<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <mask id="pipeline-mask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="680" height="480" fill="white"/>
      <rect x="276" y="23" width="127" height="23" fill="black" rx="2"/>
      <rect x="244" y="83" width="191" height="23" fill="black" rx="2"/>
      <rect x="235" y="103" width="210" height="20" fill="black" rx="2"/>
      <rect x="210" y="148" width="260" height="23" fill="black" rx="2"/>
      <rect x="227" y="168" width="225" height="20" fill="black" rx="2"/>
      <rect x="200" y="213" width="280" height="23" fill="black" rx="2"/>
      <rect x="213" y="233" width="253" height="20" fill="black" rx="2"/>
      <rect x="210" y="278" width="260" height="23" fill="black" rx="2"/>
      <rect x="227" y="298" width="225" height="20" fill="black" rx="2"/>
      <rect x="210" y="343" width="260" height="23" fill="black" rx="2"/>
      <rect x="200" y="363" width="280" height="20" fill="black" rx="2"/>
      <rect x="64" y="268" width="73" height="20" fill="black" rx="2"/>
      <rect x="596" y="456" width="82" height="20" fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- Incoming message -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="240" y="16" width="200" height="38" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="340" y="35" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#d3d1c7">Incoming message</text>
  </g>
  <line x1="340" y1="54" x2="340" y2="72" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AllowlistHandler (priority 10) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="72" width="280" height="46" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
    <text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f5c4b3">AllowlistHandler  (priority 10)</text>
    <text x="340" y="108" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f0997b">Channel allowlist check · block or pass</text>
  </g>
  <line x1="340" y1="118" x2="340" y2="136" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#pipeline-mask)"/>

  <!-- SessionResolutionHandler (priority 40) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="136" width="280" height="46" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">SessionResolutionHandler  (priority 40)</text>
    <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5dcaa5">Resolve / create session · set WorkspaceContext</text>
  </g>
  <line x1="340" y1="182" x2="340" y2="200" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#pipeline-mask)"/>

  <!-- IntentClassificationHandler (priority 50) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="200" width="280" height="46" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#cecbf6">IntentClassificationHandler  (priority 50)</text>
    <text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#afa9ec">Reflex check · skill routing · intent classify</text>
  </g>
  <line x1="340" y1="246" x2="340" y2="264" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#pipeline-mask)"/>

  <!-- CommandDispatchHandler (priority 45) - side branch -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="20" y="200" width="160" height="46" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="100" y="218" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">CommandDispatch</text>
    <text x="100" y="236" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ef9f27">priority 45 · /help etc.</text>
  </g>
  <path d="M200 222 L180 222" fill="none" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CompactionHandler (priority 60) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="264" width="280" height="46" rx="8" fill="#995700" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fac775">CompactionHandler  (priority 60)</text>
    <text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#ef9f27">Compact chat history if over threshold</text>
  </g>
  <line x1="340" y1="310" x2="340" y2="328" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#pipeline-mask)"/>

  <!-- AgentDispatchHandler (priority 70) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="328" width="280" height="46" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b5d4f4">AgentDispatchHandler  (priority 70)</text>
    <text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85b7eb">Dispatch to AgentLoop · reply via channel sender</text>
  </g>

  <!-- Reflex short-circuit label -->
  <text x="60" y="282" text-anchor="middle" font-size="12" fill="#c2c0b6" font-family="'Segoe UI', system-ui, sans-serif">short-circuit</text>
  <path d="M148 286 L180 286" fill="none" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M200 286 L148 286 L148 470 L600 470" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" mask="url(#pipeline-mask)"/>
  <text x="600" y="466" text-anchor="start" font-size="12" fill="#c2c0b6" font-family="'Segoe UI', system-ui, sans-serif">→ reply direct</text>
</svg>
