<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="beeShieldTitle beeShieldDesc">
  <title id="beeShieldTitle">Amsha Agent logo</title>
  <desc id="beeShieldDesc">A gold bee centred inside a dark heraldic shield with gold trim.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.5" stop-color="#F4A62A"/>
      <stop offset="1" stop-color="#D9820B"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2733"/>
      <stop offset="1" stop-color="#0D141B"/>
    </linearGradient>
    <clipPath id="abdomen">
