    <text x="450" y="56" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#afa9ec">CLI · REST · Security · CDI Wiring</text>

    <!-- amsha-core -->
    <rect x="260" y="92" width="380" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="450" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">amsha-core</text>
    <text x="450" y="132" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5dcaa5">Agent loop · Governance · State machine · SPIs</text>

    <!-- amsha-llm-provider-api -->
