  <line x1="400" y1="356" x2="362" y2="412" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="500" y1="356" x2="597" y2="412" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="580" y1="356" x2="832" y2="412" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#c2c0b6">
    <rect x="20" y="490" width="920" height="70" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <line x1="40" y1="520" x2="80" y2="520" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
