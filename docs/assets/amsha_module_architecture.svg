    <line x1="250" y1="520" x2="290" y2="520" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="300" y="524" fill="#c2c0b6">optional / build-time / CDI-discovered</text>
    <text x="40" y="546" fill="#888">23 modules · JDK 25 · Quarkus 3.27.2 · SQLite WAL + FTS5 + vec0 · Multi-provider LLM SPIs · Extracted Sandbox &amp; Tools</text>
