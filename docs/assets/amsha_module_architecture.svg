<svg width="100%" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Top-left: deployment + onboarding (build-time) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="20" y="16" width="180" height="46" rx="8" fill="#995700" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="110" y="35" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">amsha-deployment</text>
    <text x="110" y="51" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ef9f27">Build-time · CDI scope</text>

    <rect x="20" y="72" width="180" height="46" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="110" y="91" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#cecbf6">amsha-onboarding</text>
    <text x="110" y="107" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#afa9ec">5-step setup wizard REST</text>
  </g>
  <!-- deployment → app (build-time) -->
  <line x1="200" y1="39" x2="310" y2="39" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- onboarding → app -->
  <line x1="200" y1="95" x2="310" y2="55" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Top-right: tool-playwright + mcp + rag (optional runtime) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="680" y="16" width="190" height="46" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="775" y="35" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b5d4f4">amsha-tool-playwright</text>
    <text x="775" y="51" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#85b7eb">Browser automation</text>

    <rect x="680" y="72" width="190" height="46" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="775" y="91" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b5d4f4">amsha-mcp</text>
    <text x="775" y="107" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#85b7eb">MCP server + client bridge</text>

    <rect x="680" y="128" width="190" height="46" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="775" y="147" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b5d4f4">amsha-rag</text>
    <text x="775" y="163" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#85b7eb">FTS5 + sqlite-vec RAG</text>
  </g>

  <!-- Center column: app → core → channel-api → persistence-api -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <!-- amsha-app -->
    <rect x="310" y="16" width="240" height="52" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="430" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#cecbf6">amsha-app</text>
    <text x="430" y="56" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#afa9ec">CLI · REST · Security · Scheduler wiring</text>

    <!-- amsha-core -->
    <rect x="310" y="110" width="240" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="430" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">amsha-core</text>
    <text x="430" y="150" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5dcaa5">Agent loop · Tools · Audit · 3-tier skills</text>

    <!-- amsha-channel-api -->
    <rect x="310" y="204" width="240" height="52" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="430" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#d3d1c7">amsha-channel-api</text>
    <text x="430" y="244" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#b4b2a9">Channel SPI · HITL contracts</text>

    <!-- amsha-persistence-api -->
    <rect x="240" y="298" width="380" height="52" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="430" y="316" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fac775">amsha-persistence-api</text>
    <text x="430" y="338" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ef9f27">Port interfaces (AgentStore, AuditStore, CronStore, SessionRegistry)</text>
  </g>

  <!-- Left: common + channel-telegram (wider box to fit text) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="20" y="148" width="195" height="46" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="117" y="167" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#d3d1c7">amsha-common</text>
    <text x="117" y="183" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#b4b2a9">Shared utils · LogUtil · constants</text>

    <rect x="20" y="216" width="195" height="52" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
    <text x="117" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f5c4b3">channel-telegram</text>
    <text x="117" y="256" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#f0997b">Camel bot · HITL · garbled strip</text>

    <!-- amsha-self-evolve box (indigo theme) -->
    <rect x="20" y="298" width="195" height="52" rx="8" fill="#492473" stroke="#a98fe2" stroke-width="0.5"/>
    <text x="117" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#e8dff5">amsha-self-evolve</text>
    <text x="117" y="338" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#a98fe2">Trace capture · Extract · Synthesize</text>
  </g>

  <!-- Right: channel-web + UI -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="680" y="216" width="190" height="52" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
    <text x="775" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f5c4b3">channel-web</text>
    <text x="775" y="256" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#f0997b">WebSocket · HITL SSE</text>

    <rect x="680" y="278" width="190" height="46" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="775" y="297" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#cecbf6">ui</text>
    <text x="775" y="313" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#afa9ec">Lit 3.x · TypeScript · Vite</text>
  </g>

  <!-- Persistence adapters row -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="20" y="392" width="155" height="46" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="97" y="411" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">persistence-sqlite</text>
    <text x="97" y="429" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ef9f27">Recall/Archival (WAL+FTS5)</text>

    <rect x="195" y="392" width="155" height="46" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="272" y="411" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">persistence-postgres</text>
    <text x="272" y="429" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ef9f27">Recall/Archival (JDBI)</text>

    <rect x="370" y="392" width="155" height="46" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="447" y="411" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">persistence-fs</text>
    <text x="447" y="429" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ef9f27">Recall/Archival (JSON)</text>

    <rect x="545" y="392" width="155" height="46" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="622" y="411" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">persistence-common</text>
    <text x="622" y="429" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ef9f27">Shared JDBI records/DTOs</text>
  </g>

  <!-- Dependency arrows -->
  <!-- app → core -->
  <line x1="430" y1="68" x2="430" y2="110" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- core → channel-api -->
  <line x1="430" y1="162" x2="430" y2="204" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- channel-api ← telegram -->
  <line x1="215" y1="242" x2="310" y2="242" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- channel-api ← web -->
  <line x1="680" y1="242" x2="550" y2="242" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- UI ← web (frontend-only, no Java dep) -->
  <line x1="775" y1="324" x2="775" y2="342" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="775" y="355" text-anchor="middle" font-size="10" fill="#888" font-family="'Segoe UI', system-ui, sans-serif">npm peer</text>
  <!-- core → persistence-api -->
  <line x1="430" y1="162" x2="430" y2="298" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- persistence-api → adapters -->
  <line x1="310" y1="350" x2="97" y2="392" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="380" y1="350" x2="272" y2="392" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="480" y1="350" x2="447" y2="392" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="550" y1="350" x2="622" y2="392" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- core → mcp -->
  <line x1="550" y1="136" x2="680" y2="95" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- core → rag -->
  <line x1="550" y1="150" x2="680" y2="151" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- core → self-evolve (optional runtime event dependency) -->
  <line x1="310" y1="136" x2="117" y2="298" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- self-evolve → persistence-api -->
  <line x1="215" y1="324" x2="240" y2="324" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#c2c0b6">
    <rect x="20" y="470" width="860" height="60" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <line x1="40" y1="500" x2="80" y2="500" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="90" y="504" fill="#c2c0b6">compile dependency</text>
    <line x1="250" y1="500" x2="290" y2="500" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="300" y="504" fill="#c2c0b6">optional / build-time / CDI-discovered</text>
    <text x="40" y="522" fill="#888">18 modules · JDK 25 · Quarkus 3.27.2 · SQLite WAL + FTS5 + vec0 · Podman rootless</text>
  </g>
</svg>
