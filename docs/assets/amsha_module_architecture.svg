    <text x="450" y="274" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#b4b2a9">Channel SPI · Inbound pipeline · HITL contracts</text>

    <!-- amsha-persistence-api -->
    <rect x="260" y="308" width="380" height="48" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
