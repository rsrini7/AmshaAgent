    <text x="20" y="48" font-size="11" fill="#9c9a92">Deterministic checks remain authoritative; optional classifiers can only increase risk.</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="20" y="75" width="190" height="54" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="115" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#cecbf6">LLM Kernel</text>
    <text x="115" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#afa9ec">Emits tool call</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="285" y="70" width="230" height="64" rx="8" fill="#3b3b3b" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="400" y="93" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#d3d1c7">Pre-policy Interceptors</text>
    <text x="400" y="111" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#b4b2a9">Empty / Allow continues</text>
    <text x="400" y="125" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#b4b2a9">Block / dedup / approval stops</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
