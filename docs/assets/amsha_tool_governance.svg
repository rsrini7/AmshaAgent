    <text x="400" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f5c4b3">Mandatory Tool Guard</text>
    <text x="400" y="211" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#f0997b">Validate · dedup · recognize</text>
    <text x="400" y="227" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#f0997b">Deterministic HITL policy</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <polygon points="400,278 500,304 400,330 300,304" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="400" y="299" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fac775">Provisional</text>
    <text x="400" y="314" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fac775">Allow?</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="550" y="190" width="190" height="62" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="645" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">Stop / Approval</text>
    <text x="645" y="231" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#ef9f27">Block · dedup · ApprovalFrame</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="285" y="364" width="230" height="68" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="400" y="386" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">Post-policy Tool Risk</text>
    <text x="400" y="405" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5dcaa5">NoOpinion → preserve allow</text>
    <text x="400" y="420" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5dcaa5">Approval / block only increases risk</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="285" y="470" width="230" height="56" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="400" y="491" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b5d4f4">ToolInvoker</text>
    <text x="400" y="511" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#85b7eb">Direct or Podman sandbox execution</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="285" y="562" width="230" height="54" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="400" y="583" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">Observation Sanitizers</text>
    <text x="400" y="602" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5dcaa5">PII redact · truncate · HTML sanitize</text>
  </g>

  <line x1="210" y1="102" x2="285" y2="102" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="134" x2="400" y2="170" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="246" x2="400" y2="278" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M500 304 L645 304 L645 252" fill="none" stroke="#ef9f27" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="516" y="297" font-size="11" fill="#fac775" font-family="'Segoe UI', system-ui, sans-serif">No</text>
  <line x1="400" y1="330" x2="400" y2="364" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="349" font-size="11" fill="#5dcaa5" font-family="'Segoe UI', system-ui, sans-serif">Yes</text>
  <line x1="400" y1="432" x2="400" y2="470" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M515 398 L645 398 L645 252" fill="none" stroke="#ef9f27" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="526" y="389" font-size="10" fill="#fac775" font-family="'Segoe UI', system-ui, sans-serif">Approval / block</text>
  <line x1="400" y1="526" x2="400" y2="562" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M285 589 L115 589 L115 129" fill="none" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="126" y="410" font-size="10" fill="#c2c0b6" font-family="'Segoe UI', system-ui, sans-serif" transform="rotate(-90 126 410)">Sanitized observation</text>
</svg>
