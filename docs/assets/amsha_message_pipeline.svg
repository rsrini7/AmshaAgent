<svg width="100%" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Incoming message -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="240" y="16" width="200" height="38" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="340" y="35" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#d3d1c7">Incoming message</text>
  </g>
  <line x1="340" y1="54" x2="340" y2="72" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AllowlistHandler (priority 10) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="72" width="280" height="46" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
    <text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f5c4b3">AllowlistHandler  (priority 10)</text>
    <text x="340" y="108" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f0997b">Channel allowlist check · block or pass</text>
  </g>
  <line x1="340" y1="118" x2="340" y2="136" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SessionResolutionHandler (priority 40) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="136" width="280" height="46" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">SessionResolutionHandler  (priority 40)</text>
    <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5dcaa5">Resolve / create session · set WorkspaceContext</text>
  </g>

  <!-- Branch to CommandDispatchHandler (priority 45) — between Session and Intent -->
  <line x1="200" y1="159" x2="170" y2="159" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="153" text-anchor="middle" font-size="10" fill="#c2c0b6" font-family="'Segoe UI', system-ui, sans-serif">reflex?</text>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="10" y="140" width="160" height="46" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="90" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fac775">CommandDispatch</text>
    <text x="90" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ef9f27">priority 45 · reflex fast-path</text>
  </g>

  <!-- Short-circuit path routed BELOW the pipeline boxes (no overlap) -->
  <path d="M90 186 L90 440 L640 440 L640 122"
        fill="none" stroke="#ef9f27" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="98" y="432" text-anchor="start" font-size="11" fill="#ef9f27" font-family="'Segoe UI', system-ui, sans-serif">reflex match → short-circuit → reply direct</text>

  <!-- Main flow continues: Session → Intent -->
  <line x1="340" y1="182" x2="340" y2="200" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- IntentClassificationHandler (priority 50) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="200" width="280" height="46" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#cecbf6">IntentClassificationHandler  (priority 50)</text>
    <text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#afa9ec">Reflex check · skill routing · intent classify</text>
  </g>
  <line x1="340" y1="246" x2="340" y2="264" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CompactionHandler (priority 60) -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="200" y="264" width="280" height="46" rx="8" fill="#995700" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fac775">CompactionHandler  (priority 60)</text>
    <text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#ef9f27">Preserve to Recall &amp; compact chat memory</text>
  </g>
  <line x1="340" y1="310" x2="340" y2="328" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AgentDispatchHandler (priority 70) — wider box, shorter label -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="160" y="328" width="360" height="46" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b5d4f4">AgentDispatchHandler  (priority 70)</text>
    <text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#85b7eb">isExplicitContinuity? → old goal · else → new goal</text>
  </g>

  <!-- EvolutionEventObserver (Async CDI) -->
  <line x1="520" y1="351" x2="540" y2="351" stroke="#9c9a92" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="540" y="328" width="160" height="46" rx="8" fill="#492473" stroke="#a98fe2" stroke-width="0.5"/>
    <text x="620" y="346" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#e8dff5">EvolutionObserver</text>
    <text x="620" y="364" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#a98fe2">Async CDI trace capture</text>
  </g>
</svg>
