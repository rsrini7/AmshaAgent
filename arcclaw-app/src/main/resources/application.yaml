# =============================================================================
# ArcClaw v1.0 — Full Application Configuration
# Never hardcode secrets here. Use env vars or Kubernetes Secrets.
# =============================================================================

quarkus:

  application:
    name: arcclaw
    version: "4.1.0"

  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core

  swagger-ui:
    path: /q/swagger-ui
    always-include: true

  # ---------------------------------------------------------------------------
  # HTTP / REST
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    ssl-port: 8443
    cors:
      enabled: true
      origins: "${ARCCLAW_CORS_ORIGINS:http://localhost:3000}"
    limits:
      max-body-size: 10M

  rest:
    path: /api/v1   # all /sessions endpoints served at /api/v1/sessions

  # ---------------------------------------------------------------------------
  # DATABASE — SQLite
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:${ARCCLAW_DATA_DIR:./data}/arcclaw-meta.db"
      additional-jdbc-url-properties: "journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000"
      min-size: 1
      max-size: 5

  hibernate-orm:
    dialect: org.hibernate.community.dialect.SQLiteDialect
    database:
      generation: update
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
    log:
      sql: false

  # ---------------------------------------------------------------------------
  # LANGCHAIN4J
  # ---------------------------------------------------------------------------
  langchain4j:
    chat-model:
      provider: ollama
    ollama:
      chat-model:
        enabled: false
    openai:
      chat-model:
        enabled: false
    chat-memory:
      max-messages: 100

  # ---------------------------------------------------------------------------
  # CUSTOM ASYNC AI PROVIDER CONFIGURATION
  # ---------------------------------------------------------------------------
  arcclaw:
    ai:
      provider: "ollama"
      ollama:
        base-url: "${OLLAMA_BASE_URL:http://localhost:11434}"
        # Runtime resolved! We bypassed the Quarkiverse extension entirely.
        model-name: "${OLLAMA_MODEL:llama3.2:1b}"
        timeout-seconds: 120

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  otel:
    enabled: true
    exporter:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}"
        protocol: grpc
    resource:
      attributes:
        service.name: "arcclaw"
        service.version: "4.1.0"
        deployment.environment: "${ARCCLAW_ENV:development}"
    traces:
      enabled: true
      sampler: always_on

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  smallrye-health:
    ui:
      enable: true

  # ---------------------------------------------------------------------------
  # SCHEDULER
  # ---------------------------------------------------------------------------
  scheduler:
    enabled: true
    metrics:
      enabled: true

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS
  # ---------------------------------------------------------------------------
  virtual-threads:
    enabled: true
  thread-pool:
    core-threads: 1   # minimize platform threads; virtual threads handle concurrency

  # ---------------------------------------------------------------------------
  # INPUT VALIDATION
  # ---------------------------------------------------------------------------
  hibernate-validator:
    fail-fast: true

  # ---------------------------------------------------------------------------
  # OPENAPI
  # ---------------------------------------------------------------------------
  smallrye-openapi:
    info-title: "ArcClaw Agent API"
    info-version: "4.1.0"
    info-description: "Autonomous multi-agent framework — Java 21 + Quarkus + LangChain4J"

  # ---------------------------------------------------------------------------
  # NATIVE IMAGE
  # ---------------------------------------------------------------------------
  native:
    resources:
      includes:
        - "META-INF/services/*"
        - "META-INF/native-image/**"

  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
  log:
    level: INFO
    category:
      "com.arcclaw":
        level: DEBUG
      "io.quarkus":
        level: INFO
      "org.hibernate":
        level: WARN
    console:
      # sessionId from MDC rendered in every log line (Fix C4)
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [sid=%X{sessionId}] (%t) %s%e%n"
      color: true
    file:
      enable: "${ARCCLAW_LOG_FILE_ENABLE:false}"
      path: "${ARCCLAW_LOG_DIR:./logs}/arcclaw.log"
      rotation:
        max-file-size: 50M
        max-backup-index: 5

# =============================================================================
# ARCCLAW APPLICATION CONFIG
# =============================================================================
arcclaw:

  vault:
    pepper: "${ARCCLAW_VAULT_PEPPER:dev-pepper-not-for-production-0000000000000000000000000000}"
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1
    rotation:
      enabled: true
      interval-hours: 24

  workspace:
    root-dir: "${ARCCLAW_DATA_DIR:./data}/workspaces"
    session-ttl-minutes: 30
    gc-interval: "5m"
    heartbeat-interval: "60s"

  governance:
    token-limit: 100000
    budget-usd: "${ARCCLAW_SESSION_BUDGET_USD:10.00}"
    action-on-exceed: READONLY
    price-per-1k-input: 0.003
    price-per-1k-output: 0.015

  sandbox:
    strategy: PODMAN
    container-image: "arcclaw-tool-runner:latest"
    timeout-seconds: 30
    network: none
    tool-runner-user: "65534"
    memory-limit: "512m"    # Fix C2
    cpu-limit: "0.5"        # Fix C2

  autonomy:
    default-level: SUPERVISED

  agents:
    roles:
      - name: grok
        class: com.arcclaw.agents.GrokAgent
        description: "Captain/Coordinator — task decomposition and synthesis"
      - name: researcher
        class: com.arcclaw.agents.HarperAgent
        description: "Research & Facts Expert — real-time search and evidence"
      - name: coder
        class: com.arcclaw.agents.BenjaminAgent
        description: "Math/Code/Logic Expert — rigorous validation"
      - name: creative
        class: com.arcclaw.agents.LucasAgent
        description: "Creative & Balance Expert — blind-spot detection"

# =============================================================================
# MICROPROFILE CONTEXT PROPAGATION
# =============================================================================
mp:
  context:
    # CRITICAL: propagate CDI context across ManagedExecutor/Vert.x threads
    # Without this, @WorkspaceScoped beans are null on worker threads.
    propagators: "Quarkus, CDI, JAX-RS"

# =============================================================================
# PROFILES
# =============================================================================

"%dev":
  quarkus:
    hibernate-orm:
      log:
        sql: true
    log:
      level: DEBUG
  arcclaw:
    ai:
      provider: "ollama"
      ollama:
        base-url: "http://localhost:11434"
        model-name: "llama3.2:1b"
    sandbox:
      strategy: NONE        # no Podman in local dev
    governance:
      budget-usd: 999.99
    vault:
      pepper: "dev-pepper-not-for-production-0000000000000000000000000000"

"%test":
  quarkus:
    datasource:
      jdbc:
        url: "jdbc:sqlite::memory:"
  arcclaw:
    ai:
      provider: "ollama"
      ollama:
        base-url: "http://localhost:11434"
        model-name: "llama3.2:1b"
    sandbox:
      strategy: NONE
    vault:
      pepper: "test-pepper-00000000000000000000000000000000"

"%staging":
  arcclaw:
    governance:
      budget-usd: 50.00
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED

"%prod":
  quarkus:
    log:
      level: INFO
      console:
        color: false
  arcclaw:
    ai:
      provider: "ollama"
      ollama:
        model-name: "${OLLAMA_MODEL:llama3.2:1b}"
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED
