# =============================================================================
# ArcClaw V1.0.0 - Full Application Configuration
# Never hardcode secrets here. Use env vars or Kubernetes Secrets.
# =============================================================================

quarkus:
  shutdown:
    timeout: 30S
  vertx:
    prefer-native-transport: true
    use-async-dns: true
    resolver:
      cache-max-time-to-live: 300
      cache-negative-time-to-live: 0

  application:
    name: arcclaw
    version: "1.0.0"
  
  banner:
    enabled: true
    path: arcclaw-banner.txt
  
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-channel-api:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-api
    arcclaw-channel-telegram:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-telegram
    arcclaw-channel-web:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-web
    arcclaw-rag:
      group-id: com.arcclaw
      artifact-id: arcclaw-rag
    arcclaw-tool-playwright:
      group-id: com.arcclaw
      artifact-id: arcclaw-tool-playwright
    arcclaw-mcp:
      group-id: com.arcclaw
      artifact-id: arcclaw-mcp

  devservices:
    enabled: false
  
  swagger-ui:
    path: /q/swagger-ui
    always-include: true

  # ---------------------------------------------------------------------------
  # HTTP / REST
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    ssl-port: 8443
    cors:
      enabled: true
      origins: "${ARCCLAW_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}"
      headers: "X-ArcClaw-API-Key,X-ARCCLAW-API-KEY,Content-Type,Accept"
      methods: "GET,POST,PATCH,DELETE,OPTIONS"
    limits:
      max-body-size: 10M

  rest:
    path: /api/v1   # all /sessions endpoints served at /api/v1/sessions

  # ---------------------------------------------------------------------------
  # DATABASE - SQLite
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:${ARCCLAW_DATA_DIR:./data}/arcclaw-meta.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&transaction_mode=IMMEDIATE"
      # pool-interceptor: com.arcclaw.core.persistence.FtsConnectionInterceptor
      min-size: 1
      #Connection 1 = JTA transaction writes (approval/deny)
      #Connection 2 = AsyncPersistenceEngine audit/telemetry writes
      #Connection 3 = for REQUIRES_NEW under concurrent approval + async audit drain
      max-size: 3
      transactions: enabled
      # ✅ ADD THESE - validates connections before handing back to callers
      # prevents broken/post-BUSY connections from being reused (the cron cascade fix)
      background-validation-interval: PT30S
      validation-query-sql: "SELECT 1"
      # Discard connections that Narayana has marked broken after XA failures
      idle-removal-interval: PT60S
      acquisition-timeout: 60 # ← seconds, default is often 5
      # This must be LONGER than SQLite busy_timeout (10s)
      # so Agroal waits for SQLite to release before giving up

  hibernate-orm:
    dialect: com.arcclaw.persistence.sqlite.ArcClawSQLiteDialect
    schema-management:
      strategy: update
      halt-on-error: false 
    sql-load-script: no-file
    packages:
      - com.arcclaw.persistence.sqlite.entity
      - com.arcclaw.core.domain.model
      - com.arcclaw.core.routing
      - com.arcclaw.app.session
    log:
      sql: false

  # ---------------------------------------------------------------------------
  # LANGCHAIN4J
  # ---------------------------------------------------------------------------
  langchain4j:
    chat-model:
      provider: openai
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding-model:
        log-requests: false
        log-responses: false
      chat-model:
        model-id: ${OLLAMA_MODEL:llama3.2}
        temperature: 0.7
        log-requests: false
        log-responses: false
        enabled: false
    openai:
      base-url: "${ARCCLAW_LLM_BASE_URL:https://api.groq.com/openai/v1}"
      api-key: "${ARCCLAW_LLM_API_KEY}"
      timeout: 120s
      max-retries: 3
      embedding-model:
        log-requests: false
        log-responses: false
      chat-model:
        #model-name: "${OLLAMA_MODEL:llama3.2:1b}"
        model-name: "${ARCCLAW_LLM_MODEL_NAME:meta-llama/llama-4-scout-17b-16e-instruct}"
        temperature: 0.1
        log-requests: false
        log-responses: false
        enabled: true
    anthropic:
      chat-model:
        enabled: false

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  otel:
    enabled: true
    sdk:
      disabled: "${OTEL_SDK_DISABLED:true}"  # default off - enable when collector present
    exporter:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}"
        protocol: grpc
    resource:
      attributes:
        - deployment.environment: "${ARCCLAW_ENV:development}"
    traces:
      enabled: true
      sampler: always_on

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  smallrye-health:
    ui:
      enabled: true

  # ---------------------------------------------------------------------------
  # SCHEDULER
  # ---------------------------------------------------------------------------
  scheduler:
    enabled: true
    metrics:
      enabled: true

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS
  # ---------------------------------------------------------------------------
  virtual-threads:
    enabled: true
  thread-pool:
    core-threads: 1   # minimize platform threads; virtual threads handle concurrency

smallrye:
  context-propagation:
    managed-executor:
      max-async: 20

  transaction-manager:
    default-transaction-timeout: 300
    enable-recovery: false

  # ---------------------------------------------------------------------------
  # INPUT VALIDATION
  # ---------------------------------------------------------------------------
  hibernate-validator:
    fail-fast: true

  # ---------------------------------------------------------------------------
  # OPENAPI
  # ---------------------------------------------------------------------------
  smallrye-openapi:
    info-title: "ArcClaw Agent API"
    info-version: "1.0.0"
    info-description: "Autonomous multi-agent framework - Java 21 + Quarkus + LangChain4J"
    store-schema-directory: target
    schema-filename: openapi
    open-api-version: 3.0.3


  # ---------------------------------------------------------------------------
  # NATIVE IMAGE
  # ---------------------------------------------------------------------------
  native:
    # Set encoding to UTF-8 for Windows console support (§Cosmetic-Fix)
    additional-build-args: "-Dfile.encoding=UTF-8,-Dstdout.encoding=UTF-8"
    # native-image-xmx: 4g # require 8GB machine with podman
    resources:
      includes:
        - "META-INF/services/*"
        - "META-INF/native-image/**"
        - "skills/index.txt"
        - "skills/**.md"
        - "env-example"
        - "native/vec0/**"

  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
  log:
    level: INFO
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.arcclaw":
        level: DEBUG
      "com.arcclaw.core.agent.loop.AgentStateMachineRunner":
        level: WARN       # ← suppress goal logging noise (isInfoEnabled guard handles the rest)
      "com.arcclaw.core.sandbox.PodmanContainerExecutor":
        level: WARN       # ← suppress container start/stop/exec noise
      "io.quarkus":
        level: INFO
      "org.apache.camel.component.telegram":
        level: INFO
      "io.smallrye.faulttolerance":
        level: INFO
      "org.hibernate":
        level: WARN
      "io.sm.op.ru.util":
        level: INFO
      "ja.la.ProcessBuilder":
        level: INFO
      "java.lang.ProcessBuilder":
        level: WARN       # ← suppress DEBUG noise from sqlite-jdbc uname probe
      "org.sqlite":
        level: WARN       # ← suppress all sqlite-jdbc debug output
      "java.lang":
        level: WARN
      "org.hibernate.tool.schema.internal.exec.GenerationTargetToDatabase":
        level: ERROR   # suppress WARN → only show actual errors
      "dev.langchain4j.internal.RetryUtils":
        level: ERROR
      "org.jboss.resteasy.reactive.common.core.AbstractResteasyReactiveContext":
        level: ERROR  # suppress the unrecoverable exception noise at DEBUG
      "jdk.event.security":
        level: "OFF"  # suppress SSL cert flood
      "io.netty.handler.ssl":
        level: INFO
      "org.apache.camel.component.telegram.TelegramConsumer":
        level: ERROR
      "org.apache.camel":
        level: INFO
      "io.netty":
        level: WARN
      "io.opentelemetry":
        level: "OFF"
      "org.infinispan":
        level: WARN
      "org.jboss.resteasy.reactive.common.core":
        level: WARN
      "jakarta.json.spi":
        level: "OFF"
      "io.netty.resolver.dns.DirContextUtils":
        level: WARN
      "io.smallrye.config":
        level: INFO
      "io.micrometer":
        level: INFO
      "io.vertx":
        level: INFO
      "io.quarkus.arc":
        level: INFO
      "org.hibernate.SQL":
        level: INFO
      "org.hibernate.engine.jdbc.spi.SqlExceptionHelper":
        level: ERROR
      "org.hibernate.orm.jdbc.error":
        level: ERROR
      "io.smallrye.context.jta.context.provider.JtaContextProvider":
        level: WARN
      "com.arjuna.ats.arjuna":
        level: ERROR
    console:
      # sessionId from MDC rendered in every log line (Fix C4)
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [sid=%X{sessionId}] (%t) %s%e%n"
      darken: 0
    file:
      enabled: true
      path: "./arcclaw.log"
      level: DEBUG
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 20M
        max-backup-index: 3

# =============================================================================
# ARCCLAW APPLICATION CONFIG
# Refer .env.example for how to switch embed providers.
# =============================================================================
arcclaw:
  data-dir: "${ARCCLAW_DATA_DIR:./data}"
  delegation:
    max-depth: ${ARCCLAW_DELEGATION_MAX_DEPTH:2}
  llm:
    provider: ${ARCCLAW_LLM_PROVIDER:groq}
    log-http: ${ARCCLAW_LLM_LOG_HTTP:false}
    max-retries: ${ARCCLAW_LLM_MAX_RETRIES:3}
    max-output-tokens: ${ARCCLAW_LLM_MAX_OUTPUT_TOKENS:8192}
    timeout: ${ARCCLAW_LLM_TIMEOUT:PT120S}
    temperature: ${ARCCLAW_LLM_TEMPERATURE:0.1}
    context-window: ${ARCCLAW_LLM_CONTEXT_WINDOW:128000}
    compact-prompt-enabled: ${ARCCLAW_LLM_COMPACT_PROMPT_ENABLED:false}
    structured-output-mode: ${ARCCLAW_LLM_STRUCTURED_OUTPUT_MODE:NATIVE}
    fallback-model: ${ARCCLAW_LLM_FALLBACK_MODEL}
    fallback-provider: ${ARCCLAW_LLM_FALLBACK_PROVIDER}
    fallback-base-url: ${ARCCLAW_LLM_FALLBACK_BASE_URL}
    fallback-api-key: ${ARCCLAW_LLM_FALLBACK_API_KEY}
    fallback-message-threshold: ${ARCCLAW_LLM_FALLBACK_MESSAGE_THRESHOLD:14}
    fallback-ollama-base-url: ${ARCCLAW_LLM_FALLBACK_OLLAMA_BASE_URL:http://localhost:11434}
    fallback-ollama-model: ${ARCCLAW_LLM_FALLBACK_OLLAMA_MODEL:llama3.2}
    gemini:
      api-key: ${ARCCLAW_LLM_API_KEY}
      model-name: ${ARCCLAW_LLM_MODEL_NAME:gemini-2.5-flash-lite}
    openrouter:
      app-name: "${ARCCLAW_OPENROUTER_APP_NAME:https://github.com/rsrini7/arcclaw}"
      site-url: "${ARCCLAW_OPENROUTER_SITE_URL:https://github.com/rsrini7/arcclaw}"
  agent:
    default-timezone: "${ARCCLAW_DEFAULT_TIMEZONE:Asia/Kolkata}"
    rate-limit:
      max-auto-retry-seconds: ${ARCCLAW_AGENT_RATE_LIMIT_MAX_AUTO_RETRY_SECONDS:15}
      default-retry-seconds: ${ARCCLAW_AGENT_RATE_LIMIT_DEFAULT_RETRY_SECONDS:10}
  rag:
    min-score: -1.0f
    context-chunks: 3
    max-total-chars: 800
    max-chunk-chars: 300
    max-source-chars: 400
    embed-provider: ${ARCCLAW_EMBED_PROVIDER:ollama}
    embed-model: ${ARCCLAW_EMBED_MODEL:nomic-embed-text:v1.5}
    embed-base-url: ${ARCCLAW_EMBED_BASE_URL:http://localhost:11434}
    embed-api-key: ${ARCCLAW_EMBED_API_KEY:}
    embed-timeout-seconds: 30
    # Embedding vector dimension. nomic-embed-text = 768. mxbai-embed-large = 1024.
    embed-dimensions: ${ARCCLAW_EMBED_DIMENSIONS:768}
    # Path where sqlite-vec native lib is extracted/loaded from.
    # The OS-specific extension (.so, .dll) is added automatically.
    vec-extension-path: "${ARCCLAW_RAG_VEC_PATH:./lib/vec0}"
  auto-seed-secrets: "${ARCCLAW_AUTO_SEED_SECRETS:false}"
  skills:
    hot-reload: true
  core:
    util:
      json-salvage-max-lines: ${ARCCLAW_CORE_UTIL_JSON_SALVAGE_MAX_LINES:20}
  security:
    prompt-injection:
      enabled: true
  routing:
    intent-classifier:
      base-url: ${ARCCLAW_INTENT_CLASSIFIER_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${ARCCLAW_INTENT_CLASSIFIER_API_KEY:not-configured}
      # Specific model alias for free tier ensures structured mode support (§OpenRouter-Fix)
      provider: ${ARCCLAW_INTENT_CLASSIFIER_PROVIDER:groq}
      model: ${ARCCLAW_INTENT_CLASSIFIER_MODEL:llama-3.1-8b-instant}
      ollama-model: ${ARCCLAW_INTENT_CLASSIFIER_OLLAMA_MODEL:llama3.2}
      structured-output-mode: ${ARCCLAW_INTENT_CLASSIFIER_STRUCTURED_OUTPUT_MODE:NATIVE}
      timeout-seconds: 5
      max-retries: ${ARCCLAW_INTENT_CLASSIFIER_MAX_RETRIES:3}
      sla-warn-ms: 2000
  memory:
    compaction:
      enabled: true
      threshold: 10
      keep-recent: 5
      max-output-tokens: 1024
      max-chars: 96000 
      api-key: "${ARCCLAW_COMPACTION_API_KEY:${ARCCLAW_LLM_API_KEY}}"
      base-url: "${ARCCLAW_COMPACTION_BASE_URL:${ARCCLAW_LLM_BASE_URL}}"
      provider: "${ARCCLAW_COMPACTION_PROVIDER:groq}"
      model: "${ARCCLAW_COMPACTION_MODEL:llama-3.1-8b-instant}"
      ollama-model: "${ARCCLAW_COMPACTION_OLLAMA_MODEL:llama3.2}"
      structured-output-mode: ${ARCCLAW_COMPACTION_STRUCTURED_OUTPUT_MODE:NATIVE}
      max-retries: ${ARCCLAW_COMPACTION_MAX_RETRIES:3}
      max-backoff-ms: ${ARCCLAW_MEMORY_COMPACTION_MAX_BACKOFF_MS:60000}
  chat:
    default-observation-max-length: 2000
    tool-specific-limits:
      github_search: 10000
      read_file: 8000
      web_search: 5000
  chat-memory:
    max-messages: ${ARCCLAW_CHAT_MEMORY_MAX_MESSAGES:20}
    retention-days: ${ARCCLAW_CHAT_MEMORY_RETENTION_DAYS:30}
  api:
    keys:
      internal: "${ARCCLAW_API_KEYS_INTERNAL:key-internal-changeme}"
      ci: "${ARCCLAW_API_KEYS_CI:key-ci-changeme}"
    rate-limit:
      requests-per-minute: 60
      mutation-per-minute: 10
  
  tools:
    brave:
      api-key: "${ARCCLAW_TOOLS_BRAVE_API_KEY:none}"
    serper:
      api-key: "${ARCCLAW_TOOLS_SERPER_API_KEY:none}"
    github:
      repos-per-page: ${ARCCLAW_GITHUB_REPOS_PER_PAGE:100}
    playwright:
      enabled: "${ARCCLAW_TOOLS_PLAYWRIGHT_ENABLED:false}"
      timeout-ms: 30000
      headless: "${ARCCLAW_TOOLS_PLAYWRIGHT_HEADLESS:true}"

  hitl:
    pre-executable-tools: ""   # (§75-A1) comma-separated tool names
    delegate-approver-ids: ""  # (§75-B1) comma-separated user IDs
    timeout-hours: 24

  mcp:
    exposed-tools:
      - github
      - memory_search
    server-enabled: true

  retry:
    default-delay-ms: ${ARCCLAW_RETRY_DEFAULT_DELAY_MS:30000}

  cron:
    poll-interval: 30s
    max-concurrent: 10
    max-iterations: 3
    max-lookback-window: PT5M
    list-retention-hours: 24
    startup-delay-ms: ${ARCCLAW_CRON_STARTUP_DELAY_MS:5000}

  channel:
    telegram:
      enabled: "${ARCCLAW_TELEGRAM_ENABLED:false}"
      bot-token: ${TELEGRAM_BOT_TOKEN:mock-telegram-token}
      default-autonomy-level: SUPERVISED
      allowed-user-ids: "${ARCCLAW_TELEGRAM_ALLOWED_USER_IDS:}"
      allowed-users: "${ARCCLAW_TELEGRAM_ALLOWED_USERS:mock-telegram-user}"
      silent-block: false
      block-response: "⛔ Access denied."
      max-length: ${ARCCLAW_CHANNEL_TELEGRAM_MAX_LENGTH:4096}
    web:
      enabled: "${ARCCLAW_WEB_ENABLED:true}"
      require-auth: "${ARCCLAW_WEB_REQUIRE_AUTH:false}"

  pii:
    mode: "${ARCCLAW_PII_MODE:REDACT_AND_FORWARD}"   # Options: REDACT_AND_FORWARD (default), BLOCK_AND_NOTIFY

  vault:
    pepper: "${ARCCLAW_VAULT_PEPPER:dev-pepper-not-for-production-0000000000000000000000000000}"
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1
    rotation:
      enabled: true
      interval-hours: 24

  workspace:
    root-dir: "${ARCCLAW_DATA_DIR:./data}/workspaces"
    session-ttl-minutes: 30
    gc-interval: "5m"
    heartbeat-interval: "60s"

  recovery:
    stalled-threshold-minutes: 15

  resumption:
    stale-mark-seconds: ${ARCCLAW_RESUMPTION_STALE_MARK_SECONDS:60}
    playwright-stale-mark-seconds: ${ARCCLAW_PLAYWRIGHT_RESUMPTION_STALE_MARK_SECONDS:300}

  checkpoint:
    stale-claim-minutes: ${ARCCLAW_CHECKPOINT_STALE_CLAIM_MINUTES:2}

  audit:
    hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
    idle-timeout-ms: ${ARCCLAW_AUDIT_IDLE_TIMEOUT_MS:10000}

  governance:
    # Floor applied ONLY when LLM provider returns 0 input AND 0 output tokens.
    # This indicates the provider omitted token counts entirely (a known side
    # effect of certain log-requests=false configurations), not a valid zero-output
    # response. Set to 1 to disable the floor effect while keeping the warning.
    # A partial zero (e.g., 3 input, 0 output) is a valid API response and is
    # NOT subject to this floor.
    min-tokens-per-call: 10
    token-limit: 100000
    budget-usd: "${ARCCLAW_BUDGET_LIMIT:999.00}"
    action-on-exceed: "${ARCCLAW_BUDGET_ACTION:READONLY}"
    price-per-1k-input: 0.003
    price-per-1k-output: 0.015
    approval-timeout-minutes: 60 # must be >> gc-interval converted to minutes
    rate-limit-backoff-seconds: 30

  sandbox:
    enabled: "${ARCCLAW_SANDBOX_ENABLED:true}"
    strategy: "${ARCCLAW_SANDBOX_STRATEGY:PODMAN}"
    podman-path: "${ARCCLAW_SANDBOX_PODMAN_PATH:podman}"
    podman-image: "${ARCCLAW_SANDBOX_PODMAN_IMAGE:localhost/arcclaw-tool-runner:latest}"
    timeout-seconds: "${ARCCLAW_SANDBOX_TIMEOUT_SECONDS:30}"
    network-timeout-seconds: "${ARCCLAW_SANDBOX_NETWORK_TIMEOUT_SECONDS:60}"
    network: "${ARCCLAW_SANDBOX_NETWORK:host}"
    tool-runner-user: "${ARCCLAW_SANDBOX_USER:sandbox}"
    memory-limit: "${ARCCLAW_SANDBOX_MEMORY_LIMIT:512m}"
    cpu-limit: "${ARCCLAW_SANDBOX_CPU_LIMIT:0.5}"
    max-output-chars: ${ARCCLAW_SANDBOX_MAX_OUTPUT_CHARS:8192}
    # Executable overrides (auto-discovered on host PATH if omitted)
    python-executable: "${ARCCLAW_SANDBOX_PYTHON_EXECUTABLE:}"
    go-executable: "${ARCCLAW_SANDBOX_GO_EXECUTABLE:}"
    java-executable: "${ARCCLAW_SANDBOX_JAVA_EXECUTABLE:}"
    allow-insecure-fallback: "${ARCCLAW_SANDBOX_ALLOW_INSECURE_FALLBACK:false}"
    circuit-breaker:
      failure-threshold: 3   # was 2; gives LLM one retry for param errors

  autonomy:
    default-level: SUPERVISED

  agents:
    roles:
      - name: coordinator
        class: com.arcclaw.core.agent.VishnuAgent
        description: "Preserver and Captain/Coordinator - task decomposition and synthesis"
      - name: researcher
        class: com.arcclaw.core.agent.SaraswatiAgent
        description: "Research & Knowledge, Wisdom, and Facts - real-time search and evidence"
      - name: coder
        class: com.arcclaw.core.agent.BrahmaAgent
        description: "Math/Code Creator and Logic Expert - rigorous validation"
      - name: debugger
        class: com.arcclaw.core.agent.ShivaAgent
        description: "Creative, Transformer and Balance Expert - blind-spot detection"
      - name: architect
        class: com.arcclaw.core.agent.persona.BrihaspatiAgent
        description: "Brihaspati - Guru of the Devas, System Designer and Standards Author  - ADRs and architectural trade-offs"
      - name: synthesizer
        class: com.arcclaw.core.agent.persona.DattatreyaAgent
        description: "Synthesizer and Avadhuta - multi-agent conflict resolution and integration"        

# =============================================================================
# MICROPROFILE CONTEXT PROPAGATION
# =============================================================================
mp:
  context:
    # CRITICAL: propagate CDI context across ManagedExecutor/Vert.x threads
    # Without this, @WorkspaceScoped beans are null on worker threads.
    propagators: "Quarkus, CDI, JAX-RS"

# =============================================================================
# PROFILES
# =============================================================================

"%cli":
  quarkus:
    log:
      console:
        enabled: false
      level: ERROR
      category:
        "io.quarkus":
          level: ERROR     # Silences "Started in...", "Installed features..."
        "io.smallrye.config":
          level: ERROR     # Silences "Unrecognized configuration key..."
        "io.quarkus.agroal":
          level: ERROR     # Silences "Agroal does not support..."
        "com.arcclaw":
          level: DEBUG     # Silences WorkspaceManager and SqliteWalConfigurer
        "org.hibernate":
          level: ERROR
      file:
        enabled: true
        path: ./arcclaw-cli.log
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
    banner:
      enabled: false
    mcp:
      server:
        stdio:
          enabled: false
    hibernate-orm:
      log:
        sql: false # Forces SQL logging off even if global dev is true
  arcclaw:
    telegram:
      enabled: false        

"%dev":
  quarkus:
    mcp:
      server:
        stdio:
          enabled: false
    log:
      level: INFO                          # set to INFO to avoid infrastructure flood
      console:
        enabled: false
      file:
        enabled: true
        path: ./arcclaw-dev.log
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
    console:
      enabled: false
    live-reload:
      enabled: false
    otel:
      sdk:
        disabled: true
    langchain4j:
      ollama:
        chat-model:
          log-requests: "${arcclaw.debug.llm:false}"
          log-responses: "${arcclaw.debug.llm:false}"
      openai:
        chat-model:
          log-requests: "${arcclaw.debug.llm:false}"
          log-responses: "${arcclaw.debug.llm:false}"
    hibernate-orm:
      log:
        sql: false

  arcclaw:
    pii:
      mode: "${ARCCLAW_PII_MODE:REDACT_AND_FORWARD}"   # Dev - same as prod, see redacted output
    sandbox:
      strategy: NONE        # no Podman in local dev
    governance:
      budget-usd: 9.99
      approval-timeout-minutes: 10
    vault:
      pepper: "dev-pepper-not-for-production-0000000000000000000000000000"
    debug:
      llm: true
    metadata:
      environment: dev

"%test":
  quarkus:
    mcp:
      server:
        stdio:
          enabled: false
    opentelemetry:
      enabled: false
    smallrye-fault-tolerance:
      enabled: false
    datasource:
      jdbc:
        url: "jdbc:sqlite:target/test-audit.db"
    hibernate-orm:
      schema-management:
        strategy: update
      dialect: com.arcclaw.persistence.sqlite.ArcClawSQLiteDialect
    log:
      category:
        "com.arcclaw":
          level: INFO
        "org.hibernate.SQL":
          level: DEBUG
        "com.arjuna":
          level: ERROR
        "org.hibernate.resource.transaction":
          level: ERROR
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false

  arcclaw:
    data-dir: "target/"
    agent:
      default-timezone: "UTC"
    rag:
      vec-extension-path: "target/lib/vec0"
    skills:
      hot-reload: false
    memory:
      compaction:
        max-output-tokens: 1024
        enabled: false
        threshold: 4
        keep-recent: 2
    security:
      prompt-injection:
        enabled: true
    audit:
      hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
    channel:
      telegram:
        enabled: false
        bot-token: "mock-bot-token"
        allowed-users: ""
    pii:
      mode: "${ARCCLAW_PII_MODE:REDACT_AND_FORWARD}"   # Tests use default
    sandbox:
      strategy: NONE
    vault:
      pepper: "test-pepper-00000000000000000000000000000000"
    mcp:
      server-enabled: false
    cron:
      max-lookback-window: PT999H
    recovery:
      stalled-threshold-minutes: 15
    tools:
      # Slow tools that should be isolated to the 'external-tool-executor' bulkhead (§T5-2)
      external-tools: "browser_navigate,web_search"
    parallel:
      tool-timeout-seconds: 60
    notification:
      retry:
        attempts: 3
        initial-delay-ms: 1000


"%staging":
  quarkus:
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false

  arcclaw:
    governance:
      budget-usd: 50.00
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED

"%prod":
  quarkus:
    # native:
    #   enabled: true
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false
    log:
      level: INFO
  arcclaw:
    data-dir: "${ARCCLAW_DATA_DIR:./data}"
    rag:
      # Switch embedding provider to Jina for native binary build (§Graal-Ollama-Fix)
      embed-provider: jina 
    agent:
      max-ratelimit-retries: ${ARCCLAW_AGENT_MAX_RATELIMIT_RETRIES:3}
      schema-correction:
        max-retries-strict: ${ARCCLAW_AGENT_SCHEMA_CORRECTION_MAX_RETRIES_STRICT:4}
        max-retries-lenient: ${ARCCLAW_AGENT_SCHEMA_CORRECTION_MAX_RETRIES_LENIENT:6}
    workspace:
      root-dir: "${ARCCLAW_DATA_DIR:./data}/workspaces"
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED
