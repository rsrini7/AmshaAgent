# =============================================================================
# ArcClaw V1.0.0 — Full Application Configuration
# Never hardcode secrets here. Use env vars or Kubernetes Secrets.
# =============================================================================

quarkus:
  vertx:
    prefer-native-transport: true
    use-async-dns: true
    resolver:
      cache-max-time-to-live: 300
      cache-negative-time-to-live: 0

  application:
    name: arcclaw
    version: "1.0.0"
  
  banner:
    enabled: true
    path: arcclaw-banner.txt
  
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-channel-api:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-api
    arcclaw-channel-telegram:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-telegram
    arcclaw-channel-web:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-web
    arcclaw-rag:
      group-id: com.arcclaw
      artifact-id: arcclaw-rag

  devservices:
    enabled: false
  
  swagger-ui:
    path: /q/swagger-ui
    always-include: true

  # ---------------------------------------------------------------------------
  # HTTP / REST
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    ssl-port: 8443
    cors:
      enabled: true
      origins: "${ARCCLAW_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}"
      headers: "X-ArcClaw-API-Key,X-ARCCLAW-API-KEY,Content-Type,Accept"
      methods: "GET,POST,PATCH,DELETE,OPTIONS"
    limits:
      max-body-size: 10M

  rest:
    path: /api/v1   # all /sessions endpoints served at /api/v1/sessions

  # ---------------------------------------------------------------------------
  # DATABASE — SQLite
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:${ARCCLAW_DATA_DIR:./data}/arcclaw-meta.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&transaction_mode=IMMEDIATE"
      # pool-interceptor: com.arcclaw.core.persistence.FtsConnectionInterceptor
      min-size: 1
      #Connection 1 = JTA transaction writes (approval/deny)
      #Connection 2 = AsyncPersistenceEngine audit/telemetry writes
      #Connection 3 = for REQUIRES_NEW under concurrent approval + async audit drain
      max-size: 3
      transactions: enabled
      # ✅ ADD THESE — validates connections before handing back to callers
      # prevents broken/post-BUSY connections from being reused (the cron cascade fix)
      background-validation-interval: PT30S
      validation-query-sql: "SELECT 1"
      # Discard connections that Narayana has marked broken after XA failures
      idle-removal-interval: PT60S
      acquisition-timeout: 60 # ← seconds, default is often 5
      # This must be LONGER than SQLite busy_timeout (10s)
      # so Agroal waits for SQLite to release before giving up

  hibernate-orm:
    dialect: com.arcclaw.core.persistence.ArcClawSQLiteDialect
    schema-management:
      strategy: update
      halt-on-error: false 
    sql-load-script: no-file
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
      - com.arcclaw.core.audit
      - com.arcclaw.core.skill
      - com.arcclaw.core.routing
      - com.arcclaw.app.session
    log:
      sql: false

  # ---------------------------------------------------------------------------
  # LANGCHAIN4J
  # ---------------------------------------------------------------------------
  langchain4j:
    chat-model:
      provider: openai
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding-model:
        log-requests: false
        log-responses: false
      chat-model:
        model-id: ${OLLAMA_MODEL:llama3.2}
        temperature: 0.7
        log-requests: false
        log-responses: false
        enabled: false
    openai:
      base-url: "${ARCCLAW_LLM_BASE_URL:https://api.groq.com/openai/v1}"
      api-key: "${ARCCLAW_LLM_API_KEY}"
      timeout: 120s
      max-retries: 3
      embedding-model:
        log-requests: false
        log-responses: false
      chat-model:
        #model-name: "${OLLAMA_MODEL:llama3.2:1b}"
        model-name: "${ARCCLAW_LLM_MODEL_NAME:meta-llama/llama-4-scout-17b-16e-instruct}"
        temperature: 0.1
        log-requests: false
        log-responses: false
        enabled: true
    anthropic:
      chat-model:
        enabled: false

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  otel:
    enabled: true
    sdk:
      disabled: "${OTEL_SDK_DISABLED:true}"  # default off — enable when collector present
    exporter:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}"
        protocol: grpc
    resource:
      attributes:
        - deployment.environment: "${ARCCLAW_ENV:development}"
    traces:
      enabled: true
      sampler: always_on

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  smallrye-health:
    ui:
      enabled: true

  # ---------------------------------------------------------------------------
  # SCHEDULER
  # ---------------------------------------------------------------------------
  scheduler:
    enabled: true
    metrics:
      enabled: true

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS
  # ---------------------------------------------------------------------------
  virtual-threads:
    enabled: true
  thread-pool:
    core-threads: 1   # minimize platform threads; virtual threads handle concurrency

smallrye:
  context-propagation:
    managed-executor:
      max-async: 20

  transaction-manager:
    default-transaction-timeout: 300
    enable-recovery: false

  # ---------------------------------------------------------------------------
  # INPUT VALIDATION
  # ---------------------------------------------------------------------------
  hibernate-validator:
    fail-fast: true

  # ---------------------------------------------------------------------------
  # OPENAPI
  # ---------------------------------------------------------------------------
  smallrye-openapi:
    info-title: "ArcClaw Agent API"
    info-version: "1.0.0"
    info-description: "Autonomous multi-agent framework — Java 21 + Quarkus + LangChain4J"


  # ---------------------------------------------------------------------------
  # NATIVE IMAGE
  # ---------------------------------------------------------------------------
  native:
    # native-image-xmx: 4g # require 8GB machine with podman
    resources:
      includes:
        - "META-INF/services/*"
        - "META-INF/native-image/**"
        - "skills/index.txt"
        - "skills/**.md"
        - "env-example"
        - "native/vec0/**"
        # - "*.yaml" 

  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
  log:
    level: INFO
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.arcclaw":
        level: DEBUG
      "io.quarkus":
        level: INFO
      "org.apache.camel.component.telegram":
        level: INFO
      "org.hibernate":
        level: WARN
      "io.sm.op.ru.util":
        level: INFO
      "ja.la.ProcessBuilder":
        level: INFO
      "java.lang.ProcessBuilder":
        level: WARN       # ← suppress DEBUG noise from sqlite-jdbc uname probe
      "org.sqlite":
        level: WARN       # ← suppress all sqlite-jdbc debug output
      "java.lang":
        level: WARN
      "org.hibernate.tool.schema.internal.exec.GenerationTargetToDatabase":
        level: ERROR   # suppress WARN → only show actual errors
      "dev.langchain4j.internal.RetryUtils":
        level: WARN   # already WARN, so 520 retries show but don't spam
      "org.jboss.resteasy.reactive.common.core.AbstractResteasyReactiveContext":
        level: ERROR  # suppress the unrecoverable exception noise at DEBUG
      "jdk.event.security":
        level: INFO
      "io.netty.handler.ssl":
        level: INFO
      "org.apache.camel.component.telegram.TelegramConsumer":
        level: ERROR
      "org.jboss.resteasy.reactive.common.core":
        level: WARN
      "jakarta.json.spi":
        level: WARN
      "org.hibernate.engine.jdbc.spi.SqlExceptionHelper":
        level: ERROR
      "org.hibernate.orm.jdbc.error":
        level: ERROR
      # Mutes the massive stack trace generated by the Narayana Transaction Manager
      "com.arjuna.ats.arjuna":
        level: ERROR
    console:
      # sessionId from MDC rendered in every log line (Fix C4)
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [sid=%X{sessionId}] (%t) %s%e%n"
      darken: 0
    file:
      enabled: true
      path: "./arcclaw.log"
      level: DEBUG
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 20M
        max-backup-index: 3

# =============================================================================
# ARCCLAW APPLICATION CONFIG
# Refer .env.example for how to switch embed providers.
# =============================================================================
arcclaw:
  data-dir: "${ARCCLAW_DATA_DIR:./data}"
  llm:
    provider: ${ARCCLAW_LLM_PROVIDER:groq}
    log-http: ${ARCCLAW_LLM_LOG_HTTP:false}
  rag:
    min-score: 0.25f
    context-chunks: 5
    embed-provider: ${ARCCLAW_EMBED_PROVIDER:ollama}
    embed-model: ${ARCCLAW_EMBED_MODEL:nomic-embed-text:v1.5}
    embed-base-url: ${ARCCLAW_EMBED_BASE_URL:http://localhost:11434}
    embed-api-key: ${ARCCLAW_EMBED_API_KEY:}
    embed-timeout-seconds: 30
    # Embedding vector dimension. nomic-embed-text = 768. mxbai-embed-large = 1024.
    embed-dimensions: ${ARCCLAW_EMBED_DIMENSIONS:768}
    # Path where sqlite-vec native lib is extracted/loaded from.
    # The OS-specific extension (.so, .dll) is added automatically.
    vec-extension-path: "${ARCCLAW_RAG_VEC_PATH:./lib/vec0}"
  auto-seed-secrets: "${ARCCLAW_AUTO_SEED_SECRETS:false}"
  skills:
    hot-reload: true
  security:
    prompt-injection:
      enabled: true
  routing:
    intent-classifier:
      model: ${ARCCLAW_INTENT_CLASSIFIER_MODEL:llama-3.1-8b-instant}
      ollama-model: ${ARCCLAW_INTENT_CLASSIFIER_OLLAMA_MODEL:llama3.2}
      timeout-seconds: 5
      sla-warn-ms: 2000
  memory:
    compaction:
      enabled: true
      threshold: 12
      keep-recent: 7
      max-tokens: 1024
      max-chars: 96000 
      api-key: "${ARCCLAW_COMPACTION_API_KEY:${ARCCLAW_LLM_API_KEY}}"
      base-url: "${ARCCLAW_COMPACTION_BASE_URL:${ARCCLAW_LLM_BASE_URL}}"
      model: "${ARCCLAW_COMPACTION_MODEL:llama-3.1-8b-instant}"
      ollama-model: "${ARCCLAW_COMPACTION_OLLAMA_MODEL:llama3.2}"
  chat-memory:
    max-messages: 20
  api:
    keys:
      internal: "${ARCCLAW_API_KEYS_INTERNAL:key-internal-changeme}"
      ci: "${ARCCLAW_API_KEYS_CI:key-ci-changeme}"
    rate-limit:
      requests-per-minute: 60
  
  tools:
    brave:
      api-key: "${ARCCLAW_BRAVE_API_KEY:none}"
    serper:
      api-key: "${ARCCLAW_SERPER_API_KEY:none}"

  hitl:
    pre-executable-tools: ""   # (§75-A1) comma-separated tool names
    delegate-approver-ids: ""  # (§75-B1) comma-separated user IDs
    timeout-hours: 24

  mcp:
    exposed-tools:
      - github
      - memory_search
    server-enabled: true

  cron:
    poll-interval: 30s
    max-concurrent: 10
    max-iterations: 3
    max-lookback-window: PT5M

  channel:
    telegram:
      enabled: "${ARCCLAW_TELEGRAM_ENABLED:false}"
      bot-token: ${TELEGRAM_BOT_TOKEN:mock-telegram-token}
      default-autonomy-level: SUPERVISED
      allowed-user-ids: "${ARCCLAW_TELEGRAM_ALLOWED_USER_IDS:}"
      allowed-users: "${ARCCLAW_TELEGRAM_ALLOWED_USERS:mock-telegram-user}"
      silent-block: false
      block-response: "⛔ Access denied."
    web:
      enabled: "${ARCCLAW_WEB_ENABLED:true}"
      require-auth: "${ARCCLAW_WEB_REQUIRE_AUTH:false}"

  pii:
    mode: REDACT_AND_FORWARD   # Options: REDACT_AND_FORWARD (default), BLOCK_AND_NOTIFY

  vault:
    pepper: "${ARCCLAW_VAULT_PEPPER:dev-pepper-not-for-production-0000000000000000000000000000}"
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1
    rotation:
      enabled: true
      interval-hours: 24

  workspace:
    root-dir: "${ARCCLAW_DATA_DIR:./data}/workspaces"
    #base-dir: /home/srini/arcclaw-data/workspaces  # Native WSL2 path
    session-ttl-minutes: 30
    gc-interval: "5m"
    heartbeat-interval: "60s"

  recovery:
    stalled-threshold-minutes: 15

  audit:
    hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"

  governance:
    # Floor applied ONLY when LLM provider returns 0 input AND 0 output tokens.
    # This indicates the provider omitted token counts entirely (a known side
    # effect of certain log-requests=false configurations), not a valid zero-output
    # response. Set to 1 to disable the floor effect while keeping the warning.
    # A partial zero (e.g., 3 input, 0 output) is a valid API response and is
    # NOT subject to this floor.
    min-tokens-per-call: 10
    token-limit: 100000
    budget-usd: "${ARCCLAW_SESSION_BUDGET_USD:10.00}"
    action-on-exceed: READONLY
    price-per-1k-input: 0.003
    price-per-1k-output: 0.015
    approval-timeout-minutes: 60 # must be >> gc-interval converted to minutes
    rate-limit-backoff-seconds: 30

  sandbox:
    enabled: "${ARCCLAW_SANDBOX_ENABLED:true}"
    strategy: "${ARCCLAW_SANDBOX_STRATEGY:PODMAN}"
    podman-path: "${ARCCLAW_SANDBOX_PODMAN_PATH:podman}"
    podman-image: "${ARCCLAW_SANDBOX_PODMAN_IMAGE:localhost/arcclaw-tool-runner:latest}"
    timeout-seconds: "${ARCCLAW_SANDBOX_TIMEOUT_SECONDS:30}"
    network: "${ARCCLAW_SANDBOX_NETWORK:host}"
    secret-transport: "${ARCCLAW_SANDBOX_SECRET_TRANSPORT:tmpfs}"
    tool-runner-user: "${ARCCLAW_SANDBOX_USER:65534}"
    memory-limit: "${ARCCLAW_SANDBOX_MEMORY_LIMIT:512m}"
    cpu-limit: "${ARCCLAW_SANDBOX_CPU_LIMIT:0.5}"
    tmpfs-path: "${ARCCLAW_SANDBOX_TMPFS_PATH:/run/arcclaw/secrets}"
    # Executable overrides (auto-discovered on host PATH if omitted)
    python-executable: "${ARCCLAW_SANDBOX_PYTHON_EXECUTABLE:}"
    go-executable: "${ARCCLAW_SANDBOX_GO_EXECUTABLE:}"
    java-executable: "${ARCCLAW_SANDBOX_JAVA_EXECUTABLE:}"
    javac-executable: "${ARCCLAW_SANDBOX_JAVAC_EXECUTABLE:}"
    allow-insecure-fallback: "${ARCCLAW_SANDBOX_ALLOW_INSECURE_FALLBACK:false}"
    circuit-breaker:
      failure-threshold: 3   # was 2; gives LLM one retry for param errors

  autonomy:
    default-level: SUPERVISED

  agents:
    roles:
      - name: coordinator
        class: com.arcclaw.core.agent.VishnuAgent
        description: "Preserver and Captain/Coordinator — task decomposition and synthesis"
      - name: researcher
        class: com.arcclaw.core.agent.SaraswatiAgent
        description: "Research & Knowledge, Wisdom, and Facts — real-time search and evidence"
      - name: coder
        class: com.arcclaw.core.agent.BrahmaAgent
        description: "Math/Code Creator and Logic Expert — rigorous validation"
      - name: debugger
        class: com.arcclaw.core.agent.ShivaAgent
        description: "Creative, Transformer and Balance Expert — blind-spot detection"
      - name: architect
        class: com.arcclaw.core.agent.persona.BrihaspatiAgent
        description: "Brihaspati — Guru of the Devas, System Designer and Standards Author  — ADRs and architectural trade-offs"
      - name: synthesizer
        class: com.arcclaw.core.agent.persona.DattatreyaAgent
        description: "Synthesizer and Avadhuta — multi-agent conflict resolution and integration"        

# =============================================================================
# MICROPROFILE CONTEXT PROPAGATION
# =============================================================================
mp:
  context:
    # CRITICAL: propagate CDI context across ManagedExecutor/Vert.x threads
    # Without this, @WorkspaceScoped beans are null on worker threads.
    propagators: "Quarkus, CDI, JAX-RS"

# =============================================================================
# PROFILES
# =============================================================================

"%cli":
  quarkus:
    log:
      console:
        enable: false
      level: ERROR
      category:
        "io.quarkus":
          level: ERROR     # Silences "Started in...", "Installed features..."
        "io.smallrye.config":
          level: ERROR     # Silences "Unrecognized configuration key..."
        "io.quarkus.agroal":
          level: ERROR     # Silences "Agroal does not support..."
        "com.arcclaw":
          level: ERROR     # Silences WorkspaceManager and SqliteWalConfigurer
        "org.hibernate":
          level: ERROR
      file:
        enable: true
        path: ./arcclaw-cli.log
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
    banner:
      enabled: false
    mcp:
      server:
        stdio:
          enabled: false
    hibernate-orm:
      log:
        sql: false # Forces SQL logging off even if global dev is true
  arcclaw:
    telegram:
      enabled: false        

"%dev":
  quarkus:
    mcp:
      server:
        stdio:
          enabled: false
    log:
      level: DEBUG                          # single root block — no duplicate
      console:
        enable: false
      file:
        enable: true
        path: ./arcclaw-dev.log
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
      category:
        "com.arcclaw":
          level: DEBUG                      # all arcclaw packages
        "org.apache.camel.component.telegram":
          level: INFO                      # camel telegram consumer messages
        "org.apache.camel":
          level: INFO                       # camel internals — keep quiet
        "io.quarkus":
          level: INFO
        "io.netty":
          level: WARN                       # suppress netty allocator spam
        "jdk.event.security":
          level: "OFF"                      # suppress SSL cert flood you're seeing
        "jak.json.spi":
          level: "OFF"                      # suppress FINE JSON provider logs
        "io.opentelemetry":
          level: "OFF"                      # suppress OTel FINE logs
        "org.hibernate":
          level: WARN
        "org.infinispan":
          level: WARN
        "java.lang.ProcessBuilder":
          level: WARN
        "org.jboss.resteasy.reactive.common.core":
          level: WARN
        "dev.langchain4j.internal.RetryUtils":
          level: ERROR
        "jakarta.json.spi":
          level: WARN
        "org.hibernate.engine.jdbc.spi.SqlExceptionHelper":
          level: ERROR
        "org.hibernate.orm.jdbc.error":
          level: ERROR
        # Mutes the massive stack trace generated by the Narayana Transaction Manager
        "com.arjuna.ats.arjuna":
          level: ERROR
    console:
      enabled: false
    live-reload:
      enabled: false
    otel:
      sdk:
        disabled: true
    langchain4j:
      ollama:
        chat-model:
          log-requests: "${arcclaw.debug.llm:false}"
          log-responses: "${arcclaw.debug.llm:false}"
      openai:
        chat-model:
          log-requests: "${arcclaw.debug.llm:false}"
          log-responses: "${arcclaw.debug.llm:false}"
    hibernate-orm:
      log:
        sql: false

  arcclaw:
    pii:
      mode: REDACT_AND_FORWARD   # Dev — same as prod, see redacted output
    sandbox:
      strategy: NONE        # no Podman in local dev
    governance:
      budget-usd: 9.99
      approval-timeout-minutes: 10
    vault:
      pepper: "dev-pepper-not-for-production-0000000000000000000000000000"
    debug:
      llm: true
    metadata:
      environment: dev

"%test":
  quarkus:
    mcp:
      server:
        stdio:
          enabled: false
    opentelemetry:
      enabled: false
    smallrye-fault-tolerance:
      enabled: false
    datasource:
      jdbc:
        url: "jdbc:sqlite::memory:"
    hibernate-orm:
      schema-management:
        strategy: update
      dialect: com.arcclaw.core.persistence.ArcClawSQLiteDialect
    log:
      category:
        "com.arcclaw":
          level: INFO
        "org.hibernate.SQL":
          level: DEBUG
        "com.arjuna":
          level: ERROR
        "org.hibernate.resource.transaction":
          level: ERROR
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false

  arcclaw:
    data-dir: "target/data"
    rag:
      vec-extension-path: "target/lib/vec0"
    skills:
      hot-reload: false
    memory:
      compaction:
        enabled: false
        threshold: 4
        keep-recent: 2
    security:
      prompt-injection:
        enabled: true
    audit:
      hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"

    channel:
      telegram:
        enabled: false
        bot-token: "mock-bot-token"
        allowed-users: ""
    pii:
      mode: REDACT_AND_FORWARD   # Tests use default
    sandbox:
      strategy: NONE
    vault:
      pepper: "test-pepper-00000000000000000000000000000000"

    mcp:
      server-enabled: false

    cron:
      max-lookback-window: PT999H

    recovery:
      stalled-threshold-minutes: 15

"%staging":
  quarkus:
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false

  arcclaw:
    governance:
      budget-usd: 50.00
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED

"%prod":
  quarkus:
    # native:
    #   enabled: true
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false
    log:
      level: INFO
  arcclaw:
    data-dir: "${ARCCLAW_DATA_DIR:./data}"
    workspace:
      root-dir: "${ARCCLAW_DATA_DIR:./data}/workspaces"
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED
