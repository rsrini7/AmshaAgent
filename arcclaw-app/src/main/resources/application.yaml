# =============================================================================
# ArcClaw V1.0.0 — Full Application Configuration
# Never hardcode secrets here. Use env vars or Kubernetes Secrets.
# =============================================================================

quarkus:

  application:
    name: arcclaw
    version: "1.0.0"

  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-channel-api:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-api

  swagger-ui:
    path: /q/swagger-ui
    always-include: true

  # ---------------------------------------------------------------------------
  # HTTP / REST
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    ssl-port: 8443
    cors:
      enabled: true
      origins: "${ARCCLAW_CORS_ORIGINS:http://localhost:3000}"
    limits:
      max-body-size: 10M

  rest:
    path: /api/v1   # all /sessions endpoints served at /api/v1/sessions

  # ---------------------------------------------------------------------------
  # DATABASE — SQLite
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:${ARCCLAW_DATA_DIR:./data}/arcclaw-meta.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&transaction_mode=IMMEDIATE"
      additional-jdbc-url-properties: "journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&transaction_mode=IMMEDIATE"
      min-size: 1
      max-size: 5
      initial-sql: "ATTACH DATABASE '${ARCCLAW_DATA_DIR:./data}/arcclaw-fts.db' AS fts"

  hibernate-orm:
    dialect: org.hibernate.community.dialect.SQLiteDialect
    database:
      generation: update
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
      - com.arcclaw.core.audit
    log:
      sql: false
    schema-management:
      halt-on-error: false 

  # ---------------------------------------------------------------------------
  # LANGCHAIN4J
  # ---------------------------------------------------------------------------
  langchain4j:
    chat-model:
      provider: openai
    ollama:
      chat-model:
        enabled: false
    groq:
      api-key: "${GROQ_API_KEY}"
      log-requests: true
      log-responses: true
      chat-model:
        max-tokens: 768
    openai:
      # Ollama provides native OpenAI compatibility on /v1
      # base-url: "${OLLAMA_BASE_URL:http://localhost:11434}/v1"
      # api-key: "${OPENAI_API_KEY:ollama-key-can-be-anything}"
      # The OpenAI extension properly parses model-name DYNAMICALLY at runtime!
      
      # Groq is OpenAI API-compatible
      base-url: "https://api.groq.com/openai/v1"
      api-key: "${GROQ_API_KEY}"
      log-requests: true
      log-responses: true
      timeout: 120s
      max-retries: 3
      devservices:
        enabled: false
      chat-model:
        #model-name: "${OLLAMA_MODEL:llama3.2:1b}"
        model-name: "llama-3.3-70b-versatile"
        temperature: 0.1
        log-requests: true
        log-responses: true
        max-tokens: 768

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  otel:
    enabled: true
    exporter:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}"
        protocol: grpc
    resource:
      attributes:
        service.name: "arcclaw"
        service.version: "1.0.0"
        deployment.environment: "${ARCCLAW_ENV:development}"
    traces:
      enabled: true
      sampler: always_on

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  smallrye-health:
    ui:
      enable: true

  # ---------------------------------------------------------------------------
  # SCHEDULER
  # ---------------------------------------------------------------------------
  scheduler:
    enabled: true
    metrics:
      enabled: true

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS
  # ---------------------------------------------------------------------------
  virtual-threads:
    enabled: true
  thread-pool:
    core-threads: 1   # minimize platform threads; virtual threads handle concurrency

  # ---------------------------------------------------------------------------
  # INPUT VALIDATION
  # ---------------------------------------------------------------------------
  hibernate-validator:
    fail-fast: true

  # ---------------------------------------------------------------------------
  # OPENAPI
  # ---------------------------------------------------------------------------
  smallrye-openapi:
    info-title: "ArcClaw Agent API"
    info-version: "1.0.0"
    info-description: "Autonomous multi-agent framework — Java 21 + Quarkus + LangChain4J"


  # ---------------------------------------------------------------------------
  # NATIVE IMAGE
  # ---------------------------------------------------------------------------
  native:
    # native-image-xmx: 4g # require 8GB machine with podman
    resources:
      includes:
        - "META-INF/services/*"
        - "META-INF/native-image/**"

  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
  log:
    level: INFO
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.arcclaw":
        level: DEBUG
      "io.quarkus":
        level: INFO
      "org.hibernate":
        level: WARN
      "jdk.event.security":
        level: INFO
      "io.netty.handler.ssl":
        level: INFO
      "io.sm.op.ru.util":
        level: INFO
      "ja.la.ProcessBuilder":
        level: INFO
      "java.lang.ProcessBuilder":
        level: WARN       # ← suppress DEBUG noise from sqlite-jdbc uname probe
      "org.sqlite":
        level: WARN       # ← suppress all sqlite-jdbc debug output
      "java.lang":
        level: WARN
      "org.hibernate.tool.schema.internal.exec.GenerationTargetToDatabase":
        level: ERROR   # suppress WARN → only show actual errors
      "dev.langchain4j.internal.RetryUtils":
        level: WARN   # already WARN, so 520 retries show but don't spam
      "org.jboss.resteasy.reactive.common.core.AbstractResteasyReactiveContext":
        level: ERROR  # suppress the unrecoverable exception noise at DEBUG
    console:
      # sessionId from MDC rendered in every log line (Fix C4)
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [sid=%X{sessionId}] (%t) %s%e%n"
      color: true
    file:
      enable: "${ARCCLAW_LOG_FILE_ENABLE:false}"
      path: "${ARCCLAW_LOG_DIR:./logs}/arcclaw.log"
      rotation:
        max-file-size: 50M
        max-backup-index: 5

# =============================================================================
# ARCCLAW APPLICATION CONFIG
# =============================================================================
arcclaw:
  security:
    prompt-injection:
      enabled: true
  memory:
    compaction:
      enabled: true
      threshold: 5
      keep-recent: 5
      model: "llama-3.1-8b-instant"
  chat-memory:
    max-messages: 20
  api:
    keys:
      internal: "${ARCCLAW_API_KEY_INTERNAL:key-internal-changeme}"
      ci-pipeline: "${ARCCLAW_API_KEY_CI:key-ci-changeme}"
    rate-limit:
      requests-per-minute: 20

  cron:
    poll-interval: 30s
    max-concurrent: 10
    max-iterations: 2

  channel:
    telegram:
      enabled: true
      bot-token: ${TELEGRAM_BOT_TOKEN:mock-telegram-token}
      default-autonomy-level: SUPERVISED
      allowed-user-ids: "${ARCCLAW_TELEGRAM_ALLOWED_USER_IDS:}"
      allowed-users: "${ARCCLAW_TELEGRAM_ALLOWED_USERS:mock-telegram-user}"
      silent-block: false
      block-response: "⛔ Access denied."

  pii:
    mode: REDACT_AND_FORWARD   # Options: REDACT_AND_FORWARD (default), BLOCK_AND_NOTIFY

  vault:
    pepper: "${ARCCLAW_VAULT_PEPPER:dev-pepper-not-for-production-0000000000000000000000000000}"
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1
    rotation:
      enabled: true
      interval-hours: 24

  workspace:
    root-dir: "${ARCCLAW_DATA_DIR:./data}/workspaces"
    #base-dir: /home/srini/arcclaw-data/workspaces  # Native WSL2 path
    session-ttl-minutes: 30
    gc-interval: "5m"
    heartbeat-interval: "60s"

  audit:
    hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"

  governance:
    token-limit: 100000
    budget-usd: "${ARCCLAW_SESSION_BUDGET_USD:10.00}"
    action-on-exceed: READONLY
    price-per-1k-input: 0.003
    price-per-1k-output: 0.015
    approval-timeout-minutes: 60 # must be >> gc-interval converted to minutes

  sandbox:
    strategy: PODMAN
    podman-path: podman
    container-image: "arcclaw-tool-runner:latest"
    timeout-seconds: 30
    network: none
    tool-runner-user: "65534"
    memory-limit: "512m"    # Fix C2
    cpu-limit: "0.5"        # Fix C2

  autonomy:
    default-level: SUPERVISED

  agents:
    roles:
      - name: coordinator
        class: com.arcclaw.core.agent.VishnuAgent
        description: "Preserver and Captain/Coordinator — task decomposition and synthesis"
      - name: researcher
        class: com.arcclaw.core.agent.SaraswatiAgent
        description: "Research & Knowledge, Wisdom, and Facts — real-time search and evidence"
      - name: coder
        class: com.arcclaw.core.agent.BrahmaAgent
        description: "Math/Code Creator and Logic Expert — rigorous validation"
      - name: debugger
        class: com.arcclaw.core.agent.ShivaAgent
        description: "Creative, Transformer and Balance Expert — blind-spot detection"

# =============================================================================
# MICROPROFILE CONTEXT PROPAGATION
# =============================================================================
mp:
  context:
    # CRITICAL: propagate CDI context across ManagedExecutor/Vert.x threads
    # Without this, @WorkspaceScoped beans are null on worker threads.
    propagators: "Quarkus, CDI, JAX-RS"

# =============================================================================
# PROFILES
# =============================================================================

"%cli":
  quarkus:
    banner:
      enabled: false
    otel:
      sdk:
        disabled: true     # Stops the sun.misc.Unsafe JVM warnings
    log:
      level: ERROR
      console:
        level: ERROR
      category:
        "io.quarkus":
          level: ERROR     # Silences "Started in...", "Installed features..."
        "io.smallrye.config":
          level: ERROR     # Silences "Unrecognized configuration key..."
        "io.quarkus.agroal":
          level: ERROR     # Silences "Agroal does not support..."
        "com.arcclaw":
          level: ERROR     # Silences WorkspaceManager and SqliteWalConfigurer
        "org.hibernate":
          level: ERROR
    hibernate-orm:
      log:
        sql: false # Forces SQL logging off even if global dev is true

"%dev":
  quarkus:
    console:
      enabled: false
    otel:
      sdk:
        disabled: true
    langchain4j:
      openai:
        devservices:
          enabled: false
    groq:
      api-key: "${GROQ_API_KEY}"
      log-requests: true
      log-responses: true
      chat-model:
        max-tokens: 768
    hibernate-orm:
      log:
        sql: false
    log:
      level: DEBUG
      category:
        "org.apache.camel.component.telegram":
          level: DEBUG
        "jdk.event.security":
          level: INFO
        "io.netty.handler.ssl":
          level: INFO

  arcclaw:
    pii:
      mode: REDACT_AND_FORWARD   # Dev — same as prod, see redacted output
    sandbox:
      strategy: PODMAN        # no Podman in local dev
    channel:
      telegram:
        bot-token: ${TELEGRAM_BOT_TOKEN:mock-token}
        allowed-users: ""
    governance:
      budget-usd: 999.99
      approval-timeout-minutes: 60
    vault:
      pepper: "dev-pepper-not-for-production-0000000000000000000000000000"

"%test":
  quarkus:
    datasource:
      jdbc:
        url: "jdbc:sqlite::memory:"
        initial-sql: "ATTACH DATABASE ':memory:' AS fts"
    hibernate-orm:
      database:
        generation: update
    langchain4j:
      groq:
        api-key: "mock-api-key"

  arcclaw:
    memory:
      compaction:
        enabled: false
        threshold: 4
        keep-recent: 2
    security:
      prompt-injection:
        enabled: true
    audit:
      hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"

    channel:
      telegram:
        enabled: false
        bot-token: "mock-bot-token"
        allowed-users: ""
    pii:
      mode: REDACT_AND_FORWARD   # Tests use default
    sandbox:
      strategy: NONE
    vault:
      pepper: "test-pepper-00000000000000000000000000000000"

"%staging":
  quarkus:
    langchain4j:
      groq:
        api-key: "${GROQ_API_KEY}"
        log-requests: ${ARCCLAW_DEBUG_LLM:false}
        log-responses: ${ARCCLAW_DEBUG_LLM:false}
        chat-model:
          max-tokens: 768

  arcclaw:
    governance:
      budget-usd: 50.00
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED

"%prod":
  quarkus:
    langchain4j:
      groq:
        api-key: "${GROQ_API_KEY}"
        log-requests: ${ARCCLAW_DEBUG_LLM:false}
        log-responses: ${ARCCLAW_DEBUG_LLM:false}
        chat-model:
          max-tokens: 768
      openai:
        log-requests: ${ARCCLAW_DEBUG_LLM:false}
        log-responses: ${ARCCLAW_DEBUG_LLM:false}
    log:
      level: INFO
      console:
        color: false
  arcclaw:
    workspace:
      root-dir: /var/arcclaw/workspaces
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED
