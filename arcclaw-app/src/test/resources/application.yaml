arcclaw:
  api:
    keys:
      internal: "key-internal-changeme"
      ci-pipeline: "key-ci-changeme"
  audit:
    hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
  channel:
    telegram:
      bot-token: "test-bot-token"
  vault:
    pepper: "test-pepper"
    master-key: "test-master-key-32-chars-padded!"
  data-dir: ":memory:"
      
quarkus:
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
  http:
    host: "localhost"
    port: 8081
  management:
    host: "localhost"
    port: 9000
    enabled: true
  otel:
    sdk:
      disabled: true
  native:
    additional-build-args: --enable-native-access=ALL-UNNAMED
  datasource:
    jdbc:
      url: "jdbc:sqlite:./target/app-test.db?busy_timeout=10000&journal_mode=WAL"
      min-size: 1
      max-size: 10
      initial-size: 1
  hibernate-orm:
    database:
      generation: update
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
      - com.arcclaw.core.audit

  langchain4j:
    openai:
      api-key: "demo-key"
      model-name: "gpt-4o"
    ollama:
      base-url: "http://localhost:11434"
      model-name: "llama3.2:1b"

  log:
    level: INFO
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.arcclaw.core.agent":
        level: "OFF"
      "com.arcclaw.core.tools":
        level: "OFF"
      "com.arcclaw.core.governance":
        level: "OFF"
      "com.arcclaw.core.scope":
        level: "OFF"
