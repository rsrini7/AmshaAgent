arcclaw:
  api:
    keys:
      internal: "key-internal-changeme"
      ci-pipeline: "key-ci-changeme"
      
quarkus:
  http:
    host: "localhost"
    port: 8081
  management:
    host: "localhost"
    port: 9000
    enabled: true

  langchain4j:
    openai:
      api-key: "demo-key"
      model-name: "gpt-4o"
    ollama:
      base-url: "http://localhost:11434"
      model-name: "llama3.2:1b"

  log:
    level: INFO
    category:
      "com.arcclaw.core.agent":
        level: "OFF"
      "com.arcclaw.core.tools":
        level: "OFF"
      "com.arcclaw.core.governance":
        level: "OFF"
      "com.arcclaw.core.scope":
        level: "OFF"
