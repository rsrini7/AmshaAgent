ARCCLAW_LLM_API_KEY: "dummy-test-key"
ARCCLAW_LLM_BASE_URL: "http://localhost:9999"
 
arcclaw:
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"
  rag:
    vec-extension-path: "./target/lib/vec0"
  skills:
    hot-reload: false
  auto-seed-secrets: false
  api:
    keys:
      internal: "key-internal-changeme"
      ci: "key-ci-changeme"
  audit:
    hmac-key: "${ARCCLAW_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
  channel:
    telegram:
      enabled: false
      bot-token: "mock-telegram-token"
  vault:
    pepper: "test-pepper"
    master-key: "test-master-key-32-chars-padded!"
  cron:
    max-lookback-window: PT999H
      
quarkus:
  arc:
    # Exclude channel impl beans from CDI during tests — their dependencies
    # (ChannelServices, ApprovalGateway) live in arcclaw-core which is a Quarkus
    # extension, and extension runtime beans aren't auto-discovered by Arc.
    # These channel modules have their own test suites.
    exclude-types:
      - com.arcclaw.channel.telegram.TelegramAgentHandler
      - com.arcclaw.channel.telegram.TelegramCallbackHandler
      - com.arcclaw.channel.web.WebChatEndpoint
  mcp:
    server:
      stdio:
        enabled: false
  opentelemetry:
    enabled: false
  smallrye-fault-tolerance:
    enabled: false
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-channel-api:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-api
  http:
    host: "localhost"
    port: 8081
  management:
    host: "localhost"
    port: 9000
    enabled: true
  otel:
    sdk:
      disabled: true
  native:
    additional-build-args: --enable-native-access=ALL-UNNAMED
  datasource:
    jdbc:
      url: "jdbc:sqlite:./target/app-test.db?busy_timeout=20000&journal_mode=WAL&transaction_mode=IMMEDIATE"
      additional-jdbc-url-properties: "journal_mode=WAL&synchronous=NORMAL&busy_timeout=20000&transaction_mode=IMMEDIATE"
      min-size: 1
      max-size: 4
      initial-size: 1
      acquisition-timeout: 10s
  scheduler:
    enabled: false
  hibernate-orm:
    schema-management:
      strategy: update
    dialect: com.arcclaw.core.persistence.ArcClawSQLiteDialect
    log:
      sql: false
    jdbc:
      timezone: UTC
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
      - com.arcclaw.core.audit
      - com.arcclaw.core.skill

  langchain4j:
    openai:
      api-key: "demo-key"
      model-name: "gpt-4o"
    ollama:
      base-url: "http://localhost:11434"
      model-name: "llama3.2:1b"

  log:
    level: INFO
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.arcclaw.core.agent":
        level: "OFF"
      "com.arcclaw.core.tools":
        level: "OFF"
      "com.arcclaw.core.governance":
        level: "OFF"
      "com.arcclaw.core.scope":
        level: "OFF"
      "com.arcclaw.core.agent.loop.AgentStateMachineRunner":
        level: "OFF"
      "com.arcclaw.core.agent.loop.ToolInvoker":
        level: "OFF"
      "com.arcclaw.core.pipeline.MessagePipeline":
        level: "OFF"
      "com.arcclaw.core.tools.MemorySearchTool":
        level: "OFF"
      "com.arcclaw.app.scheduler.CronResultHandler":
        level: "OFF"
      "org.jboss.threads.errors":
        level: "OFF"
      "org.apache.camel.component.telegram.TelegramConsumer":
        level: "OFF"
      "com.arcclaw.app.channel.telegram.TelegramAgentHandler":
        level: "OFF"