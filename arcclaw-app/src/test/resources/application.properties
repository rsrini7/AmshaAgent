# Force indexing of the core library to find Entities
quarkus.index-dependency.arcclaw-core.group-id=com.arcclaw
quarkus.index-dependency.arcclaw-core.artifact-id=arcclaw-core

# Explicitly tell Hibernate where to look for entities
quarkus.hibernate-orm.packages=com.arcclaw.core.state,com.arcclaw.core.security

# Use SQLite in-memory for testing (matches main application.yaml db-kind=sqlite but overrides URL)
%test.quarkus.datasource.jdbc.url=jdbc:sqlite::memory:
