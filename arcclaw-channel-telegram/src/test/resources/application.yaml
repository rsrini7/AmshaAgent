arcclaw:
  llm:
    gemini:
      api-key: "dummy-gemini-key"
      model-name: "gemini-2.5-flash-lite"
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"  
  auto-seed-secrets: false
  audit:
    hmac-key: "dev-audit-hmac-key-min-32-bytes-00000"
  vault:
    pepper: "test-pepper"
    master-key: "test-master-key-32-chars-padded!"
  channel:
    telegram:
      bot-token: "fake-token"
      bot-username: "ArcClawBot"
      allowed-users: "admin"
      allowed-user-ids: "12345,67890"

quarkus:
  log:
    level: INFO
    category:
      "com.arcclaw":
        level: DEBUG
  opentelemetry:
    enabled: false
  smallrye-fault-tolerance:
    enabled: false
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-channel-api:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-api
    arcclaw-persistence-sqlite:
      group-id: com.arcclaw
      artifact-id: arcclaw-persistence-sqlite
  langchain4j:
    openai:
      api-key: "disabled"
      embedding-model:
        enabled: true
        model-name: "text-embedding-3-small"
  arc:
    remove-unused-beans: all
  datasource:
    jdbc:
      url: "jdbc:sqlite:./target/telegram-test.db"
  hibernate-orm:
    schema-management:
      # strategy: update — NOT none. This module includes com.arcclaw.persistence.sqlite.entity
      # in Hibernate packages, so tables like encrypted_secrets must exist at startup.
      # Test DB is ephemeral (target/telegram-test.db), `update` is safe.
      strategy: update
    dialect: com.arcclaw.persistence.sqlite.ArcClawSQLiteDialect
    packages:
      - com.arcclaw.persistence.common.entity
      - com.arcclaw.persistence.sqlite.entity
      - com.arcclaw.core.lifecycle
      - com.arcclaw.core.domain.model

