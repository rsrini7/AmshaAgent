"%test":
  arcclaw:
    data-dir: "./target/data"
    workspace:
      root-dir: "./target/data/workspaces"  
    auto-seed-secrets: false
    audit:
      hmac-key: "dev-audit-hmac-key-min-32-bytes-00000"
    vault:
      pepper: "test-pepper"
      master-key: "test-master-key-32-chars-padded!"
    channel:
      telegram:
        bot-token: "fake-token"
        bot-username: "ArcClawBot"
        allowed-users: "admin"
        allowed-user-ids: "12345,67890"

quarkus:
  log:
    level: INFO
    category:
      "com.arcclaw":
        level: DEBUG
  opentelemetry:
    enabled: false
  smallrye-fault-tolerance:
    enabled: false
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-channel-api:
      group-id: com.arcclaw
      artifact-id: arcclaw-channel-api
  arc:
    remove-unused-beans: all
  datasource:
    jdbc:
      url: "jdbc:sqlite:./target/data/telegram-test.db"
  hibernate-orm:
    schema-management:
      strategy: update
    dialect: com.arcclaw.core.persistence.ArcClawSQLiteDialect
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
      - com.arcclaw.core.audit
      - com.arcclaw.core.skill
      - com.arcclaw.core.session
      - com.arcclaw.core.lifecycle

