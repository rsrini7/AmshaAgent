arcclaw:
  vault:
    pepper: "mock-pepper"
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"  
  skills:
    hot-reload: false

quarkus:
  langchain4j:
    openai:
      timeout: "30s"
  transaction-manager:
    enable-recovery: false
  shutdown:
    timeout: 5S

quarkiverse:
  mcp:
    server:
      http:
        enabled: false
      stdio:
        enabled: false

hibernate-orm:
  packages: "com.arcclaw.core.*"
