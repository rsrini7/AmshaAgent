arcclaw:
  tools:
    playwright:
      enabled: false
  vault:
    pepper: "mock-pepper"
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"  
  skills:
    hot-reload: false

quarkus:
  arc:
    # Exclude core beans from CDI during module-level tool tests to avoid 
    # unsatisfied dependency errors for heavy core components (persistence, audit, etc.)
    exclude-types:
      - "com.arcclaw.core.**"
      - "com.arcclaw.tool.playwright.PlaywrightBrowserTool"
  otel:
    sdk:
      disabled: true
  log:
    level: INFO
    category:
      "com.arcclaw.tool.playwright":
        level: WARN
      "com.microsoft.playwright":
        level: "OFF"
  langchain4j:
    openai:
      timeout: "30s"
  transaction-manager:
    enable-recovery: false
  scheduler:
    enabled: false
  hibernate-orm:
    enabled: false
  datasource:
    enabled: false
  # Required by Quarkus REST / Management extensions when present on classpath
  http:
    host: "localhost"
    port: 8081
  management:
    host: "localhost"
    port: 9001
    enabled: true
