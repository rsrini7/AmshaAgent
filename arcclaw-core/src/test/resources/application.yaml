ARCCLAW_LLM_API_KEY: "dummy-test-key"

arcclaw:
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"
  auto-seed-secrets: false
  vault:
    pepper: "test-pepper-value-not-used-in-tests"
    master-key: "test-master-key-32-chars-padded!"
  channel:
    telegram:
      bot-token: "test-bot-token"
  cron:
    max-lookback-window: PT999H

quarkus:
  arc:
    exclude-types:
      - com.arcclaw.channel.telegram.*
      - com.arcclaw.channel.web.*
  application:
    name: arcclaw
    version: "1.0.0"
  langchain4j:
    timeout: 10s
    chat-model:
      provider: openai
    openai:
      api-key: "dummy-test-key"
      base-url: "http://localhost:9999"
      chat-model:
        model-name: "gpt-4o-mini"
  rest:
    path: /api/v1
  otel:
    sdk:
      disabled: true
  datasource:
    jdbc:
      url: "jdbc:sqlite:./target/core-test.db?busy_timeout=20000&journal_mode=WAL&transaction_mode=IMMEDIATE"
      # pool-interceptor: com.arcclaw.core.persistence.FtsConnectionInterceptor
      additional-jdbc-url-properties: "journal_mode=WAL&synchronous=NORMAL&busy_timeout=20000&transaction_mode=IMMEDIATE"
      min-size: 1
      max-size: 4
      initial-size: 1
      acquisition-timeout: 10s
  scheduler:
    enabled: false
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
    dialect: com.arcclaw.core.persistence.ArcClawSQLiteDialect
    log:
      sql: false
    packages:
      - com.arcclaw.core.state
      - com.arcclaw.core.security
      - com.arcclaw.core.audit
      - com.arcclaw.core.skill
  log:
    level: INFO
    category:
      "org.hibernate.SQL":
        level: WARN
      "org.hibernate.resource.transaction":
        level: ERROR
      "com.arjuna":
        level: ERROR
      "com.arcclaw.core.agent":
        level: "OFF"
      "com.arcclaw.core.tools":
        level: "OFF"
      "com.arcclaw.core.governance":
        level: "OFF"
      "com.arcclaw.core.scope":
        level: "OFF"
      "com.arcclaw.core.agent.loop.AgentStateMachineRunner":
        level: "OFF"
      "com.arcclaw.core.agent.loop.ToolInvoker":
        level: "OFF"
      "com.arcclaw.core.pipeline.MessagePipeline":
        level: "OFF"
      "com.arcclaw.core.tools.MemorySearchTool":
        level: "OFF"
      "com.arcclaw.app.scheduler.CronResultHandler":
        level: "OFF"
      "org.jboss.threads.errors":
        level: "OFF"
  native:
    additional-build-args: --enable-native-access=ALL-UNNAMED
