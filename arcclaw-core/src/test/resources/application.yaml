ARCCLAW_LLM_API_KEY: "dummy-test-key"

arcclaw:
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"
  auto-seed-secrets: false
  vault:
    pepper: "test-pepper-value-not-used-in-tests"
    master-key: "test-master-key-32-chars-padded!"
  channel:
    telegram:
      bot-token: "test-bot-token"
  policy:
    destructive-vocabulary:
      patterns:
        - "(?i)\\b(delete|remove|purge|drop|chmod|truncate|wipe|erase|destroy|archive|rename)\\b"
        - "(?i)\\brm\\s*-?\\s*rf\\b"
      exempt-roles:
        - debugger
      sandbox-only-roles:
        - coder
      override-role: coordinator
    governance:
      hitl-exempt-tools:
        - schedule_task
        - manage_schedule
      supervised-salvage-operations:
        - NETWORK_OUTBOUND
        - VAULT_ACCESS
        - EXECUTE_SHELL
        - WRITE_MEMORY
        - DELEGATE_AUTONOMOUS
        - WRITE_FS
  cron:
    max-lookback-window: PT999H

quarkus:
  http:
    test-port: 0
  arc:
    exclude-types:
      - com.arcclaw.channel.telegram.*
      - com.arcclaw.channel.web.*
  application:
    name: arcclaw
    version: "1.0.0"
  langchain4j:
    timeout: 10s
    chat-model:
      provider: openai
    openai:
      api-key: "dummy-test-key"
      base-url: "http://localhost:9999"
      chat-model:
        model-name: "gpt-4o-mini"
  rest:
    path: /api/v1
  otel:
    sdk:
      disabled: true
  scheduler:
    enabled: false
  log:
    level: INFO
    category:
      "com.arcclaw.core.agent":
        level: "OFF"
      "com.arcclaw.core.tools":
        level: "OFF"
      "com.arcclaw.core.governance":
        level: "OFF"
      "com.arcclaw.core.scope":
        level: "OFF"
      "com.arcclaw.core.agent.loop.AgentStateMachineRunner":
        level: "OFF"
      "com.arcclaw.core.agent.loop.ToolInvoker":
        level: "OFF"
      "com.arcclaw.core.pipeline.MessagePipeline":
        level: "OFF"
      "com.arcclaw.core.tools.MemorySearchTool":
        level: "OFF"
      "com.arcclaw.app.scheduler.CronResultHandler":
        level: "OFF"
      "org.jboss.threads.errors":
        level: "OFF"
      "com.arcclaw.app.session.SessionRegistry":
        level: "WARN"
  native:
    additional-build-args: --enable-native-access=ALL-UNNAMED
