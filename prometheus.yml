global:
  scrape_interval: 5s # Fast scrape for development feedback

scrape_configs:
  - job_name: 'amsha'
    metrics_path: '/q/metrics'
    static_configs:
      # host.docker.internal allows the container to see Quarkus running on the host OS
      - targets: ['host.docker.internal:8080']

# Operational Alert Examples (§T2-2)
rule_files:
  - "alert_rules.yml"
