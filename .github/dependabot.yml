version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      quarkus-platform:
        patterns:
          - "io.quarkus*"
          - "*:quarkus-*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /local-ml-onnx/classifier-training
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
