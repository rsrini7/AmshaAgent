amsha:
  llm:
    model: "test-model"
  tools:
    playwright:
      enabled: true
  vault:
    pepper: "mock-pepper"
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"  
  skills:
    hot-reload: false

quarkus:
  application:
    name: amsha-playwright-test
  
  arc:
    # Exclude core and persistence beans to avoid unsatisfied dependency errors 
    # for components not required during browser tool integration tests.
    exclude-types:
      - "com.amsha.core.**"
      - "com.amsha.persistence.**"
      - "com.amsha.tool.playwright.PlaywrightCliTool"

  otel:
    sdk:
      disabled: true
  
  log:
    level: INFO
    category:
      "com.amsha.tool.playwright":
        level: WARN

  langchain4j:
    openai:
      api-key: "disabled"
      timeout: "30s"
      embedding-model:
        enabled: true
        model-name: "text-embedding-3-small"
  
  transaction-manager:
    enable-recovery: false
  
  scheduler:
    enabled: false
  
  datasource:
    enabled: false
  
  # Required by Quarkus REST / Management extensions when present on classpath
  http:
    host: "localhost"
    port: 8081
  management:
    host: "localhost"
    port: 9001
    enabled: true
