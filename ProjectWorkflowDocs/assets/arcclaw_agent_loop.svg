<svg width="100%" viewBox="0 0 740 510" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <mask id="loop-mask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="740" height="510" fill="white"/>
      <!-- mask gap for "loop" label -->
      <rect x="628" y="240" width="38" height="20" fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- ── Build system prompt ── -->
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="210" y="16" width="260" height="50" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="340" y="37" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#d3d1c7">Build system prompt</text>
    <text x="340" y="55" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#b4b2a9">Role template · compaction summary · RAG context</text>
  </g>
  <line x1="340" y1="66" x2="340" y2="84" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── LLM reasoning call ── -->
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="210" y="84" width="260" height="50" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="340" y="105" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#cecbf6">LLM reasoning call</text>
    <text x="340" y="123" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#afa9ec">LangChainReasoningEngine → ChatModel</text>
  </g>
  <line x1="340" y1="134" x2="340" y2="152" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Parse ReasoningStep ── -->
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="210" y="152" width="260" height="50" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="340" y="173" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">Parse ReasoningStep</text>
    <text x="340" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5dcaa5">ACTION · OBSERVE · FINAL · PENDING</text>
  </g>
  <line x1="340" y1="202" x2="340" y2="220" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Decision diamond ── -->
  <rect x="310" y="223" width="60" height="34" rx="4" transform="rotate(-45 340 240)" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
  <text x="340" y="237" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#c2c0b6" font-family='"Segoe UI", system-ui, sans-serif'>step</text>
  <text x="340" y="251" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#c2c0b6" font-family='"Segoe UI", system-ui, sans-serif'>type?</text>

  <!-- ── FINAL branch → AgentResult ── -->
  <path d="M373 240 L510 240" fill="none" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="233" text-anchor="middle" font-size="12" fill="#c2c0b6" font-family='"Segoe UI", system-ui, sans-serif'>FINAL</text>
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="510" y="218" width="148" height="44" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="584" y="236" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9fe1cb">AgentResult</text>
    <text x="584" y="252" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5dcaa5">Finished / Failed</text>
  </g>

  <!-- ── ACTION branch → ToolInvocationGuard ── -->
  <line x1="340" y1="268" x2="340" y2="296" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="358" y="284" text-anchor="start" font-size="12" fill="#c2c0b6" font-family='"Segoe UI", system-ui, sans-serif'>ACTION</text>

  <!-- ── ToolInvocationGuard + Governance ── -->
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="190" y="296" width="300" height="50" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="0.5"/>
    <text x="340" y="317" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#f5c4b3">ToolInvocationGuard + Governance</text>
    <text x="340" y="335" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#f0997b">Budget · rate-limit · approval gate</text>
  </g>

  <!-- ── needs approval dashed branch → AwaitingApproval ── -->
  <path d="M190 321 L100 321 L100 404" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="145" y="314" text-anchor="middle" font-size="12" fill="#c2c0b6" font-family='"Segoe UI", system-ui, sans-serif'>needs approval</text>
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="20" y="404" width="160" height="50" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="0.5"/>
    <text x="100" y="425" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fac775">AwaitingApproval</text>
    <text x="100" y="443" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ef9f27">Checkpoint persisted</text>
  </g>

  <!-- ── ToolInvoker · observation transformers ── -->
  <line x1="340" y1="346" x2="340" y2="366" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="190" y="366" width="300" height="50" rx="8" fill="#0c447c" stroke="#85b7eb" stroke-width="0.5"/>
    <text x="340" y="387" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b5d4f4">ToolInvoker · observation transformers</text>
    <text x="340" y="405" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#85b7eb">PII redact · injection redact · truncate</text>
  </g>

  <!-- ── ChatMemoryWriter · next iteration ── -->
  <line x1="340" y1="416" x2="340" y2="440" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-family='"Segoe UI", system-ui, sans-serif'>
    <rect x="210" y="440" width="260" height="40" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#d3d1c7">ChatMemoryWriter · next iteration</text>
  </g>

  <!-- ── Loop arrow back to top ── -->
  <path d="M470 460 L650 460 L650 91 L470 91"
        fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-dasharray="4 3"
        marker-end="url(#arrow)" mask="url(#loop-mask)"/>
  <text x="654" y="250" text-anchor="start" font-size="12" fill="#c2c0b6" font-family='"Segoe UI", system-ui, sans-serif'>loop</text>
</svg>