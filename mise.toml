# =============================================================================
# mise.toml — ArcClaw Agent Kernel
# Docs: https://mise.jdx.dev
# Platform: macOS · WSL2 (Ubuntu) · Linux
# Windows: see scripts/windows/ for .ps1 wrappers
# =============================================================================

[tools]
# Default JDK — used by all dev, build:*, jar, native tasks except build:native*
java  = "temurin-25"
maven = "3.9"
powershell = "latest"

# GraalVM is installed alongside Temurin but NOT the default.
# Switch with:   mise run jdk:graalvm   (before native build)
# Switch back:   mise run jdk:temurin   (after native build)
# Current JDK:   mise run jdk:status

[env]
_.file = ".env"
ARCCLAW_VEC_EXT          = "../lib/vec0"
ARCCLAW_DATA_DIR_DEFAULT = "../data"

# NOTE: JDK_JAVA_OPTIONS intentionally NOT set here — see §15 in MISE_README.md

[task_config]
includes = ["mise-tasks"]

# ---------------------------------------------------------------------------
# Inline proxy tasks (share name with a subdirectory — filesystem constraint)
# ---------------------------------------------------------------------------

[tasks.setup]
description = "First-time setup: .env, chmod +x mvnw and all mise-tasks scripts, install both JDKs"
shell = "pwsh -NonInteractive -Command"
run = """
$ErrorActionPreference = 'Stop'
if (-not (Test-Path '.env')) {
    Copy-Item '.env.example' '.env'
    Write-Host '✅  .env created — fill in GROQ_API_KEY, ARCCLAW_VAULT_PEPPER etc.'
} else {
    Write-Host 'ℹ️   .env already exists — skipping copy.'
}
if (-not $IsWindows) {
    chmod +x mvnw
    Get-ChildItem -Path mise-tasks -Recurse -File | ForEach-Object { chmod +x $_.FullName }
    Write-Host '✅  mvnw and all mise-tasks scripts are executable.'
}
Write-Host 'Installing JDKs (temurin-25 + graalvm-community-25.0.2)...'
mise install java@temurin-25
mise install java@graalvm-community-25.0.2
Write-Host '✅  Both JDKs installed.'
"""

# ---------------------------------------------------------------------------
# JDK switch tasks — cross-platform (Linux · macOS · WSL2 · Windows pwsh)
# ---------------------------------------------------------------------------

[tasks."jdk:graalvm"]
description = "Switch active JDK to GraalVM Community 25.0.2 (for native builds)"
run = [
  "mise use java@graalvm-community-25.0.2",
  "java -version",
]

[tasks."jdk:temurin"]
description = "Switch active JDK back to Temurin 25 (default — dev, build, jar tasks)"
run = [
  "mise use java@temurin-25",
  "java -version",
]

[tasks."jdk:install"]
description = "Install both JDKs (temurin-25 + graalvm-community-25.0.2) — safe to re-run"
run = [
  "mise install java@temurin-25",
  "mise install java@graalvm-community-25.0.2",
  "mise ls java",
]

[tasks."jdk:status"]
description = "Show which JDK is currently active and list all installed JDKs"
run = [
  "java -version",
  "mise ls java",
]

# ---------------------------------------------------------------------------
# Build tasks — cross-platform (Linux · macOS · WSL2 · Windows pwsh)
# ---------------------------------------------------------------------------

[tasks."build:native"]
description = "Native binary — auto-switches GraalVM → Temurin (all platforms)"
shell = "pwsh -NonInteractive -Command"
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }

# Windows: GraalVM is local via mise — no container needed
# Linux/macOS: use Podman container build (existing behaviour)
$containerFlag = if ($IsWindows) { '-Dquarkus.native.container-build=false' } else { '-Dquarkus.native.container-build=true' }

try {
    mise use java@graalvm-community-25.0.2
    $env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
    & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests $containerFlag
    if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
    $suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
    Write-Host "✅  Native build complete: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
} finally {
    mise use java@temurin-25
    Write-Host '✅  Switched back to Temurin 25'
}
"""

[tasks."build:native-lowmem"]
description = "Native binary — 6 GB heap cap — auto-switches GraalVM → Temurin"
shell = "pwsh -NonInteractive -Command"
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$containerFlag = if ($IsWindows) { '-Dquarkus.native.container-build=false' } else { '-Dquarkus.native.container-build=true' }
try {
    mise use java@graalvm-community-25.0.2
    $env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
    & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests $containerFlag '-Dquarkus.native.additional-build-args=-J-Xmx6g'
    if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
    Write-Host '✅  Native lowmem build complete.'
} finally {
    mise use java@temurin-25
    Write-Host '✅  Switched back to Temurin 25'
}
"""

[tasks.build]
description = "JVM build — all modules, skip tests (fast daily driver) — uses temurin-25"
shell = "pwsh -NonInteractive -Command"
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
& $mvnw clean package -pl arcclaw-app -am -DskipTests
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Build complete: arcclaw-app/target/quarkus-app/quarkus-run.jar'
"""

[tasks."build:full"]
description = "Clean install all modules, skip tests"
shell = "pwsh -NonInteractive -Command"
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
& $mvnw clean install -DskipTests
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Full build complete.'
"""

[tasks."build:test"]
description = "Build and run all tests"
shell = "pwsh -NonInteractive -Command"
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
& $mvnw clean verify
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Tests complete.'
"""



[tasks.dev]
description = "Dev mode — serve on :8080 with hot reload (strategy: NONE, no Podman needed)"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec ./mvnw quarkus:dev -pl arcclaw-app -am \
    '-Djvm.args=--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow' \
    "-Dquarkus.args=serve" \
    "-Dquarkus.profile=dev" \
    "-Darcclaw.rag.vec-extension-path=../lib/vec0" \
    "-Darcclaw.data-dir=../data"
"""
