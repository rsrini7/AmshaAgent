# =============================================================================
# mise.toml - ArcClaw Agent Kernel  (unified, all platforms)
# Docs: https://mise.jdx.dev
# Platform: Windows · macOS · WSL2 · Linux
#
# All tasks use PowerShell (pwsh) - the only true cross-platform scripting
# runtime. mise installs pwsh automatically via the [tools] section below.
#
# BOOTSTRAP SEQUENCE (fresh clone):
#   1. mise trust --all
#   2. mise install              ← installs pwsh, java, maven, gh, usage
#   3. mise run setup:profile    ← writes shell profile (activate + completion)
#   4. reload your shell
#   5. mise run setup            ← .env, chmod mvnw, JDKs, gh CLI
#   6. mise run dev
#
# NOTE: `start` uses run = [...] array (no shell dependency) so it works
# even before `mise install` completes - cmd.exe, sh, pwsh all handle it.
#
# IMPORTANT - mise use --path
# All `mise use java@...` calls specify --path mise.toml to prevent writing
# [tools] changes to any other file.
# =============================================================================

[tools]
java = "temurin-25"
maven = "3.9"
powershell = "7.5"
node = "22"
gh = "latest"
go = "1.26"
sonar-scanner-cli = "latest"

[env]
_.file = ".env"

[settings]
trusted_config_paths = ["~/.cache/arcclaw-wsl-build"]

# Enable it with `mise settings experimental=true`
# [hooks]
# # Fires automatically after `mise install`
# postinstall = "mise run <task-name>"

# ARCCLAW_VEC_EXT and ARCCLAW_DATA_DIR are intentionally NOT set here.
# quarkus:dev forks Maven inside arcclaw-app/ → needs ../lib/vec0 and ../data.
# jar and native tasks run from project root → need ./lib/vec0 and ./data.
# Each task passes -Darcclaw.rag.vec-extension-path and -Darcclaw.data-dir explicitly.

# NOTE: JDK_JAVA_OPTIONS intentionally NOT set here.
# Dev tasks pass JVM flags via -Djvm.args; build tasks set MAVEN_OPTS inline.
# Setting JDK_JAVA_OPTIONS globally causes Maven to fail parsing --add-opens.

# =============================================================================
# BOOTSTRAP - works before `mise install` (run = [] uses system default shell)
# =============================================================================

[tasks.start]
description = "New here? Run: mise install  then: mise run setup:profile  then: mise run setup"
run = [
  "echo \"\"",
  "echo   ArcClaw - mise Task Runner",
  "echo   ===========================",
  "echo \"\"",
  "echo   BOOTSTRAP SEQUENCE",
  "echo   1. mise install                installs pwsh + java + maven + usage",
  "echo   2. mise run setup:profile      writes shell profile activate + completion",
  "echo   3. reload your shell",
  "echo   4. mise run setup              .env + chmod mvnw + JDKs + gh CLI + Playwright Chromium",
  "echo   5. mise run dev                hot-reload on :8080",
  "echo \"\"",
  "echo   See MISE_SETUP.md for full documentation.",
  "echo \"\"",
]

# =============================================================================
# SETUP
# =============================================================================

[tasks.setup]
depends = ["setup:wsl-crlf"]
alias = "s"

[tasks."setup:profile"]
description = "One-time: write mise activate + completion to your shell profile. Run after mise install."
dir = "{{config_root}}"
[tasks."setup:env-check"]
description = "Validate .env - warn about missing or placeholder values"
dir = "{{config_root}}"
[tasks."setup:wsl-crlf"]
description = "WSL2: fix Windows CRLF line endings in mvnw + all .mise bash task scripts"
dir = "{{config_root}}"

# =============================================================================
# JDK MANAGEMENT
# =============================================================================

[tasks."jdk:graalvm"]
description = "Switch active JDK to GraalVM Community 25.0.2 (for native builds)"
dir = "{{config_root}}"
run = [
  "mise use --path mise.toml java@graalvm-community-25.0.2",
  "java -version"
]

[tasks."jdk:temurin"]
description = "Switch active JDK back to Temurin 25 (default - dev, build, jar tasks)"
dir = "{{config_root}}"
run = ["mise use --path mise.toml java@temurin-25", "java -version"]

[tasks."jdk:install"]
description = "Install both JDKs (temurin-25 + graalvm-community-25.0.2) - safe to re-run"
dir = "{{config_root}}"
run = [
  "mise install",
  "mise install java@graalvm-community-25.0.2 --quiet",
  "mise ls java",
]

[tasks."jdk:status"]
description = "Show which JDK is currently active and list all installed JDKs"
dir = "{{config_root}}"
run = ["java -version", "mise ls java"]

# =============================================================================
# BUILD TASKS
# =============================================================================

[tasks."build:ui-copy"]
description = "Build UI and copy to Quarkus resources"
alias = "buc"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
  $ErrorActionPreference = 'Stop'
  if (-not (Test-Path 'arcclaw-ui')) { Write-Host '❌  arcclaw-ui/ not found.'; exit 1 }
  Push-Location arcclaw-ui
  try {
    npm install
    npm run build
  } finally {
    Pop-Location
  }
  $target = "arcclaw-app/src/main/resources/META-INF/resources"
  if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
  Copy-Item -Path "arcclaw-ui/dist/*" -Destination $target -Recurse -Force
  Write-Host "✅  UI built and copied to $target"
"""

[tasks."ui:dev"]
description = "Start UI dev server on :3000 with Vite proxy to backend :8080"
alias = "uid"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
  $ErrorActionPreference = 'Stop'
  Push-Location arcclaw-ui
  try {
    npm install
    Write-Host '🖥️  UI dev server starting on http://localhost:3000'
    Write-Host '    Proxy: /api → http://localhost:8080, /ws → ws://localhost:8080'
    Write-Host '    Make sure backend is running (arcclaw serve or mise run dev)'
    npm run dev
  } finally {
    Pop-Location
  }
"""

[tasks."build:ui-copy-dto"]
description = "Ensure generated TypeScript DTOs exist (create stubs if missing)"
alias = "buc-dto"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
  $ErrorActionPreference = 'Stop'
  $modelsDir = "arcclaw-ui/src/api/generated/models"
  $stubFiles = @(
    "AgentStatusDto.ts",
    "AgentEvent.ts",
    "SkillDto.ts",
    "McpServerRequest.ts"
  )
  $missing = $false
  foreach ($f in $stubFiles) {
    if (-not (Test-Path "$modelsDir/$f")) { $missing = $true; break }
  }
  if (-not $missing) { Write-Host '✅  Generated DTOs already exist.'; exit 0 }

  Write-Host 'ℹ️   Generated DTOs missing — creating stubs from build output...'
  try {
    if (-not (Test-Path 'arcclaw-ui')) { Write-Host '❌  arcclaw-ui/ not found.'; exit 1 }
    Push-Location arcclaw-ui
    npm run generate-dto
  } finally {
    Pop-Location
  }

  if (-not (Test-Path $modelsDir)) { New-Item -ItemType Directory -Path $modelsDir -Force | Out-Null }

  foreach ($f in $stubFiles) {
    if (-not (Test-Path "$modelsDir/$f")) {
      Write-Host "⚠️   DTO $f still missing after generate-dto — creating manual stub."
      $name = $f -replace '\\.[^.]*$', ''
      $content = @"
export interface $name {
}
"@
      Set-Content -Path "$modelsDir/$f" -Value $content
    }
  }
  Write-Host '✅  All generated DTOs present.'
"""

[tasks.build-app]
depends = ["dev:kill", "env:recover"]
description = "JVM build - all modules, skip tests (fast daily driver) - uses temurin-25"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$mOpts = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'

# --- Auto-tune: detect available RAM & CPUs ---
if ($IsMacOS) {
    $vm = vm_stat; $ps = [int](($vm | Select-String 'page size of (\\d+)').Matches[0].Groups[1].Value)
    $availGB = [Math]::Floor(([int](($vm | Select-String 'Pages free:').ToString() -replace '.*:\\s+(\\d+)\\.','$1') + [int](($vm | Select-String 'Pages inactive:').ToString() -replace '.*:\\s+(\\d+)\\.','$1')) * $ps / 1GB)
    if ($availGB -lt 4) { $availGB = [Math]::Floor([int64](sysctl -n hw.memsize) / 1GB) }
    $cpu = [int](sysctl -n hw.ncpu)
} elseif ($IsWindows) {
    $availGB = [Math]::Floor([System.GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB)
    $cpu = [int]$env:NUMBER_OF_PROCESSORS
} else {
    $availGB = [Math]::Floor([int64]((Select-String 'MemAvailable:' /proc/meminfo).ToString() -replace '.*:\\s+(\\d+)\\s+kB','$1') / 1MB)
    $cpu = [int](nproc)
}
$jitGB = [Math]::Max(2, [Math]::Floor($availGB * 0.5))
$threads = [Math]::Max(2, [Math]::Min([Math]::Floor($cpu / 2), 8))
Write-Host "🧠 ${availGB}G avail, ${cpu} CPUs → JIT heap:${jitGB}G, parallel threads:${threads}"

# --- Shield .env (secrets) from the build ---
$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) - secrets will not be baked into JAR.'
}

try {
    $env:MAVEN_OPTS = "$mOpts -Xmx${jitGB}g -Xms${jitGB}g"

    # Phase 1: Build Maven backend first (generates OpenAPI spec)
    & $mvnw clean install -pl arcclaw-app -am -DskipTests --no-transfer-progress -T $threads
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    Write-Host '✅  Maven build complete. OpenAPI spec generated.'

    # Phase 2: Build UI (prebuild auto-generates TypeScript DTOs from OpenAPI spec)
    try {
        Push-Location arcclaw-ui
        npm install
        npm run build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Write-Host '✅  UI built.'
    } finally {
        Pop-Location
    }

    # Phase 3: Copy UI dist to Quarkus resources
    $target = "arcclaw-app/src/main/resources/META-INF/resources"
    if (-not (Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force | Out-Null }
    Copy-Item -Path "arcclaw-ui/dist/*" -Destination $target -Recurse -Force
    Write-Host '✅  UI copied to Quarkus resources.'

    Write-Host '✅  Build complete: arcclaw-app/target/quarkus-app/quarkus-run.jar'
} finally {
    if ($envBackup -and (Test-Path '.env.build-backup')) {
        Rename-Item '.env.build-backup' '.env'
        Write-Host 'ℹ️   .env restored.'
    }
}
"""

