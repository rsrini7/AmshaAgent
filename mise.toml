# =============================================================================
# DIST — assemble a ready-to-run distribution folder
# =============================================================================

[tasks."env:recover"]
description = "Internal: Auto-recover stranded .env files from aborted builds"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (Test-Path '.env.build-backup') {
    if (Test-Path '.env') { Remove-Item '.env' -Force }
    Rename-Item '.env.build-backup' '.env'
    Write-Host '⚠️  Recovered stranded .env.build-backup from a previously aborted build.'
}
"""

[tasks.dist]
description = "Assemble dist/ folder: native exe + .env.example + vec0 extension + launchers"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$suffix  = if ($IsWindows) { '-runner.exe' } else { '-runner' }
$exeName = "arcclaw-app-1.0.0-SNAPSHOT$suffix"
$src     = "arcclaw-app/target/$exeName"
$distDir = 'dist'

if (-not (Test-Path $src)) {
    Write-Host "❌  Native binary not found at $src — run: mise run build:native"
    exit 1
}

New-Item -ItemType Directory -Force "$distDir/lib" | Out-Null
Copy-Item $src "$distDir/$exeName"
Copy-Item '.env.example' "$distDir/.env.example"

$vec0Copied = 0
@( @("arcclaw-app/src/main/resources/native/vec0/vec0-linux-x86_64.so",    "$distDir/lib/vec0.so",    'Linux'),
   @("arcclaw-app/src/main/resources/native/vec0/vec0-macos-aarch64.dylib", "$distDir/lib/vec0.dylib", 'macOS'),
   @("arcclaw-app/src/main/resources/native/vec0/vec0-windows-x86_64.dll",   "$distDir/lib/vec0.dll",   'Windows') ) | ForEach-Object {
    $s, $dst, $plat = $_
    if (Test-Path $s) {
        Copy-Item $s $dst
        Write-Host "✅  $dst copied ($plat) [from resources]"
        $vec0Copied++
    }
}
if ($vec0Copied -eq 0) {
    Write-Host '⚠️   No vec0 extension found in resources — vector search will degrade to FTS5.'
    Write-Host '    Ensure binaries exist in: arcclaw-app/src/main/resources/native/vec0/'
}

# ── Copy run.ps1 as-is (Windows line endings are fine for a .ps1 file)
Copy-Item '.mise/launchers/run.ps1.template' 'dist/run.ps1'

# ── Copy run.sh with enforced LF line endings and no BOM (critical for bash)
$runShRaw = [System.IO.File]::ReadAllText('.mise/launchers/run.sh.template')
$runShLf  = $runShRaw -replace "`r`n", "`n"
[System.IO.File]::WriteAllText(
    (Join-Path (Resolve-Path 'dist') 'run.sh'),
    $runShLf,
    [System.Text.UTF8Encoding]::new($false)
)

if (-not $IsWindows) { chmod +x dist/run.sh }

Write-Host ''
Write-Host '✅  dist/ assembled. Next steps:'
Write-Host '      cd dist && ./run.sh serve    (Linux/macOS — first run auto-configures .env)'
Write-Host '      cd dist && ./run.ps1 serve   (Windows)'
Write-Host ''
Write-Host '-- Binaries in dist/ ----------------------------------------------------'
if (Test-Path 'dist/arcclaw-app-1.0.0-SNAPSHOT-runner')     { Write-Host '  OK  runner        (Linux/macOS)' } else { Write-Host '  -   runner        (Linux/macOS) -- not built yet' }
if (Test-Path 'dist/arcclaw-app-1.0.0-SNAPSHOT-runner.exe') { Write-Host '  OK  runner.exe    (Windows)'     } else { Write-Host '  -   runner.exe    (Windows)     -- not built yet' }
Write-Host '-------------------------------------------------------------------------'
Write-Host '    Build the missing platform binary and re-run: mise run dist'
"""

[tasks."dist:pack"]
description = "Create OS-specific release archives from dist/ for GitHub releases"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$version = '1.0.0'
$out     = 'dist/release'
$runner  = 'arcclaw-app-1.0.0-SNAPSHOT-runner'
New-Item -ItemType Directory -Force $out | Out-Null
$packed = 0

# Windows
if (Test-Path "dist/$runner.exe") {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    New-Item -ItemType Directory "$stage/lib" | Out-Null
    Copy-Item "dist/$runner.exe"  "$stage/arcclaw.exe"
    # run.ps1 is fine with Set-Content (Windows line endings OK for .ps1)
    (Get-Content 'dist/run.ps1') `
        -replace 'arcclaw-app-[^/]*-runner\\.exe', 'arcclaw.exe' `
        -replace 'arcclaw-app-[^/]*-runner',      'arcclaw' | Set-Content "$stage/run.ps1"
    Copy-Item 'dist/.env.example' "$stage/.env.example"
    if (Test-Path 'dist/lib/vec0.dll') { Copy-Item 'dist/lib/vec0.dll' "$stage/lib/vec0.dll" }
    $archive = "$out/arcclaw-$version-windows-x64.zip"
    Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
    Remove-Item $stage -Recurse -Force
    Write-Host "✅  $archive"
    $packed++
}

# Linux
# FIX: use ReadAllText/WriteAllText to preserve LF line endings in run.sh
if (Test-Path "dist/$runner") {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    New-Item -ItemType Directory "$stage/lib" | Out-Null
    Copy-Item "dist/$runner" "$stage/arcclaw"
    $runShContent = [System.IO.File]::ReadAllText('dist/run.sh') -replace 'arcclaw-app-[^/]*-runner', 'arcclaw'
    [System.IO.File]::WriteAllText("$stage/run.sh", $runShContent, [System.Text.UTF8Encoding]::new($false))
    Copy-Item 'dist/.env.example' "$stage/.env.example"
    if (Test-Path 'dist/lib/vec0.so') { Copy-Item 'dist/lib/vec0.so' "$stage/lib/vec0.so" }
    $archive = "$out/arcclaw-$version-linux-x64.tar.gz"
    if (Get-Command tar -ErrorAction SilentlyContinue) {
        tar -czf $archive -C $stage .
        Write-Host "✅  $archive"; $packed++
    } else { Write-Host "⚠️   tar not found -- skipping Linux archive. Run from WSL2." }
    Remove-Item $stage -Recurse -Force
}

# macOS
# FIX: use ReadAllText/WriteAllText to preserve LF line endings in run.sh
if ((Test-Path "dist/$runner") -and (Test-Path 'dist/lib/vec0.dylib')) {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    New-Item -ItemType Directory "$stage/lib" | Out-Null
    Copy-Item "dist/$runner" "$stage/arcclaw"
    $runShContent = [System.IO.File]::ReadAllText('dist/run.sh') -replace 'arcclaw-app-[^/]*-runner', 'arcclaw'
    [System.IO.File]::WriteAllText("$stage/run.sh", $runShContent, [System.Text.UTF8Encoding]::new($false))
    Copy-Item 'dist/.env.example'   "$stage/.env.example"
    Copy-Item 'dist/lib/vec0.dylib' "$stage/lib/vec0.dylib"
    $archive = "$out/arcclaw-$version-macos-aarch64.tar.gz"
    if (Get-Command tar -ErrorAction SilentlyContinue) {
        tar -czf $archive -C $stage .
        Write-Host "✅  $archive"; $packed++
    } else { Write-Host "⚠️   tar not found -- skipping macOS archive. Run from WSL2." }
    Remove-Item $stage -Recurse -Force
}

if ($packed -eq 0) {
    Write-Host '❌  No binaries found in dist/ — run mise run build:native first'; exit 1
}
Write-Host ''
Write-Host "-- Release archives in $out/ --"
Get-ChildItem $out | Format-Table Name, @{L='Size';E={'{0:N0} KB' -f ($_.Length/1KB)}} -AutoSize
"""

# =============================================================================
# DOCKER COMPOSE TASKS
# =============================================================================

[tasks."compose:up"]
description = "Start full observability stack: ArcClaw native + Ollama + OTel + Jaeger + Prometheus"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
$runner = "arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
if (-not (Test-Path $runner)) {
    Write-Host "❌  Native binary not found. Run: mise run build:native"; exit 1
}
docker compose up -d
Write-Host ''
Write-Host '✅  Stack started:'
Write-Host '    ArcClaw REST  -> http://localhost:8080'
Write-Host '    Jaeger UI     -> http://localhost:16686'
Write-Host '    Prometheus    -> http://localhost:9090'
Write-Host '    Ollama        -> http://localhost:11434'
"""

[tasks."compose:down"]
description = "Stop the observability stack (data volumes are preserved)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
docker compose down
Write-Host '✅  Stack stopped. Data volumes preserved.'
"""

[tasks."compose:down-clean"]
description = "Stop the stack and DELETE all data volumes (irreversible — prompts for confirmation)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
Write-Host '⚠️   WARNING: This will permanently delete all data volumes.'
$confirm = Read-Host 'Type YES to confirm'
if ($confirm -eq 'YES') {
    docker compose down -v
    Write-Host '✅  Stack and volumes removed.'
} else {
    Write-Host 'Aborted.'
    exit 1
}
"""

[tasks."compose:logs"]
description = "Follow live arcclaw container logs (Ctrl+C to stop)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
run = "docker compose logs -f arcclaw"

[tasks."compose:restart"]
description = "Restart only the arcclaw service (observability stack stays up)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
docker compose restart arcclaw
Write-Host '✅  arcclaw service restarted.'
"""

# =============================================================================
# PODMAN TASKS
# =============================================================================

[tasks."podman:init"]
description = "macOS: initialise and start Podman machine (6 GB RAM, 4 CPUs, 40 GB disk)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if ($IsWindows) {
    Write-Host 'ℹ️   podman:init is macOS-only. On Windows use Podman Desktop or Docker Desktop.'
    exit 0
}
podman machine init --memory 6144 --cpus 4 --disk-size 40
podman machine start
Write-Host '✅  Podman machine initialised and running.'
"""

[tasks."podman:start"]
description = "macOS: start the Podman machine"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if ($IsWindows) { Write-Host 'ℹ️   podman:start is macOS-only.'; exit 0 }
podman machine start
Write-Host '✅  Podman machine started.'
"""

[tasks."podman:stop"]
description = "macOS: stop the Podman machine"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if ($IsWindows) { Write-Host 'ℹ️   podman:stop is macOS-only.'; exit 0 }
podman machine stop
Write-Host '✅  Podman machine stopped.'
"""

[tasks."podman:socket"]
description = "WSL2/Linux: enable Podman user socket via systemd (run once per WSL2 instance)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if ($IsWindows) {
    Write-Host 'ℹ️   podman:socket is WSL2/Linux-only. On Windows, Podman Desktop manages the socket.'
    exit 0
}
systemctl --user enable --now podman.socket
$uid  = & id -u
$sock = "/run/user/$uid/podman/podman.sock"
ls -l $sock
Write-Host ''
Write-Host '✅  Podman socket active.'
Write-Host "    Add to ~/.bashrc or ~/.zshrc:"
Write-Host "    export DOCKER_HOST=`"unix://$sock`""
"""

[tasks."podman:status"]
description = "Print Podman version, running containers, and tool-runner image status"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
Write-Host '-- Podman version ───────────────────────────────'
$pv = podman --version 2>&1; if ($LASTEXITCODE -eq 0) { Write-Host "  $pv" } else { Write-Host '  podman not found' }
Write-Host '-- Running containers ───────────────────────────'
$ps = podman ps 2>&1; if ($LASTEXITCODE -eq 0) { Write-Host $ps } else { Write-Host '  (podman not running)' }
Write-Host '-- arcclaw-tool-runner image ────────────────────'
$img = (podman images 2>&1) | Select-String 'arcclaw-tool-runner'
if ($img) { Write-Host "  $img" } else { Write-Host '  Image not found -- run: mise run sandbox:build' }
Write-Host '-- DOCKER_HOST ──────────────────────────────────'
Write-Host "  $($env:DOCKER_HOST ?? '(not set)')"
"""

[tasks."podman:sandbox-build"]
description = "Build the arcclaw-tool-runner Podman image for the sandbox environment"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (-not (Get-Command podman -ErrorAction SilentlyContinue)) {
    Write-Host '❌  podman is not installed or not in PATH.'
    exit 1
}
Write-Host '▶   Building arcclaw-tool-runner image via Podman...'
podman build --no-cache -t arcclaw-tool-runner -f ./sandbox/Dockerfile.toolrunner .
if ($LASTEXITCODE -ne 0) {
    Write-Host "❌  Podman build failed (exit $LASTEXITCODE)"
    exit $LASTEXITCODE
}
Write-Host ''
Write-Host '✅  Build complete. Verifying image in local registry:'
podman images | Select-String 'arcclaw-tool-runner'
"""

[tasks."podman:sandbox-check"]
description = "Verify the arcclaw-tool-runner sandbox image exists"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$img = (podman images 2>&1) | Select-String 'arcclaw-tool-runner'
if ($img) {
    Write-Host '✅  arcclaw-tool-runner image is present.'
    Write-Host "  $img"
} else {
    Write-Host '❌  Image not found. Run: mise run sandbox:build'
    exit 1
}
"""

# =============================================================================
# DATABASE HELPERS
# =============================================================================

[tasks."db:inspect"]
description = "Open arcclaw-meta.db in sqlite3 interactive CLI"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$dataDir = if ($env:ARCCLAW_DATA_DIR) { $env:ARCCLAW_DATA_DIR } else { './data' }
$db = "$dataDir/arcclaw-meta.db"
if (-not (Test-Path $db)) {
    Write-Host "❌  Database not found at: $db"
    Write-Host '    Has ArcClaw been started at least once?'
    exit 1
}
Write-Host "Opening $db ..."
sqlite3 $db
"""

[tasks."db:fts-check"]
description = "Verify SQLite FTS5 is available (required for full-text search)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$result = sqlite3 ':memory:' 'CREATE VIRTUAL TABLE t USING fts5(x);' 2>&1
if ($LASTEXITCODE -eq 0) {
    Write-Host '✅  FTS5 is available.'
} else {
    Write-Host '❌  FTS5 not available.'
    if (-not $IsWindows) { Write-Host '    Fix: sudo apt install sqlite3' }
    exit 1
}
"""

[tasks."db:vec-check"]
description = "Check sqlite-vec extension exists for your platform (lib/vec0.dll / .so / .dylib)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ext = if ($IsWindows) { './lib/vec0.dll' } elseif ($IsMacOS) { './lib/vec0.dylib' } else { './lib/vec0.so' }
if (Test-Path $ext) {
    Write-Host "✅  sqlite-vec extension found: $ext"
} else {
    Write-Host "❌  Extension not found: $ext"
    Write-Host '    Download from: https://github.com/asg017/sqlite-vec/releases/tag/v0.1.6'
    exit 1
}
"""

