# =============================================================================
# mise.toml — ArcClaw Agent Kernel  (unified, all platforms)
# Docs: https://mise.jdx.dev
# Platform: Windows · macOS · WSL2 · Linux
#
# All tasks use PowerShell (pwsh) — the only true cross-platform scripting
# runtime. mise installs pwsh automatically via the [tools] section below.
#
# BOOTSTRAP SEQUENCE (fresh clone):
#   1. mise trust --all
#   2. mise install              ← installs pwsh, java, maven, usage
#   3. mise run setup:profile    ← writes shell profile (activate + completion)
#   4. reload your shell
#   5. mise run setup            ← .env, chmod mvnw, JDKs
#   6. mise run dev
#
# NOTE: `start` uses run = [...] array (no shell dependency) so it works
# even before `mise install` completes — cmd.exe, sh, pwsh all handle it.
#
# IMPORTANT — mise use --path
# All `mise use java@...` calls specify --path mise.toml to prevent writing
# [tools] changes to any other file.
# =============================================================================

[tools]
java       = "temurin-25"
maven      = "3.9"
powershell = "7.6"

[env]
_.file = ".env"

# ARCCLAW_VEC_EXT and ARCCLAW_DATA_DIR are intentionally NOT set here.
# quarkus:dev forks Maven inside arcclaw-app/ → needs ../lib/vec0 and ../data.
# jar and native tasks run from project root → need ./lib/vec0 and ./data.
# Each task passes -Darcclaw.rag.vec-extension-path and -Darcclaw.data-dir explicitly.

# NOTE: JDK_JAVA_OPTIONS intentionally NOT set here.
# Dev tasks pass JVM flags via -Djvm.args; build tasks set MAVEN_OPTS inline.
# Setting JDK_JAVA_OPTIONS globally causes Maven to fail parsing --add-opens.

# =============================================================================
# BOOTSTRAP — works before `mise install` (run = [] uses system default shell)
# =============================================================================

[tasks.start]
description = "New here? Run: mise install  then: mise run setup:profile  then: mise run setup"
run = [
    "echo.",
    "echo   ArcClaw - mise Task Runner",
    "echo   ===========================",
    "echo.",
    "echo   BOOTSTRAP SEQUENCE",
    "echo   1. mise install                installs pwsh + java + maven + usage",
    "echo   2. mise run setup:profile      writes shell profile activate + completion",
    "echo   3. reload your shell",
    "echo   4. mise run setup              .env + chmod mvnw + JDKs",
    "echo   5. mise run dev                hot-reload on :8080",
    "echo.",
    "echo   See MISE_README.md for full documentation.",
    "echo.",
]

# =============================================================================
# SETUP
# =============================================================================

[tasks."setup:profile"]
description = "One-time: write mise activate + completion to your shell profile. Run after mise install."
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'

$commentActivate   = '# mise - ArcClaw: activate (added by setup:profile)'
$commentCompletion = '# mise - ArcClaw: tab completion (added by setup:profile)'

if ($IsWindows) {
    # ── Windows: write to $PROFILE ────────────────────────────────────────────
    $profilePath = $PROFILE
    if (-not $profilePath) {
        $profilePath = "$env:USERPROFILE\\Documents\\PowerShell\\Microsoft.PowerShell_profile.ps1"
    }
    New-Item -ItemType Directory -Force (Split-Path $profilePath) | Out-Null
    Write-Host "-- Profile: $profilePath"

    $activateLine   = '(&mise activate pwsh) | Out-String | Invoke-Expression'
    $completionLine = 'try { mise completion powershell | Out-String | Invoke-Expression } catch {}'

    $content = if (Test-Path $profilePath) { [System.IO.File]::ReadAllText($profilePath) } else { '' }

    if ($content -match 'mise activate') {
        Write-Host "i   mise activate already present -- skipping."
    } else {
        Add-Content $profilePath "`n$commentActivate`n$activateLine"
        Write-Host "OK  mise activate written."
    }

    $content = if (Test-Path $profilePath) { [System.IO.File]::ReadAllText($profilePath) } else { '' }
    if ($content -match 'mise completion') {
        Write-Host "i   mise completion already present -- skipping."
    } else {
        Add-Content $profilePath "`n$commentCompletion`n$completionLine"
        Write-Host "OK  mise completion written."
    }

    Write-Host ""
    Write-Host "-- Written to $profilePath --"
    Get-Content $profilePath | Select-String -Pattern 'mise activate|mise completion'
    Write-Host ""
    Write-Host "Next steps:"
    Write-Host "  1. Reload:  . `$PROFILE"
    Write-Host "  2. Run:     mise tasks          <- shows all ArcClaw tasks"
    Write-Host "              mise run <TAB>       <- tab completion works"

} else {
    # ── Linux / macOS / WSL2: write to ~/.bashrc or ~/.zshrc ─────────────────
    $shell = $env:SHELL
    if ($shell -like '*zsh') {
        $rcFile     = "$env:HOME/.zshrc"
        $shellName  = 'zsh'
        $activateLine   = 'eval "$(~/.local/bin/mise activate zsh)"'
        $completionLine = 'eval "$(mise completion zsh)"'
    } else {
        $rcFile     = "$env:HOME/.bashrc"
        $shellName  = 'bash'
        $activateLine   = 'eval "$(~/.local/bin/mise activate bash)"'
        $completionLine = 'eval "$(mise completion bash --include-bash-completion-lib)"'
    }
    Write-Host "-- Shell detected: $shellName -> $rcFile"

    $content = if (Test-Path $rcFile) { [System.IO.File]::ReadAllText($rcFile) } else { '' }

    if ($content -match 'mise activate') {
        Write-Host "i   mise activate already present -- skipping."
    } else {
        Add-Content $rcFile "`n$commentActivate`n$activateLine"
        Write-Host "OK  mise activate written."
    }

    $content = if (Test-Path $rcFile) { [System.IO.File]::ReadAllText($rcFile) } else { '' }
    if ($content -match 'mise completion') {
        Write-Host "i   mise completion already present -- skipping."
    } else {
        Add-Content $rcFile "`n$commentCompletion`n$completionLine"
        Write-Host "OK  mise completion written."
    }

    Write-Host ""
    Write-Host "-- Written to $rcFile --"
    Get-Content $rcFile | Select-String -Pattern 'mise activate|mise completion'
    Write-Host ""
    Write-Host "Next steps:"
    Write-Host "  1. Reload:  source $rcFile"
    Write-Host "  2. Run:     mise tasks          <- shows all ArcClaw tasks"
    Write-Host "              mise run <TAB>       <- tab completion works"
}
"""

[tasks."setup:env-check"]
description = "Validate .env — warn about missing or placeholder values"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (-not (Test-Path '.env')) {
    Write-Host '❌  .env not found. Run: mise run setup'
    exit 1
}
$issues = @()
$vars = @{}
Get-Content '.env' | Where-Object { $_ -match '^\\s*[^#]' } | ForEach-Object {
    if ($_ -match '^([^=]+)=(.*)$') { $vars[$Matches[1].Trim()] = $Matches[2].Trim() }
}

$provider = if ($vars['ARCCLAW_LLM_PROVIDER']) { $vars['ARCCLAW_LLM_PROVIDER'] } else { 'groq' }
if ($provider -eq 'groq'       -and [string]::IsNullOrEmpty($vars['GROQ_API_KEY']))       { $issues += "GROQ_API_KEY is required for provider: $provider" }
if ($provider -eq 'openrouter' -and [string]::IsNullOrEmpty($vars['OPENROUTER_API_KEY'])) { $issues += "OPENROUTER_API_KEY is required for provider: $provider" }
if ($provider -eq 'openai'     -and [string]::IsNullOrEmpty($vars['OPENAI_API_KEY']))     { $issues += "OPENAI_API_KEY is required for provider: $provider" }
if ($vars['ARCCLAW_VAULT_PEPPER']     -like '*changeme*') { $issues += 'ARCCLAW_VAULT_PEPPER is still a placeholder' }
if ($vars['ARCCLAW_AUDIT_HMAC_KEY']   -like '*changeme*') { $issues += 'ARCCLAW_AUDIT_HMAC_KEY is still a placeholder' }
if ($vars['ARCCLAW_API_KEY_INTERNAL'] -like '*changeme*') { $issues += 'ARCCLAW_API_KEY_INTERNAL is still a placeholder' }
if ($issues.Count -gt 0) {
    Write-Host '⚠️   Issues found in .env:'
    $issues | ForEach-Object { Write-Host "    - $_" }
    exit 1
} else {
    Write-Host '✅  .env looks good — all required keys are set.'
}
"""

[tasks."setup:wsl-crlf"]
description = "WSL2: fix Windows CRLF line endings in mvnw + all .mise bash task scripts"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if ($IsWindows) {
    Write-Host 'ℹ️   Not needed on native Windows — CRLF fix is for WSL2/Linux only.'
    exit 0
}
if (-not (Get-Command dos2unix -ErrorAction SilentlyContinue)) {
    Write-Host '📦 Installing dos2unix...'
    sudo apt-get install -y dos2unix
}
dos2unix mvnw
chmod +x mvnw
Get-ChildItem -Path '.mise/tasks' -Recurse -Filter '*.sh' | ForEach-Object {
    dos2unix $_.FullName
    chmod +x $_.FullName
    Write-Host "✅  Fixed: $($_.Name)"
}
Write-Host '✅  mvnw + all task scripts CRLF fixed and marked executable.'
"""

# =============================================================================
# JDK MANAGEMENT
# =============================================================================

[tasks."jdk:graalvm"]
description = "Switch active JDK to GraalVM Community 25.0.2 (for native builds)"
dir = "{{config_root}}"
run = ["mise use --path mise.toml java@graalvm-community-25.0.2", "java -version"]

[tasks."jdk:temurin"]
description = "Switch active JDK back to Temurin 25 (default — dev, build, jar tasks)"
dir = "{{config_root}}"
run = ["mise use --path mise.toml java@temurin-25", "java -version"]

[tasks."jdk:install"]
description = "Install both JDKs (temurin-25 + graalvm-community-25.0.2) — safe to re-run"
dir = "{{config_root}}"
run = [
    "mise install",
    "mise install java@graalvm-community-25.0.2 --quiet",
    "mise ls java",
]

[tasks."jdk:status"]
description = "Show which JDK is currently active and list all installed JDKs"
dir = "{{config_root}}"
run = ["java -version", "mise ls java"]

# =============================================================================
# BUILD TASKS
# =============================================================================

[tasks.build-app]
depends = ["dev:kill"]
description = "JVM build — all modules, skip tests (fast daily driver) — uses temurin-25"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
& $mvnw clean install -pl arcclaw-app -am -DskipTests
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Build complete: arcclaw-app/target/quarkus-app/quarkus-run.jar'
"""

[tasks."build:full"]
description = "Clean install all modules, skip tests"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
& $mvnw clean install -am -DskipTests
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Full build complete.'
"""

[tasks."build:test"]
description = "Build and run all tests"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
& $mvnw clean verify -am "-Dquarkus.test.profile=test"
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Tests complete.'
"""

[tasks."build:native"]
depends = ["env:recover"]
description = "Native binary — Podman container (default on Linux/macOS) or local GraalVM — auto-detects, auto-switches JDK"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw   = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
$mOpts  = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'

# ── Resolve build strategy ────────────────────────────────────────────────────
$strategy = 'local'
if ($IsWindows) {
    Write-Host 'ℹ️   Windows: using local GraalVM (container build produces Linux ELF — unusable on Windows).'
} elseif ($env:ARCCLAW_NATIVE_BUILD -eq 'local') {
    Write-Host 'ℹ️   ARCCLAW_NATIVE_BUILD=local: using local GraalVM.'
} elseif ($env:ARCCLAW_NATIVE_BUILD -eq 'container') {
    if (Get-Command podman -ErrorAction SilentlyContinue) {
        Write-Host 'ℹ️   ARCCLAW_NATIVE_BUILD=container: using Podman container build.'
        $strategy = 'container'
    } else {
        Write-Host '❌  ARCCLAW_NATIVE_BUILD=container but podman not found.'
        Write-Host '    macOS:      mise run podman:init'
        Write-Host '    Linux/WSL2: sudo apt install podman  then  mise run podman:socket'
        exit 1
    }
} else {
    if (Get-Command podman -ErrorAction SilentlyContinue) {
        podman info 2>&1 | Out-Null
        if ($LASTEXITCODE -eq 0) {
            Write-Host 'ℹ️   Podman detected and running → container build (portable binary, recommended).'
            $strategy = 'container'
        } else {
            Write-Host '⚠️   Podman installed but not running → falling back to local GraalVM.'
            Write-Host '    macOS: mise run podman:start  /  Linux/WSL2: mise run podman:socket'
        }
    } else {
        Write-Host '⚠️   Podman not found → using local GraalVM build.'
        Write-Host '    macOS: mise run podman:init  /  Linux/WSL2: sudo apt install podman'
        Write-Host '    To silence: set ARCCLAW_NATIVE_BUILD=local in .env'
    }
}
$containerFlag = if ($strategy -eq 'container') { '-Dquarkus.native.container-build=true' } else { '-Dquarkus.native.container-build=false' }

# ── .env shield ───────────────────────────────────────────────────────────────
# --- Auto-Heal stranded backups before shielding ---
if (Test-Path '.env.build-backup') {
    if (Test-Path '.env') { Remove-Item '.env' -Force }
    Rename-Item '.env.build-backup' '.env'
    Write-Host '⚠️  Recovered stranded .env.build-backup before starting new build.'
}

$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
} elseif (Test-Path 'build.env') {
    Copy-Item 'build.env' '.env'
    $envBackup = 'build.env'
    Write-Host 'ℹ️   build.env activated for native compilation (no secrets).'
} else {
    Write-Host 'ℹ️   No .env found — building without config override (good for CI).'
}

if ($strategy -eq 'container') {
    Write-Host 'ℹ️   Container build: host GraalVM not needed — skipping JDK switch.'
    try {
        $env:MAVEN_OPTS = $mOpts
        & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests $containerFlag
        if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
        Write-Host '▶   Assembling dist/ folder...'
        mise run dist
    } finally {
        if ($envBackup -eq $true)           { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
        elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
    }
} else {
    try {
        mise use --path mise.toml java@graalvm-community-25.0.2
        $env:MAVEN_OPTS = $mOpts
        & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests $containerFlag
        if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
        Write-Host '▶   Assembling dist/ folder...'
        mise run dist
    } finally {
        if ($envBackup -eq $true)           { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
        elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
        mise use --path mise.toml java@temurin-25
        Write-Host '✅  Switched back to Temurin 25.'
    }
}
Write-Host "✅  Native build complete [$strategy]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
Write-Host ''
Write-Host '▶   Run with one of:'
Write-Host '      mise run native:serve                → HTTP + MCP server on :8080'
Write-Host '      mise run native:chat                 → interactive REPL'
Write-Host '      mise run native:attach               → Telegram daemon'
Write-Host '      $env:GOAL="..."; mise run native:ask → single-shot query'
"""

[tasks."build:native-local"]
depends = ["env:recover"]
description = "Native binary — always local GraalVM, no container (fast, any OS) — auto-switches JDK"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw   = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
Write-Host 'ℹ️   build:native-local: local GraalVM, no Podman container.'

# --- Auto-Heal stranded backups before shielding ---
if (Test-Path '.env.build-backup') {
    if (Test-Path '.env') { Remove-Item '.env' -Force }
    Rename-Item '.env.build-backup' '.env'
    Write-Host '⚠️  Recovered stranded .env.build-backup before starting new build.'
}

$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
} elseif (Test-Path 'build.env') {
    Copy-Item 'build.env' '.env'
    $envBackup = 'build.env'
    Write-Host 'ℹ️   build.env activated for native compilation (no secrets).'
} else {
    Write-Host 'ℹ️   No .env found — building without config override (good for CI).'
}
try {
    mise use --path mise.toml java@graalvm-community-25.0.2

    # --- JENV BYPASS ---
    $graalPath = (mise where java@graalvm-community-25.0.2).Trim()
    $env:GRAALVM_HOME = $graalPath
    $env:JAVA_HOME = $graalPath
    # -------------------

    $env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
    & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests '-Dquarkus.native.container-build=false'
    if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
    Write-Host "✅  Native build complete [local]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
    Write-Host '▶   Assembling dist/ folder...'
    mise run dist
} finally {
    if ($envBackup -eq $true)           { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
    elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
    mise use --path mise.toml java@temurin-25
    Write-Host '✅  Switched back to Temurin 25.'
}
"""

