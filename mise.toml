    Rename-Item '.env.build-backup' '.env'
    Write-Host '⚠️  Recovered stranded .env.build-backup from a previously aborted build.'
}
"""

[tasks.dist]
description = "Assemble dist/ folder: native exe"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$suffix  = if ($IsWindows) { '-runner.exe' } else { '-runner' }
$runnerSrc = "arcclaw-app-1.0.0-SNAPSHOT$suffix"
$src     = "arcclaw-app/target/$runnerSrc"
$distExe = if ($IsWindows) { "arcclaw.exe" } else { "arcclaw" }
$distDir = 'dist'

if (-not (Test-Path $src)) {
    Write-Host "❌  Native binary not found at $src — run: mise run build:native"
    exit 1
}

Copy-Item $src "$distDir/$distExe"

Write-Host ''
Write-Host "✅  dist assembled — binary is self-contained."
Write-Host "Run directly (no run.sh needed):"
Write-Host "  Linux/macOS : ./$distExe serve"
Write-Host "  Windows     : .\\$distExe serve"
Write-Host "On first run with no .env present, .env.example is auto-extracted."
Write-Host ''
Write-Host '-- Binaries in dist/ ----------------------------------------------------'
if (Test-Path 'dist/arcclaw')     { Write-Host '  OK  arcclaw       (Linux/macOS)' } else { Write-Host '  -   arcclaw       (Linux/macOS) -- not built yet' }
if (Test-Path 'dist/arcclaw.exe') { Write-Host '  OK  arcclaw.exe   (Windows)'     } else { Write-Host '  -   arcclaw.exe   (Windows)     -- not built yet' }
Write-Host '-------------------------------------------------------------------------'
Write-Host '    Build the missing platform binary and re-run: mise run dist'
"""

[tasks."zip:source"]
description = "Generate source archive (zip) with standard exclusions"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$out = 'arcclaw-source.zip'
$excludes = @(
    '**/target',
    '.git',
    '.idea',
    '.vscode',
    'dist',
    'data',
    '*.md',
    '*.py',
    'Prompts',
    'docs',
    'docs-main',
    'docs-test',
    'Ideas-Pending',
    'ProjectWorkflowDocs',
    'bruno-collections',
    'rest-http',
    'arcclaw-ui/node_modules',
    'arcclaw-ui/dist',
    'arcclaw-ui/node',
    '.playwright-browsers',
    'backups',
    '.gitignore',
    '.gitattributes',
    '.env',
    '.env.build-backup',
    'build.env'
)

Write-Host "📦  Generating $out with exclusions..."
$root = Get-Location | Select-Object -ExpandProperty Path
$stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
New-Item -ItemType Directory $stage | Out-Null

# ── Use PowerShell for reliability (Handles exclusions consistently) ─────────
Write-Host "-- Collecting files (this may take a moment)..."
Get-ChildItem -Path . -Recurse | ForEach-Object {
    $relPath = $_.FullName.Replace($root, '').TrimStart('\\')
    if ($relPath -eq '') { return }
    
    $exclude = $false
    foreach ($pattern in $excludes) {
        # Convert glob (e.g. **/target) to PowerShell -like pattern
        $pwshPattern = $pattern.Replace('**/', '*').Replace('/*', '*')
        if ($relPath -like "*$pwshPattern*" -or $_.Name -like "$pwshPattern") {
            $exclude = $true; break
        }
    }
    
    if (-not $exclude) {
        $dest = Join-Path $stage $relPath
        if ($_.PSIsContainer) {
            if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
        } else {
            $destDir = Split-Path $dest
            if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
            Copy-Item $_.FullName $dest
        }
    }
}

if (Test-Path $out) { Remove-Item $out -Force }
Compress-Archive -Path "$stage/*" -DestinationPath $out -Force
Remove-Item $stage -Recurse -Force

Write-Host ""
Write-Host "✅  Archive created: $out"
Get-Item $out | Format-Table Name, @{L='Size';E={'{0:N0} KB' -f ($_.Length/1KB)}} -AutoSize
"""

[tasks."dist:pack"]
description = "Create OS-specific release archives from dist/ for GitHub releases"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$version = '1.0.0'
$out     = 'dist/release'
$runner  = 'arcclaw'
New-Item -ItemType Directory -Force $out | Out-Null
$packed = 0

# Windows
if (Test-Path "dist/$runner.exe") {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    Copy-Item "dist/$runner.exe" "$stage/arcclaw.exe"
    $archive = "$out/arcclaw-$version-windows-x64.zip"
    Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
    Remove-Item $stage -Recurse -Force
    Write-Host "✅  $archive"
    $packed++
}

# Linux
# FIX: use ReadAllText/WriteAllText to preserve LF line endings in run.sh
if (Test-Path "dist/$runner") {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    Copy-Item "dist/$runner" "$stage/arcclaw"
    $archive = "$out/arcclaw-$version-linux-x64.tar.gz"
    if (Get-Command tar -ErrorAction SilentlyContinue) {
        tar -czf $archive -C $stage .
        Write-Host "✅  $archive"; $packed++
    } else { Write-Host "⚠️   tar not found -- skipping Linux archive. Run from WSL2." }
    Remove-Item $stage -Recurse -Force
}

# macOS
if (Test-Path "dist/$runner") {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    Copy-Item "dist/$runner" "$stage/arcclaw"
    $archive = "$out/arcclaw-$version-macos-aarch64.tar.gz"
    if (Get-Command tar -ErrorAction SilentlyContinue) {
        tar -czf $archive -C $stage .
        Write-Host "✅  $archive"; $packed++
    } else { Write-Host "⚠️   tar not found -- skipping macOS archive. Run from WSL2." }
    Remove-Item $stage -Recurse -Force
}

if ($packed -eq 0) {
    Write-Host '❌  No binaries found in dist/ — run mise run build:native first'; exit 1
}
Write-Host ''
Write-Host "-- Release archives in $out/ --"
Get-ChildItem $out | Format-Table Name, @{L='Size';E={'{0:N0} KB' -f ($_.Length/1KB)}} -AutoSize
"""

