# =============================================================================
# PERSISTENCE BACKEND TASKS
# =============================================================================
# Three backends: sqlite (default), postgresql, filesystem.
# Switch by activating the appropriate profile:
#   mise run dev:pg       # Dev mode with PostgreSQL
#   mise run dev           # Dev mode with SQLite (default)
#
# When using PostgreSQL, the Podman container is auto-started.
# =============================================================================

[tasks."db:pg:start"]
description = "Start PostgreSQL 16 container via Podman (for dev/postgresql profile)"
dir = "{{config_root}}"
shell = "pwsh -Command"
quiet = false
run = """
$ErrorActionPreference = 'Stop'

# Ensure Podman machine is running before container operations
$test = podman ps --noheading 2>&1
if ($LASTEXITCODE -ne 0) {
    Write-Host '⚠️   Podman is not running.'
    $confirm = Read-Host 'Start Podman machine now? [Y/n]'
    if ($confirm -eq '' -or $confirm -eq 'y' -or $confirm -eq 'Y') {
        $startResult = podman machine start 2>&1
        if ($LASTEXITCODE -ne 0) {
            if ($startResult -match 'already running') {
                Write-Host '⚠️   Podman machine reported "already running" but connection failed — forcing restart...'
                podman machine stop 2>&1 | Out-Null; Start-Sleep -Seconds 2
                podman machine start 2>&1
                if ($LASTEXITCODE -ne 0) { Write-Host "❌  Podman machine failed to restart. Run: podman machine init"; exit 1 }
            } else {
                Write-Host "❌  Podman machine failed to start. Run: podman machine init"; exit 1
            }
        }
        Write-Host "✅  Podman machine started."
        Start-Sleep -Seconds 3
    } else {
        Write-Host "❌  Podman is required for PostgreSQL."
        exit 1
    }
}

$container = 'arcclaw-pg'
$existing = podman ps -a --filter name=$container --no-trunc 2>&1 | Select-String $container
if ($existing) {
    $status = podman ps --filter name=$container --no-trunc 2>&1 | Select-String $container
    if ($status) {
        Write-Host "✅  PostgreSQL container '$container' is already running."
        exit 0
    }
    Write-Host "ℹ️   Container '$container' exists but stopped — starting..."
    podman start $container
    if ($LASTEXITCODE -ne 0) { Write-Host "❌  Failed to start container."; exit 1 }
    Write-Host "✅  Container started."
    exit 0
}
Write-Host "▶   Creating PostgreSQL container '$container'..."
podman run -d --name $container `
    -e POSTGRES_DB=arcclaw `
    -e POSTGRES_USER=arcclaw `
    -e POSTGRES_PASSWORD=changeme `
    -p 5432:5432 `
    --health-cmd='pg_isready -U arcclaw' `
    --health-interval=3s `
    --health-timeout=2s `
    --health-retries=5 `
    pgvector/pgvector:0.8.0-pg16
if ($LASTEXITCODE -ne 0) { Write-Host "❌  Failed to create container. Try: podman pull pgvector/pgvector:0.8.0-pg16"; exit 1 }
if ($LASTEXITCODE -ne 0) { Write-Host "❌  Failed to create container."; exit 1 }
Write-Host "⏳  Waiting for PostgreSQL to become healthy..."
$ready = $false
for ($i = 0; $i -lt 15; $i++) {
    $status = podman inspect $container | ConvertFrom-Json | Select-Object -ExpandProperty State | Select-Object -ExpandProperty Health | Select-Object -ExpandProperty Status
    if ($status -eq 'healthy') { $ready = $true; break }
    Start-Sleep -Seconds 1
}
if (-not $ready) {
    Write-Host "⚠️   Health check did not become healthy — container may still be starting."
    podman logs -n 5 $container 2>&1 | ForEach-Object { Write-Host "  $_" }
} else {
    Write-Host "✅  PostgreSQL 16 is ready on port 5432."
}
"""

[tasks."db:pg:stop"]
description = "Stop and remove PostgreSQL container"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$container = 'arcclaw-pg'
$existing = podman ps -a --filter name=$container --no-trunc 2>&1 | Select-String $container
if (-not $existing) {
    Write-Host "ℹ️   No PostgreSQL container found."
    exit 0
}
Write-Host "▶   Stopping container '$container'..."
podman stop $container 2>&1 | Out-Null
podman rm $container 2>&1 | Out-Null
Write-Host "✅  PostgreSQL container stopped and removed."
"""

[tasks."db:pg:status"]
description = "Check PostgreSQL container health"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$container = 'arcclaw-pg'
$existing = podman ps -a --filter name=$container --no-trunc 2>&1 | Select-String $container
if (-not $existing) {
    Write-Host '❌  PostgreSQL container not found. Run: mise run db:pg:start'
    exit 1
}
$state = podman inspect $container | ConvertFrom-Json | Select-Object -ExpandProperty State
$status = $state.Status
$health = $state.Health.Status
Write-Host "✅  Container status: $status | Health: $health"
$ports = podman port $container 2>&1
if ($ports) { $ports | ForEach-Object { Write-Host "  $_" } }
"""

[tasks."db:pg:reset"]
description = "Drop and recreate the arcclaw database (wipes all data)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$container = 'arcclaw-pg'
$existing = podman ps --filter name=$container --no-trunc 2>&1 | Select-String $container
if (-not $existing) {
    Write-Host "❌  PostgreSQL container is not running. Run: mise run db:pg:start"
    exit 1
}
Write-Host "⚠️   WARNING: This will permanently delete all PostgreSQL data."
Write-Host "      Creating a new database requires Flyway clean + migrate."
$confirm = Read-Host "Type 'reset' to confirm"
if ($confirm -ne 'reset') { Write-Host "Aborted."; exit 1 }
podman exec $container psql -U arcclaw -d postgres -c "DROP DATABASE IF EXISTS arcclaw WITH (FORCE);" 2>&1 | Out-Null
podman exec $container psql -U arcclaw -d postgres -c "CREATE DATABASE arcclaw;" 2>&1 | Out-Null
Write-Host "✅  Database 'arcclaw' recreated. Run 'mise run jar:pg' to apply Flyway migrations."
"""

# ── Dev mode with PostgreSQL ────────────────────────────────────────────────

[tasks."dev:pg"]
depends = ["dev:kill", "env:recover", "db:pg:start"]
description = "Dev mode with PostgreSQL backend (auto-starts Podman container)"
dir = "{{config_root}}/arcclaw-app"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$envCopied = $false
try {
    if (-not (Test-Path '.env') -and (Test-Path '../.env')) {
        Copy-Item -Path '../.env' -Destination '.env'
        $envCopied = $true
        Write-Host '[dev:pg] Copied ../.env -> arcclaw-app/.env for this session'
    }
    $mvnw    = if ($IsWindows) { '..\\mvnw.cmd' } else { '../mvnw' }
    $jvmArgs = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8'
    & $mvnw quarkus:dev `
        '--no-transfer-progress' `
        "-Djvm.args=$jvmArgs" `
        '-Dquarkus.args=serve' `
        '-Dquarkus.profile=dev,postgresql' `
        '-Darcclaw.rag.vec-extension-path=../lib/vec0' `
        '-Darcclaw.data-dir=../data' `
        '-Ddebug=false'
    $script:exitCode = $LASTEXITCODE
} finally {
    if ($envCopied) { Remove-Item -Path '.env' -Force -ErrorAction SilentlyContinue }
    if ($script:exitCode -eq 130 -or $script:exitCode -eq 143) { exit 0 }
}
"""

[tasks."dev:pg:chat"]
depends = ["dev:kill", "env:recover", "db:pg:start"]
description = "Dev mode with PostgreSQL backend - interactive REPL"
dir = "{{config_root}}/arcclaw-app"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$envCopied = $false
try {
    if (-not (Test-Path '.env') -and (Test-Path '../.env')) {
        Copy-Item -Path '../.env' -Destination '.env'
        $envCopied = $true
        Write-Host '[dev:pg:chat] Copied ../.env -> arcclaw-app/.env'
    }
    $mvnw    = if ($IsWindows) { '..\\mvnw.cmd' } else { '../mvnw' }
    $jvmArgs = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8'
    & $mvnw quarkus:dev `
        '--no-transfer-progress' `
        "-Djvm.args=$jvmArgs" `
        '-Dquarkus.args=chat' `
        '-Dquarkus.profile=dev,postgresql' `
        '-Darcclaw.rag.vec-extension-path=../lib/vec0' `
        '-Darcclaw.data-dir=../data' `
        '-Ddebug=false'
    $script:exitCode = $LASTEXITCODE
} finally {
    if ($envCopied) { Remove-Item -Path '.env' -Force -ErrorAction SilentlyContinue }
    if ($script:exitCode -eq 130 -or $script:exitCode -eq 143) { exit 0 }
}
"""

# ── JAR mode with PostgreSQL ─────────────────────────────────────────────────

[tasks."build:app"]
depends = ["dev:kill", "env:recover"]
description = "Build quarkus-run.jar for SQLite backend (default)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
Write-Host '▶   Building quarkus-run.jar for SQLite backend...'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
& $mvnw 'package' '-pl' 'arcclaw-app' '-am' '-DskipTests' '-q'
if ($LASTEXITCODE -ne 0) { Write-Host "❌  Build failed."; exit $LASTEXITCODE }
Write-Host '✅  SQLite JAR ready.'
"""

[tasks."build:pg"]
depends = ["env:recover"]
description = "Clean install all modules with PostgreSQL backend"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$mOpts = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'

# --- Auto-tune: detect available RAM & CPUs ---
if ($IsMacOS) {
    $vm = vm_stat; $ps = [int](($vm | Select-String 'page size of (\\d+)').Matches[0].Groups[1].Value)
    $availGB = [Math]::Floor(([int](($vm | Select-String 'Pages free:').ToString() -replace '.*:\\s+(\\d+)\\.','$1') + [int](($vm | Select-String 'Pages inactive:').ToString() -replace '.*:\\s+(\\d+)\\.','$1')) * $ps / 1GB)
    if ($availGB -lt 4) { $availGB = [Math]::Floor([int64](sysctl -n hw.memsize) / 1GB) }
    $cpu = [int](sysctl -n hw.ncpu)
} elseif ($IsWindows) {
    $availGB = [Math]::Floor([System.GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB)
    $cpu = [int]$env:NUMBER_OF_PROCESSORS
} else {
    $availGB = [Math]::Floor([int64]((Select-String 'MemAvailable:' /proc/meminfo).ToString() -replace '.*:\\s+(\\d+)\\s+kB','$1') / 1MB)
    $cpu = [int](nproc)
}
$jitGB = [Math]::Max(2, [Math]::Floor($availGB * 0.5))
$threads = [Math]::Max(2, [Math]::Min([Math]::Floor($cpu / 2), 8))
Write-Host "🧠 ${availGB}G avail, ${cpu} CPUs → JIT heap:${jitGB}G, parallel threads:${threads}"

# --- Shield .env (secrets) from the build ---
$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) - secrets will not be baked into build.'
}

try {
    $env:MAVEN_OPTS = "$mOpts -Xmx${jitGB}g -Xms${jitGB}g"
