"""


[tasks."7z:source"]
description = "Generate source archive (7z). Usage: ARCCLAW_7Z_PASS=secret mise run 7z:source"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = '''
$ErrorActionPreference = 'Stop'

$argPass = $env:ARCCLAW_7Z_PASS
if ([string]::IsNullOrWhiteSpace($argPass)) {
    Write-Host "❌ ERROR: No password provided!" -ForegroundColor Red
    Write-Host "Usage: ARCCLAW_7Z_PASS=secret mise run 7z:source"
    exit 1
}

# ── Auto-install 7z if not found ──────────────────────────────────────────────
$has7z = if ($IsMacOS)      { (Get-Command '7zz' -ErrorAction SilentlyContinue) -or
                               (Get-Command '7z'  -ErrorAction SilentlyContinue) }
         elseif ($IsWindows) { (Get-Command '7z'  -ErrorAction SilentlyContinue) -or
                               (Test-Path "C:\Program Files\7-Zip\7z.exe") -or
                               (Test-Path "C:\Program Files (x86)\7-Zip\7z.exe") }
         else                { Get-Command '7z' -ErrorAction SilentlyContinue }

if (-not $has7z) {
    Write-Host '📦  7z not found — installing...'
    if ($IsMacOS) {
        if (Get-Command brew -ErrorAction SilentlyContinue) { brew install sevenzip }
        else { Write-Host '❌  brew not found. Install Homebrew: https://brew.sh'; exit 1 }
    } elseif ($IsWindows) {
        if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id 7zip.7zip -e --silent
            $env:PATH += ";C:\Program Files\7-Zip"
        } else { Write-Host '❌  winget not found. Install 7-Zip: https://www.7-zip.org'; exit 1 }
    } else {
        if      (Get-Command apt-get -ErrorAction SilentlyContinue) { sudo apt-get install -y p7zip-full }
        elseif  (Get-Command dnf     -ErrorAction SilentlyContinue) { sudo dnf install -y p7zip p7zip-plugins }
        else    { Write-Host '❌  No known package manager. Install p7zip manually.'; exit 1 }
    }
    Write-Host '✅  7z installed.'
}

# ── Resolve 7z binary ─────────────────────────────────────────────────────────
$zipPath = if ($IsWindows) {
    $p = (Get-Command '7z' -ErrorAction SilentlyContinue)?.Source
    if ($p) { $p } else {
        @("C:\Program Files\7-Zip\7z.exe","C:\Program Files (x86)\7-Zip\7z.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
    }
} elseif ($IsMacOS) {
    @('7zz','7z') | ForEach-Object { (Get-Command $_ -ErrorAction SilentlyContinue)?.Source } |
        Where-Object { $_ } | Select-Object -First 1
} else {
    (Get-Command '7z' -ErrorAction SilentlyContinue)?.Source
}
if (-not $zipPath) {
    Write-Host '❌  7z binary not found in PATH after install. Open a new shell and retry.'
    exit 1
}

$out = 'arcclaw-source.7z'

# ── Exclusion lists ───────────────────────────────────────────────────────────
$script:root = (Get-Location).Path

$script:excludeDirs = @(
    'target', 'dist', '.vscode', '.idea', 'out', '.quarkus', 'quarkus-app',
    'workspaces', 'data', 'lib', 'node_modules', 'node', 'npm',
    '.playwright-browsers', 'MyPrompts', 'docs', 'docs-main', 'docs-test',
    'Ideas-Pending', 'ProjectWorkflowDocs', 'bruno-collections',
    'rest-http', 'backups', '.git'
)

$script:excludeExts = @(
    '.md', '.jar', '.exe', '.dll', '.zip', '.7z', '.class', '.log'
)

$script:excludeFiles = @(
    '.gitignore', '.gitattributes', 'build.env',
    'arcclaw-source.zip', 'arcclaw-source.7z', '.env'
)

$script:excludeRelPaths = @(
    'arcclaw-app/src/main/resources/META-INF/resources',
    'arcclaw-app/src/main/resources/native',
    '.playwright-driver',
    '.mvn',
    'scratch'
)

$script:includeFiles = @(
    'Architecture_Invariants.md',
    'Flyway-Migration.md'
)

$script:includeRelPaths = @(
    'docs-test/arcclaw_rg_cheatsheet.md'
)

function ShouldExclude($item, $relPath) {
    if (-not $item.PSIsContainer) {
        if ($script:includeFiles -contains $item.Name) { return $false }
    }
    foreach ($rp in $script:includeRelPaths) {
        if ($relPath -eq $rp) { return $false }
        if ($item.PSIsContainer -and $rp.StartsWith("$relPath/")) { return $false }
    }
    foreach ($rp in $script:excludeRelPaths) {
        if ($relPath -eq $rp -or $relPath.StartsWith("$rp/")) { return $true }
    }
    foreach ($seg in $relPath.Split('/')) {
        if ($script:excludeDirs -contains $seg) { return $true }
    }
    if (-not $item.PSIsContainer) {
        if ($script:excludeFiles -contains $item.Name)      { return $true }
        if ($script:excludeExts  -contains $item.Extension) { return $true }
    }
    return $false
}

function CopyFiltered($sourceDir, $destDir) {
    Get-ChildItem -Path $sourceDir | ForEach-Object {
        $relPath = $_.FullName.Substring($script:root.Length).TrimStart('\\/').Replace('\','/')
        if (ShouldExclude $_ $relPath) { Write-Verbose "  skip: $relPath"; return }
        if ($_.PSIsContainer) {
            $dest = Join-Path $destDir $_.Name
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            CopyFiltered $_.FullName $dest
        } else {
            if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
            Copy-Item $_.FullName (Join-Path $destDir $_.Name) -Force
        }
    }
}

$stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
New-Item -ItemType Directory $stage | Out-Null

try {
    Write-Host "📂  Staging files from: $($script:root)"
    CopyFiltered $script:root $stage

    if (Test-Path $out) { Remove-Item $out -Force }
    Write-Host "📦  Creating encrypted archive: $out"
    & $zipPath a "$out" "$stage/*" "-p$argPass" -mhe=on -mx=5 | Out-Null
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    if (Test-Path $out) {
        Write-Host "✅  Archive created: $out" -ForegroundColor Green
        Get-Item $out | Format-Table Name, @{L='Size';E={'{0:N0} KB' -f ($_.Length/1KB)}} -AutoSize
    } else { exit 1 }
} finally {
    if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
}
'''

[tasks."dist:pack"]
description = "Create OS-specific release archives from dist/ for GitHub releases (3 archives × 3 backends each)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$version = '1.0.0'
$out     = 'dist/release'
New-Item -ItemType Directory -Force $out | Out-Null
$packed = 0

# Windows
$winBinaries = @('arcclaw-sqlite.exe', 'arcclaw-pg.exe', 'arcclaw-fs.exe')
$winFound = @()
foreach ($bin in $winBinaries) {
    if (Test-Path "dist/$bin") { $winFound += $bin }
}
if ($winFound.Count -gt 0) {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    foreach ($bin in $winFound) { Copy-Item "dist/$bin" "$stage/$bin" }
    $archive = "$out/arcclaw-$version-windows-x64.zip"
    Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
    Remove-Item $stage -Recurse -Force
    Write-Host "✅  $archive ($($winFound.Count) binaries)"
    $packed++
} else {
    Write-Host "⚠️   No Windows binaries found in dist/ - run mise run build:native-local-all first"
}

# Linux
# use ReadAllText/WriteAllText to preserve LF line endings in run.sh
$linuxBinaries = @('arcclaw-sqlite', 'arcclaw-pg', 'arcclaw-fs')
$linuxFound = @()
foreach ($bin in $linuxBinaries) {
    if (Test-Path "dist/$bin") { $linuxFound += $bin }
}
if ($linuxFound.Count -gt 0) {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    foreach ($bin in $linuxFound) { Copy-Item "dist/$bin" "$stage/$bin" }
    $archive = "$out/arcclaw-$version-linux-x64.tar.gz"
    if (Get-Command tar -ErrorAction SilentlyContinue) {
        tar -czf $archive -C $stage .
        Write-Host "✅  $archive ($($linuxFound.Count) binaries)"
        $packed++
    } else { Write-Host "⚠️   tar not found -- skipping Linux archive. Run from WSL2." }
    Remove-Item $stage -Recurse -Force
} else {
    Write-Host "⚠️   No Linux binaries found in dist/ - run mise run build:native-local-all first"
}

# macOS
$macosBinaries = @('arcclaw-sqlite', 'arcclaw-pg', 'arcclaw-fs')
$macosFound = @()
foreach ($bin in $macosBinaries) {
    if (Test-Path "dist/$bin") { $macosFound += $bin }
}
if ($macosFound.Count -gt 0) {
    $stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    New-Item -ItemType Directory $stage | Out-Null
    foreach ($bin in $macosFound) { Copy-Item "dist/$bin" "$stage/$bin" }
    $archive = "$out/arcclaw-$version-macos-aarch64.tar.gz"
    if (Get-Command tar -ErrorAction SilentlyContinue) {
        tar -czf $archive -C $stage .
        Write-Host "✅  $archive ($($macosFound.Count) binaries)"
        $packed++
    } else { Write-Host "⚠️   tar not found -- skipping macOS archive. Run from WSL2." }
    Remove-Item $stage -Recurse -Force
} else {
    Write-Host "⚠️   No macOS binaries found in dist/ - run mise run build:native-local-all first"
}

if ($packed -eq 0) {
    Write-Host '❌  No binaries found in dist/ - run mise run build:native-local-all first'; exit 1
}
Write-Host ''
Write-Host "-- Release archives in $out/ --"
Get-ChildItem $out | Format-Table Name, @{L='Size';E={'{0:N0} KB' -f ($_.Length/1KB)}}, @{L='Binaries';E={
    $ext = $_.Extension
    $archive = $_.FullName
    $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
    try {
        if ($ext -eq '.zip') {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $tempDir)
        } else {
            tar -xzf $archive -C $tempDir
        }
        (Get-ChildItem $tempDir -File).Count
    } finally {
        if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
    }
}} -AutoSize
"""

# =============================================================================
# DOCKER COMPOSE TASKS
# =============================================================================

[tasks."obs:up"]
description = "Start observability stack: OTel + Jaeger + Phoenix + Prometheus via compose"
dir = "{{config_root}}"
shell = "pwsh -Command"
quiet = false
run = """
$ErrorActionPreference = 'Stop'
# Podman machine check: try a simple command; if it fails, ask user before starting
$test = podman ps --noheading 2>&1
if ($LASTEXITCODE -ne 0) {
    Write-Host '⚠️   Podman is not running.'
    $confirm = Read-Host 'Start Podman machine now? [Y/n]'
    if ($confirm -eq '' -or $confirm -eq 'y' -or $confirm -eq 'Y') {
        $startResult = podman machine start 2>&1
        if ($LASTEXITCODE -ne 0) {
            if ($startResult -match 'already running') {
                Write-Host '⚠️   Podman machine reported "already running" but connection failed — forcing restart...'
                podman machine stop 2>&1 | Out-Null; Start-Sleep -Seconds 2
                podman machine start 2>&1
                if ($LASTEXITCODE -ne 0) { Write-Host '❌  Podman machine failed to restart'; exit 1 }
            } else {
                Write-Host '❌  Podman machine failed to start'; exit 1
            }
        }
        Start-Sleep -Seconds 3
    } else {
        Write-Host '❌  Podman is required for the observability stack.'
        exit 1
    }
}
podman compose up -d otel-collector jaeger phoenix prometheus
if ($LASTEXITCODE -ne 0) { Write-Host '❌  Failed to start observability stack'; exit 1 }
Write-Host '✅  Observability stack started:'
Write-Host '    Jaeger UI  -> http://localhost:16686'
Write-Host '    Phoenix UI -> http://localhost:6006'
Write-Host '    Prometheus -> http://localhost:9090'
"""

