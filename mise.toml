# =============================================================================
# mise.toml — ArcClaw Agent Kernel  (default / bootstrap config)
# Docs: https://mise.jdx.dev
#
# This file is the fallback mise loads when MISE_DEFAULT_CONFIG_FILENAME
# is not set (i.e. fresh clone, no shell profile configured yet).
#
# It contains exactly THREE tasks:
#
#   start               Full setup guide for all platforms. Run: mise run start
#                       Linux/macOS/WSL2 (requires sh). Windows users: just
#                       run `mise tasks` — the description has everything.
#
#   setup:profile:nix   Auto-write MISE_DEFAULT_CONFIG_FILENAME to ~/.bashrc
#                       or ~/.zshrc. Linux · macOS · WSL2 only (requires sh).
#
#   setup:profile:win   Auto-write MISE_DEFAULT_CONFIG_FILENAME to $PROFILE.
#                       Windows only (requires pwsh). Lives in mise.pwsh.toml —
#                       listed here for discoverability.
#
# IMPORTANT — NO [tools] SECTION HERE
# mise.toml intentionally has no [tools] block. All tool management lives
# entirely in mise.bash.toml and mise.pwsh.toml, including:
#   java    = "temurin-25"
#   maven   = "3.9"
#   usage   = "latest"   ← required for `mise run <TAB>` tab completion
#
# If you see [tools] appearing here it means a `mise use java@...` call ran
# without --path. Fix: ensure all `mise use` calls in mise.bash.toml and
# mise.pwsh.toml include `--path mise.bash.toml` / `--path mise.pwsh.toml`.
# See: mise_use_path_fix.md for the full list of affected lines.
#
# =============================================================================

# =============================================================================
# start — full setup guide, all platforms
# =============================================================================

[tasks.start]
description = '''
New to this project? Run:  mise run start
Full setup guide for all platforms — Linux · macOS · WSL2 · Windows.

  Linux/macOS/WSL2 — AUTO (recommended):
    mise run setup:profile:nix        <- detects shell, writes profile, done
    source ~/.bashrc                  <- (or ~/.zshrc)
    mise tasks                        <- now shows all ArcClaw tasks

  Windows pwsh — AUTO:
    mise --env pwsh run setup:profile:win   <- writes to $PROFILE
    . $PROFILE

  Linux/macOS/WSL2 — MANUAL (add to ~/.bashrc or ~/.zshrc, ORDER MATTERS):
    export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml   # BEFORE mise activate
    eval "$(~/.local/bin/mise activate bash)"
    eval "$(mise completion bash)"

  Windows pwsh — MANUAL (add to $PROFILE, ORDER MATTERS):
    $env:MISE_DEFAULT_CONFIG_FILENAME = 'mise.pwsh.toml' # BEFORE mise activate
    (&mise activate pwsh) | Out-String | Invoke-Expression
    mise completion powershell | Out-String | Invoke-Expression

  ONE-OFF (no profile change — run a task right now):
    mise --env bash tasks              # Linux / macOS / WSL2
    mise --env pwsh tasks              # Windows / PowerShell
    mise --env bash run dev

  See MISE_README.md section 3 for full documentation.
'''
run = """
#!/usr/bin/env sh
cat << 'GUIDE'

  ArcClaw — mise Task Runner
  ==========================

  New here? This guide covers all platforms.
  mise has loaded the bootstrap config (mise.toml), which only has:
    start                 <- this task (you are here)
    setup:profile:nix     <- auto-configures your shell (Linux · macOS · WSL2)
    setup:profile:win     <- auto-configures your shell (Windows pwsh only)
                             run via: mise --env pwsh run setup:profile:win

  -- QUICKEST SETUP (Linux / macOS / WSL2) ------------------------------------

    mise run setup:profile:nix

    Detects your shell (bash or zsh), finds ~/.bashrc or ~/.zshrc, inserts
    the export line BEFORE the mise activate line. Idempotent — safe to re-run.
    Then:  source ~/.bashrc   (or ~/.zshrc)
    Then:  mise tasks         <- now shows all ArcClaw tasks

  -- QUICKEST SETUP (Windows pwsh) --------------------------------------------

    mise --env pwsh run setup:profile:win

    Finds your $PROFILE, writes MISE_DEFAULT_CONFIG_FILENAME before mise
    activate. Idempotent — safe to re-run.
    Then:  . $PROFILE
    Then:  mise tasks         <- now shows all ArcClaw tasks

  -- MANUAL SETUP -------------------------------------------------------------

  Add to your shell profile. ORDER MATTERS: export BEFORE mise activate.

  bash  -> ~/.bashrc
  +--------------------------------------------------------------+
  |  export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml          |  <- FIRST
  |  eval "$(~/.local/bin/mise activate bash)"                   |  <- SECOND
  |  eval "$(mise completion bash)"                              |  <- THIRD
  +--------------------------------------------------------------+

  zsh   -> ~/.zshrc
  +--------------------------------------------------------------+
  |  export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml          |  <- FIRST
  |  eval "$(~/.local/bin/mise activate zsh)"                    |  <- SECOND
  |  eval "$(mise completion zsh)"                               |  <- THIRD
  +--------------------------------------------------------------+

  pwsh  -> $PROFILE
  +--------------------------------------------------------------+
  |  $env:MISE_DEFAULT_CONFIG_FILENAME = 'mise.pwsh.toml'        |  <- FIRST
  |  (&mise activate pwsh) | Out-String | Invoke-Expression      |  <- SECOND
  |  mise completion powershell | Out-String | Invoke-Expression |  <- THIRD
  +--------------------------------------------------------------+

  After reloading your shell:
    mise tasks        <- shows all ArcClaw tasks
    mise run setup    <- first-time project setup (JDKs, .env)

  -- ONE-OFF (skip profile setup, run a task right now) -----------------------

    mise --env bash tasks              # list tasks (Linux / macOS / WSL2)
    mise --env pwsh tasks              # list tasks (Windows / PowerShell)
    mise --env bash run dev            # run any bash task directly
    mise --env pwsh run build:native   # run any pwsh task directly

  -- WHAT IS MISE_DEFAULT_CONFIG_FILENAME? ------------------------------------

    ArcClaw ships two platform-specific task configs in the same directory:
      mise.bash.toml  -- all tasks in bash/sh  (Linux · macOS · WSL2)
      mise.pwsh.toml  -- all tasks in pwsh     (Windows · macOS · WSL2)

    Without this variable, mise falls back to mise.toml (this file), which
    only has start, setup:profile:nix, and setup:profile:win.

    Setting it in your profile tells mise which config to load every time
    you open a terminal in this project -- permanently, no --env needed.

  -- FULL DOCUMENTATION -------------------------------------------------------

    MISE_README.md -- Section 3: Config File Selection

GUIDE
"""

# =============================================================================
# setup:profile:nix — auto-configure shell profile (Linux · macOS · WSL2)
# =============================================================================

[tasks."setup:profile:nix"]
description = '''
Linux/macOS/WSL2 only — auto-write MISE_DEFAULT_CONFIG_FILENAME and mise
completion to your shell profile. Safe to re-run (idempotent — each line
is checked independently, no duplicates).

  Windows users: run `mise --env pwsh run setup:profile:win` instead.

  What this does:
    1. Detects your shell via $SHELL (bash or zsh)
    2. Finds the right rc file (~/.bashrc or ~/.zshrc)
    3. Inserts MISE_DEFAULT_CONFIG_FILENAME BEFORE the mise activate line
    4. Appends `eval "$(mise completion <shell>)"` after activate
    5. Each line is checked independently — re-running never duplicates

  Run:   mise run setup:profile:nix
  Then:  source ~/.bashrc   (or ~/.zshrc)
  Check: echo $MISE_DEFAULT_CONFIG_FILENAME
         mise run <TAB>   <- should list all tasks
'''
run = """
#!/usr/bin/env sh
set -eu

EXPORT_LINE='export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml'
COMMENT_CONFIG='# mise — ArcClaw: load bash task config (added by setup:profile:nix)'
COMMENT_COMPLETION='# mise — ArcClaw: tab completion (added by setup:profile:nix)'

# ── Detect rc file from $SHELL ────────────────────────────────────────────────
case "${SHELL:-}" in
  */zsh)
    RC_FILE="$HOME/.zshrc"
    SHELL_NAME="zsh"
    COMPLETION_LINE='eval "$(mise completion zsh)"'
    ACTIVATE_HINT='eval "$(~/.local/bin/mise activate zsh)"'
    ;;
  *)
    RC_FILE="$HOME/.bashrc"
    SHELL_NAME="bash"
    COMPLETION_LINE='eval "$(mise completion bash)"'
    ACTIVATE_HINT='eval "$(~/.local/bin/mise activate bash)"'
    ;;
esac

echo "── Shell detected: $SHELL_NAME -> $RC_FILE ──────────────────────────────────"

# ── Step 1: MISE_DEFAULT_CONFIG_FILENAME — independent idempotency check ──────
if [ -f "$RC_FILE" ] && grep -q 'MISE_DEFAULT_CONFIG_FILENAME' "$RC_FILE"; then
  echo "i   MISE_DEFAULT_CONFIG_FILENAME already present — skipping."
else
  if [ -f "$RC_FILE" ] && grep -q 'mise activate' "$RC_FILE"; then
    TMP=$(mktemp)
    awk -v comment="$COMMENT_CONFIG" -v export_line="$EXPORT_LINE" '
      !inserted && /mise activate/ {
        print comment
        print export_line
        inserted=1
      }
      { print }
    ' "$RC_FILE" > "$TMP"
    mv "$TMP" "$RC_FILE"
    echo "OK  MISE_DEFAULT_CONFIG_FILENAME inserted BEFORE mise activate."
  else
    printf '\\n%s\\n%s\\n' "$COMMENT_CONFIG" "$EXPORT_LINE" >> "$RC_FILE"
    echo "OK  MISE_DEFAULT_CONFIG_FILENAME appended."
    echo ""
    echo "    WARNING: No 'mise activate' line found in $RC_FILE."
    echo "    Make sure your profile also contains:"
    echo "      $ACTIVATE_HINT"
  fi
fi

# ── Step 2: mise completion — independent idempotency check ───────────────────
if [ -f "$RC_FILE" ] && grep -q 'mise completion' "$RC_FILE"; then
  echo "i   mise completion already present — skipping."
else
  printf '\\n%s\\n%s\\n' "$COMMENT_COMPLETION" "$COMPLETION_LINE" >> "$RC_FILE"
  echo "OK  mise completion appended."
fi

# ── Summary ───────────────────────────────────────────────────────────────────
echo ""
echo "── Written ──────────────────────────────────────────────────────────────────"
grep -E 'MISE_DEFAULT_CONFIG_FILENAME|mise completion' "$RC_FILE"
echo "─────────────────────────────────────────────────────────────────────────────"
echo ""
echo "Next steps:"
echo "  1. Reload:  source $RC_FILE"
echo "  2. Verify:  echo MISE_DEFAULT_CONFIG_FILENAME"
echo "              mise run <TAB>   <- should list all tasks"
echo "  3. Run:     mise tasks"
echo "              mise run setup   <- first-time project setup (JDKs, .env)"
"""

# =============================================================================
# setup:profile:win — Windows stub pointing to mise.pwsh.toml
# =============================================================================
# This task lives in mise.pwsh.toml (requires pwsh).
# It is documented here so it appears when users run `mise tasks` after
# cloning — but must be invoked via:
#   mise --env pwsh run setup:profile:win
#
# Defining it as a stub here with a clear error avoids silent failure if
# a Linux/macOS user accidentally runs it without --env pwsh.
# =============================================================================

[tasks."setup:profile:win"]
description = '''
Windows only — auto-write MISE_DEFAULT_CONFIG_FILENAME and mise completion
to $PROFILE. Safe to re-run (idempotent — each line checked independently).

  Must be run via:   mise --env pwsh run setup:profile:win
  Linux/macOS/WSL2:  use setup:profile:nix instead.
'''
run = """
#!/usr/bin/env sh
echo "ERROR: setup:profile:win requires pwsh and must be run via:"
echo "         mise --env pwsh run setup:profile:win"
echo ""
echo "  Linux/macOS/WSL2? Use: mise run setup:profile:nix"
exit 1
"""

# end of file
