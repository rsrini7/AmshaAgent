# =============================================================================
# DIST - assemble a ready-to-run distribution folder
# =============================================================================
# Tasks are defined as .ps1 scripts for cross-platform compatibility
# - dist/dist.ps1     (.mise/tasks/dist/)      - Assemble dist/ folder: native exe (SQLite only)
# - dist/all.ps1      (.mise/tasks/dist/)      - Assemble dist/ folder: all 3 backend variants
# - dist/pack.ps1     (.mise/tasks/dist/)      - Create OS-specific release archives from dist/

[tasks."env:recover"]
description = "Internal: Auto-recover stranded .env files from aborted builds"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (Test-Path '.env.build-backup') {
    if (Test-Path '.env') { Remove-Item '.env' -Force }
    Rename-Item '.env.build-backup' '.env'
    Write-Host '⚠️  Recovered stranded .env.build-backup from a previously aborted build.'
}
"""

[tasks."7z:source"]
description = "Generate source archive (7z). Usage: ARCCLAW_7Z_PASS=secret mise run 7z:source"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = '''
$ErrorActionPreference = 'Stop'

$argPass = $env:ARCCLAW_7Z_PASS
if ([string]::IsNullOrWhiteSpace($argPass)) {
    Write-Host "❌ ERROR: No password provided!" -ForegroundColor Red
    Write-Host "Usage: ARCCLAW_7Z_PASS=secret mise run 7z:source"
    exit 1
}

# ── Auto-install 7z if not found ──────────────────────────────────────────────
$has7z = if ($IsMacOS)      { (Get-Command '7zz' -ErrorAction SilentlyContinue) -or
                               (Get-Command '7z'  -ErrorAction SilentlyContinue) }
         elseif ($IsWindows) { (Get-Command '7z'  -ErrorAction SilentlyContinue) -or
                               (Test-Path "C:\Program Files\7-Zip\7z.exe") -or
                               (Test-Path "C:\Program Files (x86)\7-Zip\7z.exe") }
         else                { Get-Command '7z' -ErrorAction SilentlyContinue }

if (-not $has7z) {
    Write-Host '📦  7z not found — installing...'
    if ($IsMacOS) {
        if (Get-Command brew -ErrorAction SilentlyContinue) { brew install sevenzip }
        else { Write-Host '❌  brew not found. Install Homebrew: https://brew.sh'; exit 1 }
    } elseif ($IsWindows) {
        if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id 7zip.7zip -e --silent
            $env:PATH += ";C:\Program Files\7-Zip"
        } else { Write-Host '❌  winget not found. Install 7-Zip: https://www.7-zip.org'; exit 1 }
    } else {
        if      (Get-Command apt-get -ErrorAction SilentlyContinue) { sudo apt-get install -y p7zip-full }
        elseif  (Get-Command dnf     -ErrorAction SilentlyContinue) { sudo dnf install -y p7zip p7zip-plugins }
        else    { Write-Host '❌  No known package manager. Install p7zip manually.'; exit 1 }
    }
    Write-Host '✅  7z installed.'
}

# ── Resolve 7z binary ─────────────────────────────────────────────────────────
$zipPath = if ($IsWindows) {
    $p = (Get-Command '7z' -ErrorAction SilentlyContinue)?.Source
    if ($p) { $p } else {
        @("C:\Program Files\7-Zip\7z.exe","C:\Program Files (x86)\7-Zip\7z.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
    }
} elseif ($IsMacOS) {
    @('7zz','7z') | ForEach-Object { (Get-Command $_ -ErrorAction SilentlyContinue)?.Source } |
        Where-Object { $_ } | Select-Object -First 1
} else {
    (Get-Command '7z' -ErrorAction SilentlyContinue)?.Source
}
if (-not $zipPath) {
    Write-Host '❌  7z binary not found in PATH after install. Open a new shell and retry.'
    exit 1
}

$out = 'arcclaw-source.7z'

# ── Exclusion lists ───────────────────────────────────────────────────────────
$script:root = (Get-Location).Path

$script:excludeDirs = @(
    'target', 'dist', '.vscode', '.idea', 'out', '.quarkus', 'quarkus-app',
    'workspaces', 'data', 'lib', 'node_modules', 'node', 'npm',
    '.playwright-browsers', 'MyPrompts', 'docs', 'docs-main', 'docs-test',
    'Ideas-Pending', 'ProjectWorkflowDocs', 'bruno-collections',
    'rest-http', 'backups', '.git'
)

$script:excludeExts = @(
    '.md', '.jar', '.exe', '.dll', '.zip', '.7z', '.class', '.log'
)

$script:excludeFiles = @(
    '.gitignore', '.gitattributes', 'build.env',
    'arcclaw-source.zip', 'arcclaw-source.7z', '.env'
)

$script:excludeRelPaths = @(
    'arcclaw-app/src/main/resources/META-INF/resources',
    'arcclaw-app/src/main/resources/native',
    '.playwright-driver',
    '.mvn',
    'scratch'
)

$script:includeFiles = @(
    'Architecture_Invariants.md',
    'Flyway-Migration.md'
)

$script:includeRelPaths = @(
    'docs-test/arcclaw_rg_cheatsheet.md'
)

function ShouldExclude($item, $relPath) {
    if (-not $item.PSIsContainer) {
        if ($script:includeFiles -contains $item.Name) { return $false }
    }
    foreach ($rp in $script:includeRelPaths) {
        if ($relPath -eq $rp) { return $false }
        if ($item.PSIsContainer -and $rp.StartsWith("$relPath/")) { return $false }
    }
    foreach ($rp in $script:excludeRelPaths) {
        if ($relPath -eq $rp -or $relPath.StartsWith("$rp/")) { return $true }
    }
    foreach ($seg in $relPath.Split('/')) {
        if ($script:excludeDirs -contains $seg) { return $true }
    }
    if (-not $item.PSIsContainer) {
        if ($script:excludeFiles -contains $item.Name)      { return $true }
        if ($script:excludeExts  -contains $item.Extension) { return $true }
    }
    return $false
}

function CopyFiltered($sourceDir, $destDir) {
    Get-ChildItem -Path $sourceDir | ForEach-Object {
        $relPath = $_.FullName.Substring($script:root.Length).TrimStart('\\/').Replace('\','/')
        if (ShouldExclude $_ $relPath) { Write-Verbose "  skip: $relPath"; return }
        if ($_.PSIsContainer) {
            $dest = Join-Path $destDir $_.Name
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            CopyFiltered $_.FullName $dest
        } else {
            if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
            Copy-Item $_.FullName (Join-Path $destDir $_.Name) -Force
        }
    }
}

$stage = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
New-Item -ItemType Directory $stage | Out-Null

try {
    Write-Host "📂  Staging files from: $($script:root)"
    CopyFiltered $script:root $stage

    if (Test-Path $out) { Remove-Item $out -Force }
    Write-Host "📦  Creating encrypted archive: $out"
    & $zipPath a "$out" "$stage/*" "-p$argPass" -mhe=on -mx=5 | Out-Null
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    if (Test-Path $out) {
        Write-Host "✅  Archive created: $out" -ForegroundColor Green
        Get-Item $out | Format-Table Name, @{L='Size';E={'{0:N0} KB' -f ($_.Length/1KB)}} -AutoSize
    } else { exit 1 }
} finally {
    if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
}
'''

# =============================================================================
# DOCKER COMPOSE TASKS
# =============================================================================
# Tasks are defined as .ps1 scripts in .mise/tasks/compose/ for cross-platform compatibility
# - up.ps1          - Start full stack (ArcClaw + Ollama + OTel + Jaeger + Phoenix + Prometheus)
# - down.ps1        - Stop stack (data volumes preserved)
# - down-clean.ps1  - Stop stack and DELETE all data volumes (irreversible)
# - logs.ps1        - Follow live arcclaw container logs
# - restart.ps1     - Restart only the arcclaw service

# =============================================================================
# OBSERVABILITY TASKS
# =============================================================================
# Tasks are defined as .ps1 scripts in .mise/tasks/obs/ for cross-platform compatibility
# - up.ps1       - Start observability stack (OTel + Jaeger + Phoenix + Prometheus)
# - jaeger.ps1   - Start only Jaeger + OTel collector
# - phoenix.ps1  - Start only Phoenix + OTel collector
# - down.ps1     - Stop observability stack
# - status.ps1   - Check observability services status

# =============================================================================
# PODMAN TASKS
# =============================================================================
# Tasks are defined as .ps1 scripts in .mise/tasks/podman/ for cross-platform compatibility
# - init.ps1           - Initialise and start Podman machine (macOS)
# - start.ps1          - Start the Podman machine (macOS)
# - stop.ps1           - Stop the Podman machine (macOS)
# - socket.ps1         - Enable Podman user socket (WSL2/Linux)
# - status.ps1         - Print Podman version, containers, and image status
# - sandbox-build.ps1  - Build the arcclaw-tool-runner image
# - sandbox-check.ps1  - Verify the sandbox image exists

# =============================================================================
# SONARQUBE
# =============================================================================
# Tasks are defined as .ps1 scripts in .mise/tasks/sonar/ for cross-platform compatibility
# - start.ps1        - Start SonarQube container
# - stop.ps1         - Stop SonarQube container
# - logs.ps1         - View container logs
# - status.ps1       - Check container status
# - scan.ps1         - Run SonarQube analysis
# - scan-clean.ps1   - Build + run SonarQube analysis
# - token-setup.ps1  - SonarQube token setup guide
# - issues.ps1       - Fetch SonarQube issues in LLM-friendly format

# =============================================================================
# DATABASE HELPERS
# =============================================================================
# Tasks are defined as .ps1 scripts in .mise/tasks/db/ for cross-platform compatibility
# - sqlite/inspect.ps1      - Open arcclaw-meta.db in sqlite3 interactive CLI
# - sqlite/fts-check.ps1    - Verify SQLite FTS5 is available
# - sqlite/vec-check.ps1    - Check sqlite-vec extension exists
# - pg/start.ps1            - Start PostgreSQL 16 container via Podman
# - pg/stop.ps1             - Stop and remove PostgreSQL container
# - pg/status.ps1           - Check PostgreSQL container health
# - pg/reset.ps1            - Drop and recreate the arcclaw database (wipes all data)

# =============================================================================
# INFO / HELP
# =============================================================================

[tasks.info]
description = "Print runtime info: Java, Maven, Podman, Docker versions and key env vars"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
Write-Host '-- Java ─────────────────────────────────────────'
java -version 2>&1 | ForEach-Object { Write-Host "  $_" }
Write-Host '-- Maven wrapper ────────────────────────────────'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
if (Test-Path $mvnw) {
    & $mvnw --version 2>&1 | ForEach-Object { Write-Host "  $_" }
} else {
    Write-Host '  mvnw not found'
}
Write-Host '-- Podman ───────────────────────────────────────'
$pv = podman --version 2>&1; if ($LASTEXITCODE -eq 0) { Write-Host "  $pv" } else { Write-Host '  podman not installed' }
Write-Host '-- Docker CLI ───────────────────────────────────'
$dv = docker --version 2>&1; if ($LASTEXITCODE -eq 0) { Write-Host "  $dv" } else { Write-Host '  docker CLI not installed' }
Write-Host '-- DOCKER_HOST ──────────────────────────────────'
Write-Host "  $($env:DOCKER_HOST ?? '(not set)')"
Write-Host '-- ARCCLAW_VEC_EXT ──────────────────────────────'
Write-Host "  $($env:ARCCLAW_VEC_EXT ?? '(not set)')"
"""

[tasks.help]
description = "List all available mise tasks with descriptions"
dir = "{{config_root}}"
run = ["mise tasks"]

# =============================================================================
# PERSISTENCE BACKEND TASKS
# =============================================================================
# Three backends: sqlite (default), postgresql, filesystem.
# Switch by activating the appropriate profile:
#   mise run dev:pg       # Dev mode with PostgreSQL
#   mise run dev           # Dev mode with SQLite (default)
#
# When using PostgreSQL, the Podman container is auto-started.
# =============================================================================

# ── JAR mode with PostgreSQL ─────────────────────────────────────────────────

[tasks."jar:pg"]
depends = ["dev:kill", "env:recover", "db:pg:start", "build:pg"]
usage = 'arg "[cmd]" help="Command to run: serve|chat|ask (default: serve)"'
description = "Build & run packaged jar with PostgreSQL backend (auto-starts Podman container, builds PG-specific JAR)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$jar = 'arcclaw-app/target/quarkus-app/quarkus-run.jar'
if (-not (Test-Path $jar)) { Write-Host '❌  JAR not found. Run: mise run build:pg'; exit 1 }
$cmd = if ($args.Count -gt 0 -and $args[0]) { $args[0] } else { 'serve' }
[console]::InputEncoding = [console]::OutputEncoding = [System.Text.Encoding]::UTF8
$jvmArgs = @(
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens=java.base/java.lang=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED',
    '-Dsun.misc.unsafe.memory.access=allow',
    '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8',
    '-Dquarkus.profile=postgresql',
    '-Darcclaw.data-dir=./data'
)
& java @jvmArgs -jar $jar $cmd
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

[tasks."jar:pg:chat"]
depends = ["dev:kill", "env:recover", "db:pg:start", "build:pg"]
usage = 'arg "[args]..." help="Arguments to pass to the chat command"'
description = "Run packaged jar with PostgreSQL backend - interactive REPL (rebuild with: mise run build:pg first)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$jar = 'arcclaw-app/target/quarkus-app/quarkus-run.jar'
if (-not (Test-Path $jar)) { Write-Host '❌  JAR not found. Run: mise run build:pg'; exit 1 }
[console]::InputEncoding = [console]::OutputEncoding = [System.Text.Encoding]::UTF8
$jvmArgs = @(
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens=java.base/java.lang=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED',
    '-Dsun.misc.unsafe.memory.access=allow',
    '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8',
    '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8',
    '-Dquarkus.profile=cli,postgresql',
    '-Darcclaw.rag.vec-extension-path=./lib/vec0',
    '-Darcclaw.data-dir=./data'
)
& java @jvmArgs -jar $jar chat @args
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

[tasks."jar:pg:ask"]
depends = ["dev:kill", "env:recover", "db:pg:start", "build:pg"]
description = 'Run packaged jar with PostgreSQL - one-shot. Set $env:GOAL="..." (rebuild with: mise run build:pg first)'
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$goal = if ($env:GOAL) { $env:GOAL } else { '' }
if (-not $goal) { Write-Host 'Usage: $env:GOAL="..."; mise run jar:pg:ask'; exit 1 }
$jar = 'arcclaw-app/target/quarkus-app/quarkus-run.jar'
if (-not (Test-Path $jar)) { Write-Host '❌  JAR not found. Run: mise run build:pg'; exit 1 }
[console]::InputEncoding = [console]::OutputEncoding = [System.Text.Encoding]::UTF8
$jvmArgs = @(
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens=java.base/java.lang=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED',
    '-Dsun.misc.unsafe.memory.access=allow',
    '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8',
    '-Dquarkus.profile=postgresql',
    '-Darcclaw.data-dir=./data'
)
$cmdArgs = @('ask', $goal)
if ($env:ROLE) { $cmdArgs += '--role', $env:ROLE }
& java @jvmArgs -jar $jar @cmdArgs
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

# end of file

