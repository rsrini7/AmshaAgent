# =============================================================================
# mise.toml — ArcClaw Agent Kernel
# Docs: https://mise.jdx.dev
# Platform: macOS · WSL2 (Ubuntu) · Linux
# Windows: see scripts/windows/ for .ps1 wrappers
# =============================================================================

[tools]
java  = "temurin-25"
maven = "3.9"

[env]
# Auto-load project secrets — never committed
_.file = ".env"

# sqlite-vec extension path (no suffix — SQLite appends .so/.dylib)
ARCCLAW_VEC_EXT = "../lib/vec0"

# Default data directory relative to project root
ARCCLAW_DATA_DIR_DEFAULT = "../data"

# NOTE: JDK_JAVA_OPTIONS is intentionally NOT set here.
# Setting it globally causes mvnw to receive --add-opens as Maven CLI args
# (Maven CLI parser does not understand JVM-level flags).
# Each task sets MAVEN_OPTS inline (for build tasks) or uses
# -Djvm.args (for quarkus:dev tasks) to scope the flags correctly.

[task_config]
includes = ["mise-tasks"]

# ---------------------------------------------------------------------------
# Inline proxy tasks (share name with a subdirectory — filesystem constraint)
# ---------------------------------------------------------------------------

[tasks.setup]
description = "First-time setup: .env, chmod +x mvnw and all mise-tasks scripts"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ ! -f .env ]]; then
    cp .env.example .env
    echo "✅  .env created — fill in GROQ_API_KEY, ARCCLAW_VAULT_PEPPER etc."
else
    echo "ℹ️   .env already exists — skipping copy."
fi
chmod +x mvnw
find mise-tasks -type f | xargs chmod +x 2>/dev/null || true
echo "✅  mvnw and all mise-tasks scripts are executable."
echo ""
echo "Next:  mise run setup:env-check   mise run build   mise run dev"
"""

[tasks.build]
description = "JVM build — all modules, skip tests (fast daily driver)"
run = """
#!/usr/bin/env bash
set -euo pipefail
export MAVEN_OPTS="--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true"
./mvnw clean package -pl arcclaw-app -am -DskipTests
echo "✅  Build complete: arcclaw-app/target/quarkus-app/quarkus-run.jar"
"""

[tasks.dev]
description = "Dev mode — serve on :8080 with hot reload (strategy: NONE, no Podman needed)"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec ./mvnw quarkus:dev -pl arcclaw-app -am \
    '-Djvm.args=--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow' \
    "-Dquarkus.args=serve" \
    "-Dquarkus.profile=dev" \
    "-Darcclaw.rag.vec-extension-path=../lib/vec0" \
    "-Darcclaw.data-dir=../data"
"""
