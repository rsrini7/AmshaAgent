[tasks."dev:kill"]
description = "Kill any lingering Quarkus dev / quarkus-run.jar background processes"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
Write-Host '── Scanning for lingering Quarkus processes ─────────────────────'
$jps = Get-Command jps -ErrorAction SilentlyContinue
if (-not $jps) { Write-Host '❌  jps not found - is a JDK active? Run: mise run jdk:status'; exit 1 }
$procs = & jps -l 2>&1 | Where-Object { $_ -match 'quarkus-run\\.jar|quarkus\\.jar|QuarkusDevModeMain' }

# Also scan for native binaries (§Cosmetic-Fix)
$nativeProcs = Get-Process -Name "arcclaw" -ErrorAction SilentlyContinue
if ($nativeProcs) {
    Write-Host "ℹ️   Found running native processes: $($nativeProcs.Name)"
    $nativeProcs | Stop-Process -Force
    Write-Host "✅  Killed native processes."
}

if (-not $procs -and -not $nativeProcs) {
    Write-Host '✅  No lingering Quarkus processes found.'
    exit 0
}
Write-Host 'Found:'
$procs | ForEach-Object { Write-Host "  $_" }
Write-Host ''
$procs | ForEach-Object {
    $procId = ($_ -split '\\s+')[0]
    try {
        Stop-Process -Id $procId -Force
        Write-Host "✅  Killed PID $procId"
    } catch {
        Write-Host "⚠️   Could not kill PID $procId (already gone?)"
    }
}
Write-Host '────────────────────────────────────────────────────────────────'
"""

# =============================================================================
# JAR RUN TASKS  (packaged quarkus-run.jar)
# =============================================================================

[tasks."jar:serve"]
depends = ["dev:kill", "env:recover", "build:app"]
description = "Run packaged jar - REST daemon on :8080 (CLI profile)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$jar = 'arcclaw-app/target/quarkus-app/quarkus-run.jar'
if (-not (Test-Path $jar)) { Write-Host '❌  JAR not found. Run: mise run build-app'; exit 1 }
[console]::InputEncoding = [console]::OutputEncoding = [System.Text.Encoding]::UTF8
$jvmArgs = @(
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens=java.base/java.lang=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED',
    '-Dsun.misc.unsafe.memory.access=allow',
    '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8',
    '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8',
    '-Dquarkus.profile=cli',
    '-Dquarkus.mcp.server.stdio.enabled=true',
    '-Darcclaw.telegram.enabled=true',
    '-Darcclaw.rag.vec-extension-path=./lib/vec0',
    '-Darcclaw.data-dir=./data'
)
& java @jvmArgs -jar $jar serve
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

