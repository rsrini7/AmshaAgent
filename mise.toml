# =============================================================================
# mise.toml — ArcClaw Agent Kernel  (default / platform-agnostic stub)
# Docs: https://mise.jdx.dev
#
# This file exists so that `mise tasks` shows all available tasks even when
# MISE_DEFAULT_CONFIG_FILENAME is not set.
#
# Each task detects the platform and delegates to the correct config:
#   bash/zsh / Linux / macOS  →  mise.bash.toml
#   Windows / PowerShell      →  mise.pwsh.toml
#
# To avoid this indirection entirely, set once in your shell profile:
#   bash/zsh:  export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml
#   pwsh:      $env:MISE_DEFAULT_CONFIG_FILENAME = "mise.pwsh.toml"
# =============================================================================

# ---------------------------------------------------------------------------
# Internal helper — detects platform and re-invokes the task in the right env
# ---------------------------------------------------------------------------
# Every task body calls this pattern:
#   if [ "${OS:-}" = "Windows_NT" ]; then mise --env pwsh run <task>
#   else mise --env bash run <task>; fi
# ---------------------------------------------------------------------------

# =============================================================================
# SETUP
# =============================================================================

[tasks.setup]
description = "First-time setup: .env, chmod +x mvnw, install temurin-25 + graalvm-community-25.0.2"
run = """
#!/usr/bin/env sh
if [ "${OS:-}" = "Windows_NT" ]; then mise --env pwsh run setup
else mise --env bash run setup; fi
"""

[tasks."setup:env-check"]
description = "Validate .env — warn about missing or placeholder values"
run = """
#!/usr/bin/env sh
if [ "${OS:-}" = "Windows_NT" ]; then mise --env pwsh run setup:env-check
else mise --env bash run setup:env-check; fi
"""

[tasks."setup:wsl-crlf"]
description = "WSL2: fix Windows CRLF line endings in mvnw (run once after cloning on Windows)"
run = """
#!/usr/bin/env sh
if [ "${OS:-}" = "Windows_NT" ]; then mise --env pwsh run setup:wsl-crlf
else mise --env bash run setup:wsl-crlf; fi
"""

