# =============================================================================
# mise.toml — ArcClaw Agent Kernel  (default / bootstrap config)
# Docs: https://mise.jdx.dev
#
# This file exists solely as a landing page for users who have just cloned
# the repo and haven't configured their shell yet.
#
# It contains ONE task — `help` — which explains how to complete the one-time
# shell profile setup so that mise loads the correct platform config directly.
#
# AFTER setup, mise loads the right config automatically and this file is
# no longer involved:
#   bash/zsh users  →  mise.bash.toml   (Linux · macOS · WSL2)
#   pwsh users      →  mise.pwsh.toml   (Windows · macOS · WSL2)
#
# NOTE FOR WINDOWS USERS
# `mise run help` requires sh (Git Bash / WSL2) on Windows.
# If you don't have sh, just read the description printed by:
#   mise tasks
# It has everything you need.
# =============================================================================

[tasks.help]
description = """
You are seeing this because MISE_DEFAULT_CONFIG_FILENAME is not set yet.
Run `mise run help` for full setup instructions, or follow the steps below.

ONE-TIME SETUP — pick your shell and add to your profile (ORDER MATTERS):

  bash  (~/.bashrc):
    export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml   # BEFORE mise activate
    eval \"$(~/.local/bin/mise activate bash)\"

  zsh   (~/.zshrc):
    export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml   # BEFORE mise activate
    eval \"$(~/.local/bin/mise activate zsh)\"

  pwsh  ($PROFILE):
    $env:MISE_DEFAULT_CONFIG_FILENAME = 'mise.pwsh.toml' # BEFORE mise activate
    (&mise activate pwsh) | Out-String | Invoke-Expression

After reloading your shell, `mise tasks` will show all available tasks.

ONE-OFF (no profile change needed):
  mise --env bash tasks          # Linux / macOS / WSL2
  mise --env pwsh tasks          # Windows / PowerShell
  mise --env bash run dev        # run any task directly

See MISE_README.md for full documentation.
"""
run = """
#!/usr/bin/env sh
cat << 'EOF'

  ArcClaw — mise Task Runner
  ==========================

  You are seeing this because MISE_DEFAULT_CONFIG_FILENAME is not set yet.
  mise has loaded the default fallback config (mise.toml), which only
  contains this help task.

  ── ONE-TIME SETUP ───────────────────────────────────────────────────────────

  Pick your shell and add the following to your shell profile.
  ORDER MATTERS: the export line must come BEFORE the mise activate line.

  bash  → ~/.bashrc
  ┌─────────────────────────────────────────────────────────────┐
  │  export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml         │  ← FIRST
  │  eval "$(~/.local/bin/mise activate bash)"                  │  ← SECOND
  └─────────────────────────────────────────────────────────────┘

  zsh   → ~/.zshrc
  ┌─────────────────────────────────────────────────────────────┐
  │  export MISE_DEFAULT_CONFIG_FILENAME=mise.bash.toml         │  ← FIRST
  │  eval "$(~/.local/bin/mise activate zsh)"                   │  ← SECOND
  └─────────────────────────────────────────────────────────────┘

  pwsh  → $PROFILE
  ┌─────────────────────────────────────────────────────────────┐
  │  $env:MISE_DEFAULT_CONFIG_FILENAME = 'mise.pwsh.toml'       │  ← FIRST
  │  (&mise activate pwsh) | Out-String | Invoke-Expression     │  ← SECOND
  └─────────────────────────────────────────────────────────────┘

  After reloading your shell:
    mise tasks        ← shows all ArcClaw tasks
    mise run setup    ← first-time project setup (JDKs, .env)

  ── ONE-OFF (skip profile setup, run a task right now) ───────────────────────

    mise --env bash tasks            # list tasks  (Linux / macOS / WSL2)
    mise --env pwsh tasks            # list tasks  (Windows / PowerShell)

    mise --env bash run dev          # run any bash task directly
    mise --env pwsh run build:native # run any pwsh task directly

  ── WHAT IS MISE_DEFAULT_CONFIG_FILENAME? ────────────────────────────────────

    mise supports multiple config files in the same directory.
    ArcClaw ships two platform-specific ones:

      mise.bash.toml  — all tasks in bash/sh  (Linux · macOS · WSL2)
      mise.pwsh.toml  — all tasks in pwsh     (Windows · macOS · WSL2)

    Without MISE_DEFAULT_CONFIG_FILENAME, mise falls back to mise.toml
    (this file), which only has this help task.

    Setting the variable in your profile tells mise which file to load
    every time you open a terminal in this project — permanently.

  ── FULL DOCUMENTATION ───────────────────────────────────────────────────────

    See MISE_README.md — Section 3: Config File Selection

EOF
"""
