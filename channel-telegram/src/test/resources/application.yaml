amsha:
  llm:
    model: "test-model"
    gemini:
      api-key: "dummy-gemini-key"
      model-name: "gemini-2.5-flash-lite"
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"  
  auto-seed-secrets: false
  audit:
    hmac-key: "dev-audit-hmac-key-min-32-bytes-00000"
  vault:
    pepper: "test-pepper"
    master-key: "test-master-key-32-chars-padded!"
  channel:
    telegram:
      bot-token: "fake-token"
      bot-username: "AmshaBot"
      allowed-users: "admin"
      allowed-user-ids: "12345,67890"

quarkus:
  log:
    level: INFO
    category:
      "com.amsha":
        level: DEBUG
  opentelemetry:
    enabled: false
  smallrye-fault-tolerance:
    enabled: false
  index-dependency:
    amsha-core:
      group-id: com.amsha
      artifact-id: amsha-core
    amsha-channel-api:
      group-id: com.amsha
      artifact-id: amsha-channel-api
    amsha-persistence-sqlite:
      group-id: com.amsha
      artifact-id: amsha-persistence-sqlite
  langchain4j:
    openai:
      api-key: "disabled"
      embedding-model:
        enabled: true
        model-name: "text-embedding-3-small"
  arc:
    remove-unused-beans: all
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:./target/telegram-test.db?busy_timeout=20000&journal_mode=WAL&transaction_mode=IMMEDIATE"
      additional-jdbc-url-properties: "journal_mode=WAL&synchronous=NORMAL&busy_timeout=20000&transaction_mode=IMMEDIATE"
      min-size: 1
      max-size: 3
      initial-size: 1
      acquisition-timeout: 10s
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration/sqlite

