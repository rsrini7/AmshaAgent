ARCCLAW_LLM_API_KEY: "dummy-test-key"

quarkiverse:
  mcp:
    server:
      http:
        enabled: false
      stdio:
        enabled: false

arcclaw:
  llm:
    gemini:
      api-key: "dummy-gemini-key"
      model-name: "gemini-2.5-flash-lite"
  auto-seed-secrets: false
  api:
    keys:
      internal: "key-internal-changeme"
  vault:
    pepper: "test-pepper-value-not-used-in-tests"
    master-key: "test-master-key-32-chars-padded!"
  data-dir: "./target"
  workspace:
    root-dir: "./target/workspaces"
  channel:
    telegram:
      bot-token: "test-bot-token"
  cron:
    max-lookback-window: PT999H
  mcp:
    server-enabled: false
quarkus:
  langchain4j:
    openai:
      timeout: 30s
      embedding-model:
        enabled: false
        model-name: "text-embedding-3-small"
  application:
    name: arcclaw-onboarding-test
  index-dependency:
    arcclaw-core:
      group-id: com.arcclaw
      artifact-id: arcclaw-core
    arcclaw-persistence-sqlite:
      group-id: com.arcclaw
      artifact-id: arcclaw-persistence-sqlite
    arcclaw-mcp:
      group-id: com.arcclaw
      artifact-id: arcclaw-mcp
  otel:
    sdk:
      disabled: true
  thread-pool:
    shutdown-timeout: 3
    shutdown-interrupt-timeout: 2
  transaction-manager:
    enable-recovery: false
    object-store-directory: target/tx-object-store
    default-transaction-timeout: 10
  shutdown:
    timeout: 5S
  scheduler:
    enabled: false
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:./target/onboarding-test.db?busy_timeout=20000&journal_mode=WAL&transaction_mode=IMMEDIATE"
      additional-jdbc-url-properties: "journal_mode=WAL&synchronous=NORMAL&busy_timeout=20000&transaction_mode=IMMEDIATE"
      min-size: 1
      max-size: 4
      initial-size: 1
      acquisition-timeout: 10s
  hibernate-orm:
    dialect: com.arcclaw.persistence.sqlite.ArcClawSQLiteDialect
    schema-management:
      strategy: drop-and-create
    log:
      sql: false
    packages:
      - com.arcclaw.persistence.common.entity
      - com.arcclaw.persistence.sqlite.entity
  log:
    level: INFO
    category:
      "org.hibernate.SQL":
        level: WARN
      "org.hibernate.resource.transaction":
        level: ERROR
      "com.arjuna":
        level: ERROR
      "org.jboss.threads.errors":
        level: "OFF"
      "com.arcclaw.app.session.SessionRegistry":
        level: "WARN"
