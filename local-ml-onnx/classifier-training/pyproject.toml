[project]
name = "amsha-classifier-training"
version = "0.1.0"
description = "Reproducible offline training and evaluation for Amsha Phase 2 shadow classifiers"
authors = [{ name = "Amsha Agent contributors" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.8,<2",
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "scikit-learn>=1.7,<2",
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
]

[tool.uv]
package = false
