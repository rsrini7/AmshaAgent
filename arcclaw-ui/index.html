<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcClaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
    }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
    body {
      font-family: var(--font-family);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      position: relative;
      transition: background var(--transition-slow),
                  color var(--transition-slow);
    }
    /* Subtle noise texture — dark mode only */
    [data-theme="dark"] body::before,
    :root:not([data-theme]) body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      opacity: 0.025;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    }
    /* Theme toggle button */
    #theme-toggle {
      position: fixed; top: 14px; right: 16px; z-index: 1000;
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-elevated);
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), color var(--transition),
                  border-color var(--transition), box-shadow var(--transition);
      backdrop-filter: blur(8px);
    }
    #theme-toggle:hover {
      background: var(--accent-subtle);
      color: var(--accent);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #theme-toggle svg { pointer-events: none; }
  </style>
  <script>
    // Instant theme init — runs before body renders (no flash)
    (function() {
      const stored = sessionStorage.getItem('arc-theme');
      const system = matchMedia('(prefers-color-scheme: light)').matches
                     ? 'light' : 'dark';
      const theme = stored || system;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">
    <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" display="none">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42
               M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
  <arc-shell></arc-shell>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Theme toggle logic
    (function() {
      const btn = document.getElementById('theme-toggle');
      const sun = document.getElementById('icon-sun');
      const moon = document.getElementById('icon-moon');
      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        sessionStorage.setItem('arc-theme', t);
        sun.style.display  = t === 'light' ? 'block' : 'none';
        moon.style.display = t === 'dark'  ? 'block' : 'none';
        btn.setAttribute('aria-label',
          'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' mode');
      }
      const initial = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(initial);
      btn.addEventListener('click', function() {
        const cur = document.documentElement.getAttribute('data-theme');
        applyTheme(cur === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
