<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcClaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <style>
    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
      scrollbar-width: thin; 
      scrollbar-color: #1a1d26 transparent;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a1d26; border-radius: 4px; }
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: #0a0b0f; 
      color: #e8eaf0; 
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    /* Noise texture overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
      z-index: 9999;
    }
  </style>
</head>
<body>
  <arc-shell></arc-shell>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
