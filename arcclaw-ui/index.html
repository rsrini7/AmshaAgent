<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcClaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
    }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
    body {
      font-family: var(--font-family);
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      position: relative;
      transition: background var(--transition-slow),
                  color var(--transition-slow);
    }
    /* Subtle noise texture - dark mode only */
    [data-theme="dark"] body::before,
    :root:not([data-theme]) body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      opacity: 0.025;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    }
    /* Utility and Theme Rail - removed, handled by arc-theme-toggle */
  </style>
  <script>
    // Instant theme init - runs before body renders (no flash)
    (function() {
      const stored = sessionStorage.getItem('arc-theme');
      const system = matchMedia('(prefers-color-scheme: light)').matches
                     ? 'light' : 'dark';
      const theme = stored || system;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <arc-shell></arc-shell>
  <script type="module" src="/src/main.ts"></script>

</body>
</html>
