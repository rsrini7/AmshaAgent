groups:
  - name: arcclaw-operational-alerts
    rules:
      - alert: AgentLoopHighFailureRate
        expr: rate(arcclaw_agent_loop_failure_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agent loop failure rate is high ({{ $value | printf \"%.2f\" }} failures/sec)"

      - alert: ToolTimeoutDetected
        expr: rate(arcclaw_agent_tool_timeout_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Parallel tools are timing out: {{ $labels.tool }}"

      - alert: LLMRateLimitSpike
        expr: rate(arcclaw_llm_rate_limit_hit_total[5m]) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM Provider is rate-limiting ArcClaw"

      - alert: HITLAutoDenyBurst
        expr: increase(arcclaw_hitl_timeout_auto_deny_total[1h]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High volume of HITL timeouts; users may be unresponsive"
