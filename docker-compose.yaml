services:
  init-perms:
    image: registry.access.redhat.com/ubi9/ubi-minimal:9.3
    user: "0:0"
    # Explicitly create the workspaces directory before taking ownership
    command: sh -c "mkdir -p /app/data/workspaces && chown -R 1000:1000 /app/data"
    volumes:
      - arcclaw_data:/app/data
    networks:
      - arcclaw-net

  arcclaw:
    build: 
      context: .
      dockerfile: Dockerfile.native
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_PROFILE=prod
      - ARCCLAW_DATA_DIR=/app/data
      # Explicitly override the prod profile default (/var/arcclaw)
      - ARCCLAW_SANDBOX_WORKSPACE_ROOT=/app/data/workspaces
      - OLLAMA_BASE_URL=http://ollama:11434
      #- OLLAMA_MODEL=${OLLAMA_MODEL:-mistral-small:latest}
      # The OpenAI extension properly parses this dynamically at runtime!
      #- QUARKUS_LANGCHAIN4J_OPENAI_CHAT_MODEL_MODEL_NAME=${OLLAMA_MODEL:-mistral-small:latest}
      - QUARKUS_LANGCHAIN4J_OPENAI_CHAT_MODEL_MODEL_NAME=${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - ARCCLAW_LLM_API_KEY=${ARCCLAW_LLM_API_KEY:-}
      # Added Jina embedding key missing from previous env setups
      - ARCCLAW_EMBED_API_KEY=${ARCCLAW_EMBED_API_KEY:-}
      - QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4317
      # LangChain credentials
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key-to-bypass-validation}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # GITHUB_TOKEN should be provided via .env file or environment
      - "GITHUB_TOKEN=${GITHUB_TOKEN:-}"
    volumes:
      - arcclaw_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # Optional fallback for process isolation
    depends_on:
      init-perms:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    networks:
      - arcclaw-net
    privileged: true # Required for nested rootless Podman to create namespaces

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - arcclaw-net
    # GPU deployment block moved here from ollama-init!
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    networks:
      - arcclaw-net
    command: >
      sh -c "
        echo 'Waiting for Ollama API...' &&
        until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done &&
        echo 'Ollama is up, pulling models...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_MODEL:-mistral-small:latest}\"}' &&
        if [ \"${ARCCLAW_EMBED_PROVIDER:-ollama}\" = \"ollama\" ]; then
          curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"${ARCCLAW_EMBED_MODEL:-nomic-embed-text:v1.5}\"}';
        fi &&
        echo '\nModel pull complete!'
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - jaeger
      - phoenix
    networks:
      - arcclaw-net

  jaeger:
    image: jaegertracing/all-in-one:1.54
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317"        # OTLP gRPC port (internal)
    networks:
      - arcclaw-net

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix UI (only port exposed on host)
    networks:
      - arcclaw-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - arcclaw-net

  # ---------------------------------------------------------------------------
  # ARC-CLAW SANDBOX IMAGE (BUILD ONLY)
  # This service exists strictly to centralize the build configuration.
  # It is assigned to the "builder" profile so `compose up` ignores it.
  # ---------------------------------------------------------------------------
  tool-runner:
    image: arcclaw-tool-runner:latest
    build:
      context: ./sandbox
      dockerfile: Dockerfile.toolrunner
    profiles:
      - builder # Keeps this dormant during normal operations

  postgres:
    image: postgres:17-alpine
    container_name: arcclaw-postgres
    environment:
      - POSTGRES_DB=arcclaw
      - POSTGRES_USER=arcclaw
      - POSTGRES_PASSWORD=arcclawpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arcclaw-net

  sonarqube:
    image: sonarqube:latest
    container_name: arcclaw-sonarqube
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - arcclaw-net

volumes:
  arcclaw_data:
  ollama_data:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  arcclaw-net:
    driver: bridge
