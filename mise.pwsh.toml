# =============================================================================
# DIST — assemble a ready-to-run distribution folder
# =============================================================================

[tasks.dist]
description = "Assemble dist/ folder: native exe + .env.example + vec0 extension + run instructions"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$suffix  = if ($IsWindows) { '-runner.exe' } else { '-runner' }
$exeName = "arcclaw-app-1.0.0-SNAPSHOT$suffix"
$src     = "arcclaw-app/target/$exeName"
$distDir = 'dist'

if (-not (Test-Path $src)) {
    Write-Host "❌  Native binary not found at $src — run: mise run build:native"
    exit 1
}

# Preserve any existing platform binaries — only recreate lib/ and support files
New-Item -ItemType Directory -Force "$distDir/lib" | Out-Null

Copy-Item $src "$distDir/$exeName"
Copy-Item '.env.example' "$distDir/.env.example"

# Copy ALL vec0 variants that exist — preserves other platforms' files
$vec0Copied = 0
@( @('lib/vec0.so',    "$distDir/lib/vec0.so",    'Linux'),
   @('lib/vec0.dylib', "$distDir/lib/vec0.dylib", 'macOS'),
   @('lib/vec0.dll',   "$distDir/lib/vec0.dll",   'Windows') ) | ForEach-Object {
    $src, $dst, $plat = $_
    if (Test-Path $src) {
        Copy-Item $src $dst
        Write-Host "✅  $dst copied ($plat)"
        $vec0Copied++
    }
}
if ($vec0Copied -eq 0) {
    Write-Host '⚠️   No vec0 extension found in lib/ — vector search will degrade to FTS5.'
    Write-Host '    Download from: https://github.com/asg017/sqlite-vec/releases/tag/v0.1.6'
    Write-Host '    Linux  : sqlite-vec-v0.1.6-loadable-linux-x86_64.zip   → vec0.so    → lib/'
    Write-Host '    macOS  : sqlite-vec-v0.1.6-loadable-macos-aarch64.zip  → vec0.dylib → lib/'
    Write-Host '    Windows: sqlite-vec-v0.1.6-loadable-windows-x86_64.zip → vec0.dll   → lib/'
}

Write-Host ''
Write-Host "✅  dist/ assembled. Next steps:"
Write-Host "      cd dist"
Write-Host "      Copy-Item .env.example .env                             # fill in API keys"
Write-Host "      `$env:ARCCLAW_RAG_VEC_EXTENSION_PATH='./lib/vec0'      # required for vector search"
Write-Host "      `$env:ARCCLAW_DATA_DIR='./data'                        # data directory"
Write-Host "      ./$exeName serve                                        # HTTP + MCP server on :8080"
Write-Host "      ./$exeName chat                                         # interactive REPL"
Write-Host "      ./$exeName ask 'your prompt'                            # single-shot query"
Write-Host "      ./$exeName attach                                        # Telegram daemon"
Write-Host ""
Write-Host "    Tip: add env vars to dist/.env — Quarkus native reads them automatically."

# ── Generate run.ps1 launcher ────────────────────────────────────────────────
$runPs1 = @'
# run.ps1 — ArcClaw launcher
# Sets required env vars and forwards subcommand to the native binary.
# Usage: ./run.ps1 serve | chat | attach | ask "your goal"
[console]::InputEncoding = [console]::OutputEncoding = [System.Text.Encoding]::UTF8
$ErrorActionPreference = 'Stop'
$scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path
$suffix = if ($env:OS -eq 'Windows_NT') { '-runner.exe' } else { '-runner' }
$exe    = Join-Path $scriptDir "arcclaw-app-1.0.0-SNAPSHOT$suffix"
if (-not (Test-Path $exe)) {
    Write-Host "❌  Binary not found: $exe"; exit 1
}
# Load .env if present
$envFile = Join-Path $scriptDir '.env'
if (Test-Path $envFile) {
    Get-Content $envFile | Where-Object { $_ -match '^[^#].*=' } | ForEach-Object {
        $k, $v = $_ -split '=', 2
        [System.Environment]::SetEnvironmentVariable($k.Trim(), $v.Trim(), 'Process')
    }
}
# Default paths (override via .env or env vars before calling this script)
if (-not $env:ARCCLAW_RAG_VEC_EXTENSION_PATH) { $env:ARCCLAW_RAG_VEC_EXTENSION_PATH = './lib/vec0' }
if (-not $env:ARCCLAW_DATA_DIR)               { $env:ARCCLAW_DATA_DIR = './data' }
if ($args.Count -eq 0) {
    Write-Host ""
    Write-Host "    ___                ________  "
    Write-Host "   /   |  __________  / ____/ /___ __      __"
    Write-Host "  / /| | / ___/ ___/ / /   / / __  / | /| / /"
    Write-Host " / ___ |/ /  / /__  / /___/ / /_/ /| |/ |/ / "
    Write-Host "/_/  |_/_/   \\___/  \\____/_/\\__,_/ |__/|__/  "
    Write-Host ""
    Write-Host "  ArcClaw Agent Kernel"
    Write-Host ""
    Write-Host "  USAGE"
    Write-Host "    ./run.ps1 serve                    Start HTTP + MCP server on :8080"
    Write-Host "    ./run.ps1 chat                     Start interactive REPL"
    Write-Host "    ./run.ps1 ask `"your goal here`"   Run one-shot task and exit"
    Write-Host "    ./run.ps1 attach                   Start Telegram daemon"
    Write-Host ""
    Write-Host "  OPTIONS (append to any command)"
    Write-Host "    --role coordinator|researcher|architect|synthesizer|debugger"
    Write-Host ""
    exit 0
}
$process = Start-Process -FilePath $exe -ArgumentList $args -NoNewWindow -Wait -PassThru
exit $process.ExitCode
'@
$runPs1 | Set-Content (Join-Path $distDir 'run.ps1') -Encoding UTF8

# ── Generate run.sh launcher ─────────────────────────────────────────────────
$runSh = @'
#!/usr/bin/env bash
# run.sh — ArcClaw launcher
# Sets required env vars and forwards subcommand to the native binary.
# Usage: ./run.sh serve | chat | attach | ask "your goal"
set -euo pipefail
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
EXE="$SCRIPT_DIR/arcclaw-app-1.0.0-SNAPSHOT-runner"
if [[ ! -f "$EXE" ]]; then
    echo "❌  Binary not found: $EXE"; exit 1
fi
# Load .env if present
[[ -f "$SCRIPT_DIR/.env" ]] && set -a && source "$SCRIPT_DIR/.env" && set +a
# Default paths (override via .env or env vars)
export ARCCLAW_RAG_VEC_EXTENSION_PATH="${ARCCLAW_RAG_VEC_EXTENSION_PATH:-./lib/vec0}"
export ARCCLAW_DATA_DIR="${ARCCLAW_DATA_DIR:-./data}"
# Linux: preload libm for sqlite-vec symbol resolution
[[ "$(uname -s)" == "Linux" ]] && export LD_PRELOAD=/lib/x86_64-linux-gnu/libm.so.6
if [[ $# -eq 0 ]]; then
    echo ""
    echo "    ___                ________  "
    echo "   /   |  __________  / ____/ /___ __      __"
    echo "  / /| | / ___/ ___/ / /   / / __  / | /| / /"
    echo " / ___ |/ /  / /__  / /___/ / /_/ /| |/ |/ / "
    echo "/_/  |_/_/   \\___/  \\____/_/\\__,_/ |__/|__/  "
    echo ""
    echo "  ArcClaw Agent Kernel"
    echo ""
    echo "  USAGE"
    echo "    ./run.sh serve                   Start HTTP + MCP server on :8080"
    echo "    ./run.sh chat                    Start interactive REPL"
    echo "    ./run.sh ask 'your goal here'    Run one-shot task and exit"
    echo "    ./run.sh attach                  Start Telegram daemon"
    echo ""
    echo "  OPTIONS (append to any command)"
    echo "    --role coordinator|researcher|architect|synthesizer|debugger"
    echo ""
    exit 0
fi
exec "$EXE" "$@"
'@
$runShLf = $runSh -replace "`r`n", "`n"
[System.IO.File]::WriteAllText(
    (Join-Path (Resolve-Path $distDir) 'run.sh'),
    $runShLf,
    [System.Text.UTF8Encoding]::new($false)   # UTF-8, no BOM
)
if (-not $IsWindows) { chmod +x (Join-Path $distDir 'run.sh') }

Write-Host ''
Write-Host '✅  Launchers written:'
Write-Host '      dist/run.sh    → Linux/macOS  :  ./run.sh serve|chat|ask|attach'
Write-Host '      dist/run.ps1   → Windows/pwsh :  ./run.ps1 serve|chat|ask|attach'
Write-Host ''
Write-Host '── Binaries in dist/ ────────────────────────────────────────────────'
if (Test-Path 'dist/arcclaw-app-1.0.0-SNAPSHOT-runner')     { Write-Host '  ✅  runner        (Linux/macOS)' } else { Write-Host '  ·   runner        (Linux/macOS) — not built yet' }
if (Test-Path 'dist/arcclaw-app-1.0.0-SNAPSHOT-runner.exe') { Write-Host '  ✅  runner.exe    (Windows)'     } else { Write-Host '  ·   runner.exe    (Windows)     — not built yet' }
Write-Host '─────────────────────────────────────────────────────────────────────'
Write-Host '    Build the missing platform binary and re-run: mise run dist'
"""

