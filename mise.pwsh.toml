# =============================================================================
# mise.pwsh.toml — ArcClaw Agent Kernel  (PowerShell variant)
# Docs: https://mise.jdx.dev
# Platform: Windows · macOS · WSL2 · Linux — all tasks use pwsh.
# No separate .ps1 or bash scripts needed.
#
# Activate with:  mise --env pwsh tasks   (or any mise command)
# bash/zsh users → use mise.bash.toml instead (no pwsh needed).
# =============================================================================

[tools]
# Temurin 25 is the default JDK for all dev, build, jar, native-run tasks.
# GraalVM is installed alongside but NOT the default.
# Switch with:  mise run jdk:graalvm  (before native build)
# Switch back:  mise run jdk:temurin  (after native build — build:native does this automatically)
java       = "temurin-25"
maven      = "3.9"
powershell = "latest"

[env]
_.file = ".env"

# ARCCLAW_VEC_EXT and ARCCLAW_DATA_DIR are intentionally NOT set here.
# quarkus:dev forks Maven inside arcclaw-app/ → needs ../lib/vec0 and ../data.
# jar and native tasks run from the project root  → need  ./lib/vec0 and  ./data.
# Each task passes -Darcclaw.rag.vec-extension-path and -Darcclaw.data-dir explicitly.

# NOTE: JDK_JAVA_OPTIONS intentionally NOT set here.
# Dev tasks pass JVM flags via -Djvm.args; build tasks set MAVEN_OPTS inline.
# Setting JDK_JAVA_OPTIONS globally causes Maven to fail parsing --add-opens.

# =============================================================================
# SETUP
# =============================================================================

[tasks.setup]
description = "First-time setup: .env, chmod +x mvnw, install temurin-25 + graalvm-community-25.0.2"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (-not (Test-Path '.env')) {
    Copy-Item '.env.example' '.env'
    Write-Host '✅  .env created — fill in GROQ_API_KEY, ARCCLAW_VAULT_PEPPER etc.'
} else {
    Write-Host 'ℹ️   .env already exists — skipping copy.'
}
if (-not $IsWindows) {
    chmod +x mvnw
    Write-Host '✅  mvnw marked executable.'
}
Write-Host 'Installing JDKs (temurin-25 + graalvm-community-25.0.2)...'
mise install java@temurin-25
mise install java@graalvm-community-25.0.2
Write-Host '✅  Both JDKs installed.'
"""

[tasks."setup:env-check"]
description = "Validate .env — warn about missing or placeholder values"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (-not (Test-Path '.env')) {
    Write-Host '❌  .env not found. Run: mise run setup'
    exit 1
}
$issues = @()
$vars = @{}
Get-Content '.env' | Where-Object { $_ -match '^\\s*[^#]' } | ForEach-Object {
    if ($_ -match '^([^=]+)=(.*)$') { $vars[$Matches[1].Trim()] = $Matches[2].Trim() }
}
if ([string]::IsNullOrEmpty($vars['GROQ_API_KEY']))                { $issues += 'GROQ_API_KEY is empty' }
if ($vars['ARCCLAW_VAULT_PEPPER']     -like '*changeme*')          { $issues += 'ARCCLAW_VAULT_PEPPER is still a placeholder' }
if ($vars['ARCCLAW_AUDIT_HMAC_KEY']   -like '*changeme*')          { $issues += 'ARCCLAW_AUDIT_HMAC_KEY is still a placeholder' }
if ($vars['ARCCLAW_API_KEY_INTERNAL'] -like '*changeme*')          { $issues += 'ARCCLAW_API_KEY_INTERNAL is still a placeholder' }
if ($issues.Count -gt 0) {
    Write-Host '⚠️   Issues found in .env:'
    $issues | ForEach-Object { Write-Host "    • $_" }
    exit 1
} else {
    Write-Host '✅  .env looks good — all required keys are set.'
}
"""

[tasks."setup:wsl-crlf"]
description = "WSL2: fix Windows CRLF line endings in mvnw (run once after cloning on Windows)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if ($IsWindows) {
    Write-Host 'ℹ️   Not needed on native Windows — CRLF fix is for WSL2/Linux only.'
    exit 0
}
sudo apt-get install -y dos2unix
dos2unix mvnw
chmod +x mvnw
Write-Host '✅  mvnw CRLF fixed and marked executable.'
"""

# =============================================================================
# JDK MANAGEMENT
# =============================================================================

[tasks."jdk:graalvm"]
description = "Switch active JDK to GraalVM Community 25.0.2 (for native builds)"
dir = "{{config_root}}"
run = [
  "mise use java@graalvm-community-25.0.2",
  "java -version",
]

[tasks."jdk:temurin"]
description = "Switch active JDK back to Temurin 25 (default — dev, build, jar tasks)"
dir = "{{config_root}}"
run = [
  "mise use java@temurin-25",
  "java -version",
]

[tasks."jdk:install"]
description = "Install both JDKs (temurin-25 + graalvm-community-25.0.2) — safe to re-run"
dir = "{{config_root}}"
run = [
  "mise install java@temurin-25",
  "mise install java@graalvm-community-25.0.2",
  "mise ls java",
]

[tasks."jdk:status"]
description = "Show which JDK is currently active and list all installed JDKs"
dir = "{{config_root}}"
run = [
  "java -version",
  "mise ls java",
]

# =============================================================================
# BUILD TASKS
# =============================================================================

[tasks.build-app]
depends = ["dev:kill"]
description = "JVM build — all modules, skip tests (fast daily driver) — uses temurin-25"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
& $mvnw clean install -pl arcclaw-app -am -DskipTests
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Build complete: arcclaw-app/target/quarkus-app/quarkus-run.jar'
"""

[tasks."build:full"]
description = "Clean install all modules, skip tests"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
& $mvnw clean install -DskipTests
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Full build complete.'
"""

[tasks."build:test"]
description = "Build and run all tests"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
& $mvnw clean verify
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host '✅  Tests complete.'
"""

[tasks."build:native"]
description = "Native binary — Podman container (default on Linux/macOS) or local GraalVM — auto-detects, auto-switches JDK"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw   = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
$mOpts  = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'

# ── Resolve build strategy ────────────────────────────────────────────────────
# Priority: Windows(always local) > ARCCLAW_NATIVE_BUILD env var > auto-detect Podman > fallback local
$strategy = 'local'
if ($IsWindows) {
    Write-Host 'ℹ️   Windows: using local GraalVM (container build produces a Linux ELF — unusable on Windows).'
} elseif ($env:ARCCLAW_NATIVE_BUILD -eq 'local') {
    Write-Host 'ℹ️   ARCCLAW_NATIVE_BUILD=local: using local GraalVM.'
} elseif ($env:ARCCLAW_NATIVE_BUILD -eq 'container') {
    if (Get-Command podman -ErrorAction SilentlyContinue) {
        Write-Host 'ℹ️   ARCCLAW_NATIVE_BUILD=container: using Podman container build.'
        $strategy = 'container'
    } else {
        Write-Host '❌  ARCCLAW_NATIVE_BUILD=container but podman not found.'
        Write-Host '    Install Podman:'
        Write-Host '      macOS:      mise run podman:init'
        Write-Host '      Linux/WSL2: sudo apt install podman  then  mise run podman:socket'
        exit 1
    }
} else {
    # Auto-detect: probe Podman — it is the preferred default on Linux/macOS
    if (Get-Command podman -ErrorAction SilentlyContinue) {
        podman info 2>&1 | Out-Null
        if ($LASTEXITCODE -eq 0) {
            Write-Host 'ℹ️   Podman detected and running → container build (portable binary, recommended).'
            $strategy = 'container'
        } else {
            Write-Host '⚠️   Podman installed but not running → falling back to local GraalVM.'
            Write-Host '    To use container builds start Podman first:'
            Write-Host '      macOS:      mise run podman:start'
            Write-Host '      Linux/WSL2: mise run podman:socket'
        }
    } else {
        Write-Host '⚠️   Podman not found → using local GraalVM build.'
        Write-Host '    To use container builds (more portable binary, recommended for Linux targets):'
        Write-Host '      macOS:      mise run podman:init'
        Write-Host '      Linux/WSL2: sudo apt install podman  then  mise run podman:socket'
        Write-Host '    To silence this warning:  export ARCCLAW_NATIVE_BUILD=local  (or set in .env)'
    }
}
$containerFlag = if ($strategy -eq 'container') { '-Dquarkus.native.container-build=true' } else { '-Dquarkus.native.container-build=false' }
# ─────────────────────────────────────────────────────────────────────────────


# ── .env shield — TEMP FIX ───────────────────────────────────────────────────
# Quarkus bakes BUILD_TIME config properties from .env into the native binary.
# We move .env aside so no secrets or API keys are frozen into the binary.
# Long-term fix: maintain a build.env with only non-secret build-time config
# and rename it here instead (see MISE_README.md §Build Tasks).
$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
} elseif (Test-Path 'build.env') {
    Copy-Item 'build.env' '.env'
    $envBackup = 'build.env'
    Write-Host 'ℹ️   build.env activated for native compilation (no secrets).'
} else {
    Write-Host 'ℹ️   No .env found — building without config override (good for CI).'
}
# ─────────────────────────────────────────────────────────────────────────────
if ($strategy -eq 'container') {
    # ── Container build — GraalVM runs inside Podman, host JDK unchanged ─────
    Write-Host 'ℹ️   Container build: host GraalVM not needed — skipping JDK switch.'
    try {
        $env:MAVEN_OPTS = $mOpts
        # '-Dquarkus.native.additional-build-args=-H:+PrintAnalysisCallTree' - if needed add it
        & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests $containerFlag 
        if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
        Write-Host '▶   Assembling dist/ folder...'
        mise run dist
    } finally {
        if ($envBackup -eq $true)           { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
        elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
    }
} else {
    # ── Local build — switch to GraalVM, restore Temurin after ───────────────
    try {
        mise use java@graalvm-community-25.0.2
        $env:MAVEN_OPTS = $mOpts
        # '-Dquarkus.native.additional-build-args=-H:+PrintAnalysisCallTree' - if needed add it
        & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests $containerFlag
        if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
        Write-Host '▶   Assembling dist/ folder...'
        mise run dist
    } finally {
        if ($envBackup -eq $true)           { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
        elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
        mise use java@temurin-25
        Write-Host '✅  Switched back to Temurin 25.'
    }
}
Write-Host "✅  Native build complete [$strategy]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
Write-Host ''
Write-Host '▶   Run with one of:'
Write-Host '      mise run native:serve                → HTTP + MCP server on :8080'
Write-Host '      mise run native:chat                 → interactive REPL'
Write-Host '      mise run native:attach               → Telegram daemon'
Write-Host '      $env:GOAL="..."; mise run native:ask → single-shot query'
Write-Host ''
"""

[tasks."build:native-local"]
description = "Native binary — always local GraalVM, no container (fast, any OS) — auto-switches JDK"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw   = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
Write-Host 'ℹ️   build:native-local: local GraalVM, no Podman container.'

# ── .env shield — TEMP FIX ───────────────────────────────────────────────────
# Quarkus bakes BUILD_TIME config properties from .env into the native binary.
# We move .env aside so no secrets or API keys are frozen into the binary.
# Long-term fix: maintain a build.env with only non-secret build-time config
# and rename it here instead (see MISE_README.md §Build Tasks).
$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
} elseif (Test-Path 'build.env') {
    Copy-Item 'build.env' '.env'
    $envBackup = 'build.env'
    Write-Host 'ℹ️   build.env activated for native compilation (no secrets).'
} else {
    Write-Host 'ℹ️   No .env found — building without config override (good for CI).'
}
# ─────────────────────────────────────────────────────────────────────────────
try {
    mise use java@graalvm-community-25.0.2
    $env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
    & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests '-Dquarkus.native.container-build=false'
    # '-Dquarkus.native.additional-build-args=-H:+PrintAnalysisCallTree' - if needed add it
    if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
    Write-Host "✅  Native build complete [local]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
    Write-Host ''
    Write-Host '▶   Assembling dist/ folder...'
    mise run dist
    Write-Host '▶   Run with one of:'
    Write-Host '      mise run native:serve                → HTTP + MCP server on :8080'
    Write-Host '      mise run native:chat                 → interactive REPL'
    Write-Host '      mise run native:attach               → Telegram daemon'
    Write-Host '      $env:GOAL="..."; mise run native:ask → single-shot query'
} finally {
    # ── restore .env ──────────────────────────────────────────────────────────
    if ($envBackup -eq $true)          { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
    elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
    mise use java@temurin-25
    Write-Host '✅  Switched back to Temurin 25.'
}
"""

[tasks."build:native-lowmem"]
description = "Native binary — local GraalVM, 6 GB heap cap (use when RAM is tight) — auto-switches JDK"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw   = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$suffix = if ($IsWindows) { '-runner.exe' } else { '-runner' }
Write-Host 'ℹ️   build:native-lowmem: local GraalVM, heap capped at 6 GB.'

# ── .env shield — TEMP FIX ───────────────────────────────────────────────────
# Quarkus bakes BUILD_TIME config properties from .env into the native binary.
# We move .env aside so no secrets or API keys are frozen into the binary.
# Long-term fix: maintain a build.env with only non-secret build-time config
# and rename it here instead (see MISE_README.md §Build Tasks).
$envBackup = $null
if (Test-Path '.env') {
    Rename-Item '.env' '.env.build-backup'
    $envBackup = $true
    Write-Host 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
} elseif (Test-Path 'build.env') {
    Copy-Item 'build.env' '.env'
    $envBackup = 'build.env'
    Write-Host 'ℹ️   build.env activated for native compilation (no secrets).'
} else {
    Write-Host 'ℹ️   No .env found — building without config override (good for CI).'
}
# ─────────────────────────────────────────────────────────────────────────────
try {
    mise use java@graalvm-community-25.0.2
    $env:MAVEN_OPTS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
    & $mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests `
        '-Dquarkus.native.container-build=false' `
        '-Dquarkus.native.additional-build-args=-J-Xmx6g'
    if ($LASTEXITCODE -ne 0) { throw "Maven native build failed (exit $LASTEXITCODE)" }
    Write-Host "✅  Native lowmem build complete [local]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT$suffix"
    Write-Host '▶   Assembling dist/ folder...'
    mise run dist 
} finally {
    # ── restore .env ──────────────────────────────────────────────────────────
    if ($envBackup -eq $true)          { Rename-Item '.env.build-backup' '.env'; Write-Host 'ℹ️   .env restored.' }
    elseif ($envBackup -eq 'build.env') { Remove-Item '.env' -ErrorAction SilentlyContinue; Write-Host 'ℹ️   Temporary build.env copy removed.' }
    mise use java@temurin-25
    Write-Host '✅  Switched back to Temurin 25.'
}
"""

[tasks.clean]
description = "Clean Maven build artifacts"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
& $mvnw clean
Write-Host '✅  Build artifacts cleaned.'
"""

# =============================================================================
# DEV MODE TASKS  (hot reload — Temurin 25, no Podman)
# =============================================================================

[tasks.dev]
description = "Dev mode — serve on :8080 with hot reload (strategy: NONE, no Podman needed)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw    = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$jvmArgs = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8'
& $mvnw quarkus:dev -pl arcclaw-app -am `
    "-Djvm.args=$jvmArgs" `
    '-Dquarkus.args=serve' `
    '-Dquarkus.profile=dev' `
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' `
    '-Darcclaw.data-dir=../data'
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

[tasks."dev:chat"]
description = "Dev mode — interactive REPL with hot reload (strategy: NONE)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$mvnw    = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$jvmArgs = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8'
& $mvnw quarkus:dev -pl arcclaw-app -am `
    "-Djvm.args=$jvmArgs" `
    '-Dquarkus.args=chat' `
    '-Dquarkus.profile=dev' `
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' `
    '-Darcclaw.data-dir=../data'
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

[tasks."dev:attach"]
description = "Dev mode — Telegram daemon with hot reload (requires TELEGRAM_BOT_TOKEN in .env)"
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
if (-not $env:TELEGRAM_BOT_TOKEN) {
    Write-Host '❌  TELEGRAM_BOT_TOKEN is not set in .env'
    exit 1
}
$mvnw    = if ($IsWindows) { '.\\mvnw.cmd' } else { './mvnw' }
$jvmArgs = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Darcclaw.telegram.enabled=true'
& $mvnw quarkus:dev -pl arcclaw-app -am `
    "-Djvm.args=$jvmArgs" `
    '-Dquarkus.args=attach' `
    '-Dquarkus.profile=dev' `
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' `
    '-Darcclaw.data-dir=../data'
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

[tasks."dev:ask"]
description = 'Dev mode — one-shot task. Set $env:GOAL="..." then: mise run dev:ask'
dir = "{{config_root}}"
shell = "pwsh -NonInteractive -Command"
quiet = true
run = """
$ErrorActionPreference = 'Stop'
$goal = if ($env:GOAL) { $env:GOAL } else { '' }
if (-not $goal) {
    Write-Host 'Usage:  $env:GOAL="Your goal here"; mise run dev:ask'
    Write-Host 'Or:     GOAL="Your goal" mise run dev:ask   (macOS/Linux)'
    Write-Host 'Roles:  coordinator · researcher · architect · synthesizer · debugger'
