[tasks."db:inspect"]
description = "Open arcclaw-meta.db in sqlite3 interactive CLI"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
DB="${ARCCLAW_DATA_DIR:-./data}/arcclaw-meta.db"
