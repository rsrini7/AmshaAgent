# =============================================================================
# mise.bash.toml — ArcClaw Agent Kernel  (bash/sh variant)
# Docs: https://mise.jdx.dev
# Platform: macOS · WSL2 (Ubuntu) · Linux
# No PowerShell required — all tasks run in bash/sh.
#
# Activate with:  mise --env bash tasks   (or any mise command)
# Windows users → use mise.pwsh.toml instead (no bash needed).
# =============================================================================

[tools]
# Temurin 25 is the default JDK for all dev, build, jar, native-run tasks.
# GraalVM is installed alongside but NOT the default.
# Switch with:  mise run jdk:graalvm  (before native build)
# Switch back:  mise run jdk:temurin  (after native build — build:native does this automatically)
java  = "temurin-25"
maven = "3.9"

[env]
_.file = ".env"

# ARCCLAW_VEC_EXT and ARCCLAW_DATA_DIR are intentionally NOT set here.
# quarkus:dev forks Maven inside arcclaw-app/ → needs ../lib/vec0 and ../data.
# jar and native tasks run from the project root  → need  ./lib/vec0 and  ./data.
# Each task passes -Darcclaw.rag.vec-extension-path and -Darcclaw.data-dir explicitly.

# NOTE: JDK_JAVA_OPTIONS intentionally NOT set here.
# Dev tasks pass JVM flags via -Djvm.args; build tasks set MAVEN_OPTS inline.
# Setting JDK_JAVA_OPTIONS globally causes Maven to fail parsing --add-opens.

# =============================================================================
# SETUP
# =============================================================================

[tasks.setup]
description = "First-time setup: .env, chmod +x mvnw, install temurin-25 + graalvm-community-25.0.2"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ ! -f .env ]]; then
    cp .env.example .env
    echo '✅  .env created — fill in GROQ_API_KEY, ARCCLAW_VAULT_PEPPER etc.'
else
    echo 'ℹ️   .env already exists — skipping copy.'
fi
chmod +x mvnw
echo '✅  mvnw marked executable.'
echo 'Installing JDKs (temurin-25 + graalvm-community-25.0.2)...'
mise install java@temurin-25
mise install java@graalvm-community-25.0.2
echo '✅  Both JDKs installed.'
"""

[tasks."setup:env-check"]
description = "Validate .env — warn about missing or placeholder values"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ ! -f .env ]]; then
    echo '❌  .env not found. Run: mise run setup'
    exit 1
fi
source .env
issues=()
[[ -z "${GROQ_API_KEY:-}" ]]                          && issues+=("GROQ_API_KEY is empty")
[[ "${ARCCLAW_VAULT_PEPPER:-}"     == *"changeme"* ]] && issues+=("ARCCLAW_VAULT_PEPPER is still a placeholder")
[[ "${ARCCLAW_AUDIT_HMAC_KEY:-}"   == *"changeme"* ]] && issues+=("ARCCLAW_AUDIT_HMAC_KEY is still a placeholder")
[[ "${ARCCLAW_API_KEY_INTERNAL:-}" == *"changeme"* ]] && issues+=("ARCCLAW_API_KEY_INTERNAL is still a placeholder")
if [[ ${#issues[@]} -gt 0 ]]; then
    echo '⚠️   Issues found in .env:'
    for msg in "${issues[@]}"; do echo "    • $msg"; done
    exit 1
else
    echo '✅  .env looks good — all required keys are set.'
fi
"""

[tasks."setup:wsl-crlf"]
description = "WSL2: fix Windows CRLF line endings in mvnw (run once after cloning on Windows)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
sudo apt-get install -y dos2unix
dos2unix mvnw
chmod +x mvnw
echo '✅  mvnw CRLF fixed and marked executable.'
"""

# =============================================================================
# JDK MANAGEMENT
# =============================================================================

[tasks."jdk:graalvm"]
description = "Switch active JDK to GraalVM Community 25.0.2 (for native builds)"
dir = "{{config_root}}"
run = [
  "mise use java@graalvm-community-25.0.2",
  "java -version",
]

[tasks."jdk:temurin"]
description = "Switch active JDK back to Temurin 25 (default — dev, build, jar tasks)"
dir = "{{config_root}}"
run = [
  "mise use java@temurin-25",
  "java -version",
]

[tasks."jdk:install"]
description = "Install both JDKs (temurin-25 + graalvm-community-25.0.2) — safe to re-run"
dir = "{{config_root}}"
run = [
  "mise install java@temurin-25",
  "mise install java@graalvm-community-25.0.2",
  "mise ls java",
]

[tasks."jdk:status"]
description = "Show which JDK is currently active and list all installed JDKs"
dir = "{{config_root}}"
run = [
  "java -version",
  "mise ls java",
]

# =============================================================================
# BUILD TASKS
# =============================================================================

[tasks.build-app]
depends = ["dev:kill"]
description = "JVM build — all modules, skip tests (fast daily driver) — uses temurin-25"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
export MAVEN_OPTS='--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
./mvnw clean install -pl arcclaw-app -am -DskipTests
echo '✅  Build complete: arcclaw-app/target/quarkus-app/quarkus-run.jar'
"""

[tasks."build:full"]
description = "Clean install all modules, skip tests"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
export MAVEN_OPTS='--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dquarkus.otel.sdk.disabled=true'
./mvnw clean install -DskipTests
echo '✅  Full build complete.'
"""

[tasks."build:test"]
description = "Build and run all tests"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
export MAVEN_OPTS='--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
./mvnw clean verify
echo '✅  Tests complete.'
"""

[tasks."build:native"]
description = "Native binary — Podman container (default on Linux/macOS) or local GraalVM — auto-detects, auto-switches JDK"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
MOPTS='--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'

# ── Resolve build strategy ────────────────────────────────────────────────────
# Priority: ARCCLAW_NATIVE_BUILD env var > auto-detect Podman > fallback local
strategy='local'
if [[ "${ARCCLAW_NATIVE_BUILD:-}" == 'local' ]]; then
    echo 'ℹ️   ARCCLAW_NATIVE_BUILD=local: using local GraalVM.'
elif [[ "${ARCCLAW_NATIVE_BUILD:-}" == 'container' ]]; then
    if command -v podman &>/dev/null; then
        echo 'ℹ️   ARCCLAW_NATIVE_BUILD=container: using Podman container build.'
        strategy='container'
    else
        echo '❌  ARCCLAW_NATIVE_BUILD=container but podman not found.'
        echo '    Install Podman:'
        echo '      macOS:      mise run podman:init'
        echo '      Linux/WSL2: sudo apt install podman  then  mise run podman:socket'
        exit 1
    fi
else
    # Auto-detect: probe Podman — preferred default on Linux/macOS
    if command -v podman &>/dev/null; then
        if podman info &>/dev/null; then
            echo 'ℹ️   Podman detected and running → container build (portable binary, recommended).'
            strategy='container'
        else
            echo '⚠️   Podman installed but not running → falling back to local GraalVM.'
            echo '    To use container builds start Podman first:'
            echo '      macOS:      mise run podman:start'
            echo '      Linux/WSL2: mise run podman:socket'
        fi
    else
        echo '⚠️   Podman not found → using local GraalVM build.'
        echo '    To use container builds (more portable binary, recommended for Linux targets):'
        echo '      macOS:      mise run podman:init'
        echo '      Linux/WSL2: sudo apt install podman  then  mise run podman:socket'
        echo '    To silence this warning:  export ARCCLAW_NATIVE_BUILD=local  (or set in .env)'
    fi
fi
containerFlag="-Dquarkus.native.container-build=$([ "$strategy" = 'container' ] && echo true || echo false)"
# ─────────────────────────────────────────────────────────────────────────────


# ── .env shield — TEMP FIX ───────────────────────────────────────────────────
# Quarkus bakes BUILD_TIME config properties from .env into the native binary.
# We move .env aside so no secrets or API keys are frozen into the binary.
# Long-term fix: maintain a build.env with only non-secret build-time config
# and rename it here instead (see MISE_README.md §Build Tasks).
env_backup=''
if [[ -f .env ]]; then
    mv .env .env.build-backup
    env_backup='dotenv'
    echo 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
elif [[ -f build.env ]]; then
    cp build.env .env
    env_backup='build.env'
    echo 'ℹ️   build.env activated for native compilation (no secrets).'
else
    echo 'ℹ️   No .env found — building without config override (good for CI).'
fi
# ─────────────────────────────────────────────────────────────────────────────
if [[ "$strategy" == 'container' ]]; then
    # ── Container build — GraalVM runs inside Podman, host JDK unchanged ─────
    echo 'ℹ️   Container build: host GraalVM not needed — skipping JDK switch.'
    _arcclaw_native_cleanup() {
        if   [[ "$env_backup" == 'dotenv'    ]]; then mv .env.build-backup .env; echo 'ℹ️   .env restored.'
        elif [[ "$env_backup" == 'build.env' ]]; then rm -f .env; echo 'ℹ️   Temporary build.env copy removed.'
        fi
    }
    trap _arcclaw_native_cleanup EXIT
    # '-Dquarkus.native.additional-build-args=-H:+PrintAnalysisCallTree' - if needed add it
    export MAVEN_OPTS="$MOPTS"
    ./mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests "$containerFlag"
else
    # ── Local build — switch to GraalVM, restore Temurin after ───────────────
    _arcclaw_native_cleanup() {
        if   [[ "$env_backup" == 'dotenv'    ]]; then mv .env.build-backup .env; echo 'ℹ️   .env restored.'
        elif [[ "$env_backup" == 'build.env' ]]; then rm -f .env; echo 'ℹ️   Temporary build.env copy removed.'
        fi
        mise use java@temurin-25 && echo '✅  Switched back to Temurin 25.'
    }
    trap _arcclaw_native_cleanup EXIT
    mise use java@graalvm-community-25.0.2
    export MAVEN_OPTS="$MOPTS"
    ./mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests "$containerFlag"
fi
echo "✅  Native build complete [$strategy]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT-runner"
echo ''
echo '▶   Assembling dist/ folder...'
mise run dist
echo ''
echo '▶   Run with one of:'
echo '      mise run native:serve          → HTTP + MCP server on :8080'
echo '      mise run native:chat           → interactive REPL'
echo '      mise run native:attach         → Telegram daemon'
echo '      GOAL="..." mise run native:ask → single-shot query'
echo ''
"""

[tasks."build:native-local"]
description = "Native binary — always local GraalVM, no container (fast, any OS) — auto-switches JDK"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo 'ℹ️   build:native-local: local GraalVM, no Podman container.'

# ── .env shield — TEMP FIX ───────────────────────────────────────────────────
# Quarkus bakes BUILD_TIME config properties from .env into the native binary.
# We move .env aside so no secrets or API keys are frozen into the binary.
# Long-term fix: maintain a build.env with only non-secret build-time config
# and rename it here instead (see MISE_README.md §Build Tasks).
env_backup=''
if [[ -f .env ]]; then
    mv .env .env.build-backup
    env_backup='dotenv'
    echo 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
elif [[ -f build.env ]]; then
    cp build.env .env
    env_backup='build.env'
    echo 'ℹ️   build.env activated for native compilation (no secrets).'
else
    echo 'ℹ️   No .env found — building without config override (good for CI).'
fi
# ─────────────────────────────────────────────────────────────────────────────
_arcclaw_native_cleanup() {
    if   [[ "$env_backup" == 'dotenv'    ]]; then mv .env.build-backup .env; echo 'ℹ️   .env restored.'
    elif [[ "$env_backup" == 'build.env' ]]; then rm -f .env; echo 'ℹ️   Temporary build.env copy removed.'
    fi
    mise use java@temurin-25 && echo '✅  Switched back to Temurin 25.'
}
trap _arcclaw_native_cleanup EXIT
mise use java@graalvm-community-25.0.2
export MAVEN_OPTS='--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
# '-Dquarkus.native.additional-build-args=-H:+PrintAnalysisCallTree' - if needed add it
./mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests '-Dquarkus.native.container-build=false'
echo '✅  Native build complete [local]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT-runner'
echo ''
echo '▶   Assembling dist/ folder...'
mise run dist
echo '▶   Run with one of:'
echo '      mise run native:serve          → HTTP + MCP server on :8080'
echo '      mise run native:chat           → interactive REPL'
echo '      mise run native:attach         → Telegram daemon'
echo '      GOAL="..." mise run native:ask → single-shot query'
"""

[tasks."build:native-lowmem"]
description = "Native binary — local GraalVM, 6 GB heap cap (use when RAM is tight) — auto-switches JDK"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo 'ℹ️   build:native-lowmem: local GraalVM, heap capped at 6 GB.'

# ── .env shield — TEMP FIX ───────────────────────────────────────────────────
# Quarkus bakes BUILD_TIME config properties from .env into the native binary.
# We move .env aside so no secrets or API keys are frozen into the binary.
# Long-term fix: maintain a build.env with only non-secret build-time config
# and rename it here instead (see MISE_README.md §Build Tasks).
env_backup=''
if [[ -f .env ]]; then
    mv .env .env.build-backup
    env_backup='dotenv'
    echo 'ℹ️   .env shielded (.env.build-backup) — secrets will not be baked into binary.'
elif [[ -f build.env ]]; then
    cp build.env .env
    env_backup='build.env'
    echo 'ℹ️   build.env activated for native compilation (no secrets).'
else
    echo 'ℹ️   No .env found — building without config override (good for CI).'
fi
# ─────────────────────────────────────────────────────────────────────────────
_arcclaw_native_cleanup() {
    if   [[ "$env_backup" == 'dotenv'    ]]; then mv .env.build-backup .env; echo 'ℹ️   .env restored.'
    elif [[ "$env_backup" == 'build.env' ]]; then rm -f .env; echo 'ℹ️   Temporary build.env copy removed.'
    fi
    mise use java@temurin-25 && echo '✅  Switched back to Temurin 25.'
}
trap _arcclaw_native_cleanup EXIT
mise use java@graalvm-community-25.0.2
export MAVEN_OPTS='--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow'
./mvnw clean package -Pnative -pl arcclaw-app -am -DskipTests \
    '-Dquarkus.native.container-build=false' \
    '-Dquarkus.native.additional-build-args=-J-Xmx6g'
echo '✅  Native lowmem build complete [local]: arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT-runner'
echo ''
echo '▶   Assembling dist/ folder...'
mise run dist
"""

[tasks.clean]
description = "Clean Maven build artifacts"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
./mvnw clean
echo '✅  Build artifacts cleaned.'
"""

# =============================================================================
# SHARED VARS — referenced as $JVM_ARGS inside task scripts
# =============================================================================

[vars]
JVM_ARGS = '--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8'

# =============================================================================
# DEV MODE TASKS  (hot reload — Temurin 25, no Podman)
# =============================================================================

[tasks.dev]
description = "Dev mode — serve on :8080 with hot reload (strategy: NONE, no Podman needed)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec ./mvnw quarkus:dev -pl arcclaw-app -am \\
    "-Djvm.args=$JVM_ARGS" \\
    '-Dquarkus.args=serve' \\
    '-Dquarkus.profile=dev' \\
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' \\
    '-Darcclaw.data-dir=../data'
"""

[tasks."dev:chat"]
description = "Dev mode — interactive REPL with hot reload (strategy: NONE)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec ./mvnw quarkus:dev -pl arcclaw-app -am \\
    "-Djvm.args=$JVM_ARGS" \\
    '-Dquarkus.args=chat' \\
    '-Dquarkus.profile=dev' \\
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' \\
    '-Darcclaw.data-dir=../data'
"""

[tasks."dev:attach"]
description = "Dev mode — Telegram daemon with hot reload (requires TELEGRAM_BOT_TOKEN in .env)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
    echo '❌  TELEGRAM_BOT_TOKEN is not set in .env'; exit 1
fi
exec ./mvnw quarkus:dev -pl arcclaw-app -am \\
    "-Djvm.args=$JVM_ARGS -Darcclaw.telegram.enabled=true" \\
    '-Dquarkus.args=attach' \\
    '-Dquarkus.profile=dev' \\
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' \\
    '-Darcclaw.data-dir=../data'
"""

[tasks."dev:ask"]
description = 'Dev mode — one-shot task. Usage: GOAL="your goal" mise run dev:ask'
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
GOAL="${1:-${GOAL:-}}"
if [[ -z "$GOAL" ]]; then
    echo 'Usage:  GOAL="Your goal here" mise run dev:ask'
    echo 'Or:     mise run dev:ask -- "Your goal here"'
    echo 'Roles:  coordinator · researcher · architect · synthesizer · debugger'
    echo '        ROLE=researcher GOAL="..." mise run dev:ask'
    exit 1
fi
QARGS="ask $GOAL${ROLE:+ --role $ROLE}"
exec ./mvnw quarkus:dev -pl arcclaw-app -am \\
    "-Djvm.args=$JVM_ARGS" \\
    "-Dquarkus.args=$QARGS" \\
    '-Dquarkus.profile=dev' \\
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' \\
    '-Darcclaw.data-dir=../data'
"""

[tasks."dev:no-ui"]
description = "Dev mode — serve with Dev UI + console disabled (NPE workaround in Quarkus dev console)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec ./mvnw quarkus:dev -pl arcclaw-app -am \\
    "-Djvm.args=$JVM_ARGS" \\
    '-Dquarkus.args=serve' \\
    '-Dquarkus.profile=dev' \\
    '-Dquarkus.console.enabled=false' \\
    '-Dquarkus.devui.enabled=false' \\
    '-Darcclaw.rag.vec-extension-path=../lib/vec0' \\
    '-Darcclaw.data-dir=../data'
"""

# =============================================================================
# JAR RUN TASKS  (packaged quarkus-run.jar)
# =============================================================================

[tasks.serve]
description = "Run packaged jar — REST daemon on :8080 (CLI profile)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
JAR='arcclaw-app/target/quarkus-app/quarkus-run.jar'
[[ ! -f "$JAR" ]] && echo '❌  JAR not found. Run: mise run build' && exit 1
JVM_ARGS=(
    '--add-opens=java.base/java.nio=ALL-UNNAMED'
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    '--add-opens=java.base/java.lang=ALL-UNNAMED'
    '--enable-native-access=ALL-UNNAMED'
    '-Dsun.misc.unsafe.memory.access=allow'
    '-Dfile.encoding=UTF-8' '-Dstdout.encoding=UTF-8'
    '-Dsun.stdout.encoding=UTF-8' '-Dsun.stderr.encoding=UTF-8'
    '-Dquarkus.profile=dev'
    '-Darcclaw.rag.vec-extension-path=./lib/vec0'
    '-Darcclaw.data-dir=./data'
)
exec java "${JVM_ARGS[@]}" -jar "$JAR" serve
"""

[tasks.chat]
description = "Run packaged jar — interactive REPL (CLI profile)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
JAR='arcclaw-app/target/quarkus-app/quarkus-run.jar'
[[ ! -f "$JAR" ]] && echo '❌  JAR not found. Run: mise run build' && exit 1
JVM_ARGS=(
    '--add-opens=java.base/java.nio=ALL-UNNAMED'
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    '--add-opens=java.base/java.lang=ALL-UNNAMED'
    '--enable-native-access=ALL-UNNAMED'
    '-Dsun.misc.unsafe.memory.access=allow'
    '-Dfile.encoding=UTF-8' '-Dstdout.encoding=UTF-8'
    '-Dsun.stdout.encoding=UTF-8' '-Dsun.stderr.encoding=UTF-8'
    '-Dquarkus.profile=cli'
    '-Darcclaw.rag.vec-extension-path=./lib/vec0'
    '-Darcclaw.data-dir=./data'
)
exec java "${JVM_ARGS[@]}" -jar "$JAR" chat
"""

[tasks.attach]
description = "Run packaged jar — Telegram channel daemon (requires TELEGRAM_BOT_TOKEN in .env)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
JAR='arcclaw-app/target/quarkus-app/quarkus-run.jar'
[[ ! -f "$JAR" ]] && echo '❌  JAR not found. Run: mise run build' && exit 1
[[ -z "${TELEGRAM_BOT_TOKEN:-}" ]] && echo '❌  TELEGRAM_BOT_TOKEN is not set in .env' && exit 1
JVM_ARGS=(
    '--add-opens=java.base/java.nio=ALL-UNNAMED'
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    '--add-opens=java.base/java.lang=ALL-UNNAMED'
    '--enable-native-access=ALL-UNNAMED'
    '-Dsun.misc.unsafe.memory.access=allow'
    '-Dfile.encoding=UTF-8' '-Dstdout.encoding=UTF-8'
    '-Dsun.stdout.encoding=UTF-8' '-Dsun.stderr.encoding=UTF-8'
    '-Dquarkus.profile=cli'
    '-Darcclaw.telegram.enabled=true'
    '-Darcclaw.rag.vec-extension-path=./lib/vec0'
    '-Darcclaw.data-dir=./data'
)
exec java "${JVM_ARGS[@]}" -jar "$JAR" attach
"""

[tasks.ask]
description = 'Run packaged jar — one-shot task. Usage: GOAL="your goal" mise run ask'
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
JAR='arcclaw-app/target/quarkus-app/quarkus-run.jar'
[[ ! -f "$JAR" ]] && echo '❌  JAR not found. Run: mise run build' && exit 1
GOAL="${1:-${GOAL:-}}"
if [[ -z "$GOAL" ]]; then
    echo 'Usage:  GOAL="Your goal here" mise run ask'
    echo 'Or:     mise run ask -- "Your goal here"'
    echo 'Roles:  coordinator · researcher · architect · synthesizer · debugger'
    echo '        ROLE=researcher GOAL="..." mise run ask'
    exit 1
fi
JVM_ARGS=(
    '--add-opens=java.base/java.nio=ALL-UNNAMED'
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    '--add-opens=java.base/java.lang=ALL-UNNAMED'
    '--enable-native-access=ALL-UNNAMED'
    '-Dsun.misc.unsafe.memory.access=allow'
    '-Dfile.encoding=UTF-8' '-Dstdout.encoding=UTF-8'
    '-Dsun.stdout.encoding=UTF-8' '-Dsun.stderr.encoding=UTF-8'
    '-Dquarkus.profile=cli'
    '-Darcclaw.rag.vec-extension-path=./lib/vec0'
    '-Darcclaw.data-dir=./data'
)
CMD_ARGS=("ask" "$GOAL")
[[ -n "${ROLE:-}" ]] && CMD_ARGS+=("--role" "$ROLE")
exec java "${JVM_ARGS[@]}" -jar "$JAR" "${CMD_ARGS[@]}"
"""

[tasks."jar:serve-dev-profile"]
description = "Run packaged jar with %dev profile (no Podman sandbox) — for smoke-testing without Podman"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
JAR='arcclaw-app/target/quarkus-app/quarkus-run.jar'
[[ ! -f "$JAR" ]] && echo '❌  JAR not found. Run: mise run build' && exit 1
JVM_ARGS=(
    '--add-opens=java.base/java.nio=ALL-UNNAMED'
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    '--add-opens=java.base/java.lang=ALL-UNNAMED'
    '--enable-native-access=ALL-UNNAMED'
    '-Dsun.misc.unsafe.memory.access=allow'
    '-Dfile.encoding=UTF-8' '-Dstdout.encoding=UTF-8'
    '-Dsun.stdout.encoding=UTF-8' '-Dsun.stderr.encoding=UTF-8'
    '-Dquarkus.profile=dev'
    '-Darcclaw.rag.vec-extension-path=./lib/vec0'
    '-Darcclaw.data-dir=./data'
)
exec java "${JVM_ARGS[@]}" -jar "$JAR" serve
"""

