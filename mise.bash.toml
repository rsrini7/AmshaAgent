[tasks."db:fts-check"]
description = "Verify SQLite FTS5 is available (required for full-text search)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
if sqlite3 :memory: 'CREATE VIRTUAL TABLE t USING fts5(x);' 2>/dev/null; then
    echo '✅  FTS5 is available.'
else
    echo '❌  FTS5 not available. Fix: sudo apt install sqlite3'
    exit 1
fi
"""

[tasks."db:vec-check"]
description = "Check sqlite-vec extension exists for your platform (lib/vec0.so / .dylib)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
OS="$(uname -s)"
if   [[ "$OS" == "Darwin" ]]; then EXT='./lib/vec0.dylib'
elif [[ "$OS" == "Linux"  ]]; then EXT='./lib/vec0.so'
else                                EXT='./lib/vec0.so'
fi
if [[ -f "$EXT" ]]; then
    echo "✅  sqlite-vec extension found: $EXT"
else
    echo "❌  Extension not found: $EXT"
    echo '    Download from: https://github.com/asg017/sqlite-vec/releases/tag/v0.1.6'
    exit 1
fi
"""

