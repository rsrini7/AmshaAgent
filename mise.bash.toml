# =============================================================================
# DIST — assemble a ready-to-run distribution folder
# =============================================================================

[tasks.dist]
description = "Assemble dist/ folder: native binary + .env.example + vec0 extension"
dir = "{{config_root}}"
quiet = true
run = """
#!/usr/bin/env bash
set -euo pipefail
RUNNER='arcclaw-app/target/arcclaw-app-1.0.0-SNAPSHOT-runner'
if [[ ! -f "$RUNNER" ]]; then
    echo "❌  Native binary not found at $RUNNER — run: mise run build:native"
    exit 1
fi
# Preserve any existing platform binaries — only recreate lib/ and support files
mkdir -p dist/lib
cp "$RUNNER" dist/
cp .env.example dist/.env.example
# Copy ALL vec0 variants that exist — preserves other platforms' files
vec0_copied=0
[[ -f 'lib/vec0.so'    ]] && cp 'lib/vec0.so'    'dist/lib/vec0.so'    && echo '✅  dist/lib/vec0.so    copied (Linux)'  && (( vec0_copied++ )) || true
[[ -f 'lib/vec0.dylib' ]] && cp 'lib/vec0.dylib' 'dist/lib/vec0.dylib' && echo '✅  dist/lib/vec0.dylib copied (macOS)'  && (( vec0_copied++ )) || true
[[ -f 'lib/vec0.dll'   ]] && cp 'lib/vec0.dll'   'dist/lib/vec0.dll'   && echo '✅  dist/lib/vec0.dll   copied (Windows)' && (( vec0_copied++ )) || true
if (( vec0_copied == 0 )); then
    echo '⚠️   No vec0 extension found in lib/ — vector search will degrade to FTS5.'
    echo '    Download from: https://github.com/asg017/sqlite-vec/releases/tag/v0.1.6'
    echo '    Linux  : sqlite-vec-v0.1.6-loadable-linux-x86_64.zip   → vec0.so    → lib/'
    echo '    macOS  : sqlite-vec-v0.1.6-loadable-macos-aarch64.zip  → vec0.dylib → lib/'
    echo '    Windows: sqlite-vec-v0.1.6-loadable-windows-x86_64.zip → vec0.dll   → lib/'
fi
echo ''
echo '✅  dist/ assembled. Next steps:'
echo '      cd dist'
echo '      cp .env.example .env                                      # fill in API keys'
echo '      export ARCCLAW_RAG_VEC_EXTENSION_PATH=./lib/vec0          # required for vector search'
echo '      export ARCCLAW_DATA_DIR=./data                            # data directory'
echo '      ./arcclaw-app-1.0.0-SNAPSHOT-runner serve                 # HTTP + MCP on :8080'
echo '      ./arcclaw-app-1.0.0-SNAPSHOT-runner chat                  # interactive REPL'
echo '      ./arcclaw-app-1.0.0-SNAPSHOT-runner ask "your prompt"     # single-shot query'
echo '      ./arcclaw-app-1.0.0-SNAPSHOT-runner attach                # Telegram daemon'
echo ''
echo '    Tip: add env vars to dist/.env — Quarkus native reads them automatically.'

# ── Generate run.sh launcher ─────────────────────────────────────────────────
cat > "dist/run.sh" << 'LAUNCHER'
#!/usr/bin/env bash
# run.sh — ArcClaw launcher
# Sets required env vars and forwards subcommand to the native binary.
# Usage: ./run.sh serve | chat | attach | ask "your goal"
set -euo pipefail
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
EXE="$SCRIPT_DIR/arcclaw-app-1.0.0-SNAPSHOT-runner"
if [[ ! -f "$EXE" ]]; then
    echo "❌  Binary not found: $EXE"; exit 1
fi
# Load .env if present
[[ -f "$SCRIPT_DIR/.env" ]] && set -a && source "$SCRIPT_DIR/.env" && set +a
# Default paths (override via .env or env vars)
export ARCCLAW_RAG_VEC_EXTENSION_PATH="${ARCCLAW_RAG_VEC_EXTENSION_PATH:-./lib/vec0}"
export ARCCLAW_DATA_DIR="${ARCCLAW_DATA_DIR:-./data}"
# Linux: preload libm for sqlite-vec symbol resolution
[[ "$(uname -s)" == "Linux" ]] && export LD_PRELOAD=/lib/x86_64-linux-gnu/libm.so.6
if [[ $# -eq 0 ]]; then
    echo ""
    echo "    ___                ________  "
    echo "   /   |  __________  / ____/ /___ __      __"
    echo "  / /| | / ___/ ___/ / /   / / __  / | /| / /"
    echo " / ___ |/ /  / /__  / /___/ / /_/ /| |/ |/ / "
    echo "/_/  |_/_/   \\___/  \\____/_/\\__,_/ |__/|__/  "
    echo ""
    echo "  ArcClaw Agent Kernel"
    echo ""
    echo "  USAGE"
    echo "    ./run.sh serve                   Start HTTP + MCP server on :8080"
    echo "    ./run.sh chat                    Start interactive REPL"
    echo "    ./run.sh ask 'your goal here'    Run one-shot task and exit"
    echo "    ./run.sh attach                  Start Telegram daemon"
    echo ""
    echo "  OPTIONS (append to any command)"
    echo "    --role coordinator|researcher|architect|synthesizer|debugger"
    echo ""
    exit 0
fi
# Strip any Windows \r from args (guards against CRLF-contaminated copies of this script)
CLEAN_ARGS=()
for arg in "$@"; do CLEAN_ARGS+=("${arg//$'\r'/}"); done
exec "$EXE" "${CLEAN_ARGS[@]}"
LAUNCHER
chmod +x "dist/run.sh"

# ── Generate run.ps1 launcher ────────────────────────────────────────────────
cat > "dist/run.ps1" << 'LAUNCHER'
# run.ps1 — ArcClaw launcher
# Sets required env vars and forwards subcommand to the native binary.
# Usage: ./run.ps1 serve | chat | attach | ask "your goal"
[console]::InputEncoding = [console]::OutputEncoding = [System.Text.Encoding]::UTF8
$ErrorActionPreference = 'Stop'
$scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path
$exe       = Join-Path $scriptDir 'arcclaw-app-1.0.0-SNAPSHOT-runner'
# Load .env if present
$envFile = Join-Path $scriptDir '.env'
if (Test-Path $envFile) {
    Get-Content $envFile | Where-Object { $_ -match '^[^#].*=' } | ForEach-Object {
        $k, $v = $_ -split '=', 2
        [System.Environment]::SetEnvironmentVariable($k.Trim(), $v.Trim(), 'Process')
    }
}
if (-not $env:ARCCLAW_RAG_VEC_EXTENSION_PATH) { $env:ARCCLAW_RAG_VEC_EXTENSION_PATH = './lib/vec0' }
if (-not $env:ARCCLAW_DATA_DIR)               { $env:ARCCLAW_DATA_DIR = './data' }
if ($args.Count -eq 0) {
    Write-Host ""
    Write-Host "    ___                ________  "
    Write-Host "   /   |  __________  / ____/ /___ __      __"
    Write-Host "  / /| | / ___/ ___/ / /   / / __  / | /| / /"
    Write-Host " / ___ |/ /  / /__  / /___/ / /_/ /| |/ |/ / "
    Write-Host "/_/  |_/_/   \\___/  \\____/_/\\__,_/ |__/|__/  "
    Write-Host ""
    Write-Host "  ArcClaw Agent Kernel"
    Write-Host ""
    Write-Host "  USAGE"
    Write-Host "    ./run.ps1 serve                    Start HTTP + MCP server on :8080"
    Write-Host "    ./run.ps1 chat                     Start interactive REPL"
    Write-Host "    ./run.ps1 ask 'your goal here'     Run one-shot task and exit"
    Write-Host "    ./run.ps1 attach                   Start Telegram daemon"
    Write-Host ""
    Write-Host "  OPTIONS (append to any command)"
    Write-Host "    --role coordinator|researcher|architect|synthesizer|debugger"
    Write-Host ""
    exit 0
}
& "$exe" $args
LAUNCHER

echo ''
echo '✅  Launchers written:'
echo '      dist/run.sh   → Linux/macOS  :  ./run.sh serve|chat|ask|attach'
echo '      dist/run.ps1  → Windows/pwsh :  ./run.ps1 serve|chat|ask|attach'
echo ''
echo '── Binaries in dist/ ────────────────────────────────────────────────'
[[ -f 'dist/arcclaw-app-1.0.0-SNAPSHOT-runner'     ]] && echo '  ✅  runner        (Linux/macOS)' || echo '  ·   runner        (Linux/macOS) — not built yet'
[[ -f 'dist/arcclaw-app-1.0.0-SNAPSHOT-runner.exe' ]] && echo '  ✅  runner.exe    (Windows)'     || echo '  ·   runner.exe    (Windows)     — not built yet'
echo '─────────────────────────────────────────────────────────────────────'
echo '    Build the missing platform binary and re-run: mise run dist'
"""

