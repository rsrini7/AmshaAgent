Args = --initialize-at-run-time=io.quarkus.websockets.next.runtime.SecuritySupport \
       --initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$ObjectMapperHolder \
       --initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$SnakeCaseObjectMapperHolder \
       --initialize-at-run-time=com.amsha.persistence.fs.FsMemoryRetrievalAdapter,com.amsha.persistence.fs.lucene.LuceneIndexManager \
       --initialize-at-build-time=org.apache.lucene.internal.vectorization.PanamaVectorizationProvider \
       --initialize-at-run-time=org.apache.lucene.internal.tests.TestSecrets \
       --initialize-at-run-time=org.apache.lucene.store.FilterIndexInput \
       --initialize-at-run-time=org.apache.lucene.index.IndexWriter \
       -J--add-modules=jdk.incubator.vector \
       -H:+VectorAPISupport \
       -H:-CheckToolchain \
       -Dfile.encoding=UTF-8 \
       -Dstdout.encoding=UTF-8 \
       -Dstderr.encoding=UTF-8 \
       -Dorg.apache.lucene.internal.vectorization.PanamaVectorizationProvider.disabled=true \
       --initialize-at-run-time=org.jline.nativ \
       --enable-native-access=ALL-UNNAMED
       
