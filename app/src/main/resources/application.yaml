# =============================================================================
# Amsha Agent V0.1.0 - Full Application Configuration
# Never hardcode secrets here. Use env vars or Kubernetes Secrets.
# =============================================================================

quarkus:
  shutdown:
    timeout: 30S
  mcp:
    server:
      stdio:
        enabled: false
  vertx:
    prefer-native-transport: true
    use-async-dns: true
    resolver:
      cache-max-time-to-live: 300
      cache-negative-time-to-live: 0

  application:
    name: amsha
    version: "0.1.0"
  
  banner:
    enabled: true
    path: amsha-banner.txt
  
  index-dependency:
    amsha-core:
      group-id: com.amsha
      artifact-id: amsha-core
    amsha-channel-api:
      group-id: com.amsha
      artifact-id: amsha-channel-api
    amsha-channel-telegram:
      group-id: com.amsha
      artifact-id: amsha-channel-telegram
    amsha-channel-web:
      group-id: com.amsha
      artifact-id: amsha-channel-web
    amsha-rag:
      group-id: com.amsha
      artifact-id: amsha-rag
    amsha-tool-playwright:
      group-id: com.amsha
      artifact-id: amsha-tool-playwright
    amsha-mcp:
      group-id: com.amsha
      artifact-id: amsha-mcp
    amsha-llm-provider-api:
      group-id: com.amsha
      artifact-id: amsha-llm-provider-api
    amsha-llm-providers:
      group-id: com.amsha
      artifact-id: amsha-llm-providers

  devservices:
    enabled: false
  
  swagger-ui:
    path: /q/swagger-ui
    always-include: true

  # ---------------------------------------------------------------------------
  # HTTP / REST
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    ssl-port: 8443
    cors:
      enabled: true
      origins: "${AMSHA_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}"
      headers: "X-Amsha-API-Key,X-AMSHA-API-KEY,X-AMSHA-PLATFORM-ID,Content-Type,Accept"
      methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    limits:
      max-body-size: 10M

  rest:
    path: /api/v1   # all /sessions endpoints served at /api/v1/sessions

  # ---------------------------------------------------------------------------
  # DATABASE — SQLite (default). Switch to PostgreSQL via %postgresql profile.
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:${AMSHA_DATA_DIR:./data}/amsha-meta.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&transaction_mode=IMMEDIATE"
      # pool-interceptor: com.amsha.core.persistence.FtsConnectionInterceptor
      min-size: 1
      #Connection 1 = JTA transaction writes (approval/deny)
      #Connection 2 = AsyncPersistenceEngine audit/telemetry writes
      #Connection 3 = for REQUIRES_NEW under concurrent approval + async audit drain
      max-size: 3
      transactions: enabled
      # ✅ ADD THESE - validates connections before handing back to callers
      # prevents broken/post-BUSY connections from being reused (the cron cascade fix)
      background-validation-interval: PT30S
      validation-query-sql: "SELECT 1"
      # Discard connections that Narayana has marked broken after XA failures
      idle-removal-interval: PT60S
      acquisition-timeout: 60 # ← seconds, default is often 5
      # This must be LONGER than SQLite busy_timeout (10s)
      # so Agroal waits for SQLite to release before giving up

  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    # SQLite migrations live under db/migration/sqlite/
    # PostgreSQL (when activated via -Dquarkus.profile=postgresql) uses db/migration/postgresql/
    locations: db/migration/sqlite

  # ---------------------------------------------------------------------------
  # LANGCHAIN4J
  # ---------------------------------------------------------------------------
  langchain4j:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding-model:
        log-requests: false
        log-responses: false
      chat-model:
        model-id: ${OLLAMA_MODEL:mistral-small:latest}
        temperature: 0.7
        log-requests: false
        log-responses: false
        enabled: false
    openai:
      timeout: 120s
      max-retries: 3
      chat-model:
        enabled: false
      embedding-model:
        enabled: false
    anthropic:
      chat-model:
        enabled: false

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  otel:
    enabled: true
    sdk:
      disabled: "${OTEL_SDK_DISABLED:false}"  # default on - set OTEL_SDK_DISABLED=true to disable
    exporter:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}"
        protocol: grpc
    resource:
      attributes: "deployment.environment=${AMSHA_ENV:development},service.name=amsha"
    traces:
      enabled: true
      sampler: always_on

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  smallrye-health:
    ui:
      enabled: true

  # ---------------------------------------------------------------------------
  # SCHEDULER
  # ---------------------------------------------------------------------------
  scheduler:
    enabled: true
    metrics:
      enabled: true

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS
  # ---------------------------------------------------------------------------
  virtual-threads:
    enabled: true
  thread-pool:
    core-threads: 1   # minimize platform threads; virtual threads handle concurrency

smallrye:
  context-propagation:
    managed-executor:
      max-async: 20

  transaction-manager:
    default-transaction-timeout: 300
    enable-recovery: false

  # ---------------------------------------------------------------------------
  # INPUT VALIDATION
  # ---------------------------------------------------------------------------
  hibernate-validator:
    fail-fast: true

  # ---------------------------------------------------------------------------
  # OPENAPI
  # ---------------------------------------------------------------------------
  smallrye-openapi:
    info-title: "Amsha Agent API"
    info-version: "0.1.0"
    info-description: "Autonomous multi-agent framework - Java 21 + Quarkus + LangChain4J"
    store-schema-directory: target
    schema-filename: openapi
    open-api-version: 3.0.3


  # ---------------------------------------------------------------------------
  # NATIVE IMAGE
  # ---------------------------------------------------------------------------
  native:
    # Set encoding to UTF-8 for Windows console support (§Cosmetic-Fix)
    additional-build-args: "-Dfile.encoding=UTF-8,-Dstdout.encoding=UTF-8"
    # native-image-xmx: 4g # require 8GB machine with podman
    resources:
      includes:
        - "META-INF/services/*"
        - "META-INF/native-image/**"
        - "META-INF/skills/**"
        - "skills/**"
        - "templates/**"
        - "prompts/**"
        - "env-example"
        - "native/vec0/**"
        - "provider-catalog.json"

  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
    log:
      console:
        enabled: false
      level: INFO
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.amsha":
        level: DEBUG
      "com.amsha.core.agent.loop.AgentStateMachineRunner":
        level: WARN       # ← suppress goal logging noise (isInfoEnabled guard handles the rest)
      "com.amsha.core.sandbox.PodmanContainerExecutor":
        level: WARN       # ← suppress container start/stop/exec noise
      "org.jboss.resteasy.reactive.server.handlers.PublisherResponseHandler":
        level: ERROR
      "io.quarkus":
        level: INFO
      "org.apache.camel.component.telegram":
        level: INFO
      "io.smallrye.faulttolerance":
        level: INFO
      "io.sm.op.ru.util":
        level: INFO
      "io.quarkus.opentelemetry.runtime.exporter.otlp":
        level: ERROR      # suppress connection-refused noise when collector is down
      "io.quarkus.opentelemetry.runtime.exporter.otlp.sender":
        level: ERROR      # suppress VertxGrpcSender warnings
      "ja.la.ProcessBuilder":
        level: INFO
      "java.lang.ProcessBuilder":
        level: WARN       # ← suppress DEBUG noise from sqlite-jdbc uname probe
      "org.sqlite":
        level: WARN       # ← suppress all sqlite-jdbc debug output
      "java.lang":
        level: WARN

      "dev.langchain4j.internal.RetryUtils":
        level: ERROR
      "org.jboss.resteasy.reactive.common.core.AbstractResteasyReactiveContext":
        level: ERROR  # suppress the unrecoverable exception noise at DEBUG
      "jdk.event.security":
        level: "OFF"  # suppress SSL cert flood
      "io.netty.handler.ssl":
        level: INFO
      "org.apache.camel.component.telegram.TelegramConsumer":
        level: ERROR
      # Telegram polling retries are handled by Camel's backoff policy. Keep
      # expected transient outages quiet while preserving ERROR diagnostics.
      "com.amsha.channel.telegram.TelegramChannelRoute":
        level: ERROR
      "org.apache.camel":
        level: INFO
      "io.netty":
        level: WARN
      "io.opentelemetry":
        level: WARN
      "org.infinispan":
        level: WARN
      "org.jboss.resteasy.reactive.common.core":
        level: WARN
      "jakarta.json.spi":
        level: "OFF"
      "io.netty.resolver.dns.DirContextUtils":
        level: WARN
      "io.smallrye.config":
        level: INFO
      "io.micrometer":
        level: INFO
      "io.vertx":
        level: INFO
      "io.quarkus.arc":
        level: INFO
      "io.smallrye.context.jta.context.provider.JtaContextProvider":
        level: WARN
      "com.arjuna.ats.arjuna":
        level: ERROR
    console:
      # sessionId from MDC rendered in every log line (Fix C4)
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [sid=%X{sessionId}] (%t) %s%e%n"
      darken: 0
      filter: secret-redaction
    file:
      enabled: true
      path: "./amsha.log"
      level: DEBUG
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [sid=%X{sessionId}] [trace=%X{traceId}] [span=%X{spanId}] (%t) %s%e%n"
      filter: secret-redaction
      rotation:
        max-file-size: 20M
        max-backup-index: 3

# =============================================================================
# AMSHA APPLICATION CONFIG
# Embedding providers are configured via `amsha.infinite-loop.embedding.providers`
# with per-provider keys under `amsha.embedding.{provider}.{key}`.
# See .env.example for full details.
# =============================================================================
amsha:
  data-dir: "${AMSHA_DATA_DIR:./data}"
  test-data-collection:
    enabled: ${AMSHA_TEST_DATA_COLLECTION_ENABLED:false}
  classifier:
    shadow:
      threads: ${AMSHA_CLASSIFIER_SHADOW_THREADS:2}
      queue-capacity: ${AMSHA_CLASSIFIER_SHADOW_QUEUE_CAPACITY:64}
      shutdown-grace: ${AMSHA_CLASSIFIER_SHADOW_SHUTDOWN_GRACE:PT5S}
    sarvam:
      api-key: "${AMSHA_CLASSIFIER_SARVAM_API_KEY:${AMSHA_SARVAM_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_SARVAM_BASE_URL:https://api.sarvam.ai/v1}"
      model: "${AMSHA_CLASSIFIER_SARVAM_MODEL:sarvam-105b}"
    opencode:
      api-key: "${AMSHA_CLASSIFIER_OPENCODE_API_KEY:${AMSHA_OPENCODE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_OPENCODE_BASE_URL:https://opencode.ai/zen/v1}"
      model: "${AMSHA_CLASSIFIER_OPENCODE_MODEL:deepseek-v4-flash-free}"
    huggingface:
      api-key: "${AMSHA_CLASSIFIER_HUGGINGFACE_API_KEY:${AMSHA_HUGGINGFACE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}"
      model: "${AMSHA_CLASSIFIER_HUGGINGFACE_MODEL:meta-llama/Llama-3.3-70B-Instruct}"
    mistral:
      api-key: "${AMSHA_CLASSIFIER_MISTRAL_API_KEY:${AMSHA_MISTRAL_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_MISTRAL_BASE_URL:https://api.mistral.ai/v1}"
      model: "${AMSHA_CLASSIFIER_MISTRAL_MODEL:codestral-latest}"
    cloudflare:
      api-key: "${AMSHA_CLASSIFIER_CLOUDFLARE_API_KEY:${AMSHA_CLOUDFLARE_API_KEY:}}"
      account-id: "${AMSHA_CLASSIFIER_CLOUDFLARE_ACCOUNT_ID:${AMSHA_CLOUDFLARE_ACCOUNT_ID:}}"
      # Do not put {account_id} inside ${ENV:default} — MP Config closes on the first '}'.
      base-url: "${AMSHA_CLASSIFIER_CLOUDFLARE_BASE_URL:${amsha.llm.cloudflare.unresolved-base-url}}"
      model: "${AMSHA_CLASSIFIER_CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
    cohere:
      api-key: "${AMSHA_CLASSIFIER_COHERE_API_KEY:${AMSHA_COHERE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}"
      model: "${AMSHA_CLASSIFIER_COHERE_MODEL:command-r-plus-08-2024}"
    codex:
      api-key: "${AMSHA_CLASSIFIER_CODEX_API_KEY:${AMSHA_CODEX_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_CODEX_BASE_URL:https://chatgpt.com/backend-api/codex}"
      model: "${AMSHA_CLASSIFIER_CODEX_MODEL:gpt-5.6-luna}"
    claude-code:
      api-key: "${AMSHA_CLASSIFIER_CLAUDE_CODE_API_KEY:${AMSHA_CLAUDE_CODE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_CLAUDE_CODE_BASE_URL:https://api.anthropic.com}"
      model: "${AMSHA_CLASSIFIER_CLAUDE_CODE_MODEL:claude-sonnet-4-5}"
    agy:
      api-key: "${AMSHA_CLASSIFIER_AGY_API_KEY:${AMSHA_AGY_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_AGY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}"
      model: "${AMSHA_CLASSIFIER_AGY_MODEL:gemini-3.1-flash-lite}"
    kimchi:
      api-key: "${AMSHA_CLASSIFIER_KIMCHI_API_KEY:${AMSHA_KIMCHI_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_KIMCHI_BASE_URL:https://llm.kimchi.dev/openai/v1}"
      model: "${AMSHA_CLASSIFIER_KIMCHI_MODEL:minimax-m3}"
    foundry:
      base-url: "${AMSHA_CLASSIFIER_FOUNDRY_BASE_URL:${AMSHA_FOUNDRY_BASE_URL:http://127.0.0.1:8000/v1}}"
      model: "${AMSHA_CLASSIFIER_FOUNDRY_MODEL:qwen3-14b}"
  onnx:
    enabled: ${AMSHA_ONNX_ENABLED:false}
    model-root: "${AMSHA_ONNX_MODEL_ROOT:data/models}"
    max-model-file-bytes: ${AMSHA_ONNX_MAX_MODEL_FILE_BYTES:1073741824}
    max-loaded-models: ${AMSHA_ONNX_MAX_LOADED_MODELS:2}
    max-resident-mb: ${AMSHA_ONNX_MAX_RESIDENT_MB:1024}
    inference-threads: ${AMSHA_ONNX_INFERENCE_THREADS:2}
    queue-capacity: ${AMSHA_ONNX_QUEUE_CAPACITY:64}
    shutdown-grace: ${AMSHA_ONNX_SHUTDOWN_GRACE:PT10S}
    max-input-bytes: ${AMSHA_ONNX_MAX_INPUT_BYTES:262144}
    max-batch-input-bytes: ${AMSHA_ONNX_MAX_BATCH_INPUT_BYTES:1048576}
    max-batch-size: ${AMSHA_ONNX_MAX_BATCH_SIZE:32}
    warmup:
      enabled: ${AMSHA_ONNX_WARMUP_ENABLED:true}
      max-probes: ${AMSHA_ONNX_WARMUP_MAX_PROBES:5}
      timeout: ${AMSHA_ONNX_WARMUP_TIMEOUT:PT3S}
    classifier:
      circuit:
        failure-threshold: ${AMSHA_ONNX_CLASSIFIER_CIRCUIT_FAILURE_THRESHOLD:3}
        cooldown-seconds: ${AMSHA_ONNX_CLASSIFIER_CIRCUIT_COOLDOWN_SECONDS:30}
      # Enables shadow inference and seeds shadow requested state. A ready active
      # implementation registration is still required for effective behavior.
      intent:
        enabled: ${AMSHA_ONNX_CLASSIFIER_INTENT_ENABLED:false}
        model: "${AMSHA_ONNX_CLASSIFIER_INTENT_MODEL:}"
        timeout-seconds: ${AMSHA_ONNX_CLASSIFIER_INTENT_TIMEOUT_SECONDS:2}
      tool-risk:
        enabled: ${AMSHA_ONNX_CLASSIFIER_TOOL_RISK_ENABLED:false}
        model: "${AMSHA_ONNX_CLASSIFIER_TOOL_RISK_MODEL:}"
        timeout-seconds: ${AMSHA_ONNX_CLASSIFIER_TOOL_RISK_TIMEOUT_SECONDS:2}
      answer-quality:
        enabled: ${AMSHA_ONNX_CLASSIFIER_ANSWER_QUALITY_ENABLED:false}
        model: "${AMSHA_ONNX_CLASSIFIER_ANSWER_QUALITY_MODEL:}"
        timeout-seconds: ${AMSHA_ONNX_CLASSIFIER_ANSWER_QUALITY_TIMEOUT_SECONDS:2}
  fs:
    data-dir: "${AMSHA_FS_DATA_DIR:./data/fs}"
    lock-timeout-seconds: 30
    lucene-index-dir: "${AMSHA_FS_LUCENE_INDEX_DIR:lucene-index}"
    vector-dimension: "${AMSHA_FS_VECTOR_DIMENSION:768}"
  delegation:
    max-depth: ${AMSHA_DELEGATION_MAX_DEPTH:3}
  ui:
    skip-onboarding: ${AMSHA_UI_SKIP_ONBOARDING:false}
  bootstrap:
    # Loopback-only owner credential rotation for local development recovery.
    local-recovery-enabled: ${AMSHA_BOOTSTRAP_LOCAL_RECOVERY:false}
  llm:
    provider: ${AMSHA_LLM_PROVIDER:groq}
    profile-routing:
      enabled: ${AMSHA_LLM_PROFILE_ROUTING_ENABLED:false}
    vault-priority: ${AMSHA_LLM_VAULT_PRIORITY:false}
    log-http: ${AMSHA_LLM_LOG_HTTP:false}
    max-retries: ${AMSHA_LLM_MAX_RETRIES:3}
    max-output-tokens: ${AMSHA_LLM_MAX_OUTPUT_TOKENS:8192}
    timeout: ${AMSHA_LLM_TIMEOUT:PT120S}
    temperature: ${AMSHA_LLM_TEMPERATURE:0.1}
    context-window: ${AMSHA_LLM_CONTEXT_WINDOW:128000}
    compact-prompt-enabled: ${AMSHA_LLM_COMPACT_PROMPT_ENABLED:false}
    compact-prompt-max-chars: ${AMSHA_LLM_COMPACT_PROMPT_MAX_CHARS:32000}
    structured-output-mode: ${AMSHA_LLM_STRUCTURED_OUTPUT_MODE:NATIVE}
    circuit-breaker:
      enabled: ${AMSHA_LLM_CIRCUIT_BREAKER_ENABLED:true}
    # Per-persona model routing (P102). Resolution: persona → group → global.
    # Single model:
    #   persona.models:
    #     brahma:
    #       provider: deepseek
    #       model: deepseek-coder-33b
    # Multi-model (failover chain):
    #   persona.models:
    #     brahma:
    #       0:
    #         provider: deepseek
    #         model: deepseek-coder-33b
    #       1:
    #         provider: groq
    #         model: llama-3.3-70b
    #
    # Or via env vars:
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_PROVIDER=deepseek
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_MODEL=deepseek-coder-33b
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_0_PROVIDER=deepseek
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_0_MODEL=deepseek-coder-33b
    group.models:
    persona.models:
    openrouter:
      app-name: "${AMSHA_OPENROUTER_APP_NAME:https://github.com/rsrini7/amsha}"
      site-url: "${AMSHA_OPENROUTER_SITE_URL:https://github.com/rsrini7/amsha}"
    sarvam:
      api-key: "${AMSHA_SARVAM_API_KEY:}"
      base-url: "${AMSHA_SARVAM_BASE_URL:https://api.sarvam.ai/v1}"
      model: "${AMSHA_SARVAM_MODEL:sarvam-105b}"
    opencode:
      api-key: "${AMSHA_OPENCODE_API_KEY:}"
      base-url: "${AMSHA_OPENCODE_BASE_URL:https://opencode.ai/zen/v1}"
      model: "${AMSHA_OPENCODE_MODEL:deepseek-v4-flash-free}"
    huggingface:
      api-key: "${AMSHA_HUGGINGFACE_API_KEY:}"
      base-url: "${AMSHA_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}"
      model: "${AMSHA_HUGGINGFACE_MODEL:meta-llama/Llama-3.3-70B-Instruct}"
    mistral:
      api-key: "${AMSHA_MISTRAL_API_KEY:}"
      base-url: "${AMSHA_MISTRAL_BASE_URL:https://api.mistral.ai/v1}"
      model: "${AMSHA_MISTRAL_MODEL:codestral-latest}"
    cloudflare:
      api-key: "${AMSHA_CLOUDFLARE_API_KEY:}"
      account-id: "${AMSHA_CLOUDFLARE_ACCOUNT_ID:}"
      # Keep braces out of ${ENV:default} — MP Config treats the first '}' as end-of-expression,
      # which otherwise appends a literal "/ai/v1}" and breaks URI parsing.
      unresolved-base-url: "https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1"
      base-url: "${AMSHA_CLOUDFLARE_BASE_URL:${amsha.llm.cloudflare.unresolved-base-url}}"
      model: "${AMSHA_CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
    cohere:
      api-key: "${AMSHA_COHERE_API_KEY:}"
      base-url: "${AMSHA_COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}"
      model: "${AMSHA_COHERE_MODEL:command-r-plus-08-2024}"
    codex:
      api-key: "${AMSHA_CODEX_API_KEY:}"
      base-url: "${AMSHA_CODEX_BASE_URL:https://chatgpt.com/backend-api/codex}"
      model: "${AMSHA_CODEX_MODEL:gpt-5.6-luna}"
    claude-code:
      api-key: "${AMSHA_CLAUDE_CODE_API_KEY:}"
      base-url: "${AMSHA_CLAUDE_CODE_BASE_URL:https://api.anthropic.com}"
      model: "${AMSHA_CLAUDE_CODE_MODEL:claude-sonnet-4-5}"
    agy:
      api-key: "${AMSHA_AGY_API_KEY:}"
      base-url: "${AMSHA_AGY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}"
      model: "${AMSHA_AGY_MODEL:gemini-3.1-flash-lite}"
    kimchi:
      api-key: "${AMSHA_KIMCHI_API_KEY:}"
      base-url: "${AMSHA_KIMCHI_BASE_URL:https://llm.kimchi.dev/openai/v1}"
      model: "${AMSHA_KIMCHI_MODEL:minimax-m3}"
    foundry:
      base-url: "${AMSHA_FOUNDRY_BASE_URL:http://127.0.0.1:8000/v1}"
      model: "${AMSHA_FOUNDRY_MODEL:qwen3-14b}"
  infinite-loop:
    llm:
      providers: ${AMSHA_INFINITE_LOOP_LLM_PROVIDERS:omlx,groq,openrouter}
    compaction:
      providers: ${AMSHA_INFINITE_LOOP_COMPACTION_PROVIDERS:groq,ollama}
    classifier:
      providers: ${AMSHA_INFINITE_LOOP_CLASSIFIER_PROVIDERS:groq,ollama}
    embedding:
      providers: ${AMSHA_INFINITE_LOOP_EMBEDDING_PROVIDERS:ollama}
    cooldown-base-seconds: ${AMSHA_INFINITE_LOOP_COOLDOWN_BASE_SECONDS:30}
    cooldown-max-seconds: ${AMSHA_INFINITE_LOOP_COOLDOWN_MAX_SECONDS:300}
    cooldown-transient-seconds: ${AMSHA_INFINITE_LOOP_COOLDOWN_TRANSIENT_SECONDS:5}
    max-latency-ms: ${AMSHA_INFINITE_LOOP_MAX_LATENCY_MS:60000}
  # Embedding-space values prevent incompatible provider rotation. A provider
  # without an explicit shared space remains provider-bound by default.
  embedding:
    ollama:
      space-id: "${AMSHA_EMBEDDING_OLLAMA_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_OLLAMA_SPACE_REVISION:}"
    jina:
      space-id: "${AMSHA_EMBEDDING_JINA_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_JINA_SPACE_REVISION:}"
    openai:
      space-id: "${AMSHA_EMBEDDING_OPENAI_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_OPENAI_SPACE_REVISION:}"
    onnx:
      model: "${AMSHA_EMBEDDING_ONNX_MODEL:}"
      timeout-seconds: ${AMSHA_EMBEDDING_ONNX_TIMEOUT_SECONDS:5}
      space-id: "${AMSHA_EMBEDDING_ONNX_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_ONNX_SPACE_REVISION:}"
  compaction:
    structured-output-mode: "${AMSHA_COMPACTION_STRUCTURED_OUTPUT_MODE:PROMPT_DIRECTIVE}"
    sarvam:
      api-key: "${AMSHA_COMPACTION_SARVAM_API_KEY:${AMSHA_SARVAM_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_SARVAM_BASE_URL:https://api.sarvam.ai/v1}"
      model: "${AMSHA_COMPACTION_SARVAM_MODEL:sarvam-105b}"
    opencode:
      api-key: "${AMSHA_COMPACTION_OPENCODE_API_KEY:${AMSHA_OPENCODE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_OPENCODE_BASE_URL:https://opencode.ai/zen/v1}"
      model: "${AMSHA_COMPACTION_OPENCODE_MODEL:deepseek-v4-flash-free}"
    huggingface:
      api-key: "${AMSHA_COMPACTION_HUGGINGFACE_API_KEY:${AMSHA_HUGGINGFACE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}"
      model: "${AMSHA_COMPACTION_HUGGINGFACE_MODEL:meta-llama/Llama-3.3-70B-Instruct}"
    mistral:
      api-key: "${AMSHA_COMPACTION_MISTRAL_API_KEY:${AMSHA_MISTRAL_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_MISTRAL_BASE_URL:https://api.mistral.ai/v1}"
      model: "${AMSHA_COMPACTION_MISTRAL_MODEL:codestral-latest}"
    cloudflare:
      api-key: "${AMSHA_COMPACTION_CLOUDFLARE_API_KEY:${AMSHA_CLOUDFLARE_API_KEY:}}"
      account-id: "${AMSHA_COMPACTION_CLOUDFLARE_ACCOUNT_ID:${AMSHA_CLOUDFLARE_ACCOUNT_ID:}}"
      # Do not put {account_id} inside ${ENV:default} — MP Config closes on the first '}'.
      base-url: "${AMSHA_COMPACTION_CLOUDFLARE_BASE_URL:${amsha.llm.cloudflare.unresolved-base-url}}"
      model: "${AMSHA_COMPACTION_CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
    cohere:
      api-key: "${AMSHA_COMPACTION_COHERE_API_KEY:${AMSHA_COHERE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}"
      model: "${AMSHA_COMPACTION_COHERE_MODEL:command-r-plus-08-2024}"
    codex:
      api-key: "${AMSHA_COMPACTION_CODEX_API_KEY:${AMSHA_CODEX_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_CODEX_BASE_URL:https://chatgpt.com/backend-api/codex}"
      model: "${AMSHA_COMPACTION_CODEX_MODEL:gpt-5.6-luna}"
    claude-code:
      api-key: "${AMSHA_COMPACTION_CLAUDE_CODE_API_KEY:${AMSHA_CLAUDE_CODE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_CLAUDE_CODE_BASE_URL:https://api.anthropic.com}"
      model: "${AMSHA_COMPACTION_CLAUDE_CODE_MODEL:claude-sonnet-4-5}"
    agy:
      api-key: "${AMSHA_COMPACTION_AGY_API_KEY:${AMSHA_AGY_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_AGY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}"
      model: "${AMSHA_COMPACTION_AGY_MODEL:gemini-3.1-flash-lite}"
    kimchi:
      api-key: "${AMSHA_COMPACTION_KIMCHI_API_KEY:${AMSHA_KIMCHI_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_KIMCHI_BASE_URL:https://llm.kimchi.dev/openai/v1}"
      model: "${AMSHA_COMPACTION_KIMCHI_MODEL:minimax-m3}"
    foundry:
      base-url: "${AMSHA_COMPACTION_FOUNDRY_BASE_URL:${AMSHA_FOUNDRY_BASE_URL:http://127.0.0.1:8000/v1}}"
      model: "${AMSHA_COMPACTION_FOUNDRY_MODEL:qwen3-14b}"
  agent:
    default-timezone: "${AMSHA_DEFAULT_TIMEZONE:Asia/Kolkata}"
    rate-limit:
      max-auto-retry-seconds: ${AMSHA_AGENT_RATE_LIMIT_MAX_AUTO_RETRY_SECONDS:15}
      default-retry-seconds: ${AMSHA_AGENT_RATE_LIMIT_DEFAULT_RETRY_SECONDS:10}
  rag:
    min-score: 0.01f
    context-chunks: 3
    max-total-chars: 800
    max-chunk-chars: 300
    max-source-chars: 400
    # Embedding vector dimension. nomic-embed-text = 768. mxbai-embed-large = 1024.
    # MUST match the model used by the active embedding provider.
    embed-dimensions: ${AMSHA_EMBED_DIMENSIONS:768}
    # Path where sqlite-vec native lib is extracted/loaded from.
    # The OS-specific extension (.so, .dll) is added automatically.
    vec-extension-path: "${AMSHA_RAG_VEC_PATH:./lib/vec0}"
  auto-seed-secrets: "${AMSHA_AUTO_SEED_SECRETS:false}"
  skills:
    hot-reload: true
    adaptive:
      enabled: ${AMSHA_SKILLS_ADAPTIVE_ENABLED:false}
    default-max-iterations: ${AMSHA_SKILLS_DEFAULT_MAX_ITERATIONS:15}
    skillsjars:
      require-approval-for-sensitive: ${AMSHA_SKILLSJARS_REQUIRE_APPROVAL_FOR_SENSITIVE:true}
  core:
    util:
      json-salvage-max-lines: ${AMSHA_CORE_UTIL_JSON_SALVAGE_MAX_LINES:20}
  security:
    prompt-injection:
      enabled: true
  routing:
    intent-classifier:
      ollama-model: ${AMSHA_INTENT_CLASSIFIER_OLLAMA_MODEL:mistral-small:latest}
      structured-output-mode: ${AMSHA_INTENT_CLASSIFIER_STRUCTURED_OUTPUT_MODE:NATIVE}
      ollama-fallback:
        enabled: ${AMSHA_INTENT_CLASSIFIER_OLLAMA_FALLBACK_ENABLED:false}
      sla-warn-ms: 2000
  memory:
    compaction:
      enabled: true
      threshold: 10
      keep-recent: 5
      max-output-tokens: 1024
      max-chars: 96000
      max-backoff-ms: ${AMSHA_MEMORY_COMPACTION_MAX_BACKOFF_MS:60000}
    tiered:
      enabled: ${AMSHA_MEMORY_TIERED_ENABLED:false}
      backend: ${AMSHA_MEMORY_TIERED_BACKEND:sqlite}
      core-memory:
        enabled: ${AMSHA_MEMORY_CORE_ENABLED:false}
        max-blocks-per-user: ${AMSHA_MEMORY_CORE_MAX_BLOCKS_PER_USER:20}
        max-chars-per-block: ${AMSHA_MEMORY_CORE_MAX_CHARS_PER_BLOCK:2000}
      recall:
        enabled: ${AMSHA_MEMORY_RECALL_ENABLED:false}
        retention-days: ${AMSHA_MEMORY_RECALL_RETENTION_DAYS:90}
        max-search-results: ${AMSHA_MEMORY_RECALL_MAX_SEARCH_RESULTS:10}
        cross-session-search: ${AMSHA_MEMORY_RECALL_CROSS_SESSION:true}
      archival:
        enabled: ${AMSHA_MEMORY_ARCHIVAL_ENABLED:false}
        max-search-results: ${AMSHA_MEMORY_ARCHIVAL_MAX_SEARCH_RESULTS:8}
        hybrid-search-k: ${AMSHA_MEMORY_ARCHIVAL_HYBRID_K:60}
        confidence-threshold: ${AMSHA_MEMORY_ARCHIVAL_CONFIDENCE_THRESHOLD:0.6}
        eviction:
          low-confidence-days: ${AMSHA_MEMORY_ARCHIVAL_LOW_CONFIDENCE_DAYS:60}
          low-confidence-threshold: ${AMSHA_MEMORY_ARCHIVAL_LOW_CONFIDENCE_THRESHOLD:0.5}
          lru-min-access-count: ${AMSHA_MEMORY_ARCHIVAL_LRU_MIN_ACCESS_COUNT:1}
          lru-max-age-days: ${AMSHA_MEMORY_ARCHIVAL_LRU_MAX_AGE_DAYS:90}
    prompt-budget:
      max-core-memory-tokens: ${AMSHA_MEMORY_PROMPT_BUDGET_CORE_TOKENS:800}
      max-compaction-summary-tokens: ${AMSHA_MEMORY_PROMPT_BUDGET_COMPACTION_TOKENS:1200}
      max-prefetched-archival-results: ${AMSHA_MEMORY_PROMPT_BUDGET_ARCHIVAL_RESULTS:3}
      max-directives: ${AMSHA_MEMORY_PROMPT_BUDGET_DIRECTIVES:5}
      total-non-conversation-tokens: ${AMSHA_MEMORY_PROMPT_BUDGET_TOTAL_TOKENS:2500}
    governance:
      core-writes-per-minute: ${AMSHA_MEMORY_GOVERNANCE_CORE_WRITES_PER_MINUTE:5}
      archival-writes-per-hour: ${AMSHA_MEMORY_GOVERNANCE_ARCHIVAL_WRITES_PER_HOUR:10}
    retention:
      enabled: ${AMSHA_MEMORY_RETENTION_ENABLED:true}
      recall-retention-days: ${AMSHA_MEMORY_RETENTION_RECALL_RETENTION_DAYS:30}
      archival-eviction-threshold: ${AMSHA_MEMORY_RETENTION_ARCHIVAL_EVICTION_THRESHOLD:0.3}
      archival-min-age-days: ${AMSHA_MEMORY_RETENTION_ARCHIVAL_MIN_AGE_DAYS:30}
    chat:
      recovered-observation-max-chars: ${AMSHA_CHAT_RECOVERED_OBSERVATION_MAX_CHARS:2000}
      tool-specific-limits:
        github_search: 10000
        read_file: 8000
      web_search: 5000
  chat-memory:
    max-messages: ${AMSHA_CHAT_MEMORY_MAX_MESSAGES:20}
    retention-days: ${AMSHA_CHAT_MEMORY_RETENTION_DAYS:30}
  session-catalog:
    archive-after-days: ${AMSHA_SESSION_CATALOG_ARCHIVE_AFTER_DAYS:90}
  self-evolve:
    enabled: ${AMSHA_SELF_EVOLVE_ENABLED:false}
    backend: ${AMSHA_SELF_EVOLVE_BACKEND:sqlite}
    buffer-size: ${AMSHA_SELF_EVOLVE_BUFFER_SIZE:50}
    default-search-limit: ${AMSHA_SELF_EVOLVE_DEFAULT_SEARCH_LIMIT:8}
    directives-enabled: ${AMSHA_SELF_EVOLVE_DIRECTIVES_ENABLED:true}
    synthesis-trigger: "${AMSHA_SELF_EVOLVE_SYNTHESIS_TRIGGER:manual}"
    flush:
      max-events: ${AMSHA_SELF_EVOLVE_FLUSH_MAX_EVENTS:12}
      idle-ms: ${AMSHA_SELF_EVOLVE_FLUSH_IDLE_MS:300000}
  api:
    keys:
      internal: "${AMSHA_API_KEYS_INTERNAL:key-internal-changeme}"
      ci: "${AMSHA_API_KEYS_CI:key-ci-changeme}"
    rate-limit:
      requests-per-minute: 60
      mutation-per-minute: 10
  
  tools:
    # Per-category thread pool isolation to prevent cross-category starvation.
    # Discovered MCP tools default to network; register_mcp_server can assign
    # NETWORK, COMPUTE, DATABASE, or INTERNAL for all tools from that server.
    bulkhead:
      network:
        max-async: 8
        max-queued: 20
      compute:
        max-async: 4
        max-queued: 10
      database:
        max-async: 6
        max-queued: 20
      internal:
        max-async: 20
        max-queued: 100
    brave:
      api-key: "${AMSHA_TOOLS_BRAVE_API_KEY:none}"
    serper:
      api-key: "${AMSHA_TOOLS_SERPER_API_KEY:none}"
    github:
      repos-per-page: ${AMSHA_GITHUB_REPOS_PER_PAGE:100}
    playwright:
      enabled: "${AMSHA_TOOLS_PLAYWRIGHT_ENABLED:false}"
      timeout-ms: 30000
      headless: "${AMSHA_TOOLS_PLAYWRIGHT_HEADLESS:true}"
      # MCP Server mode — uses official @playwright/mcp via STDIO, falls back to CLI
      mcp-enabled: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_ENABLED:false}"
      mcp-headless: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_HEADLESS:true}"
      mcp-command: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_COMMAND:npx}"
      mcp-args: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_ARGS:@playwright/mcp}"

    # Direct-host execution grant list for diagnostic skills that cannot work
    # inside the Podman sandbox (e.g. JDB attaching to host JVMs).
    host-exec:
      skills: "${AMSHA_TOOLS_HOST_EXEC_SKILLS:jdb-debugger}"
      max-output-chars: "${AMSHA_HOST_EXEC_MAX_OUTPUT_CHARS:${AMSHA_SANDBOX_MAX_OUTPUT_CHARS:8192}}"
      python-executable: "${AMSHA_HOST_EXEC_PYTHON_EXECUTABLE:${AMSHA_SANDBOX_PYTHON_EXECUTABLE:}}"
      java-executable: "${AMSHA_HOST_EXEC_JAVA_EXECUTABLE:${AMSHA_SANDBOX_JAVA_EXECUTABLE:}}"
      go-executable: "${AMSHA_HOST_EXEC_GO_EXECUTABLE:${AMSHA_SANDBOX_GO_EXECUTABLE:}}"

  hitl:
    pre-executable-tools: ""   # (§75-A1) comma-separated tool names
    delegate-approver-ids: ""  # (§75-B1) comma-separated user IDs
    timeout-hours: 24

  mcp:
    exposed-tools:
      - github
      - recall_memory_search
      - archival_memory_search
    server-enabled: true
    setup-token-secret: ${AMSHA_MCP_SETUP_TOKEN_SECRET:}
    setup-ui-base-url: ${AMSHA_MCP_SETUP_UI_BASE_URL:}
    health-check-interval-ms: ${AMSHA_MCP_HEALTH_CHECK_INTERVAL_MS:15000}
    podman:
      health-check-interval-ms: ${AMSHA_MCP_PODMAN_HEALTH_CHECK_INTERVAL_MS:15000}

  retry:
    default-delay-ms: ${AMSHA_RETRY_DEFAULT_DELAY_MS:30000}

  cron:
    poll-interval: 30s
    max-concurrent: 10
    max-iterations: 3
    max-lookback-window: PT5M
    list-retention-hours: 24
    startup-delay-ms: ${AMSHA_CRON_STARTUP_DELAY_MS:5000}

  channel:
    telegram:
      enabled: "${AMSHA_TELEGRAM_ENABLED:false}"
      bot-token: ${TELEGRAM_BOT_TOKEN:mock-telegram-token}
      default-autonomy-level: SUPERVISED
      allowed-user-ids: "${AMSHA_TELEGRAM_ALLOWED_USER_IDS:}"
      allowed-users: "${AMSHA_TELEGRAM_ALLOWED_USERS:mock-telegram-user}"
      silent-block: false
      block-response: "⛔ Access denied."
      max-length: ${AMSHA_CHANNEL_TELEGRAM_MAX_LENGTH:4096}
    web:
      enabled: "${AMSHA_WEB_ENABLED:true}"
      require-auth: "${AMSHA_WEB_REQUIRE_AUTH:false}"

  pii:
    mode: "${AMSHA_PII_MODE:REDACT_AND_FORWARD}"   # Options: REDACT_AND_FORWARD (default), BLOCK_AND_NOTIFY

  vault:
    pepper: "${AMSHA_VAULT_PEPPER:dev-pepper-not-for-production-0000000000000000000000000000}"
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1
    rotation:
      enabled: true
      interval-hours: 24

  workspace:
    root-dir: "${AMSHA_DATA_DIR:./data}/workspaces"
    session-ttl-minutes: 30
    gc-interval: "5m"
    heartbeat-interval: "60s"

  recovery:
    stalled-threshold-minutes: 15

  resumption:
    stale-mark-seconds: ${AMSHA_RESUMPTION_STALE_MARK_SECONDS:60}
    playwright-stale-mark-seconds: ${AMSHA_TOOLS_PLAYWRIGHT_RESUMPTION_STALE_MARK_SECONDS:300}

  checkpoint:
    stale-claim-minutes: ${AMSHA_CHECKPOINT_STALE_CLAIM_MINUTES:2}

  audit:
    hmac-key: "${AMSHA_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
    idle-timeout-ms: ${AMSHA_AUDIT_IDLE_TIMEOUT_MS:10000}
  auth:
    hmac-key: "${AMSHA_AUTH_HMAC_KEY:dev-auth-hmac-key-min-32-bytes-0000000}"

  governance:
    # Floor applied ONLY when LLM provider returns 0 input AND 0 output tokens.
    # This indicates the provider omitted token counts entirely (a known side
    # effect of certain log-requests=false configurations), not a valid zero-output
    # response. Set to 1 to disable the floor effect while keeping the warning.
    # A partial zero (e.g., 3 input, 0 output) is a valid API response and is
    # NOT subject to this floor.
    min-tokens-per-call: 10
    token-limit: 100000
    budget-usd: "${AMSHA_BUDGET_LIMIT:999.00}"
    action-on-exceed: "${AMSHA_BUDGET_ACTION:READONLY}"
    price-per-1k-input: 0.003
    price-per-1k-output: 0.015
    approval-timeout-minutes: 60 # must be >> gc-interval converted to minutes
    rate-limit-backoff-seconds: 30

  observability:
    phoenix:
      enabled: "${AMSHA_PHOENIX_ENABLED:true}"
      endpoint: "${AMSHA_PHOENIX_ENDPOINT:http://localhost:4318/v1/traces}"

  sandbox:
    enabled: "${AMSHA_SANDBOX_ENABLED:true}"
    strategy: "${AMSHA_SANDBOX_STRATEGY:PODMAN}"
    podman-path: "${AMSHA_SANDBOX_PODMAN_PATH:podman}"
    podman-image: "${AMSHA_SANDBOX_PODMAN_IMAGE:localhost/amsha-tool-runner:latest}"
    timeout-seconds: "${AMSHA_SANDBOX_TIMEOUT_SECONDS:30}"
    network-timeout-seconds: "${AMSHA_SANDBOX_NETWORK_TIMEOUT_SECONDS:60}"
    network: "${AMSHA_SANDBOX_NETWORK:host}"
    tool-runner-user: "${AMSHA_SANDBOX_USER:sandbox}"
    memory-limit: "${AMSHA_SANDBOX_MEMORY_LIMIT:512m}"
    cpu-limit: "${AMSHA_SANDBOX_CPU_LIMIT:0.5}"
    max-output-chars: ${AMSHA_SANDBOX_MAX_OUTPUT_CHARS:8192}
    # Executable overrides (auto-discovered on host PATH if omitted)
    python-executable: "${AMSHA_SANDBOX_PYTHON_EXECUTABLE:}"
    go-executable: "${AMSHA_SANDBOX_GO_EXECUTABLE:}"
    java-executable: "${AMSHA_SANDBOX_JAVA_EXECUTABLE:}"
    allow-insecure-fallback: "${AMSHA_SANDBOX_ALLOW_INSECURE_FALLBACK:false}"
    circuit-breaker:
      failure-threshold: ${AMSHA_SANDBOX_CB_FAILURE_THRESHOLD:3}   # was 2; gives LLM one retry for param errors
      reset-timeout-seconds: ${AMSHA_SANDBOX_CB_RESET_TIMEOUT_SECONDS:30}

  autonomy:
    default-level: SUPERVISED

  agents:
    roles:
      - name: coordinator
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Vishnu - Preserver and Captain/Coordinator - task decomposition and synthesis"
      - name: researcher
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Saraswati - Research & Knowledge, Wisdom, and Facts - real-time search and evidence"
      - name: coder
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Brahma - Math/Code Creator and Logic Expert - rigorous validation"
      - name: debugger
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Shiva - Creative, Transformer and Balance Expert - blind-spot detection"
      - name: architect
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Brihaspati - Guru of the Devas, System Designer and Standards Author - ADRs and architectural trade-offs"
      - name: synthesizer
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Dattatreya - Synthesizer and Avadhuta - multi-agent conflict resolution and integration"
      - name: optimizer
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Ganesha - Obstacle Remover, Complex Logic and Problem-Solving (son of Shiva)"
      - name: sentinel
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Kartikeya - Sentinel, Security Scanning and Input Validation (son of Shiva)"
      - name: healer
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Lakshmi - Healer, Error Recovery and Token Budget Optimization (wife of Vishnu)"
      - name: protector
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Durga - Protector, Policy Enforcement and Guardrails (form of Parvati)"
      - name: purifier
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Kali - Purifier, Cleanup and Resource Lifecycle Management (form of Parvati)"
      - name: nurturer
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Parvati - Nurturer, Empathy and Tone Analysis (wife of Shiva)"        

# =============================================================================
# MICROPROFILE CONTEXT PROPAGATION
# =============================================================================
mp:
  context:
    # CRITICAL: propagate CDI context across ManagedExecutor/Vert.x threads
    # Without this, @WorkspaceScoped beans are null on worker threads.
    propagators: "Quarkus, CDI, JAX-RS"

# =============================================================================
# PROFILES
# =============================================================================

"%cli":
  quarkus:
    log:
      console:
        enabled: false
      level: ERROR
      category:
        "io.quarkus":
          level: ERROR     # Silences "Started in...", "Installed features..."
        "io.smallrye.config":
          level: ERROR     # Silences "Unrecognized configuration key..."
        "io.quarkus.agroal":
          level: ERROR     # Silences "Agroal does not support..."
        "com.amsha":
          level: DEBUG
      file:
        enabled: true
        path: ./amsha-cli.log
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [sid=%X{sessionId}] [trace=%X{traceId}] [span=%X{spanId}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
    banner:
      enabled: false
    mcp:
      server:
        stdio:
          enabled: false
  amsha:
    telegram:
      enabled: false
    policy:
      governance:
        # Tools that bypass HITL approval in SUPERVISED mode.
        # garuda is exempt because delegation is the coordinator's primary function —
        # blocking it at SUPERVISED level creates a dead-end (coordinator can't delegate,
        # can't code-gen, can only FINISH with no result).
        hitl-exempt-tools: ${AMSHA_HITL_EXEMPT_TOOLS:schedule_task,manage_schedule}

"%dev":
  quarkus:
    flyway:
      clean-at-start: ${AMSHA_FLYWAY_CLEAN_AT_START:true}   # set to false to keep existing data across restarts
    mcp:
      server:
        stdio:
          enabled: false
    log:
      level: INFO                          # set to INFO to avoid infrastructure flood
      console:
        enabled: false
      file:
        enabled: true
        path: ./amsha-dev.log
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [sid=%X{sessionId}] [trace=%X{traceId}] [span=%X{spanId}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
    console:
      enabled: false
    live-reload:
      enabled: false
    otel:
      sdk:
        disabled: "${OTEL_SDK_DISABLED:false}"
    langchain4j:
      ollama:
        chat-model:
          log-requests: "${amsha.debug.llm:false}"
          log-responses: "${amsha.debug.llm:false}"
      openai:
        chat-model:
          log-requests: "${amsha.debug.llm:false}"
          log-responses: "${amsha.debug.llm:false}"

  amsha:
    pii:
      mode: "${AMSHA_PII_MODE:REDACT_AND_FORWARD}"   # Dev - same as prod, see redacted output
    sandbox:
      strategy: NONE        # no Podman in local dev
    governance:
      budget-usd: 9.99
      approval-timeout-minutes: 10
    vault:
      pepper: "dev-pepper-not-for-production-0000000000000000000000000000"
    debug:
      llm: true
    metadata:
      environment: dev

"%test":
  quarkus:
    mcp:
      server:
        stdio:
          enabled: false
    opentelemetry:
      enabled: false
    smallrye-fault-tolerance:
      enabled: false
    datasource:
      jdbc:
        url: "jdbc:sqlite:target/test-audit.db"
    flyway:
      migrate-at-start: true
      baseline-on-migrate: true
      locations: db/migration/sqlite
      clean-at-start: true   # tests always need a clean schema
    log:
      category:
        "com.amsha":
          level: INFO
        "com.arjuna":
          level: ERROR
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false

  amsha:
    data-dir: "target/"
    llm:
      model: "test-model"
    agent:
      default-timezone: "UTC"
    rag:
      vec-extension-path: "target/lib/vec0"
    skills:
      hot-reload: false
    memory:
      compaction:
        max-output-tokens: 1024
        enabled: false
        threshold: 4
        keep-recent: 2
    security:
      prompt-injection:
        enabled: true
    audit:
      hmac-key: "${AMSHA_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
    auth:
      hmac-key: "${AMSHA_AUTH_HMAC_KEY:dev-auth-hmac-key-min-32-bytes-0000000}"
    session:
      idle-timeout-minutes: ${AMSHA_AUTH_SESSION_IDLE_MINUTES:720}
      rotation-grace-seconds: ${AMSHA_AUTH_SESSION_ROTATION_GRACE_SECONDS:30}
    channel:
      telegram:
        enabled: false
        bot-token: "mock-bot-token"
        allowed-users: ""
    pii:
      mode: "${AMSHA_PII_MODE:REDACT_AND_FORWARD}"   # Tests use default
    sandbox:
      strategy: NONE
    vault:
      pepper: "test-pepper-00000000000000000000000000000000"
    mcp:
      server-enabled: false
    cron:
      max-lookback-window: PT999H
    recovery:
      stalled-threshold-minutes: 15
    tools:
      # Slow tools that should be isolated to the 'external-tool-executor' bulkhead (§T5-2)
      external-tools: "browser_navigate,web_search"
    parallel:
      tool-timeout-seconds: 60
    notification:
      retry:
        attempts: 3
        initial-delay-ms: 1000


"%staging":
  quarkus:
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false

  amsha:
    governance:
      budget-usd: 50.00
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED

"%prod":
  quarkus:
    # native:
    #   enabled: true
    langchain4j:
      ollama:
        chat-model:
          log-requests: false
          log-responses: false
      openai:
        chat-model:
          log-requests: false
          log-responses: false
    log:
      level: INFO
  amsha:
    data-dir: "${AMSHA_DATA_DIR:./data}"
    # Embedding provider list for native binary builds.
    # Jina is the recommended embedding provider for native images since Ollama
    # native HTTP client has compatibility issues. Configure per-provider keys
    # under amsha.embedding.{provider}.{key} (see .env.example).
    infinite-loop:
      embedding:
        providers: jina,ollama
    agent:
      max-ratelimit-retries: ${AMSHA_AGENT_MAX_RATELIMIT_RETRIES:3}
      schema-correction:
        max-retries-strict: ${AMSHA_AGENT_SCHEMA_CORRECTION_MAX_RETRIES_STRICT:4}
        max-retries-lenient: ${AMSHA_AGENT_SCHEMA_CORRECTION_MAX_RETRIES_LENIENT:6}
    workspace:
      root-dir: "${AMSHA_DATA_DIR:./data}/workspaces"
    sandbox:
      strategy: PODMAN
    autonomy:
      default-level: SUPERVISED
    auth:
      idp:
        oidc:
          enabled: ${AMSHA_AUTH_IDP_OIDC_ENABLED:false}
          client-id: "${AMSHA_AUTH_IDP_OIDC_CLIENT_ID:}"
          client-secret: "${AMSHA_AUTH_IDP_OIDC_CLIENT_SECRET:}"
          client-secret-vault-key: "${AMSHA_AUTH_IDP_OIDC_CLIENT_SECRET_VAULT_KEY:}"
          authorization-url: "${AMSHA_AUTH_IDP_OIDC_AUTHORIZATION_URL:}"
          token-url: "${AMSHA_AUTH_IDP_OIDC_TOKEN_URL:}"
          userinfo-url: "${AMSHA_AUTH_IDP_OIDC_USERINFO_URL:}"
          issuer: "${AMSHA_AUTH_IDP_OIDC_ISSUER:}"
          jwks-url: "${AMSHA_AUTH_IDP_OIDC_JWKS_URL:}"
          redirect-uri: "${AMSHA_AUTH_IDP_OIDC_REDIRECT_URI:}"
        github:
          enabled: ${AMSHA_AUTH_IDP_GITHUB_ENABLED:false}
          client-id: "${AMSHA_AUTH_IDP_GITHUB_CLIENT_ID:}"
          client-secret: "${AMSHA_AUTH_IDP_GITHUB_CLIENT_SECRET:}"
          redirect-uri: "${AMSHA_AUTH_IDP_GITHUB_REDIRECT_URI:}"

# =============================================================================
# ALTERNATIVE PERSISTENCE BACKENDS
# =============================================================================
# Default is SQLite (no profile switch needed).
# For PostgreSQL: mise run dev:pg  (auto-starts Podman container)
# Or manually:    mise run db:pg:start && mvn quarkus:dev -Dquarkus.profile=postgresql
#
# Flyway migrations are dialect-specific (owned by adapter modules):
#   persistence-sqlite/   → db/migration/sqlite/     (SQLite, default)
#   persistence-postgres/ → db/migration/postgresql/ (PostgreSQL, %postgresql profile)
# PostgreSQL vector search requires the pgvector extension on the server (installed via V2 migration).
# Only ONE persistence adapter should be on the classpath at a time to avoid CDI ambiguity.
# ---------------------------------------------------------------------------

"%postgresql":
  amsha:
    persistence:
      backend: postgres
    memory:
      tiered:
        backend: postgres
  quarkus:
    datasource:
      db-kind: postgresql
      username: "${AMSHA_PG_USER:amsha}"
      password: "${AMSHA_PG_PASSWORD:changeme}"
      jdbc:
        url: "jdbc:postgresql://${AMSHA_PG_HOST:localhost}:${AMSHA_PG_PORT:5432}/${AMSHA_PG_DB:amsha}"
        min-size: 2
        max-size: 10
        transactions: disabled
        background-validation-interval: PT30S
        validation-query-sql: "SELECT 1"
        acquisition-timeout: 30
    flyway:
      migrate-at-start: true
      baseline-on-migrate: true
      locations: db/migration/postgresql
      clean-at-start: ${AMSHA_FLYWAY_CLEAN_AT_START:true}
    log:
      console:
        enabled: false
      level: INFO
      file:
        enabled: true
        path: "./amsha-pg.log"
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [sid=%X{sessionId}] [trace=%X{traceId}] [span=%X{spanId}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3

"%filesystem":
  amsha:
    persistence:
      backend: fs
    memory:
      tiered:
        backend: fs
  quarkus:
    datasource:
      enabled: false
    flyway:
      enabled: false
    log:
      console:
        enabled: false
      level: INFO
      file:
        enabled: true
        path: "./amsha-fs.log"
        level: DEBUG
        format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [sid=%X{sessionId}] [trace=%X{traceId}] [span=%X{spanId}] (%t) %s%e%n"
        rotation:
          max-file-size: 20M
          max-backup-index: 3
