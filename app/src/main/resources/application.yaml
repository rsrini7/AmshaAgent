# =============================================================================
# Amsha Agent V0.1.0 - Full Application Configuration
# Never hardcode secrets here. Use env vars or Kubernetes Secrets.
# =============================================================================

quarkus:
  shutdown:
    timeout: 30S
  mcp:
    server:
      stdio:
        enabled: false
  websockets-next:
    server:
      max-frame-size: 37748736
      max-message-size: 37748736
  vertx:
    prefer-native-transport: true
    use-async-dns: true
    resolver:
      cache-max-time-to-live: 300
      cache-negative-time-to-live: 0

  application:
    name: amsha
    version: "0.1.0"
  
  banner:
    enabled: true
    path: amsha-banner.txt
  
  index-dependency:
    amsha-core:
      group-id: com.amsha
      artifact-id: amsha-core
    amsha-channel-api:
      group-id: com.amsha
      artifact-id: amsha-channel-api
    amsha-channel-telegram:
      group-id: com.amsha
      artifact-id: amsha-channel-telegram
    amsha-channel-web:
      group-id: com.amsha
      artifact-id: amsha-channel-web
    amsha-rag:
      group-id: com.amsha
      artifact-id: amsha-rag
    amsha-mcp:
      group-id: com.amsha
      artifact-id: amsha-mcp
    amsha-llm-provider-api:
      group-id: com.amsha
      artifact-id: amsha-llm-provider-api
    amsha-llm-providers:
      group-id: com.amsha
      artifact-id: amsha-llm-providers
    amsha-sandbox:
      group-id: com.amsha
      artifact-id: amsha-sandbox
    amsha-security:
      group-id: com.amsha
      artifact-id: amsha-security
    amsha-memory:
      group-id: com.amsha
      artifact-id: amsha-memory
    amsha-skills:
      group-id: com.amsha
      artifact-id: amsha-skills
    amsha-tools-builtin:
      group-id: com.amsha
      artifact-id: amsha-tools-builtin
    amsha-self-evolve:
      group-id: com.amsha
      artifact-id: amsha-self-evolve
    amsha-tool-api:
      group-id: com.amsha
      artifact-id: amsha-tool-api
    amsha-classifier-api:
      group-id: com.amsha
      artifact-id: amsha-classifier-api
    amsha-security-api:
      group-id: com.amsha
      artifact-id: amsha-security-api
    amsha-persistence-api:
      group-id: com.amsha
      artifact-id: amsha-persistence-api

  devservices:
    enabled: false
  
  swagger-ui:
    path: /q/swagger-ui
    always-include: true

  # ---------------------------------------------------------------------------
  # HTTP / REST
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    ssl-port: 8443
    websocket-server:
      max-frame-size: 37748736
    cors:
      enabled: true
      origins: "${AMSHA_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}"
      headers: "X-Amsha-API-Key,X-AMSHA-API-KEY,X-AMSHA-PLATFORM-ID,Content-Type,Accept"
      methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    limits:
      max-body-size: 36M

  rest:
    path: /api/v1   # all /sessions endpoints served at /api/v1/sessions

  # ---------------------------------------------------------------------------
  # DATABASE — SQLite (default). Switch to PostgreSQL via %postgresql profile.
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:${AMSHA_DATA_DIR:./data}/amsha-meta.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&transaction_mode=IMMEDIATE"
      # pool-interceptor: com.amsha.core.persistence.FtsConnectionInterceptor
      min-size: 1
      #Connection 1 = JTA transaction writes (approval/deny)
      #Connection 2 = AsyncPersistenceEngine audit/telemetry writes
      #Connection 3 = for REQUIRES_NEW under concurrent approval + async audit drain
      max-size: 3
      transactions: enabled
      # ✅ ADD THESE - validates connections before handing back to callers
      # prevents broken/post-BUSY connections from being reused (the cron cascade fix)
      background-validation-interval: PT30S
      validation-query-sql: "SELECT 1"
      # Discard connections that Narayana has marked broken after XA failures
      idle-removal-interval: PT60S
      acquisition-timeout: 60 # ← seconds, default is often 5
      # This must be LONGER than SQLite busy_timeout (10s)
      # so Agroal waits for SQLite to release before giving up

  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    # SQLite migrations live under db/migration/sqlite/
    # PostgreSQL (when activated via -Dquarkus.profile=postgresql) uses db/migration/postgresql/
    locations: db/migration/sqlite

  # ---------------------------------------------------------------------------
  # LANGCHAIN4J
  # ---------------------------------------------------------------------------
  langchain4j:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding-model:
        log-requests: false
        log-responses: false
      chat-model:
        model-id: ${OLLAMA_MODEL:mistral-small:latest}
        temperature: 0.7
        log-requests: false
        log-responses: false
        enabled: false
    openai:
      timeout: 120s
      max-retries: 3
      chat-model:
        enabled: false
      embedding-model:
        enabled: false
    anthropic:
      chat-model:
        enabled: false

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  otel:
    enabled: true
    sdk:
      disabled: "${OTEL_SDK_DISABLED:false}"  # default on - set OTEL_SDK_DISABLED=true to disable
    exporter:
      otlp:
        endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}"
        protocol: grpc
    resource:
      attributes: "deployment.environment=${AMSHA_ENV:development},service.name=amsha"
    traces:
      enabled: true
      sampler: always_on

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  smallrye-health:
    ui:
      enabled: true

  # ---------------------------------------------------------------------------
  # SCHEDULER
  # ---------------------------------------------------------------------------
  scheduler:
    enabled: true
    metrics:
      enabled: true

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS
  # ---------------------------------------------------------------------------
  virtual-threads:
    enabled: true
  thread-pool:
    core-threads: 1   # minimize platform threads; virtual threads handle concurrency


  # ---------------------------------------------------------------------------
  # LOGGING
  # ---------------------------------------------------------------------------
  log:
    category:
      "dev.langchain4j.model.chat.listener.ListenersUtil":
        level: ERROR
      "com.amsha":
        level: DEBUG
      "com.amsha.core.agent.loop.AgentStateMachineRunner":
        level: WARN       # ← suppress goal logging noise (isInfoEnabled guard handles the rest)
      "com.amsha.sandbox.PodmanContainerExecutor":
        level: WARN       # ← suppress container start/stop/exec noise
      "org.jboss.resteasy.reactive.server.handlers.PublisherResponseHandler":
        level: ERROR
      "io.quarkus":
        level: INFO
      "org.apache.camel.component.telegram":
        level: INFO
      "io.smallrye.faulttolerance":
        level: INFO
      "io.sm.op.ru.util":
        level: INFO
      "io.quarkus.opentelemetry.runtime.exporter.otlp":
        level: ERROR      # suppress connection-refused noise when collector is down
      "io.quarkus.opentelemetry.runtime.exporter.otlp.sender":
        level: ERROR      # suppress VertxGrpcSender warnings
      "ja.la.ProcessBuilder":
        level: INFO
      "java.lang.ProcessBuilder":
        level: WARN       # ← suppress DEBUG noise from sqlite-jdbc uname probe
      "org.sqlite":
        level: WARN       # ← suppress all sqlite-jdbc debug output
      "java.lang":
        level: WARN

      "dev.langchain4j.internal.RetryUtils":
        level: ERROR
      "org.jboss.resteasy.reactive.common.core.AbstractResteasyReactiveContext":
        level: ERROR  # suppress the unrecoverable exception noise at DEBUG
      "jdk.event.security":
        level: "OFF"  # suppress SSL cert flood
      "io.netty.handler.ssl":
        level: INFO
      "org.apache.camel.component.telegram.TelegramConsumer":
        level: ERROR
      # Telegram polling retries are handled by Camel's backoff policy. Keep
      # expected transient outages quiet while preserving ERROR diagnostics.
      "com.amsha.channel.telegram.TelegramChannelRoute":
        level: ERROR
      "org.apache.camel":
        level: INFO
      "io.netty":
        level: WARN
      "io.opentelemetry":
        level: WARN
      "org.infinispan":
        level: WARN
      "org.jboss.resteasy.reactive.common.core":
        level: WARN
      "jakarta.json.spi":
        level: "OFF"
      "io.netty.resolver.dns.DirContextUtils":
        level: WARN
      "io.smallrye.config":
        level: INFO
      "io.micrometer":
        level: INFO
      "io.vertx":
        level: INFO
      "io.quarkus.arc":
        level: INFO
      "io.smallrye.context.jta.context.provider.JtaContextProvider":
        level: WARN
      "com.arjuna.ats.arjuna":
        level: ERROR
    console:
      enabled: ${AMSHA_LOG_CONSOLE_ENABLED:false}
      level: INFO
      # sessionId from MDC rendered in every log line (Fix C4)
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [sid=%X{sessionId}] (%t) %s%e%n"
      darken: 0
      filter: secret-redaction
    file:
      enabled: true
      path: "./amsha-prod-sqlite.log"
      level: DEBUG
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [sid=%X{sessionId}] [trace=%X{traceId}] [span=%X{spanId}] (%t) %s%e%n"
      filter: secret-redaction
      rotation:
        max-file-size: 20M
        max-backup-index: 3

# =============================================================================
# AMSHA APPLICATION CONFIG
# Embedding providers are configured via `amsha.infinite-loop.embedding.providers`
# with per-provider keys under `amsha.embedding.{provider}.{key}`.
# See .env.example for full details.
# =============================================================================
smallrye:
  context-propagation:
    managed-executor:
      max-async: 20

  transaction-manager:
    default-transaction-timeout: 300
    enable-recovery: false

  # ---------------------------------------------------------------------------
  # INPUT VALIDATION
  # ---------------------------------------------------------------------------
  hibernate-validator:
    fail-fast: true

  # ---------------------------------------------------------------------------
  # OPENAPI
  # ---------------------------------------------------------------------------
  smallrye-openapi:
    info-title: "Amsha Agent API"
    info-version: "0.1.0"
    info-description: "Autonomous multi-agent framework - Java 21 + Quarkus + LangChain4J"
    store-schema-directory: target
    schema-filename: openapi
    open-api-version: 3.0.3


  # ---------------------------------------------------------------------------
  # NATIVE IMAGE
  # ---------------------------------------------------------------------------
  native:
    # Set encoding to UTF-8 for Windows console support (§Cosmetic-Fix)
    additional-build-args: "-Dfile.encoding=UTF-8,-Dstdout.encoding=UTF-8"
    # QuarkusJsonCodecFactory$ObjectMapperHolder must initialize at RUN time:
    # its static mapper pulls the container ObjectMapper and registers the
    # LangChain4j ChatMessage mixins. Build-time init freezes a mixin-less
    # mapper -> native writes type-less chat-memory JSON that its own reader
    # then rejects (InvalidTypeIdException, missing 'type').
    initialize-at-runtime: io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$ObjectMapperHolder
    # native-image-xmx: 4g # require 8GB machine with podman
    resources:
      includes:
        - "META-INF/services/*"
        - "META-INF/native-image/**"
        - "META-INF/skills/**"
        - "skills/**"
        - "templates/**"
        - "prompts/**"
        - "env-example"
        - "native/vec0/**"
        - "provider-catalog.json"
        # The versioned decision-evidence corpus. Quarkus includes no resources by default, so a
        # classpath corpus is absent from a native image unless it is named here (and in app/pom.xml's
        # native profile). See DecisionEvidenceCorpusRegistry.
        - "decision-evidence/**"
amsha:
  data-dir: "${AMSHA_DATA_DIR:./data}"
  github:
    app-id: "${AMSHA_GITHUB_APP_ID:none}"
  test-data-collection:
    enabled: ${AMSHA_TEST_DATA_COLLECTION_ENABLED:false}
  classifier:
    shadow:
      threads: ${AMSHA_CLASSIFIER_SHADOW_THREADS:2}
      queue-capacity: ${AMSHA_CLASSIFIER_SHADOW_QUEUE_CAPACITY:64}
      shutdown-grace: ${AMSHA_CLASSIFIER_SHADOW_SHUTDOWN_GRACE:PT5S}
    sarvam:
      api-key: "${AMSHA_CLASSIFIER_SARVAM_API_KEY:${AMSHA_SARVAM_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_SARVAM_BASE_URL:https://api.sarvam.ai/v1}"
      model: "${AMSHA_CLASSIFIER_SARVAM_MODEL:sarvam-105b-conversations}"
    opencode:
      api-key: "${AMSHA_CLASSIFIER_OPENCODE_API_KEY:${AMSHA_OPENCODE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_OPENCODE_BASE_URL:https://opencode.ai/zen/v1}"
      model: "${AMSHA_CLASSIFIER_OPENCODE_MODEL:deepseek-v4-flash-free}"
    huggingface:
      api-key: "${AMSHA_CLASSIFIER_HUGGINGFACE_API_KEY:${AMSHA_HUGGINGFACE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}"
      model: "${AMSHA_CLASSIFIER_HUGGINGFACE_MODEL:meta-llama/Llama-3.3-70B-Instruct}"
    mistral:
      api-key: "${AMSHA_CLASSIFIER_MISTRAL_API_KEY:${AMSHA_MISTRAL_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_MISTRAL_BASE_URL:https://api.mistral.ai/v1}"
      model: "${AMSHA_CLASSIFIER_MISTRAL_MODEL:codestral-latest}"
    cloudflare:
      api-key: "${AMSHA_CLASSIFIER_CLOUDFLARE_API_KEY:${AMSHA_CLOUDFLARE_API_KEY:}}"
      account-id: "${AMSHA_CLASSIFIER_CLOUDFLARE_ACCOUNT_ID:${AMSHA_CLOUDFLARE_ACCOUNT_ID:}}"
      # Do not put {account_id} inside ${ENV:default} — MP Config closes on the first '}'.
      base-url: "${AMSHA_CLASSIFIER_CLOUDFLARE_BASE_URL:${amsha.llm.cloudflare.unresolved-base-url}}"
      model: "${AMSHA_CLASSIFIER_CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
    cohere:
      api-key: "${AMSHA_CLASSIFIER_COHERE_API_KEY:${AMSHA_COHERE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}"
      model: "${AMSHA_CLASSIFIER_COHERE_MODEL:command-r-08-2024}"
    codex:
      api-key: "${AMSHA_CLASSIFIER_CODEX_API_KEY:${AMSHA_CODEX_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_CODEX_BASE_URL:https://chatgpt.com/backend-api/codex}"
      model: "${AMSHA_CLASSIFIER_CODEX_MODEL:gpt-5.6-luna}"
    claude-code:
      api-key: "${AMSHA_CLASSIFIER_CLAUDE_CODE_API_KEY:${AMSHA_CLAUDE_CODE_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_CLAUDE_CODE_BASE_URL:https://api.anthropic.com}"
      model: "${AMSHA_CLASSIFIER_CLAUDE_CODE_MODEL:claude-sonnet-4-5}"
    agy:
      api-key: "${AMSHA_CLASSIFIER_AGY_API_KEY:${AMSHA_AGY_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_AGY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}"
      model: "${AMSHA_CLASSIFIER_AGY_MODEL:gemini-3.1-flash-lite}"
    kimchi:
      api-key: "${AMSHA_CLASSIFIER_KIMCHI_API_KEY:${AMSHA_KIMCHI_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_KIMCHI_BASE_URL:https://llm.kimchi.dev/openai/v1}"
      model: "${AMSHA_CLASSIFIER_KIMCHI_MODEL:minimax-m3}"
    foundry:
      base-url: "${AMSHA_CLASSIFIER_FOUNDRY_BASE_URL:${AMSHA_FOUNDRY_BASE_URL:http://127.0.0.1:8000/v1}}"
      model: "${AMSHA_CLASSIFIER_FOUNDRY_MODEL:qwen3-14b}"
    omlx:
      api-key: "${AMSHA_CLASSIFIER_OMLX_API_KEY:${AMSHA_OMLX_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_OMLX_BASE_URL:${AMSHA_OMLX_BASE_URL:http://127.0.0.1:8000/v1}}"
      model: "${AMSHA_CLASSIFIER_OMLX_MODEL:${AMSHA_OMLX_MODEL:}}"
    groq:
      api-key: "${AMSHA_CLASSIFIER_GROQ_API_KEY:${AMSHA_GROQ_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_GROQ_BASE_URL:${AMSHA_GROQ_BASE_URL:https://api.groq.com/openai/v1}}"
      model: "${AMSHA_CLASSIFIER_GROQ_MODEL:openai/gpt-oss-20b}"
    ollama:
      base-url: "${AMSHA_CLASSIFIER_OLLAMA_BASE_URL:${AMSHA_OLLAMA_BASE_URL:http://localhost:11434}}"
      model: "${AMSHA_CLASSIFIER_OLLAMA_MODEL:mistral-small:latest}"
    cerebras:
      api-key: "${AMSHA_CLASSIFIER_CEREBRAS_API_KEY:${AMSHA_CEREBRAS_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_CEREBRAS_BASE_URL:${AMSHA_CEREBRAS_BASE_URL:https://api.cerebras.ai/v1}}"
      model: "${AMSHA_CLASSIFIER_CEREBRAS_MODEL:llama3.1-8b}"
    openrouter:
      api-key: "${AMSHA_CLASSIFIER_OPENROUTER_API_KEY:${AMSHA_OPENROUTER_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_OPENROUTER_BASE_URL:${AMSHA_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}}"
      model: "${AMSHA_CLASSIFIER_OPENROUTER_MODEL:openai/gpt-oss-20b:free}"
    nvidia:
      api-key: "${AMSHA_CLASSIFIER_NVIDIA_API_KEY:${AMSHA_NVIDIA_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_NVIDIA_BASE_URL:${AMSHA_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}}"
      model: "${AMSHA_CLASSIFIER_NVIDIA_MODEL:meta/llama-3.3-70b-instruct}"
    gemini:
      api-key: "${AMSHA_CLASSIFIER_GEMINI_API_KEY:${AMSHA_GEMINI_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_GEMINI_BASE_URL:${AMSHA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}"
      model: "${AMSHA_CLASSIFIER_GEMINI_MODEL:gemini-2.5-flash-lite}"
    openai:
      api-key: "${AMSHA_CLASSIFIER_OPENAI_API_KEY:${AMSHA_OPENAI_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_OPENAI_BASE_URL:${AMSHA_OPENAI_BASE_URL:https://api.openai.com/v1}}"
      model: "${AMSHA_CLASSIFIER_OPENAI_MODEL:gpt-4o-mini}"
    generic-openai:
      api-key: "${AMSHA_CLASSIFIER_GENERIC_OPENAI_API_KEY:${AMSHA_GENERIC_OPENAI_API_KEY:}}"
      base-url: "${AMSHA_CLASSIFIER_GENERIC_OPENAI_BASE_URL:${AMSHA_GENERIC_OPENAI_BASE_URL:}}"
      model: "${AMSHA_CLASSIFIER_GENERIC_OPENAI_MODEL:deepseek-v4-flash}"
    llama-cpp:
      base-url: "${AMSHA_CLASSIFIER_LLAMACPP_BASE_URL:${AMSHA_LLAMACPP_BASE_URL:http://127.0.0.1:9000/v1}}"
      model: "${AMSHA_CLASSIFIER_LLAMACPP_MODEL:qwen3}"
  onnx:
    enabled: ${AMSHA_ONNX_ENABLED:false}
    model-root: "${AMSHA_ONNX_MODEL_ROOT:data/models}"
    max-model-file-bytes: ${AMSHA_ONNX_MAX_MODEL_FILE_BYTES:1073741824}
    max-loaded-models: ${AMSHA_ONNX_MAX_LOADED_MODELS:2}
    max-resident-mb: ${AMSHA_ONNX_MAX_RESIDENT_MB:1024}
    inference-threads: ${AMSHA_ONNX_INFERENCE_THREADS:2}
    queue-capacity: ${AMSHA_ONNX_QUEUE_CAPACITY:64}
    shutdown-grace: ${AMSHA_ONNX_SHUTDOWN_GRACE:PT10S}
    max-input-bytes: ${AMSHA_ONNX_MAX_INPUT_BYTES:262144}
    max-batch-input-bytes: ${AMSHA_ONNX_MAX_BATCH_INPUT_BYTES:1048576}
    max-batch-size: ${AMSHA_ONNX_MAX_BATCH_SIZE:32}
    warmup:
      enabled: ${AMSHA_ONNX_WARMUP_ENABLED:true}
      max-probes: ${AMSHA_ONNX_WARMUP_MAX_PROBES:5}
      timeout: ${AMSHA_ONNX_WARMUP_TIMEOUT:PT3S}
    classifier:
      circuit:
        failure-threshold: ${AMSHA_ONNX_CLASSIFIER_CIRCUIT_FAILURE_THRESHOLD:3}
        cooldown-seconds: ${AMSHA_ONNX_CLASSIFIER_CIRCUIT_COOLDOWN_SECONDS:30}
      # Enables shadow inference and seeds shadow requested state. A ready active
      # implementation registration is still required for effective behavior.
      intent:
        enabled: ${AMSHA_ONNX_CLASSIFIER_INTENT_ENABLED:false}
        model: "${AMSHA_ONNX_CLASSIFIER_INTENT_MODEL:}"
        timeout-seconds: ${AMSHA_ONNX_CLASSIFIER_INTENT_TIMEOUT_SECONDS:2}
      tool-risk:
        enabled: ${AMSHA_ONNX_CLASSIFIER_TOOL_RISK_ENABLED:false}
        model: "${AMSHA_ONNX_CLASSIFIER_TOOL_RISK_MODEL:}"
        timeout-seconds: ${AMSHA_ONNX_CLASSIFIER_TOOL_RISK_TIMEOUT_SECONDS:2}
      answer-quality:
        enabled: ${AMSHA_ONNX_CLASSIFIER_ANSWER_QUALITY_ENABLED:false}
        model: "${AMSHA_ONNX_CLASSIFIER_ANSWER_QUALITY_MODEL:}"
        timeout-seconds: ${AMSHA_ONNX_CLASSIFIER_ANSWER_QUALITY_TIMEOUT_SECONDS:2}
  decision:
    # -------------------------------------------------------------------------
    # Opt-in decision evaluation path (W4).
    #
    # INERT BY DEFAULT: when false — the shipped value — the internal evaluation
    # endpoints refuse before any provider is touched, so no egress is possible.
    # Enabling it lets an operator run the two registered decisions
    # (`amsha.routing.intent.v1` and `tool.risk.shadow`) and gather evidence.
    #
    # It does NOT register a DecisionEngine bean and does not activate routing:
    # the parent ADR stays Deferred, so `Instance<DecisionEngine>` remains
    # unsatisfiable and intent routing stays on the deterministic baseline. The
    # key lands with the workstream that first reads it (W4), rather than ahead
    # of its reader. See
    # docs/research/Jev-Decision-Plane-Activation-Plan-2026-10-07.md §W4.
    # -------------------------------------------------------------------------
    evaluation:
      enabled: ${AMSHA_DECISION_EVALUATION_ENABLED:false}
    # -------------------------------------------------------------------------
    # Operations monitoring (W6).
    #
    # Bounded, payload-free observation of the evaluations the opt-in path runs.
    # `drift` compares the mean confidence and abstention rate of the most recent
    # `window` observations on a lane against the first `window`, and logs one WARN
    # per drift episode; `cost` tracks the rolling cost per 1,000 priced decisions
    # so an approved per-slot ceiling can fail the evaluation closed.
    #
    # Nothing here activates the plane: the monitor observes and the cost guard is
    # inert until a ceiling is approved and a price schedule authorises rates (the
    # shipped schedule is empty). See the activation plan §W6.
    # -------------------------------------------------------------------------
    drift:
      window: ${AMSHA_DECISION_DRIFT_WINDOW:64}
      confidence-threshold: ${AMSHA_DECISION_DRIFT_CONFIDENCE_THRESHOLD:0.15}
      abstention-threshold: ${AMSHA_DECISION_DRIFT_ABSTENTION_THRESHOLD:0.20}
    cost:
      window: ${AMSHA_DECISION_COST_WINDOW:1000}
    shadow:
      intent:
        enabled: ${AMSHA_DECISION_SHADOW_INTENT_ENABLED:false}
      tool-risk:
        enabled: ${AMSHA_DECISION_SHADOW_TOOL_RISK_ENABLED:false}
      answer-quality:
        enabled: ${AMSHA_DECISION_SHADOW_ANSWER_QUALITY_ENABLED:false}
    # -------------------------------------------------------------------------
    # Decision provider selection (Jev / System One).
    #
    # NOT A PRODUCTION BEAN: this mapping is never consumed into a registered
    # DecisionEngine — the parent ADR keeps the plane Deferred. It is consumed
    # only by the opt-in evaluation path (amsha.decision.evaluation.enabled,
    # default false), which constructs an engine for a single evaluation without
    # registering one, so Instance<DecisionEngine> stays unsatisfiable and no
    # activation switch opens. With that switch off, a value here changes no
    # behaviour. See docs/research/Jev-Provider-Integration-Plan-2026.md §8.
    #
    # Mirrors the LLM convention above — `selected` picks one provider, and each
    # provider names its own `model`. Those are the same two axes as
    # AMSHA_LLM_PROVIDER + amsha.llm.<provider>.model.
    #
    # A provider is the System One ENDPOINT that receives POST /v1/systemone,
    # exactly as an LLM provider is the endpoint that receives
    # /v1/chat/completions. An id may therefore name a specific decision server
    # (laya, kev, clm), a generic local runtime host that serves whichever
    # decision model is loaded into it (omlx), or a hosted API (typesafe).
    # `model` is a SEPARATE axis naming the checkpoint served at that endpoint —
    # which is why `omlx` (a runtime) and `laya` (a model) are both valid ids.
    # It is required for a REMOTE slot (the hosted contract makes it mandatory)
    # and optional for a SELF-HOSTED one, where omitting it means "the server's
    # own checkpoint" and the request leaves the field out entirely.
    #
    # `selected` must name one of the slots below. An undeclared id resolves to
    # nothing (fail closed) rather than being turned into an endpoint.
    #
    # The lane is derived from the endpoint host, not declared: the literal
    # 127.0.0.1 selects the self-hosted lane, anything else the remote lane.
    # `localhost`, `::1`, and other 127.x hosts are rejected as ambiguous.
    #
    # `api-key` is the direct environment-backed provider key, following the
    # same convention as Amsha's other providers. Selection and status expose
    # only whether a key is configured. Evaluation copies it to request-owned
    # bytes and clears them after use; the configuration String remains in memory.
    # `wire-profile` belongs to the MODEL, not the endpoint: a CLM model must
    # declare PROSE, and the selector refuses the contradiction.
    #
    # Each slot also carries a `governance` declaration — the parent ADR's
    # Governance gate requires retention, residency, training-use, and
    # tenant-isolation to be declared explicitly before state may leave the
    # process. Declaring them records an operator decision; it does not by itself
    # activate anything. The selector refuses an enabled slot whose declaration
    # is incomplete, and the engine factory re-checks before constructing:
    #   * `projection-allow-list` is required on BOTH lanes and must be non-empty
    #     — the state projection redactor fails closed without an allow-list, and
    #     inventing one from the question handles is exactly the widening the
    #     control exists to prevent. It is a comma-separated list of the top-level
    #     `state` field names permitted to leave the process. Tool-risk evaluation requires the
    #     camel-case `requiredOperation` key to be included in the operator's allow-list.
    #   * `data-location` is the provider-confirmed country/region where submitted state is
    #     processed or stored, required on REMOTE lanes. Get it from account terms or the
    #     provider's data-processing agreement; do not infer it from the endpoint or guess.
    #     The Jev ADR currently records TypeSafe residency as undeclared. Leave it blank until
    #     confirmed; the remote slot stays unavailable. Loopback slots never export state.
    #   * `allow-training-use` must stay false and `tenant-isolation` must stay
    #     true; a contrary value is refused rather than sent.
    #   * `retention-window` defaults to PT0S (zero retention), which is a positive
    #     statement, not an absence of one.
    #   * `cost-ceiling-per-thousand` is required before production activation, not to
    #     gather evaluation evidence. Named `PerThousand` rather than `Per1000` on
    #     purpose: SmallRye derives a member name by inserting `-` before each capital,
    #     so a trailing digit yields `cost-ceiling-per1000` with no separator — an easy
    #     key to write wrongly, and an unknown property fails the whole mapping at
    #     startup rather than being ignored.
    # -------------------------------------------------------------------------
    providers:
      selected: "${AMSHA_DECISION_PROVIDER:}"
      slots:
        # TypeSafe Jev — closed hosted reference implementation (remote lane).
        typesafe:
          enabled: ${AMSHA_DECISION_TYPESAFE_ENABLED:false}
          endpoint: "${AMSHA_DECISION_TYPESAFE_ENDPOINT:https://api.typesafe.ai/v1/systemone}"
          model: "${AMSHA_DECISION_TYPESAFE_MODEL:jev-latest}"
          api-key: "${AMSHA_DECISION_TYPESAFE_API_KEY:}"
          timeout: ${AMSHA_DECISION_TYPESAFE_TIMEOUT:PT50S}
          wire-profile: ${AMSHA_DECISION_TYPESAFE_WIRE_PROFILE:JSON_OBJECT}
          governance:
            data-location: "${AMSHA_DECISION_TYPESAFE_GOVERNANCE_DATA_LOCATION:}"
            retention-window: ${AMSHA_DECISION_TYPESAFE_GOVERNANCE_RETENTION_WINDOW:PT0S}
            allow-training-use: ${AMSHA_DECISION_TYPESAFE_GOVERNANCE_ALLOW_TRAINING_USE:false}
            tenant-isolation: ${AMSHA_DECISION_TYPESAFE_GOVERNANCE_TENANT_ISOLATION:true}
            projection-allow-list: "${AMSHA_DECISION_TYPESAFE_GOVERNANCE_PROJECTION_ALLOW_LIST:}"
            cost-ceiling-per-thousand: "${AMSHA_DECISION_TYPESAFE_GOVERNANCE_COST_CEILING_PER_THOUSAND:}"
        # CLM — contrastive System One model (a MODEL id, not a runtime). Its
        # heads were trained on prose, so a JSON `state` degrades answers
        # silently rather than failing loudly — hence PROSE below.
        clm:
          enabled: ${AMSHA_DECISION_CLM_ENABLED:false}
          endpoint: "${AMSHA_DECISION_CLM_ENDPOINT:http://127.0.0.1:8000/v1/systemone}"
          model: "${AMSHA_DECISION_CLM_MODEL:CLM-v0.1-8B-MLX-8bit}"
          api-key: "${AMSHA_DECISION_CLM_API_KEY:}"
          timeout: ${AMSHA_DECISION_CLM_TIMEOUT:PT50S}
          wire-profile: ${AMSHA_DECISION_CLM_WIRE_PROFILE:PROSE}
          governance:
            data-location: "${AMSHA_DECISION_CLM_GOVERNANCE_DATA_LOCATION:}"
            retention-window: ${AMSHA_DECISION_CLM_GOVERNANCE_RETENTION_WINDOW:PT0S}
            allow-training-use: ${AMSHA_DECISION_CLM_GOVERNANCE_ALLOW_TRAINING_USE:false}
            tenant-isolation: ${AMSHA_DECISION_CLM_GOVERNANCE_TENANT_ISOLATION:true}
            projection-allow-list: "${AMSHA_DECISION_CLM_GOVERNANCE_PROJECTION_ALLOW_LIST:}"
            cost-ceiling-per-thousand: "${AMSHA_DECISION_CLM_GOVERNANCE_COST_CEILING_PER_THOUSAND:}"
        # Laya — Apache-2.0 Jev-wire-compatible server. Bind it to 127.0.0.1:
        # laya-serve defaults to 0.0.0.0, which exposes it to the LAN.
        laya:
          enabled: ${AMSHA_DECISION_LAYA_ENABLED:false}
          endpoint: "${AMSHA_DECISION_LAYA_ENDPOINT:http://127.0.0.1:8000/v1/systemone}"
          model: "${AMSHA_DECISION_LAYA_MODEL:laya-multilingual}"
          api-key: "${AMSHA_DECISION_LAYA_API_KEY:}"
          timeout: ${AMSHA_DECISION_LAYA_TIMEOUT:PT50S}
          wire-profile: ${AMSHA_DECISION_LAYA_WIRE_PROFILE:JSON_OBJECT}
          governance:
            data-location: "${AMSHA_DECISION_LAYA_GOVERNANCE_DATA_LOCATION:}"
            retention-window: ${AMSHA_DECISION_LAYA_GOVERNANCE_RETENTION_WINDOW:PT0S}
            allow-training-use: ${AMSHA_DECISION_LAYA_GOVERNANCE_ALLOW_TRAINING_USE:false}
            tenant-isolation: ${AMSHA_DECISION_LAYA_GOVERNANCE_TENANT_ISOLATION:true}
            projection-allow-list: "${AMSHA_DECISION_LAYA_GOVERNANCE_PROJECTION_ALLOW_LIST:}"
            cost-ceiling-per-thousand: "${AMSHA_DECISION_LAYA_GOVERNANCE_COST_CEILING_PER_THOUSAND:}"
        # Kev — Apache-2.0, LLM-backed rather than a dedicated decision head.
        # `model` is blank on purpose: it names whichever checkpoint this server
        # wraps, which is deployment-specific. A self-hosted slot may omit it —
        # the request then leaves the field out and the server picks its own.
        kev:
          enabled: ${AMSHA_DECISION_KEV_ENABLED:false}
          endpoint: "${AMSHA_DECISION_KEV_ENDPOINT:http://127.0.0.1:8000/v1/systemone}"
          model: "${AMSHA_DECISION_KEV_MODEL:}"
          api-key: "${AMSHA_DECISION_KEV_API_KEY:}"
          timeout: ${AMSHA_DECISION_KEV_TIMEOUT:PT50S}
          wire-profile: ${AMSHA_DECISION_KEV_WIRE_PROFILE:JSON_OBJECT}
          governance:
            data-location: "${AMSHA_DECISION_KEV_GOVERNANCE_DATA_LOCATION:}"
            retention-window: ${AMSHA_DECISION_KEV_GOVERNANCE_RETENTION_WINDOW:PT0S}
            allow-training-use: ${AMSHA_DECISION_KEV_GOVERNANCE_ALLOW_TRAINING_USE:false}
            tenant-isolation: ${AMSHA_DECISION_KEV_GOVERNANCE_TENANT_ISOLATION:true}
            projection-allow-list: "${AMSHA_DECISION_KEV_GOVERNANCE_PROJECTION_ALLOW_LIST:}"
            cost-ceiling-per-thousand: "${AMSHA_DECISION_KEV_GOVERNANCE_COST_CEILING_PER_THOUSAND:}"
        # OMLX 0.7.1.dev1 supports POST /v1/systemone. OMLX's OpenAI API expects
        # Bearer auth while Amsha's loopback client sends X-Amsha-Loopback-Token;
        # verify authentication compatibility before enabling this slot.
        omlx:
          enabled: ${AMSHA_DECISION_OMLX_ENABLED:false}
          endpoint: "${AMSHA_DECISION_OMLX_ENDPOINT:http://127.0.0.1:8000/v1/systemone}"
          model: "${AMSHA_DECISION_OMLX_MODEL:}"
          api-key: "${AMSHA_DECISION_OMLX_API_KEY:}"
          timeout: ${AMSHA_DECISION_OMLX_TIMEOUT:PT50S}
          wire-profile: ${AMSHA_DECISION_OMLX_WIRE_PROFILE:JSON_OBJECT}
          governance:
            data-location: "${AMSHA_DECISION_OMLX_GOVERNANCE_DATA_LOCATION:}"
            retention-window: ${AMSHA_DECISION_OMLX_GOVERNANCE_RETENTION_WINDOW:PT0S}
            allow-training-use: ${AMSHA_DECISION_OMLX_GOVERNANCE_ALLOW_TRAINING_USE:false}
            tenant-isolation: ${AMSHA_DECISION_OMLX_GOVERNANCE_TENANT_ISOLATION:true}
            projection-allow-list: "${AMSHA_DECISION_OMLX_GOVERNANCE_PROJECTION_ALLOW_LIST:}"
            cost-ceiling-per-thousand: "${AMSHA_DECISION_OMLX_GOVERNANCE_COST_CEILING_PER_THOUSAND:}"
  fs:
    data-dir: "${AMSHA_FS_DATA_DIR:./data/fs}"
    lock-timeout-seconds: 30
    lucene-index-dir: "${AMSHA_FS_LUCENE_INDEX_DIR:lucene-index}"
    vector-dimension: "${AMSHA_FS_VECTOR_DIMENSION:768}"
  delegation:
    max-depth: ${AMSHA_DELEGATION_MAX_DEPTH:3}
  ui:
    skip-onboarding: ${AMSHA_UI_SKIP_ONBOARDING:false}
  bootstrap:
    # Loopback-only owner credential rotation for local development recovery.
    local-recovery-enabled: ${AMSHA_BOOTSTRAP_LOCAL_RECOVERY:false}
  llm:
    provider: ${AMSHA_LLM_PROVIDER:}
    profile-routing:
      enabled: ${AMSHA_LLM_PROFILE_ROUTING_ENABLED:false}
    modality-route-seeder:
      enabled: ${AMSHA_LLM_MODALITY_ROUTE_SEEDER_ENABLED:false}
    vault-priority: ${AMSHA_LLM_VAULT_PRIORITY:false}
    log-http: ${AMSHA_LLM_LOG_HTTP:false}
    max-retries: ${AMSHA_LLM_MAX_RETRIES:3}
    max-output-tokens: ${AMSHA_LLM_MAX_OUTPUT_TOKENS:8192}
    timeout: ${AMSHA_LLM_TIMEOUT:PT120S}
    temperature: ${AMSHA_LLM_TEMPERATURE:0.1}
    context-window: ${AMSHA_LLM_CONTEXT_WINDOW:128000}
    compact-prompt-enabled: ${AMSHA_LLM_COMPACT_PROMPT_ENABLED:false}
    compact-prompt-max-chars: ${AMSHA_LLM_COMPACT_PROMPT_MAX_CHARS:32000}
    structured-output-mode: ${AMSHA_LLM_STRUCTURED_OUTPUT_MODE:NATIVE}
    circuit-breaker:
      enabled: ${AMSHA_LLM_CIRCUIT_BREAKER_ENABLED:true}
    # Per-persona model routing (P102). Resolution: persona → group → global.
    # Single model:
    #   persona.models:
    #     brahma:
    #       provider: deepseek
    #       model: deepseek-coder-33b
    # Multi-model (failover chain):
    #   persona.models:
    #     brahma:
    #       0:
    #         provider: deepseek
    #         model: deepseek-coder-33b
    #       1:
    #         provider: groq
    #         model: llama-3.3-70b
    #
    # Or via env vars:
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_PROVIDER=deepseek
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_MODEL=deepseek-coder-33b
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_0_PROVIDER=deepseek
    #   AMSHA_LLM_PERSONA_MODELS_BRAHMA_0_MODEL=deepseek-coder-33b
    group.models:
    persona.models:
    openrouter:
      app-name: "${AMSHA_OPENROUTER_APP_NAME:https://github.com/rsrini7/AmshaAgent}"
      site-url: "${AMSHA_OPENROUTER_SITE_URL:https://github.com/rsrini7/AmshaAgent}"
    sarvam:
      api-key: "${AMSHA_SARVAM_API_KEY:}"
      base-url: "${AMSHA_SARVAM_BASE_URL:https://api.sarvam.ai/v1}"
      model: "${AMSHA_SARVAM_MODEL:sarvam-105b-conversations}"
    opencode:
      api-key: "${AMSHA_OPENCODE_API_KEY:}"
      base-url: "${AMSHA_OPENCODE_BASE_URL:https://opencode.ai/zen/v1}"
      model: "${AMSHA_OPENCODE_MODEL:deepseek-v4-flash-free}"
    huggingface:
      api-key: "${AMSHA_HUGGINGFACE_API_KEY:}"
      base-url: "${AMSHA_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}"
      model: "${AMSHA_HUGGINGFACE_MODEL:meta-llama/Llama-3.3-70B-Instruct}"
    mistral:
      api-key: "${AMSHA_MISTRAL_API_KEY:}"
      base-url: "${AMSHA_MISTRAL_BASE_URL:https://api.mistral.ai/v1}"
      model: "${AMSHA_MISTRAL_MODEL:codestral-latest}"
    cloudflare:
      api-key: "${AMSHA_CLOUDFLARE_API_KEY:}"
      account-id: "${AMSHA_CLOUDFLARE_ACCOUNT_ID:}"
      # Keep braces out of ${ENV:default} — MP Config treats the first '}' as end-of-expression,
      # which otherwise appends a literal "/ai/v1}" and breaks URI parsing.
      unresolved-base-url: "https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1"
      base-url: "${AMSHA_CLOUDFLARE_BASE_URL:${amsha.llm.cloudflare.unresolved-base-url}}"
      model: "${AMSHA_CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
    cohere:
      api-key: "${AMSHA_COHERE_API_KEY:}"
      base-url: "${AMSHA_COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}"
      model: "${AMSHA_COHERE_MODEL:command-r-08-2024}"
    codex:
      api-key: "${AMSHA_CODEX_API_KEY:}"
      base-url: "${AMSHA_CODEX_BASE_URL:https://chatgpt.com/backend-api/codex}"
      model: "${AMSHA_CODEX_MODEL:gpt-5.6-luna}"
    claude-code:
      api-key: "${AMSHA_CLAUDE_CODE_API_KEY:}"
      base-url: "${AMSHA_CLAUDE_CODE_BASE_URL:https://api.anthropic.com}"
      model: "${AMSHA_CLAUDE_CODE_MODEL:claude-sonnet-4-5}"
    agy:
      api-key: "${AMSHA_AGY_API_KEY:}"
      base-url: "${AMSHA_AGY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}"
      model: "${AMSHA_AGY_MODEL:gemini-3.1-flash-lite}"
    kimchi:
      api-key: "${AMSHA_KIMCHI_API_KEY:}"
      base-url: "${AMSHA_KIMCHI_BASE_URL:https://llm.kimchi.dev/openai/v1}"
      model: "${AMSHA_KIMCHI_MODEL:minimax-m3}"
    foundry:
      base-url: "${AMSHA_FOUNDRY_BASE_URL:http://127.0.0.1:8000/v1}"
      model: "${AMSHA_FOUNDRY_MODEL:qwen3-14b}"
    # Infinite-loop sub-loops (compaction/classifier/embedding) resolve slots through
    # amsha.llm.<provider>.* — mirror the standard OMLX provider vars so e.g.
    # AMSHA_INFINITE_LOOP_COMPACTION_PROVIDERS=omlx works out of the box.
    omlx:
      base-url: "${AMSHA_OMLX_BASE_URL:http://127.0.0.1:8000/v1}"
      api-key: "${AMSHA_OMLX_API_KEY:}"
      model: "${AMSHA_OMLX_MODEL:}"
    groq:
      api-key: "${AMSHA_GROQ_API_KEY:}"
      base-url: "${AMSHA_GROQ_BASE_URL:https://api.groq.com/openai/v1}"
      model: "${AMSHA_GROQ_MODEL:openai/gpt-oss-120b}"
    ollama:
      base-url: "${AMSHA_OLLAMA_BASE_URL:http://localhost:11434}"
      model: "${AMSHA_OLLAMA_MODEL:mistral-small:latest}"
    cerebras:
      api-key: "${AMSHA_CEREBRAS_API_KEY:}"
      base-url: "${AMSHA_CEREBRAS_BASE_URL:https://api.cerebras.ai/v1}"
      model: "${AMSHA_CEREBRAS_MODEL:qwen-3-235b-a22b-instruct-2507}"
    nvidia:
      api-key: "${AMSHA_NVIDIA_API_KEY:}"
      base-url: "${AMSHA_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}"
      model: "${AMSHA_NVIDIA_MODEL:bytedance/seed-oss-36b-instruct}"
    gemini:
      api-key: "${AMSHA_GEMINI_API_KEY:}"
      base-url: "${AMSHA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}"
      model: "${AMSHA_GEMINI_MODEL:gemini-2.5-flash-lite}"
    openai:
      api-key: "${AMSHA_OPENAI_API_KEY:}"
      base-url: "${AMSHA_OPENAI_BASE_URL:https://api.openai.com/v1}"
      model: "${AMSHA_OPENAI_MODEL:gpt-4o-mini}"
    generic-openai:
      api-key: "${AMSHA_GENERIC_OPENAI_API_KEY:}"
      base-url: "${AMSHA_GENERIC_OPENAI_BASE_URL:}"
      model: "${AMSHA_GENERIC_OPENAI_MODEL:gpt-4o-mini}"
    llama-cpp:
      base-url: "${AMSHA_LLAMACPP_BASE_URL:http://127.0.0.1:9000/v1}"
      model: "${AMSHA_LLAMACPP_MODEL:qwen3}"
  stt:
    enabled: ${AMSHA_STT_ENABLED:false}
    model: ${AMSHA_STT_MODEL:whisper-large-v3-turbo}
    timeout: ${AMSHA_STT_TIMEOUT:PT60S}
    max-bytes: ${AMSHA_STT_MAX_BYTES:26214400}
    max-transcript-chars: ${AMSHA_STT_MAX_TRANSCRIPT_CHARS:12000}
    ffmpeg-path: ${AMSHA_STT_FFMPEG_PATH:ffmpeg}
    allow-fallback-on-failure: ${AMSHA_STT_ALLOW_FALLBACK_ON_FAILURE:false}
    gnani:
      enabled: ${AMSHA_STT_GNANI_ENABLED:false}
      default-language: ${AMSHA_STT_GNANI_DEFAULT_LANGUAGE:en-IN}
      max-duration: ${AMSHA_STT_GNANI_MAX_DURATION:PT30S}
    local:
      enabled: ${AMSHA_STT_LOCAL_ENABLED:false}
      bundle-id: "${AMSHA_STT_LOCAL_BUNDLE_ID:whisper-tiny-en-v1}"
      timeout: ${AMSHA_STT_LOCAL_TIMEOUT:PT30S}
      max-audio-bytes: ${AMSHA_STT_LOCAL_MAX_AUDIO_BYTES:26214400}
      max-transcript-chars: ${AMSHA_STT_LOCAL_MAX_TRANSCRIPT_CHARS:12000}
  tts:
    # P8 speech synthesis (Issue 12). Output-only; disabled by default. V1 supports only the
    # directly verified WAV format from the OMLX Qwen3-TTS model — any other response_format is
    # reported UNSUPPORTED rather than attempted. Never shares routing with P7 audio input.
    provider: ${AMSHA_TTS_PROVIDER:omlx}
    enabled: ${AMSHA_TTS_ENABLED:false}
    gnani:
      model: ${AMSHA_TTS_GNANI_MODEL:timbre-v3.0}
      voice: ${AMSHA_TTS_GNANI_VOICE:Shivani}
    model: ${AMSHA_TTS_MODEL:Qwen3-TTS-12Hz-1.7B-Base-bf16}
    voice: ${AMSHA_TTS_VOICE:}
    response-format: ${AMSHA_TTS_RESPONSE_FORMAT:wav}
    timeout: ${AMSHA_TTS_TIMEOUT:PT120S}
    max-input-chars: ${AMSHA_TTS_MAX_INPUT_CHARS:1200}
    max-bytes: ${AMSHA_TTS_MAX_BYTES:8388608}
    max-concurrent: ${AMSHA_TTS_MAX_CONCURRENT:1}
    # Resolved output mode for inbound-audio turns when the user gives no explicit directive.
    # One of TEXT_ONLY | TEXT_AND_AUDIO | AUDIO_ONLY. Default TEXT_ONLY (fail closed).
    default-output-mode: ${AMSHA_TTS_DEFAULT_OUTPUT_MODE:TEXT_ONLY}
  gnani:
    api-key: ${AMSHA_GNANI_API_KEY:}
  infinite-loop:
    llm:
      providers: ${AMSHA_INFINITE_LOOP_LLM_PROVIDERS:omlx,ollama}
    compaction:
      providers: ${AMSHA_INFINITE_LOOP_COMPACTION_PROVIDERS:omlx,ollama}
    classifier:
      providers: ${AMSHA_INFINITE_LOOP_CLASSIFIER_PROVIDERS:omlx,ollama}
    embedding:
      providers: ${AMSHA_INFINITE_LOOP_EMBEDDING_PROVIDERS:ollama}
    cooldown-base-seconds: ${AMSHA_INFINITE_LOOP_COOLDOWN_BASE_SECONDS:5}
    cooldown-max-seconds: ${AMSHA_INFINITE_LOOP_COOLDOWN_MAX_SECONDS:60}
    cooldown-transient-seconds: ${AMSHA_INFINITE_LOOP_COOLDOWN_TRANSIENT_SECONDS:5}
    max-latency-ms: ${AMSHA_INFINITE_LOOP_MAX_LATENCY_MS:45000}
  # Embedding-space values prevent incompatible provider rotation. A provider
  # without an explicit shared space remains provider-bound by default.
  embedding:
    ollama:
      model: "${AMSHA_EMBEDDING_OLLAMA_MODEL:nomic-embed-text:v1.5}"
      base-url: "${AMSHA_EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}"
      space-id: "${AMSHA_EMBEDDING_OLLAMA_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_OLLAMA_SPACE_REVISION:}"
    jina:
      api-key: "${AMSHA_EMBEDDING_JINA_API_KEY:}"
      model: "${AMSHA_EMBEDDING_JINA_MODEL:jina-embeddings-v5-text-nano}"
      base-url: "${AMSHA_EMBEDDING_JINA_BASE_URL:https://api.jina.ai/v1/}"
      space-id: "${AMSHA_EMBEDDING_JINA_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_JINA_SPACE_REVISION:}"
    openai:
      api-key: "${AMSHA_EMBEDDING_OPENAI_API_KEY:}"
      model: "${AMSHA_EMBEDDING_OPENAI_MODEL:text-embedding-3-small}"
      base-url: "${AMSHA_EMBEDDING_OPENAI_BASE_URL:https://api.openai.com/v1}"
      space-id: "${AMSHA_EMBEDDING_OPENAI_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_OPENAI_SPACE_REVISION:}"
    onnx:
      model: "${AMSHA_EMBEDDING_ONNX_MODEL:}"
      timeout-seconds: ${AMSHA_EMBEDDING_ONNX_TIMEOUT_SECONDS:5}
      space-id: "${AMSHA_EMBEDDING_ONNX_SPACE_ID:}"
      space-revision: "${AMSHA_EMBEDDING_ONNX_SPACE_REVISION:}"
  compaction:
    structured-output-mode: "${AMSHA_COMPACTION_STRUCTURED_OUTPUT_MODE:PROMPT_DIRECTIVE}"
    sarvam:
      api-key: "${AMSHA_COMPACTION_SARVAM_API_KEY:${AMSHA_SARVAM_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_SARVAM_BASE_URL:https://api.sarvam.ai/v1}"
      model: "${AMSHA_COMPACTION_SARVAM_MODEL:sarvam-105b-conversations}"
    opencode:
      api-key: "${AMSHA_COMPACTION_OPENCODE_API_KEY:${AMSHA_OPENCODE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_OPENCODE_BASE_URL:https://opencode.ai/zen/v1}"
      model: "${AMSHA_COMPACTION_OPENCODE_MODEL:deepseek-v4-flash-free}"
    huggingface:
      api-key: "${AMSHA_COMPACTION_HUGGINGFACE_API_KEY:${AMSHA_HUGGINGFACE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_HUGGINGFACE_BASE_URL:https://router.huggingface.co/v1}"
      model: "${AMSHA_COMPACTION_HUGGINGFACE_MODEL:meta-llama/Llama-3.3-70B-Instruct}"
    mistral:
      api-key: "${AMSHA_COMPACTION_MISTRAL_API_KEY:${AMSHA_MISTRAL_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_MISTRAL_BASE_URL:https://api.mistral.ai/v1}"
      model: "${AMSHA_COMPACTION_MISTRAL_MODEL:codestral-latest}"
    cloudflare:
      api-key: "${AMSHA_COMPACTION_CLOUDFLARE_API_KEY:${AMSHA_CLOUDFLARE_API_KEY:}}"
      account-id: "${AMSHA_COMPACTION_CLOUDFLARE_ACCOUNT_ID:${AMSHA_CLOUDFLARE_ACCOUNT_ID:}}"
      # Do not put {account_id} inside ${ENV:default} — MP Config closes on the first '}'.
      base-url: "${AMSHA_COMPACTION_CLOUDFLARE_BASE_URL:${amsha.llm.cloudflare.unresolved-base-url}}"
      model: "${AMSHA_COMPACTION_CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
    cohere:
      api-key: "${AMSHA_COMPACTION_COHERE_API_KEY:${AMSHA_COHERE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}"
      model: "${AMSHA_COMPACTION_COHERE_MODEL:command-r-08-2024}"
    codex:
      api-key: "${AMSHA_COMPACTION_CODEX_API_KEY:${AMSHA_CODEX_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_CODEX_BASE_URL:https://chatgpt.com/backend-api/codex}"
      model: "${AMSHA_COMPACTION_CODEX_MODEL:gpt-5.6-luna}"
    claude-code:
      api-key: "${AMSHA_COMPACTION_CLAUDE_CODE_API_KEY:${AMSHA_CLAUDE_CODE_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_CLAUDE_CODE_BASE_URL:https://api.anthropic.com}"
      model: "${AMSHA_COMPACTION_CLAUDE_CODE_MODEL:claude-sonnet-4-5}"
    agy:
      api-key: "${AMSHA_COMPACTION_AGY_API_KEY:${AMSHA_AGY_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_AGY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}"
      model: "${AMSHA_COMPACTION_AGY_MODEL:gemini-3.1-flash-lite}"
    kimchi:
      api-key: "${AMSHA_COMPACTION_KIMCHI_API_KEY:${AMSHA_KIMCHI_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_KIMCHI_BASE_URL:https://llm.kimchi.dev/openai/v1}"
      model: "${AMSHA_COMPACTION_KIMCHI_MODEL:minimax-m3}"
    foundry:
      base-url: "${AMSHA_COMPACTION_FOUNDRY_BASE_URL:${AMSHA_FOUNDRY_BASE_URL:http://127.0.0.1:8000/v1}}"
      model: "${AMSHA_COMPACTION_FOUNDRY_MODEL:qwen3-14b}"
    omlx:
      api-key: "${AMSHA_COMPACTION_OMLX_API_KEY:${AMSHA_OMLX_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_OMLX_BASE_URL:${AMSHA_OMLX_BASE_URL:http://127.0.0.1:8000/v1}}"
      model: "${AMSHA_COMPACTION_OMLX_MODEL:${AMSHA_OMLX_MODEL:}}"
    groq:
      api-key: "${AMSHA_COMPACTION_GROQ_API_KEY:${AMSHA_GROQ_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_GROQ_BASE_URL:${AMSHA_GROQ_BASE_URL:https://api.groq.com/openai/v1}}"
      model: "${AMSHA_COMPACTION_GROQ_MODEL:openai/gpt-oss-20b}"
    ollama:
      base-url: "${AMSHA_COMPACTION_OLLAMA_BASE_URL:${AMSHA_OLLAMA_BASE_URL:http://localhost:11434}}"
      model: "${AMSHA_COMPACTION_OLLAMA_MODEL:mistral-small:latest}"
    cerebras:
      api-key: "${AMSHA_COMPACTION_CEREBRAS_API_KEY:${AMSHA_CEREBRAS_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_CEREBRAS_BASE_URL:${AMSHA_CEREBRAS_BASE_URL:https://api.cerebras.ai/v1}}"
      model: "${AMSHA_COMPACTION_CEREBRAS_MODEL:llama3.1-8b}"
    openrouter:
      api-key: "${AMSHA_COMPACTION_OPENROUTER_API_KEY:${AMSHA_OPENROUTER_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_OPENROUTER_BASE_URL:${AMSHA_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}}"
      model: "${AMSHA_COMPACTION_OPENROUTER_MODEL:openai/gpt-oss-20b:free}"
    nvidia:
      api-key: "${AMSHA_COMPACTION_NVIDIA_API_KEY:${AMSHA_NVIDIA_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_NVIDIA_BASE_URL:${AMSHA_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}}"
      model: "${AMSHA_COMPACTION_NVIDIA_MODEL:meta/llama-3.3-70b-instruct}"
    gemini:
      api-key: "${AMSHA_COMPACTION_GEMINI_API_KEY:${AMSHA_GEMINI_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_GEMINI_BASE_URL:${AMSHA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}"
      model: "${AMSHA_COMPACTION_GEMINI_MODEL:gemini-2.5-flash-lite}"
    openai:
      api-key: "${AMSHA_COMPACTION_OPENAI_API_KEY:${AMSHA_OPENAI_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_OPENAI_BASE_URL:${AMSHA_OPENAI_BASE_URL:https://api.openai.com/v1}}"
      model: "${AMSHA_COMPACTION_OPENAI_MODEL:gpt-4o-mini}"
    generic-openai:
      api-key: "${AMSHA_COMPACTION_GENERIC_OPENAI_API_KEY:${AMSHA_GENERIC_OPENAI_API_KEY:}}"
      base-url: "${AMSHA_COMPACTION_GENERIC_OPENAI_BASE_URL:${AMSHA_GENERIC_OPENAI_BASE_URL:}}"
      model: "${AMSHA_COMPACTION_GENERIC_OPENAI_MODEL:deepseek-v4-flash}"
    llama-cpp:
      base-url: "${AMSHA_COMPACTION_LLAMACPP_BASE_URL:${AMSHA_LLAMACPP_BASE_URL:http://127.0.0.1:9000/v1}}"
      model: "${AMSHA_COMPACTION_LLAMACPP_MODEL:qwen3}"
  agent:
    default-timezone: "${AMSHA_DEFAULT_TIMEZONE:Asia/Kolkata}"
    rate-limit:
      max-auto-retry-seconds: ${AMSHA_AGENT_RATE_LIMIT_MAX_AUTO_RETRY_SECONDS:15}
      default-retry-seconds: ${AMSHA_AGENT_RATE_LIMIT_DEFAULT_RETRY_SECONDS:10}
  rag:
    min-score: 0.01f
    context-chunks: 3
    max-total-chars: 800
    max-chunk-chars: 300
    max-source-chars: 400
    # Embedding vector dimension. nomic-embed-text = 768. mxbai-embed-large = 1024.
    # MUST match the model used by the active embedding provider.
    embed-dimensions: ${AMSHA_EMBED_DIMENSIONS:768}
    # Path where sqlite-vec native lib is extracted/loaded from.
    # The OS-specific extension (.so, .dll) is added automatically.
    vec-extension-path: "${AMSHA_RAG_VEC_PATH:./lib/vec0}"
    # Download the pinned sqlite-vec release asset (SHA-256 verified) when the
    # binary is absent from both disk and JAR resources. Opt-in: disabled by
    # default so air-gapped/offline boots never touch the network.
    vec-auto-download: "${AMSHA_RAG_VEC_AUTO_DOWNLOAD:false}"
    # sqlite-vec version the downloader resolves when auto-download is enabled.
    # 0.1.9 digests are pinned in code; any other version is verified against
    # that release's own checksums.txt (fail-closed).
    vec-version: "${AMSHA_RAG_VEC_VERSION:0.1.9}"
    reranker:
      enabled: ${AMSHA_RAG_RERANKER_ENABLED:false}
      bundle-id: "${AMSHA_RAG_RERANKER_BUNDLE_ID:bge-reranker-v1}"
      timeout: ${AMSHA_RAG_RERANKER_TIMEOUT:PT5S}
      max-candidates: ${AMSHA_RAG_RERANKER_MAX_CANDIDATES:50}
      max-input-bytes: ${AMSHA_RAG_RERANKER_MAX_INPUT_BYTES:262144}
  auto-seed-secrets: "${AMSHA_AUTO_SEED_SECRETS:false}"
  skills:
    hot-reload: true
    adaptive:
      enabled: ${AMSHA_SKILLS_ADAPTIVE_ENABLED:false}
    default-max-iterations: ${AMSHA_SKILLS_DEFAULT_MAX_ITERATIONS:15}
    skillsjars:
      require-approval-for-sensitive: ${AMSHA_SKILLSJARS_REQUIRE_APPROVAL_FOR_SENSITIVE:true}
  core:
    util:
      json-salvage-max-lines: ${AMSHA_CORE_UTIL_JSON_SALVAGE_MAX_LINES:20}
  security:
    prompt-injection:
      enabled: true
  routing:
    intent-classifier:
      ollama-model: ${AMSHA_INTENT_CLASSIFIER_OLLAMA_MODEL:mistral-small:latest}
      structured-output-mode: ${AMSHA_INTENT_CLASSIFIER_STRUCTURED_OUTPUT_MODE:NATIVE}
      ollama-fallback:
        enabled: ${AMSHA_INTENT_CLASSIFIER_OLLAMA_FALLBACK_ENABLED:false}
      sla-warn-ms: 2000
    intent-decision-router:
      enabled: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_ENABLED:false}
      review-band:
        low: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_REVIEW_BAND_LOW:0.50}
        high: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_REVIEW_BAND_HIGH:0.85}
      timeout-ms: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_TIMEOUT_MS:50000}
      activation-gate:
        candidate-evidence-approved: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_ACTIVATION_GATE_CANDIDATE_EVIDENCE_APPROVED:false}
        cost-ceiling-approved: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_ACTIVATION_GATE_COST_CEILING_APPROVED:false}
        rollout-owner: ${AMSHA_ROUTING_INTENT_DECISION_ROUTER_ACTIVATION_GATE_ROLLOUT_OWNER:}
  memory:
    compaction:
      enabled: true
      threshold: 10
      keep-recent: 5
      max-output-tokens: 1024
      max-chars: 96000
      max-backoff-ms: ${AMSHA_MEMORY_COMPACTION_MAX_BACKOFF_MS:60000}
    tiered:
      enabled: ${AMSHA_MEMORY_TIERED_ENABLED:false}
      backend: ${AMSHA_MEMORY_TIERED_BACKEND:sqlite}
      core-memory:
        enabled: ${AMSHA_MEMORY_CORE_ENABLED:false}
        max-blocks-per-user: ${AMSHA_MEMORY_CORE_MAX_BLOCKS_PER_USER:20}
        max-chars-per-block: ${AMSHA_MEMORY_CORE_MAX_CHARS_PER_BLOCK:2000}
      recall:
        enabled: ${AMSHA_MEMORY_RECALL_ENABLED:false}
        retention-days: ${AMSHA_MEMORY_RECALL_RETENTION_DAYS:90}
        max-search-results: ${AMSHA_MEMORY_RECALL_MAX_SEARCH_RESULTS:10}
        cross-session-search: ${AMSHA_MEMORY_RECALL_CROSS_SESSION:true}
      archival:
        enabled: ${AMSHA_MEMORY_ARCHIVAL_ENABLED:false}
        max-search-results: ${AMSHA_MEMORY_ARCHIVAL_MAX_SEARCH_RESULTS:8}
        hybrid-search-k: ${AMSHA_MEMORY_ARCHIVAL_HYBRID_K:60}
        confidence-threshold: ${AMSHA_MEMORY_ARCHIVAL_CONFIDENCE_THRESHOLD:0.6}
        eviction:
          low-confidence-days: ${AMSHA_MEMORY_ARCHIVAL_LOW_CONFIDENCE_DAYS:60}
          low-confidence-threshold: ${AMSHA_MEMORY_ARCHIVAL_LOW_CONFIDENCE_THRESHOLD:0.5}
          lru-min-access-count: ${AMSHA_MEMORY_ARCHIVAL_LRU_MIN_ACCESS_COUNT:1}
          lru-max-age-days: ${AMSHA_MEMORY_ARCHIVAL_LRU_MAX_AGE_DAYS:90}
    prompt-budget:
      max-core-memory-tokens: ${AMSHA_MEMORY_PROMPT_BUDGET_CORE_TOKENS:800}
      max-compaction-summary-tokens: ${AMSHA_MEMORY_PROMPT_BUDGET_COMPACTION_TOKENS:1200}
      max-prefetched-archival-results: ${AMSHA_MEMORY_PROMPT_BUDGET_ARCHIVAL_RESULTS:3}
      max-directives: ${AMSHA_MEMORY_PROMPT_BUDGET_DIRECTIVES:5}
      total-non-conversation-tokens: ${AMSHA_MEMORY_PROMPT_BUDGET_TOTAL_TOKENS:2500}
    governance:
      core-writes-per-minute: ${AMSHA_MEMORY_GOVERNANCE_CORE_WRITES_PER_MINUTE:5}
      archival-writes-per-hour: ${AMSHA_MEMORY_GOVERNANCE_ARCHIVAL_WRITES_PER_HOUR:10}
    retention:
      enabled: ${AMSHA_MEMORY_RETENTION_ENABLED:true}
      recall-retention-days: ${AMSHA_MEMORY_RETENTION_RECALL_RETENTION_DAYS:30}
      archival-eviction-threshold: ${AMSHA_MEMORY_RETENTION_ARCHIVAL_EVICTION_THRESHOLD:0.3}
      archival-min-age-days: ${AMSHA_MEMORY_RETENTION_ARCHIVAL_MIN_AGE_DAYS:30}
    chat:
      recovered-observation-max-chars: ${AMSHA_CHAT_RECOVERED_OBSERVATION_MAX_CHARS:2000}
      tool-specific-limits:
        github_search: 10000
        read_file: 8000
      web_search: 5000
  chat-memory:
    max-messages: ${AMSHA_CHAT_MEMORY_MAX_MESSAGES:20}
    retention-days: ${AMSHA_CHAT_MEMORY_RETENTION_DAYS:30}
  trace:
    persistence:
      queue-capacity: ${AMSHA_TRACE_PERSISTENCE_QUEUE_CAPACITY:10000}
    retention:
      max-age-days: ${AMSHA_TRACE_RETENTION_MAX_AGE_DAYS:7}
      max-runs-per-session: ${AMSHA_TRACE_RETENTION_MAX_RUNS_PER_SESSION:50}
      interval: ${AMSHA_TRACE_RETENTION_INTERVAL:24h}
  session-catalog:
    archive-after-days: ${AMSHA_SESSION_CATALOG_ARCHIVE_AFTER_DAYS:90}
  self-evolve:
    enabled: ${AMSHA_SELF_EVOLVE_ENABLED:false}
    backend: ${AMSHA_SELF_EVOLVE_BACKEND:sqlite}
    buffer-size: ${AMSHA_SELF_EVOLVE_BUFFER_SIZE:50}
    default-search-limit: ${AMSHA_SELF_EVOLVE_DEFAULT_SEARCH_LIMIT:8}
    directives-enabled: ${AMSHA_SELF_EVOLVE_DIRECTIVES_ENABLED:true}
    synthesis-trigger: "${AMSHA_SELF_EVOLVE_SYNTHESIS_TRIGGER:manual}"
    flush:
      max-events: ${AMSHA_SELF_EVOLVE_FLUSH_MAX_EVENTS:12}
      idle-ms: ${AMSHA_SELF_EVOLVE_FLUSH_IDLE_MS:300000}
  api:
    keys:
      internal: "${AMSHA_API_KEYS_INTERNAL:key-internal-changeme}"
      ci: "${AMSHA_API_KEYS_CI:key-ci-changeme}"
    rate-limit:
      requests-per-minute: ${AMSHA_API_RATE_LIMIT_REQUESTS_PER_MINUTE:6000}
      mutation-per-minute: ${AMSHA_API_RATE_LIMIT_MUTATION_PER_MINUTE:1000}
  
  tools:
    # Per-category thread pool isolation to prevent cross-category starvation.
    # Discovered MCP tools default to network; register_mcp_server can assign
    # NETWORK, COMPUTE, DATABASE, or INTERNAL for all tools from that server.
    bulkhead:
      network:
        max-async: 8
        max-queued: 20
      compute:
        max-async: 4
        max-queued: 10
      database:
        max-async: 6
        max-queued: 20
      internal:
        max-async: 20
        max-queued: 100
    brave:
      api-key: "${AMSHA_TOOLS_BRAVE_API_KEY:none}"
    serper:
      api-key: "${AMSHA_TOOLS_SERPER_API_KEY:none}"
    github:
      repos-per-page: ${AMSHA_GITHUB_REPOS_PER_PAGE:100}
    playwright:
      enabled: "${AMSHA_TOOLS_PLAYWRIGHT_ENABLED:false}"
      timeout-ms: 30000
      headless: "${AMSHA_TOOLS_PLAYWRIGHT_HEADLESS:true}"
      # MCP Server mode — uses official @playwright/mcp via STDIO, falls back to CLI
      mcp-enabled: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_ENABLED:false}"
      mcp-headless: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_HEADLESS:true}"
      mcp-command: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_COMMAND:npx}"
      mcp-args: "${AMSHA_TOOLS_PLAYWRIGHT_MCP_ARGS:@playwright/mcp}"

    # Direct-host execution grant list for diagnostic skills that cannot work
    # inside the Podman sandbox (e.g. JDB attaching to host JVMs).
    host-exec:
      skills: "${AMSHA_TOOLS_HOST_EXEC_SKILLS:jdb-debugger}"
      max-output-chars: "${AMSHA_HOST_EXEC_MAX_OUTPUT_CHARS:${AMSHA_SANDBOX_MAX_OUTPUT_CHARS:8192}}"
      python-executable: "${AMSHA_HOST_EXEC_PYTHON_EXECUTABLE:${AMSHA_SANDBOX_PYTHON_EXECUTABLE:}}"
      java-executable: "${AMSHA_HOST_EXEC_JAVA_EXECUTABLE:${AMSHA_SANDBOX_JAVA_EXECUTABLE:}}"
      go-executable: "${AMSHA_HOST_EXEC_GO_EXECUTABLE:${AMSHA_SANDBOX_GO_EXECUTABLE:}}"

  hitl:
    pre-executable-tools: ""   # (§75-A1) comma-separated tool names
    delegate-approver-ids: ""  # (§75-B1) comma-separated user IDs
    timeout-hours: 24
    # Approval lease for parallel batches (ADR-approval-lease-for-parallel-batches).
    # Session-bound, in-memory, TTL-bounded optimization hints; disabled restores
    # strict re-prompting.
    approval-lease:
      enabled: ${AMSHA_HITL_APPROVAL_LEASE_ENABLED:true}
      ttl-seconds: ${AMSHA_HITL_APPROVAL_LEASE_TTL_SECONDS:3600}

  mcp:
    exposed-tools:
      - github
      - recall_memory_search
      - archival_memory_search
    server-enabled: true
    setup-token-secret: ${AMSHA_MCP_SETUP_TOKEN_SECRET:}
    setup-ui-base-url: ${AMSHA_MCP_SETUP_UI_BASE_URL:}
    health-check-interval-ms: ${AMSHA_MCP_HEALTH_CHECK_INTERVAL_MS:15000}
    podman:
      health-check-interval-ms: ${AMSHA_MCP_PODMAN_HEALTH_CHECK_INTERVAL_MS:15000}

  retry:
    default-delay-ms: ${AMSHA_RETRY_DEFAULT_DELAY_MS:30000}

  cron:
    poll-interval: 30s
    max-concurrent: 10
    max-iterations: 3
    max-lookback-window: PT5M
    list-retention-hours: 24
    startup-delay-ms: ${AMSHA_CRON_STARTUP_DELAY_MS:5000}

  channel:
    telegram:
      enabled: "${AMSHA_TELEGRAM_ENABLED:false}"
      bot-token: ${TELEGRAM_BOT_TOKEN:mock-telegram-token}
      base-uri: "${AMSHA_TELEGRAM_BASE_URI:https://api.telegram.org}"
      default-autonomy-level: SUPERVISED
      allowed-user-ids: "${AMSHA_TELEGRAM_ALLOWED_USER_IDS:}"
      allowed-users: "${AMSHA_TELEGRAM_ALLOWED_USERS:mock-telegram-user}"
      silent-block: false
      block-response: "⛔ Access denied."
      max-length: ${AMSHA_CHANNEL_TELEGRAM_MAX_LENGTH:4096}
    web:
      enabled: "${AMSHA_WEB_ENABLED:true}"
      require-auth: "${AMSHA_WEB_REQUIRE_AUTH:false}"

  pii:
    mode: "${AMSHA_PII_MODE:REDACT_AND_FORWARD}"   # Options: REDACT_AND_FORWARD (default), BLOCK_AND_NOTIFY

  vault:
    pepper: "${AMSHA_VAULT_PEPPER:dev-pepper-not-for-production-0000000000000000000000000000}"
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 1
    rotation:
      enabled: true
      interval-hours: 24

  workspace:
    root-dir: "${AMSHA_WORKSPACE_ROOT_DIR:${AMSHA_DATA_DIR:./data}/workspaces}"
    session-ttl-minutes: 30
    gc-interval: "5m"
    heartbeat-interval: "60s"

  recovery:
    stalled-threshold-minutes: 15

  resumption:
    stale-mark-seconds: ${AMSHA_RESUMPTION_STALE_MARK_SECONDS:60}
    playwright-stale-mark-seconds: ${AMSHA_TOOLS_PLAYWRIGHT_RESUMPTION_STALE_MARK_SECONDS:300}

  checkpoint:
    stale-claim-minutes: ${AMSHA_CHECKPOINT_STALE_CLAIM_MINUTES:2}

  audit:
    hmac-key: "${AMSHA_AUDIT_HMAC_KEY:dev-audit-hmac-key-min-32-bytes-00000}"
    idle-timeout-ms: ${AMSHA_AUDIT_IDLE_TIMEOUT_MS:10000}
  auth:
    hmac-key: "${AMSHA_AUTH_HMAC_KEY:dev-auth-hmac-key-min-32-bytes-0000000}"

  governance:
    # Floor applied ONLY when LLM provider returns 0 input AND 0 output tokens.
    # This indicates the provider omitted token counts entirely (a known side
    # effect of certain log-requests=false configurations), not a valid zero-output
    # response. Set to 1 to disable the floor effect while keeping the warning.
    # A partial zero (e.g., 3 input, 0 output) is a valid API response and is
    # NOT subject to this floor.
    min-tokens-per-call: 10
    token-limit: 100000
    budget-usd: "${AMSHA_BUDGET_LIMIT:999.00}"
    action-on-exceed: "${AMSHA_BUDGET_ACTION:READONLY}"
    price-per-1k-input: 0.003
    price-per-1k-output: 0.015
    approval-timeout-minutes: 60 # must be >> gc-interval converted to minutes
    rate-limit-backoff-seconds: 30

  observability:
    chat-listener:
      mode: "${AMSHA_OBSERVABILITY_CHAT_LISTENER_MODE:off}"
    phoenix:
      enabled: "${AMSHA_PHOENIX_ENABLED:true}"
      endpoint: "${AMSHA_PHOENIX_ENDPOINT:http://localhost:4318/v1/traces}"

  media:
    max-image-size-mb: ${AMSHA_MEDIA_MAX_IMAGE_SIZE_MB:10}
    max-document-size-mb: ${AMSHA_MEDIA_MAX_DOCUMENT_SIZE_MB:25}
    max-total-payload-mb: ${AMSHA_MEDIA_MAX_TOTAL_PAYLOAD_MB:50}
    connect-timeout-seconds: ${AMSHA_MEDIA_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${AMSHA_MEDIA_READ_TIMEOUT_SECONDS:30}

  sandbox:
    enabled: "${AMSHA_SANDBOX_ENABLED:true}"
    strategy: "${AMSHA_SANDBOX_STRATEGY:PODMAN}"
    image: "${AMSHA_SANDBOX_IMAGE:}"
    podman-path: "${AMSHA_SANDBOX_PODMAN_PATH:podman}"
    podman-image: "${AMSHA_SANDBOX_PODMAN_IMAGE:localhost/amsha-tool-runner:latest}"
    timeout-seconds: "${AMSHA_SANDBOX_TIMEOUT_SECONDS:30}"
    network-timeout-seconds: "${AMSHA_SANDBOX_NETWORK_TIMEOUT_SECONDS:60}"
    network: "${AMSHA_SANDBOX_NETWORK:host}"
    tool-runner-user: "${AMSHA_SANDBOX_USER:sandbox}"
    memory-limit: "${AMSHA_SANDBOX_MEMORY_LIMIT:512m}"
    cpu-limit: "${AMSHA_SANDBOX_CPU_LIMIT:0.5}"
    max-output-chars: ${AMSHA_SANDBOX_MAX_OUTPUT_CHARS:8192}
    # Executable overrides (auto-discovered on host PATH if omitted)
    python-executable: "${AMSHA_SANDBOX_PYTHON_EXECUTABLE:}"
    go-executable: "${AMSHA_SANDBOX_GO_EXECUTABLE:}"
    java-executable: "${AMSHA_SANDBOX_JAVA_EXECUTABLE:}"
    allow-insecure-fallback: "${AMSHA_SANDBOX_ALLOW_INSECURE_FALLBACK:false}"
    circuit-breaker:
      failure-threshold: ${AMSHA_SANDBOX_CB_FAILURE_THRESHOLD:3}   # was 2; gives LLM one retry for param errors
      reset-timeout-seconds: ${AMSHA_SANDBOX_CB_RESET_TIMEOUT_SECONDS:30}

  autonomy:
    default-level: SUPERVISED

  agents:
    roles:
      - name: coordinator
        class: com.amsha.core.agent.persona.DefaultAgent
        description: "Vishnu - Preserver and Captain/Coordinator - task decomposition and synthesis"
      - name: researcher
        class: com.amsha.core.agent.persona.DefaultAgent
